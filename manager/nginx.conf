server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /manager/favicon.svg { rewrite ^/manager/(.*)$ /$1 break; try_files $uri =404; }
    location = /manager/favicon.ico { rewrite ^/manager/(.*)$ /$1 break; try_files $uri =404; }
    location = /manager/apple-touch-icon.png { rewrite ^/manager/(.*)$ /$1 break; try_files $uri =404; }
    location = /manager/manifest.webmanifest { rewrite ^/manager/(.*)$ /$1 break; try_files $uri =404; }
    location /manager/icons/ { rewrite ^/manager/(.*)$ /$1 break; try_files $uri =404; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
