server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self'; script-src 'self'; connect-src 'self' https: wss:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location = /manager { return 302 /manager/; }
  location ^~ /manager/ {
    rewrite ^/manager/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
