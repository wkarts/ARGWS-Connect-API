name: ${COMPOSE_PROJECT_NAME:-argws-connect-api-dev}

services:
  api:
    environment:
      MANAGER_FEATURE_TEST_MESSAGE_CONTACTS: ${MANAGER_FEATURE_TEST_MESSAGE_CONTACTS:-true}
      MANAGER_FEATURE_INSTANCE_TEST_MESSAGE: ${MANAGER_FEATURE_INSTANCE_TEST_MESSAGE:-true}
      MANAGER_FEATURE_CONTACTS: ${MANAGER_FEATURE_CONTACTS:-true}
      MANAGER_FEATURE_MESSAGES: ${MANAGER_FEATURE_MESSAGES:-true}
      MANAGER_FEATURE_CONVERSATIONS: ${MANAGER_FEATURE_CONVERSATIONS:-true}
      OPERATIONS_INTERNAL_TOKEN: ${OPERATIONS_INTERNAL_TOKEN:-}
      OPERATIONS_AGENT_URL: ${OPERATIONS_AGENT_URL:-http://operations:8092}
      OPERATIONS_ENABLED: ${OPERATIONS_ENABLED:-false}
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:develop}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_API_HOST_PORT:-8080}:8080"
    volumes:
      - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/instances}:/argws-connect/instances
    networks:
      - argws-connect-dev-net
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  operations:
    profiles: ["operations"]
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:develop}
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["node", "/argws-connect/operations-agent/server.cjs"]
    environment:
      TZ: ${TZ:-America/Bahia}
      OPERATIONS_INTERNAL_TOKEN: ${OPERATIONS_INTERNAL_TOKEN:-}
      OPERATIONS_DATA_PATH: /data
      OPERATIONS_HOT_DAYS: ${OPERATIONS_HOT_DAYS:-3}
      OPERATIONS_RETENTION_DAYS: ${OPERATIONS_RETENTION_DAYS:-90}
      OPERATIONS_CHECKS: '[{"service":"api","type":"http","url":"http://api:8080/health"}]'
    expose: ["8092"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: "0.50"
    pids_limit: 64
    volumes:
      - ${ARGWS_CONNECT_OPERATIONS_DATA_PATH:-./volumes/operations}:/data
    networks:
      argws-connect-dev-net:
        aliases: [operations]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

networks:
  argws-connect-dev-net:
    name: ${ARGWS_CONNECT_NETWORK_NAME:-argws-connect-dev-net}
    driver: bridge
