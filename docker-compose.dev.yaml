name: ${COMPOSE_PROJECT_NAME:-argws-connect-api-dev}

services:
  api:
    environment:
      TRACCAR_ENABLED: "${TRACCAR_ENABLED:-false}"
      TRACCAR_MODE: "${TRACCAR_MODE:-disabled}"
      TRACCAR_URL: "${TRACCAR_URL:-}"
      TRACCAR_RECEIVER_URL: "${TRACCAR_RECEIVER_URL:-}"
      TRACCAR_TOKEN: "${TRACCAR_TOKEN:-}"
      TRACCAR_ALLOWED_ORIGINS: "${TRACCAR_ALLOWED_ORIGINS:-}"
      TRACCAR_INTERNAL_URL: "${TRACCAR_INTERNAL_URL:-http://traccar:8082}"
      TRACCAR_INTERNAL_RECEIVER_URL: "${TRACCAR_INTERNAL_RECEIVER_URL:-http://traccar:5055}"
      TRACCAR_ADMIN_EMAIL: "${TRACCAR_ADMIN_EMAIL:-connect-admin@localhost.invalid}"
      TRACCAR_ADMIN_PASSWORD: "${TRACCAR_ADMIN_PASSWORD:-}"
      FINDHUB_HISTORY_RETENTION_DAYS: "${FINDHUB_HISTORY_RETENTION_DAYS:-30}"
      FINDHUB_MAP_TILE_URL: "${FINDHUB_MAP_TILE_URL:-}"
      FINDHUB_CREDENTIALS_KEY: "${FINDHUB_CREDENTIALS_KEY:-}"
      FINDHUB_DEFAULT_TRACKING_INTERVAL_SECONDS: "${FINDHUB_DEFAULT_TRACKING_INTERVAL_SECONDS:-60}"
      FINDHUB_MIN_TRACKING_INTERVAL_SECONDS: "${FINDHUB_MIN_TRACKING_INTERVAL_SECONDS:-30}"
      FINDHUB_LOCATION_TIMEOUT_MS: "${FINDHUB_LOCATION_TIMEOUT_MS:-30000}"
      FINDHUB_STORE_POSITION_HISTORY: "${FINDHUB_STORE_POSITION_HISTORY:-false}"
      FINDHUB_TRACCAR_TIMEOUT_MS: "${FINDHUB_TRACCAR_TIMEOUT_MS:-10000}"
      MANAGER_FEATURE_TEST_MESSAGE_CONTACTS: ${MANAGER_FEATURE_TEST_MESSAGE_CONTACTS:-true}
      MANAGER_FEATURE_INSTANCE_TEST_MESSAGE: ${MANAGER_FEATURE_INSTANCE_TEST_MESSAGE:-true}
      MANAGER_FEATURE_CONTACTS: ${MANAGER_FEATURE_CONTACTS:-true}
      MANAGER_FEATURE_MESSAGES: ${MANAGER_FEATURE_MESSAGES:-true}
      MANAGER_FEATURE_CONVERSATIONS: ${MANAGER_FEATURE_CONVERSATIONS:-true}
      OPERATIONS_INTERNAL_TOKEN: ${OPERATIONS_INTERNAL_TOKEN:-}
      OPERATIONS_AGENT_URL: ${OPERATIONS_AGENT_URL:-http://operations:8092}
      OPERATIONS_ENABLED: ${OPERATIONS_ENABLED:-false}
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:develop}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_API_HOST_PORT:-8080}:8080"
    volumes:
      - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/instances}:/argws-connect/instances
    networks:
      - argws-connect-dev-net
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  mysql:
    depends_on:
      mysql-volume-init:
        condition: service_healthy
    profiles: ["mysql"]
    image: ${ARGWS_CONNECT_MYSQL_IMAGE:-ghcr.io/wkarts/argws-connect-mysql:8.0}
    pull_policy: always
    container_name: argws_connect_dev_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-argws_connect_api}
      MYSQL_USER: ${MYSQL_USERNAME:-argws_connect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    expose: ["3306"]
    volumes:
      - ${ARGWS_CONNECT_MYSQL_DATA_PATH:-./volumes/mysql}:/var/lib/mysql
    networks:
      argws-connect-dev-net:
        aliases: [argws-connect-dev-mysql]
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
  operations:
    profiles: ["operations"]
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:develop}
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["node", "/argws-connect/operations-agent/server.cjs"]
    environment:
      TZ: ${TZ:-America/Bahia}
      OPERATIONS_INTERNAL_TOKEN: ${OPERATIONS_INTERNAL_TOKEN:-}
      OPERATIONS_DATA_PATH: /data
      OPERATIONS_HOT_DAYS: ${OPERATIONS_HOT_DAYS:-3}
      OPERATIONS_RETENTION_DAYS: ${OPERATIONS_RETENTION_DAYS:-90}
      OPERATIONS_CHECKS: '[{"service":"api","type":"http","url":"http://api:8080/health"}]'
    expose: ["8092"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: "0.50"
    pids_limit: 64
    volumes:
      - ${ARGWS_CONNECT_OPERATIONS_DATA_PATH:-./volumes/operations}:/data
    networks:
      argws-connect-dev-net:
        aliases: [operations]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  # BEGIN OPTIONAL TRACCAR
  traccar:
    profiles: [traccar]
    image: ${ARGWS_CONNECT_TRACCAR_IMAGE:-ghcr.io/wkarts/argws-connect-traccar:6.15.3-alpine}
    restart: unless-stopped
    depends_on:
      traccar-postgres:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://traccar-postgres:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
      WEB_PORT: "8082"
      OSMAND_PORT: "5055"
      OSMAND_ADDRESS: 0.0.0.0
      PROTOCOLS_ENABLE: osmand
      SERVER_STATISTICS: ""
      GEOCODER_ENABLE: "false"
      TZ: ${TZ:-America/Bahia}
    expose: ["8082", "5055"]
    volumes:
      - ${ARGWS_CONNECT_TRACCAR_DATA_PATH:-./volumes/traccar}:/opt/traccar/data
    networks:
      argws-connect-dev-net:
        aliases: [traccar]
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider -T 5 http://127.0.0.1:8082/api/server 2>&1 | grep -Eq 'HTTP/[0-9.]+ (200|401)'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
  traccar-postgres:
    profiles: [traccar]
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
      TRACCAR_DATABASE_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        set -Eeuo pipefail
        data_directory="$${PGDATA:-/var/lib/postgresql/data}"
        if [ ! -s "$$data_directory/PG_VERSION" ]; then
          exec /usr/local/bin/docker-entrypoint.sh postgres
        fi
        : "$${TRACCAR_DATABASE_PASSWORD:?TRACCAR_DATABASE_PASSWORD nao configurada}"
        /usr/local/bin/docker-entrypoint.sh postgres &
        postgres_pid="$$!"
        stop_postgres() {
          kill -TERM "$$postgres_pid" 2>/dev/null || true
          wait "$$postgres_pid" || true
          exit 0
        }
        trap stop_postgres INT TERM

        admin=""
        for candidate in postgres traccar; do
          for attempt in $$(seq 1 60); do
            if psql --no-password -h /var/run/postgresql -U "$$candidate" -d postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              admin="$$candidate"
              break 2
            fi
            if [ "$$candidate" = postgres ] && command -v gosu >/dev/null 2>&1 && gosu postgres psql --no-password -h /var/run/postgresql -U postgres -d postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              admin="postgres"
              break 2
            fi
            sleep 1
          done
        done
        if [ -z "$$admin" ]; then
          echo 'Nao foi possivel validar a administracao local do PostgreSQL do Traccar.' >&2
          kill -TERM "$$postgres_pid" 2>/dev/null || true
          wait "$$postgres_pid" || true
          exit 31
        fi

        role_exists="$$(psql --no-password -h /var/run/postgresql -U "$$admin" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'traccar'")"
        role_created=false
        if [ "$$role_exists" != 1 ]; then
          psql --no-password -v ON_ERROR_STOP=1 -v traccar_password="$$TRACCAR_DATABASE_PASSWORD" -h /var/run/postgresql -U "$$admin" -d postgres -c "CREATE ROLE traccar LOGIN PASSWORD :'traccar_password'"
          role_created=true
        fi
        database_exists="$$(psql --no-password -h /var/run/postgresql -U "$$admin" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'traccar'")"
        if [ "$$database_exists" != 1 ]; then
          psql --no-password -v ON_ERROR_STOP=1 -h /var/run/postgresql -U "$$admin" -d postgres -c 'CREATE DATABASE traccar OWNER traccar'
        elif [ "$$role_created" = true ]; then
          psql --no-password -v ON_ERROR_STOP=1 -h /var/run/postgresql -U "$$admin" -d postgres -c 'ALTER DATABASE traccar OWNER TO traccar'
        fi
        PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc 'SELECT 1' | grep -qx 1
        wait "$$postgres_pid"
    volumes:
      - ${ARGWS_CONNECT_TRACCAR_DB_PATH:-./volumes/traccar-postgres}:/var/lib/postgresql/data
    networks: [argws-connect-dev-net]
    healthcheck:
      test: ['CMD-SHELL', 'PGPASSWORD="$${TRACCAR_DATABASE_PASSWORD}" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 75s
  traccar-bootstrap:
    profiles: [traccar]
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    restart: unless-stopped
    depends_on:
      traccar:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        node - <<'NODE'
          'use strict';
          // Internal-only one-time bootstrap. Never resets users or changes existing passwords.
          const root = process.env.TRACCAR_INTERNAL_URL || 'http://traccar:8082';
          const email = process.env.TRACCAR_ADMIN_EMAIL;
          const password = process.env.TRACCAR_ADMIN_PASSWORD;
          async function main() {
            if (!email || !password || password.length < 32) throw new Error('Segredos Traccar nao preparados.');
            let cookie = '';
            async function request(path, method='GET', data, form=false) {
              const response = await fetch(root+path, { method, redirect:'error', signal:AbortSignal.timeout(15000),
                headers:{ ...(cookie?{Cookie:cookie}:{}), ...(data?{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'}:{}) },
                body:data ? form ? new URLSearchParams(data).toString() : JSON.stringify(data) : undefined });
              if(!response.ok) throw new Error('Traccar bootstrap recusado (HTTP '+response.status+').');
              const set = response.headers.getSetCookie().map(x=>x.split(';')[0]).find(x=>x.startsWith('JSESSIONID=')); if(set) cookie=set;
              return response.status===204?null:response.json();
            }
            let server;
            for(let n=0;n<40;n++) {try {server=await request('/api/server');break;}catch {if(n===39)throw new Error('Traccar indisponivel no bootstrap.');await new Promise(r=>setTimeout(r,3000));}}
            if(server.newServer===true) await request('/api/users','POST',{name:'Connect internal service',email,password});
            await request('/api/session','POST',{email,password},true);
            server=await request('/api/server');
            if(server.registration) await request('/api/server','PUT',{...server,registration:false});
            console.log('Traccar interno validado. Registro publico desabilitado; credenciais existentes preservadas.');
          }
          main().catch(()=>{console.error('Falha ao preparar Traccar. Verifique os segredos sem apagar usuarios/volumes. A API principal nao depende deste bootstrap.');process.exitCode=1;});
        NODE
        touch /tmp/traccar-bootstrap-ready
        exec tail -f /dev/null
    environment:
      TRACCAR_INTERNAL_URL: http://traccar:8082
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL:-connect-admin@localhost.invalid}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/traccar-bootstrap-ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [argws-connect-dev-net]
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
  # END OPTIONAL TRACCAR

  # BEGIN COMPOSE MYSQL VOLUME INIT
  mysql-volume-init:
    profiles: ["mysql"]
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /prepared/mysql
        # Percona 8.0 runs as uid 1001. Ownership repair changes metadata only;
        # it never removes or initializes files in an existing data directory.
        chown --no-dereference --recursive 1001:0 /prepared/mysql
        chmod u+rwx /prepared/mysql
        touch /tmp/mysql-volume-init-ready
        exec tail -f /dev/null
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mysql-volume-init-ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ${ARGWS_CONNECT_MYSQL_DATA_PATH:-./volumes/mysql}:/prepared/mysql
    networks: [argws-connect-dev-net]
  # END COMPOSE MYSQL VOLUME INIT

networks:
  argws-connect-dev-net:
    name: ${ARGWS_CONNECT_NETWORK_NAME:-argws-connect-dev-net}
    driver: bridge
