[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argws-connect-deployer"
version = "1.0.0"
description = "Launcher local/SSH para implantação segura do ARGWS Connect|API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "paramiko>=3.5,<5",
]
authors = [
  { name = "ARGWS" }
]

[project.urls]
Homepage = "https://github.com/wkarts/ARGWS-Connect-API"
Repository = "https://github.com/wkarts/ARGWS-Connect-API"
Issues = "https://github.com/wkarts/ARGWS-Connect-API/issues"

[project.scripts]
connect-deploy = "connect_deployer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
connect_deployer = ["payload/install-connect.py", "build-info.json"]
