[project]
name = "argws-connect-api-platform"
version = "1.0.16"
description = "Communication & Integration Platform multitenant com Control Plane"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "gunicorn>=23,<24",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "redis>=5.2,<7",
  "celery>=5.4,<6",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "pyotp>=2.9,<3",
  "qrcode[pil]>=7.4,<9",
  "aiosmtplib>=3.0,<6",
  "boto3>=1.35,<2",
  "python-multipart>=0.0.18,<1",
  "email-validator>=2.2,<3",
  "Jinja2>=3.1,<4",
  "python-dateutil>=2.9,<3",
  "orjson>=3.10,<4",
  "structlog>=24.4,<27",
  "prometheus-client>=0.21,<1",
  "tenacity>=9,<10",
  "openpyxl>=3.1,<4",
  "phonenumbers>=8.13,<10",
  "python-slugify>=8,<9",
  "dnspython>=2.7,<3",
  "PyYAML>=6,<7",
  "click>=8.1,<9",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "respx>=0.22,<1",
  "reportlab>=4.2,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/connect_platform"]
addopts = "-ra --strict-markers"
markers = [
  "bank_contract: valida contratos locais, manifests e mappings dos providers sem credenciais externas",
  "bank_sandbox: executa testes opcionais contra sandbox oficial somente quando credenciais forem fornecidas",
]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
# Gate de CI focado em erros que quebram execução: sintaxe e nomes indefinidos.
# Regras estilísticas serão tratadas em uma PR dedicada, sem refatoração abrupta.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[tool.coverage.run]
branch = true
source = ["app"]
