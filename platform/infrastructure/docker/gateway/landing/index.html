<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081722">
  <title>Plataforma financeira</title>
  <meta name="description" content="Gestão financeira para empresas.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <style id="base-style">
    :root{--page:#f8fafc;--text:#0f172a;--primary:#0f766e;--accent:#53d5b0;--radius:18px;--width:1120px;--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}.lp-wrap{width:min(var(--width),calc(100% - 32px));margin:auto}.lp-brandbar{border-bottom:1px solid rgba(148,163,184,.18);background:#081722;color:#fff}.lp-brandbar>.lp-wrap{min-height:68px;display:flex;align-items:center;gap:12px}.lp-mark{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;background:var(--accent);color:#062019;font-weight:900}.lp-brand{font-weight:800;letter-spacing:-.02em}.lp-section{position:relative;overflow:hidden}.lp-content{width:min(var(--width),calc(100% - 32px));margin:auto}.lp-eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.lp-title{margin:12px 0 0;font-size:clamp(32px,5vw,64px);line-height:1.04;letter-spacing:-.045em}.lp-section-title{margin:0;font-size:clamp(28px,4vw,44px);line-height:1.08;letter-spacing:-.04em}.lp-lead{max-width:780px;margin:18px 0 0;font-size:clamp(16px,2vw,20px);opacity:.78}.lp-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.lp-btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;border-radius:12px;padding:11px 18px;font-weight:800;border:1px solid rgba(148,163,184,.3)}.lp-btn.primary{background:var(--accent);color:#062019;border-color:transparent}.lp-grid{display:grid;gap:16px}.lp-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.lp-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.lp-card{border:1px solid rgba(148,163,184,.22);border-radius:var(--radius);padding:22px;background:rgba(255,255,255,.75);box-shadow:0 18px 50px rgba(15,23,42,.06)}.lp-card h3{margin:0;font-size:18px}.lp-card p{margin:8px 0 0;opacity:.72}.lp-price{margin-top:18px;font-size:28px;font-weight:900}.lp-price small{font-size:12px;font-weight:600;opacity:.6}.lp-image{border-radius:var(--radius);overflow:hidden}.lp-image img{width:100%;height:auto}.lp-caption{margin-top:8px;font-size:12px;opacity:.65}.lp-gallery figure{margin:0}.lp-divider{height:1px;background:rgba(148,163,184,.28)}.lp-disabled{min-height:100vh;display:grid;place-items:center;padding:24px;background:#081722;color:#fff}.lp-disabled>div{max-width:520px;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px;background:#0d2231}.lp-disabled h1{margin:0;font-size:24px}.lp-disabled p{margin:10px 0 0;color:#9eb0bd}.lp-html>*:first-child{margin-top:0}.lp-html>*:last-child{margin-bottom:0}@media(max-width:820px){.lp-grid.cols-3,.lp-grid.cols-2{grid-template-columns:1fr}.lp-title{font-size:clamp(36px,11vw,54px)}}@media(max-width:520px){.lp-wrap,.lp-content{width:min(100% - 22px,var(--width))}.lp-actions{display:grid}.lp-btn{width:100%}}
  </style>
</head>
<body>
  <div id="app"><div class="lp-disabled"><div><h1>Carregando apresentação</h1><p>Aguarde um instante.</p></div></div></div>
  <script>
    const app=document.getElementById('app')
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]))
    const money=value=>Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})
    const safeUrl=value=>{const url=String(value||'').trim();return /^(https?:\/\/|\/|#|mailto:|tel:)/i.test(url)?url:''}
    const styleVars=style=>{
      const allowed=['background','color','padding','minHeight','textAlign','borderRadius','margin','maxWidth']
      return allowed.map(key=>style?.[key]!==undefined?`${key.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}:${String(style[key]).replace(/[;{}<>]/g,'')}`:'').filter(Boolean).join(';')
    }
    function button(label,url,primary=true){const target=safeUrl(url);if(!label||!target)return'';const external=/^https?:\/\//i.test(target);return`<a class="lp-btn ${primary?'primary':''}" href="${esc(target)}" ${external?'target="_blank" rel="noopener noreferrer"':''}>${esc(label)}</a>`}
    function blockHtml(block,plans){
      const p=block.props||{},s=block.style||{},style=styleVars(s),type=String(block.type||'')
      if(type==='hero')return`<section class="lp-section" style="${style}"><div class="lp-content">${p.eyebrow?`<div class="lp-eyebrow">${esc(p.eyebrow)}</div>`:''}<h1 class="lp-title">${esc(p.title||'')}</h1>${p.text?`<p class="lp-lead">${esc(p.text)}</p>`:''}<div class="lp-actions">${button(p.button_label,p.button_url,true)}${button(p.secondary_label,p.secondary_url,false)}</div></div></section>`
      if(type==='text')return`<section class="lp-section" style="${style}"><div class="lp-content">${p.title?`<h2 class="lp-section-title">${esc(p.title)}</h2>`:''}${p.text?`<p class="lp-lead">${esc(p.text)}</p>`:''}</div></section>`
      if(type==='features'){const items=Array.isArray(p.items)?p.items:[];return`<section class="lp-section" style="${style}"><div class="lp-content"><h2 class="lp-section-title">${esc(p.title||'Benefícios')}</h2>${p.text?`<p class="lp-lead">${esc(p.text)}</p>`:''}<div class="lp-grid cols-3" style="margin-top:28px">${items.map((item,i)=>{const obj=typeof item==='object'?item:{title:String(item),text:''};return`<article class="lp-card"><h3>${esc(obj.title||`Benefício ${i+1}`)}</h3>${obj.text?`<p>${esc(obj.text)}</p>`:''}</article>`}).join('')}</div></div></section>`}
      if(type==='plans')return`<section class="lp-section" style="${style}"><div class="lp-content"><h2 class="lp-section-title">${esc(p.title||'Planos')}</h2>${p.text?`<p class="lp-lead">${esc(p.text)}</p>`:''}<div class="lp-grid cols-3" style="margin-top:28px">${plans.map(plan=>{const price=Number(plan.monthly_price||0);return`<article class="lp-card"><h3>${esc(plan.name||'Plano')}</h3><p>${esc(plan.description||'')}</p><div class="lp-price">${price>0?money(price):'Sob consulta'}${price>0?'<small> / mês</small>':''}</div></article>`}).join('')}</div></div></section>`
      if(type==='image'){const url=safeUrl(p.url);if(!url)return'';const image=`<div class="lp-image"><img src="${esc(url)}" alt="${esc(p.alt||'Imagem')}" loading="lazy"></div>${p.caption?`<div class="lp-caption">${esc(p.caption)}</div>`:''}`;return`<section class="lp-section" style="${style}"><div class="lp-content">${p.link_url?`<a href="${esc(safeUrl(p.link_url))}">${image}</a>`:image}</div></section>`}
      if(type==='gallery'){const items=Array.isArray(p.items)?p.items:[];return`<section class="lp-section" style="${style}"><div class="lp-content">${p.title?`<h2 class="lp-section-title">${esc(p.title)}</h2>`:''}<div class="lp-grid cols-2 lp-gallery" style="margin-top:28px">${items.map(item=>{const obj=typeof item==='object'?item:{url:String(item),caption:''};const url=safeUrl(obj.url);return url?`<figure><div class="lp-image"><img src="${esc(url)}" alt="${esc(obj.caption||'Imagem da plataforma')}" loading="lazy"></div>${obj.caption?`<figcaption class="lp-caption">${esc(obj.caption)}</figcaption>`:''}</figure>`:''}).join('')}</div></div></section>`}
      if(type==='cta')return`<section class="lp-section" style="${style}"><div class="lp-content"><h2 class="lp-section-title">${esc(p.title||'')}</h2>${p.text?`<p class="lp-lead">${esc(p.text)}</p>`:''}<div class="lp-actions">${button(p.button_label,p.button_url,true)}</div></div></section>`
      if(type==='divider')return`<section class="lp-section" style="${style}"><div class="lp-content"><div class="lp-divider"></div></div></section>`
      if(type==='spacer')return`<div aria-hidden="true" style="height:${esc(String(p.height||'48px').replace(/[;{}<>]/g,''))}"></div>`
      if(type==='html')return`<section class="lp-section lp-html" style="${style}"><div class="lp-content">${String(p.html||'')}</div></section>`
      return''
    }
    function applyTheme(documentData){
      const theme=documentData.theme||{},root=document.documentElement.style
      root.setProperty('--page',theme.page_background||'#f8fafc');root.setProperty('--text',theme.text_color||'#0f172a');root.setProperty('--primary',theme.primary_color||'#0f766e');root.setProperty('--accent',theme.accent_color||'#53d5b0');root.setProperty('--radius',theme.radius||'18px');root.setProperty('--width',theme.content_width||'1120px');root.setProperty('--font',theme.font_family||'Inter,ui-sans-serif,system-ui,sans-serif')
    }
    async function bootstrap(){
      try{
        const response=await fetch('/api/public/platform/landing',{headers:{Accept:'application/json'},cache:'no-store'})
        if(!response.ok)throw new Error('config')
        const cfg=(await response.json()).data||{}
        if(cfg.enabled===false){app.innerHTML='<div class="lp-disabled"><div><h1>Página pública indisponível</h1><p>A apresentação pública desta plataforma está desativada.</p></div></div>';return}
        const doc=cfg.document||{},meta=doc.meta||{},blocks=Array.isArray(doc.blocks)?doc.blocks:[]
        applyTheme(doc)
        document.documentElement.lang=meta.language||'pt-BR';document.title=meta.seo_title||meta.brand_name||'Plataforma financeira'
        const description=document.querySelector('meta[name="description"]');if(description)description.setAttribute('content',meta.seo_description||'Gestão financeira para empresas.')
        const custom=document.createElement('style');custom.id='landing-custom-css';custom.textContent=String(cfg.custom_css||'');document.head.appendChild(custom)
        const brand=meta.show_brand===false?'':`<nav class="lp-brandbar"><div class="lp-wrap"><span class="lp-mark">AF</span><span class="lp-brand">${esc(meta.brand_name||'Connect|API Platform')}</span></div></nav>`
        app.innerHTML=brand+`<main>${blocks.map(block=>blockHtml(block,cfg.plans||[])).join('')}</main>`
      }catch(error){console.error('landing_bootstrap_failed',error);app.innerHTML='<div class="lp-disabled"><div><h1>Página pública indisponível</h1><p>Não foi possível carregar a apresentação neste momento.</p></div></div>'}
    }
    bootstrap()
  </script>
</body>
</html>
