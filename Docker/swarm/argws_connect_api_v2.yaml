version: "3.7"

services:
  argws_connect_v2:
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:latest}
    volumes:
      - argws_connect_instances:/argws-connect/instances
    networks:
      - network_public
    environment:
      - TRACCAR_ENABLED=${TRACCAR_ENABLED:-false}
      - TRACCAR_MODE=${TRACCAR_MODE:-disabled}
      - TRACCAR_URL=${TRACCAR_URL:-}
      - TRACCAR_RECEIVER_URL=${TRACCAR_RECEIVER_URL:-}
      - TRACCAR_TOKEN=${TRACCAR_TOKEN:-}
      - TRACCAR_ALLOWED_ORIGINS=${TRACCAR_ALLOWED_ORIGINS:-}
      - TRACCAR_INTERNAL_URL=${TRACCAR_INTERNAL_URL:-http://traccar:8082}
      - TRACCAR_INTERNAL_RECEIVER_URL=${TRACCAR_INTERNAL_RECEIVER_URL:-http://traccar:5055}
      - TRACCAR_ADMIN_EMAIL=${TRACCAR_ADMIN_EMAIL:-connect-admin@localhost.invalid}
      - TRACCAR_ADMIN_PASSWORD=${TRACCAR_ADMIN_PASSWORD:-}
      - FINDHUB_HISTORY_RETENTION_DAYS=${FINDHUB_HISTORY_RETENTION_DAYS:-30}
      - FINDHUB_MAP_TILE_URL=${FINDHUB_MAP_TILE_URL:-}
      - FINDHUB_CREDENTIALS_KEY=${FINDHUB_CREDENTIALS_KEY:-}
      - FINDHUB_DEFAULT_TRACKING_INTERVAL_SECONDS=${FINDHUB_DEFAULT_TRACKING_INTERVAL_SECONDS:-60}
      - FINDHUB_MIN_TRACKING_INTERVAL_SECONDS=${FINDHUB_MIN_TRACKING_INTERVAL_SECONDS:-30}
      - FINDHUB_LOCATION_TIMEOUT_MS=${FINDHUB_LOCATION_TIMEOUT_MS:-30000}
      - FINDHUB_STORE_POSITION_HISTORY=${FINDHUB_STORE_POSITION_HISTORY:-false}
      - FINDHUB_TRACCAR_TIMEOUT_MS=${FINDHUB_TRACCAR_TIMEOUT_MS:-10000}
      - SERVER_URL=${SERVER_URL}
      - DEL_INSTANCE=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:SENHA@postgres:5432/connect
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      - DATABASE_CONNECTION_CLIENT_NAME=argws_connect_v2
      - RABBITMQ_ENABLED=false
      - RABBITMQ_URI=amqp://admin:admin@rabbitmq:5672/default
      - RABBITMQ_EXCHANGE_NAME=argws_connect_v2
      - RABBITMQ_GLOBAL_ENABLED=false
      - RABBITMQ_EVENTS_APPLICATION_STARTUP=false
      - RABBITMQ_EVENTS_INSTANCE_CREATE=false
      - RABBITMQ_EVENTS_INSTANCE_DELETE=false
      - RABBITMQ_EVENTS_QRCODE_UPDATED=false
      - RABBITMQ_EVENTS_MESSAGES_SET=false
      - RABBITMQ_EVENTS_MESSAGES_UPSERT=true
      - RABBITMQ_EVENTS_MESSAGES_EDITED=false
      - RABBITMQ_EVENTS_MESSAGES_UPDATE=false
      - RABBITMQ_EVENTS_MESSAGES_DELETE=false
      - RABBITMQ_EVENTS_SEND_MESSAGE=false
      - RABBITMQ_EVENTS_SEND_MESSAGE_UPDATE=false
      - RABBITMQ_EVENTS_CONTACTS_SET=false
      - RABBITMQ_EVENTS_CONTACTS_UPSERT=false
      - RABBITMQ_EVENTS_CONTACTS_UPDATE=false
      - RABBITMQ_EVENTS_PRESENCE_UPDATE=false
      - RABBITMQ_EVENTS_CHATS_SET=false
      - RABBITMQ_EVENTS_CHATS_UPSERT=false
      - RABBITMQ_EVENTS_CHATS_UPDATE=false
      - RABBITMQ_EVENTS_CHATS_DELETE=false
      - RABBITMQ_EVENTS_GROUPS_UPSERT=false
      - RABBITMQ_EVENTS_GROUP_UPDATE=false
      - RABBITMQ_EVENTS_GROUP_PARTICIPANTS_UPDATE=false
      - RABBITMQ_EVENTS_CONNECTION_UPDATE=true
      - RABBITMQ_EVENTS_CALL=false
      - RABBITMQ_EVENTS_TYPEBOT_START=false
      - RABBITMQ_EVENTS_TYPEBOT_CHANGE_STATUS=false
      - SQS_ENABLED=false
      - SQS_ACCESS_KEY_ID=
      - SQS_SECRET_ACCESS_KEY=
      - SQS_ACCOUNT_ID=
      - SQS_REGION=
      - WEBSOCKET_ENABLED=false
      - WEBSOCKET_GLOBAL_EVENTS=false
      - WA_BUSINESS_TOKEN_WEBHOOK=argws-connect
      - WA_BUSINESS_URL=https://graph.facebook.com
      - WA_BUSINESS_VERSION=v20.0
      - WA_BUSINESS_LANGUAGE=pt_BR
      - WEBHOOK_GLOBAL_URL=''
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_EDITED=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_MESSAGES_DELETE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE=true
      - WEBHOOK_EVENTS_CONTACTS_SET=true
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=true
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=true
      - WEBHOOK_EVENTS_PRESENCE_UPDATE=true
      - WEBHOOK_EVENTS_CHATS_SET=true
      - WEBHOOK_EVENTS_CHATS_UPSERT=true
      - WEBHOOK_EVENTS_CHATS_UPDATE=true
      - WEBHOOK_EVENTS_CHATS_DELETE=true
      - WEBHOOK_EVENTS_GROUPS_UPSERT=true
      - WEBHOOK_EVENTS_GROUPS_UPDATE=true
      - WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_LABELS_EDIT=true
      - WEBHOOK_EVENTS_LABELS_ASSOCIATION=true
      - WEBHOOK_EVENTS_CALL=true
      - WEBHOOK_EVENTS_TYPEBOT_START=false
      - WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS=false
      - WEBHOOK_EVENTS_ERRORS=false
      - WEBHOOK_EVENTS_ERRORS_WEBHOOK=
      - CONFIG_SESSION_PHONE_CLIENT=ARGWS Connect API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - OPENAI_ENABLED=true
      - DIFY_ENABLED=true
      - TYPEBOT_ENABLED=true
      - TYPEBOT_API_VERSION=latest
      - CHATWOOT_ENABLED=true
      - CHATWOOT_MESSAGE_READ=true
      - CHATWOOT_MESSAGE_DELETE=true
      - CHATWOOT_IMPORT_DATABASE_CONNECTION_URI=postgresql://postgres:PASSWORD@postgres:5432/chatwoot?sslmode=disable
      - CHATWOOT_IMPORT_PLACEHOLDER_MEDIA_MESSAGE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=argws_connect_v2
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      - S3_ENABLED=true
      - S3_ACCESS_KEY=
      - S3_SECRET_KEY=
      - S3_BUCKET=argws-connect
      - S3_PORT=443
      - S3_ENDPOINT=files.site.com
      - S3_USE_SSL=true
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LANGUAGE=en
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == argws-connect-manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.argws_connect_v2.rule=Host(`connect.example.com`)
        - traefik.http.routers.argws_connect_v2.entrypoints=websecure
        - traefik.http.routers.argws_connect_v2.tls.certresolver=letsencryptresolver
        - traefik.http.routers.argws_connect_v2.priority=1
        - traefik.http.routers.argws_connect_v2.service=argws_connect_v2
        - traefik.http.services.argws_connect_v2.loadbalancer.server.port=8080
        - traefik.http.services.argws_connect_v2.loadbalancer.passHostHeader=true

  # BEGIN OPTIONAL TRACCAR
  traccar:
    deploy:
      replicas: ${TRACCAR_REPLICAS:-0}
    image: ${ARGWS_CONNECT_TRACCAR_IMAGE:-ghcr.io/wkarts/argws-connect-traccar:6.15.3-alpine}
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://traccar-postgres:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
      WEB_PORT: "8082"
      OSMAND_PORT: "5055"
      OSMAND_ADDRESS: 0.0.0.0
      PROTOCOLS_ENABLE: osmand
      SERVER_STATISTICS: ""
      GEOCODER_ENABLE: "false"
      TZ: ${TZ:-America/Bahia}
    expose: ["8082", "5055"]
    volumes:
      - ${ARGWS_CONNECT_TRACCAR_DATA_PATH:-./volumes/traccar}:/opt/traccar/data
    networks:
      network_public:
        aliases: [traccar]
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider -T 5 http://127.0.0.1:8082/api/server 2>&1 | grep -Eq 'HTTP/[0-9.]+ (200|401)'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
  traccar-postgres:
    deploy:
      replicas: ${TRACCAR_REPLICAS:-0}
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
      TRACCAR_DATABASE_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        set -Eeuo pipefail
        data_directory="$${PGDATA:-/var/lib/postgresql/data}"
        if [ ! -s "$$data_directory/PG_VERSION" ]; then
          exec /usr/local/bin/docker-entrypoint.sh postgres
        fi
        : "$${TRACCAR_DATABASE_PASSWORD:?TRACCAR_DATABASE_PASSWORD nao configurada}"
        /usr/local/bin/docker-entrypoint.sh postgres &
        postgres_pid="$$!"
        stop_postgres() {
          kill -TERM "$$postgres_pid" 2>/dev/null || true
          wait "$$postgres_pid" || true
          exit 0
        }
        trap stop_postgres INT TERM

        admin=""
        for candidate in postgres traccar; do
          for attempt in $$(seq 1 60); do
            if psql --no-password -h /var/run/postgresql -U "$$candidate" -d postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              admin="$$candidate"
              break 2
            fi
            if [ "$$candidate" = postgres ] && command -v gosu >/dev/null 2>&1 && gosu postgres psql --no-password -h /var/run/postgresql -U postgres -d postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              admin="postgres"
              break 2
            fi
            sleep 1
          done
        done
        if [ -z "$$admin" ]; then
          echo 'Nao foi possivel validar a administracao local do PostgreSQL do Traccar.' >&2
          kill -TERM "$$postgres_pid" 2>/dev/null || true
          wait "$$postgres_pid" || true
          exit 31
        fi

        role_exists="$$(psql --no-password -h /var/run/postgresql -U "$$admin" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'traccar'")"
        role_created=false
        if [ "$$role_exists" != 1 ]; then
          psql --no-password -v ON_ERROR_STOP=1 -v traccar_password="$$TRACCAR_DATABASE_PASSWORD" -h /var/run/postgresql -U "$$admin" -d postgres -c "CREATE ROLE traccar LOGIN PASSWORD :'traccar_password'"
          role_created=true
        fi
        database_exists="$$(psql --no-password -h /var/run/postgresql -U "$$admin" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'traccar'")"
        if [ "$$database_exists" != 1 ]; then
          psql --no-password -v ON_ERROR_STOP=1 -h /var/run/postgresql -U "$$admin" -d postgres -c 'CREATE DATABASE traccar OWNER traccar'
        elif [ "$$role_created" = true ]; then
          psql --no-password -v ON_ERROR_STOP=1 -h /var/run/postgresql -U "$$admin" -d postgres -c 'ALTER DATABASE traccar OWNER TO traccar'
        fi
        PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc 'SELECT 1' | grep -qx 1
        wait "$$postgres_pid"
    volumes:
      - ${ARGWS_CONNECT_TRACCAR_DB_PATH:-./volumes/traccar-postgres}:/var/lib/postgresql/data
    networks: [network_public]
    healthcheck:
      test: ['CMD-SHELL', 'PGPASSWORD="$${TRACCAR_DATABASE_PASSWORD}" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 75s
  traccar-bootstrap:
    deploy:
      replicas: ${TRACCAR_REPLICAS:-0}
      restart_policy:
        condition: on-failure
        max_attempts: 5
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        node - <<'NODE'
          'use strict';
          // Internal-only one-time bootstrap. Never resets users or changes existing passwords.
          const root = process.env.TRACCAR_INTERNAL_URL || 'http://traccar:8082';
          const email = process.env.TRACCAR_ADMIN_EMAIL;
          const password = process.env.TRACCAR_ADMIN_PASSWORD;
          async function main() {
            if (!email || !password || password.length < 32) throw new Error('Segredos Traccar nao preparados.');
            let cookie = '';
            async function request(path, method='GET', data, form=false) {
              const response = await fetch(root+path, { method, redirect:'error', signal:AbortSignal.timeout(15000),
                headers:{ ...(cookie?{Cookie:cookie}:{}), ...(data?{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'}:{}) },
                body:data ? form ? new URLSearchParams(data).toString() : JSON.stringify(data) : undefined });
              if(!response.ok) throw new Error('Traccar bootstrap recusado (HTTP '+response.status+').');
              const set = response.headers.getSetCookie().map(x=>x.split(';')[0]).find(x=>x.startsWith('JSESSIONID=')); if(set) cookie=set;
              return response.status===204?null:response.json();
            }
            let server;
            for(let n=0;n<40;n++) {try {server=await request('/api/server');break;}catch {if(n===39)throw new Error('Traccar indisponivel no bootstrap.');await new Promise(r=>setTimeout(r,3000));}}
            if(server.newServer===true) await request('/api/users','POST',{name:'Connect internal service',email,password});
            await request('/api/session','POST',{email,password},true);
            server=await request('/api/server');
            if(server.registration) await request('/api/server','PUT',{...server,registration:false});
            console.log('Traccar interno validado. Registro publico desabilitado; credenciais existentes preservadas.');
          }
          main().catch(()=>{console.error('Falha ao preparar Traccar. Verifique os segredos sem apagar usuarios/volumes. A API principal nao depende deste bootstrap.');process.exitCode=1;});
        NODE
        touch /tmp/traccar-bootstrap-ready
        exec tail -f /dev/null
    environment:
      TRACCAR_INTERNAL_URL: http://traccar:8082
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL:-connect-admin@localhost.invalid}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/traccar-bootstrap-ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [network_public]
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
  # END OPTIONAL TRACCAR

volumes:
  argws_connect_instances:
    external: true
    name: argws_connect_v2_data

networks:
  network_public:
    external: true
    name: network_public
