name: ${COMPOSE_PROJECT_NAME:-argws-connect-platform}

# Local-build overlay da Connect|API Platform.
# Este arquivo pertence explicitamente ao MESMO projeto de deploy/platform/compose.yaml.
# Ele troca apenas image/pull_policy por build local; não cria uma segunda stack.

services:
  api-argws-connect-platform:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${CONNECT_API_VERSION:-1.0.16}
    pull_policy: never

  docs-argws-connect-platform:
    build:
      context: ../..
      dockerfile: docs/Dockerfile
    pull_policy: never

  platform-api-argws-connect-platform:
    build:
      context: ../..
      dockerfile: platform/control-api/Dockerfile
      args:
        APP_VERSION: ${CONNECT_API_VERSION:-1.0.16}
    pull_policy: never

  platform-web-argws-connect-platform:
    build:
      context: ../..
      dockerfile: platform/web/Dockerfile
      args:
        APP_VERSION: ${CONNECT_API_VERSION:-1.0.16}
        VITE_CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-control.connect.example.com}
        VITE_PARTNER_PLANE_HOST: ${PARTNER_PLANE_HOST:-partner.connect.example.com}
        VITE_API_BASE_URL: /api
    pull_policy: never

  platform-gateway-argws-connect-platform:
    build:
      context: ../..
      dockerfile: platform/gateway/Dockerfile
    pull_policy: never
