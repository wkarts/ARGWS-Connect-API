      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  nats-fersoft-connect-production:
    profiles:
    - nats
    - extended
    image: ${ARGWS_CONNECT_NATS_IMAGE:-ghcr.io/wkarts/argws-connect-nats:2.10-alpine}
    pull_policy: always
    container_name: nats-fersoft-connect-production
    restart: unless-stopped
    command:
    - -js
    - -m
    - '8222'
    - --store_dir
    - /data
    expose:
    - '4222'
    - '8222'
    volumes:
    - ${ARGWS_CONNECT_NATS_DATA_PATH:-./volumes/nats}:/data
    networks:
      fersoft-connect-production-net:
        aliases:
        - nats-fersoft-connect-production
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
