# Generated Fersoft Compose deployment. Do not edit by hand.
name: ${COMPOSE_PROJECT_NAME:-fersoft-connect-production}
x-logging:
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}
services:
  api-fersoft-connect-production:
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:latest}
    pull_policy: always
    container_name: api-fersoft-connect-production
    restart: unless-stopped
    env_file:
    - .env
    environment:
      TRACCAR_ENABLED: ${TRACCAR_ENABLED:-false}
      TRACCAR_MODE: ${TRACCAR_MODE:-disabled}
      TRACCAR_URL: ${TRACCAR_URL:-}
      TRACCAR_RECEIVER_URL: ${TRACCAR_RECEIVER_URL:-}
      TRACCAR_TOKEN: ${TRACCAR_TOKEN:-}
      TRACCAR_ALLOWED_ORIGINS: ${TRACCAR_ALLOWED_ORIGINS:-}
      TRACCAR_INTERNAL_URL: ${TRACCAR_INTERNAL_URL:-http://traccar:8082}
      TRACCAR_INTERNAL_RECEIVER_URL: ${TRACCAR_INTERNAL_RECEIVER_URL:-http://traccar:5055}
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL:-connect-admin@localhost.invalid}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:-}
      FINDHUB_HISTORY_RETENTION_DAYS: ${FINDHUB_HISTORY_RETENTION_DAYS:-30}
      FINDHUB_MAP_TILE_URL: ${FINDHUB_MAP_TILE_URL:-}
      FINDHUB_CREDENTIALS_KEY: ${FINDHUB_CREDENTIALS_KEY:-}
      FINDHUB_DEFAULT_TRACKING_INTERVAL_SECONDS: ${FINDHUB_DEFAULT_TRACKING_INTERVAL_SECONDS:-60}
      FINDHUB_MIN_TRACKING_INTERVAL_SECONDS: ${FINDHUB_MIN_TRACKING_INTERVAL_SECONDS:-30}
      FINDHUB_LOCATION_TIMEOUT_MS: ${FINDHUB_LOCATION_TIMEOUT_MS:-30000}
      FINDHUB_STORE_POSITION_HISTORY: ${FINDHUB_STORE_POSITION_HISTORY:-false}
      FINDHUB_TRACCAR_TIMEOUT_MS: ${FINDHUB_TRACCAR_TIMEOUT_MS:-10000}
      MANAGER_FEATURE_TEST_MESSAGE_CONTACTS: ${MANAGER_FEATURE_TEST_MESSAGE_CONTACTS:-false}
      MANAGER_FEATURE_INSTANCE_TEST_MESSAGE: ${MANAGER_FEATURE_INSTANCE_TEST_MESSAGE:-true}
      MANAGER_FEATURE_CONVERSATIONS: ${MANAGER_FEATURE_CONVERSATIONS:-false}
      SERVER_TYPE: http
      SERVER_PORT: '8080'
      DOCKER_ENV: 'true'
      DATABASE_MIGRATION_MAX_ATTEMPTS: ${DATABASE_MIGRATION_MAX_ATTEMPTS:-60}
      DATABASE_MIGRATION_RETRY_SECONDS: ${DATABASE_MIGRATION_RETRY_SECONDS:-2}
      LOG_QRCODE: ${LOG_QRCODE:-true}
      ARGWS_CONNECT_DOCS_INTERNAL_URL: ${ARGWS_CONNECT_DOCS_INTERNAL_URL:-http://docs-fersoft-connect-production:8080}
      ARGWS_CONNECT_DOCS_INTERNAL_BASE_PATH: ${ARGWS_CONNECT_DOCS_INTERNAL_BASE_PATH:-/manager/docs}
      OPERATIONS_ENABLED: ${OPERATIONS_ENABLED:-false}
      OPERATIONS_AGENT_URL: ${OPERATIONS_AGENT_URL:-http://operations:8092}
      OPERATIONS_INTERNAL_TOKEN: ${OPERATIONS_INTERNAL_TOKEN:-}
      MANAGER_FEATURE_DOCS: ${MANAGER_FEATURE_DOCS:-true}
      MANAGER_FEATURE_VOICE: ${MANAGER_FEATURE_VOICE:-true}
      MANAGER_FEATURE_VOICE_EXTENSIONS: ${MANAGER_FEATURE_VOICE_EXTENSIONS:-false}
      MANAGER_FEATURE_VOICE_QUEUES: ${MANAGER_FEATURE_VOICE_QUEUES:-false}
      MANAGER_FEATURE_FLOWS: ${MANAGER_FEATURE_FLOWS:-false}
      MANAGER_FEATURE_AUTOMATIONS: ${MANAGER_FEATURE_AUTOMATIONS:-false}
      MANAGER_FEATURE_CONTACTS: ${MANAGER_FEATURE_CONTACTS:-false}
      MANAGER_FEATURE_MESSAGES: ${MANAGER_FEATURE_MESSAGES:-false}
      MANAGER_FEATURE_USERS: ${MANAGER_FEATURE_USERS:-false}
      MANAGER_FEATURE_PERMISSIONS: ${MANAGER_FEATURE_PERMISSIONS:-false}
      MANAGER_FEATURE_AUDIT: ${MANAGER_FEATURE_AUDIT:-false}
      MANAGER_FEATURE_SECURITY: ${MANAGER_FEATURE_SECURITY:-false}
      MANAGER_FEATURE_UPDATES: ${MANAGER_FEATURE_UPDATES:-true}
      MANAGER_FEATURE_SETTINGS: ${MANAGER_FEATURE_SETTINGS:-true}
    depends_on:
      postgres-fersoft-connect-production:
        condition: service_healthy
      redis-fersoft-connect-production:
        condition: service_healthy
      rabbitmq-fersoft-connect-production:
        condition: service_healthy
      minio-fersoft-connect-production:
        condition: service_healthy
      docs-fersoft-connect-production:
        condition: service_healthy
    ports:
    - ${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_API_HOST_PORT:-38080}:8080
    volumes:
    - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/instances}:/argws-connect/instances
    networks:
    - fersoft-connect-production-net
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  mysql-fersoft-connect-production:
    depends_on:
      mysql-volume-init-fersoft-connect-production:
        condition: service_healthy
    profiles:
    - mysql
    image: ${ARGWS_CONNECT_MYSQL_IMAGE:-ghcr.io/wkarts/argws-connect-mysql:8.0}
    pull_policy: always
    container_name: mysql-fersoft-connect-production
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-argws_connect_api}
      MYSQL_USER: ${MYSQL_USERNAME:-argws_connect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    expose:
    - '3306'
    volumes:
    - ${ARGWS_CONNECT_MYSQL_DATA_PATH:-./volumes/mysql}:/var/lib/mysql
    networks:
      fersoft-connect-production-net:
        aliases:
        - mysql-fersoft-connect-production
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  operations-fersoft-connect-production:
    container_name: operations-fersoft-connect-production
    profiles:
    - operations
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:latest}
    pull_policy: always
    restart: unless-stopped
    entrypoint:
    - node
    - /argws-connect/operations-agent/server.cjs
    environment:
      TZ: ${TZ:-America/Bahia}
      OPERATIONS_INTERNAL_TOKEN: ${OPERATIONS_INTERNAL_TOKEN:-}
      OPERATIONS_DATA_PATH: /data
      OPERATIONS_HOT_DAYS: ${OPERATIONS_HOT_DAYS:-3}
      OPERATIONS_RETENTION_DAYS: ${OPERATIONS_RETENTION_DAYS:-90}
      OPERATIONS_CHECKS: '[{"service":"api","type":"http","url":"http://api-fersoft-connect-production:8080/health"},{"service":"docs","type":"http","url":"http://docs-fersoft-connect-production:8080/health"},{"service":"database","type":"tcp","url":"tcp://postgres-fersoft-connect-production:5432"},{"service":"cache","type":"tcp","url":"tcp://redis-fersoft-connect-production:6379"},{"service":"events","type":"tcp","url":"tcp://rabbitmq-fersoft-connect-production:5672"},{"service":"storage","type":"http","url":"http://minio-fersoft-connect-production:9000/minio/health/live"}]'
    expose:
    - '8092'
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 192m
    cpus: '0.50'
    pids_limit: 64
    volumes:
    - ${ARGWS_CONNECT_OPERATIONS_DATA_PATH:-./volumes/operations}:/data
    networks:
      fersoft-connect-production-net:
        aliases:
        - operations
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  docs-fersoft-connect-production:
    image: ${ARGWS_CONNECT_DOCS_IMAGE:-ghcr.io/wkarts/argws-connect-docs:latest}
    pull_policy: always
    container_name: docs-fersoft-connect-production
    restart: unless-stopped
    environment:
      BASE_PATH: ${ARGWS_CONNECT_DOCS_INTERNAL_BASE_PATH:-/manager/docs}
      SERVER_URL: ${SERVER_URL:-}
      API_REFERENCE_CONFIG: '{"sources":[{"url":"openapi/connect-api.openapi.json","title":"Connect|API REST API","slug":"rest","default":true},{"url":"openapi/findhub.openapi.json","title":"Connect|API
        Google Find Hub","slug":"findhub"},{"url":"openapi/meta-compatible.openapi.json","title":"Connect|API Meta Compatible","slug":"meta-compatible"},{"url":"openapi/connect-api-events.asyncapi.json","title":"Connect|API
        Events","slug":"events"}],"theme":"none","layout":"modern","darkMode":false,"showOperationId":true,"modelsSectionLabel":"Schemas","operationTitleSource":"summary","documentDownloadType":"both","showDeveloperTools":"localhost","customCss":".light-mode{--scalar-color-accent:#2563eb;--scalar-background-1:#ffffff;--scalar-background-2:#f7f9fc;--scalar-background-3:#eef3f9;--scalar-color-1:#0f172a;--scalar-color-2:#475569;--scalar-color-3:#64748b;--scalar-border-color:#dbe4ef}.dark-mode{--scalar-color-accent:#2f6df6;--scalar-background-1:#0f172a;--scalar-background-2:#111827;--scalar-background-3:#172033;--scalar-color-1:#f8fafc;--scalar-color-2:#cbd5e1;--scalar-color-3:#94a3b8;--scalar-border-color:#263249}"}'
    expose:
    - '8080'
    networks:
    - fersoft-connect-production-net
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  postgres-fersoft-connect-production:
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    pull_policy: always
    container_name: postgres-fersoft-connect-production
    restart: unless-stopped
    env_file:
    - .env
    command:
    - postgres
    - -c
    - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
    - -c
    - listen_addresses=*
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-argws_connect_api}
      POSTGRES_USER: ${POSTGRES_USERNAME:-argws_connect}
      TZ: ${TZ:-America/Bahia}
    expose:
    - '5432'
    volumes:
    - ${ARGWS_CONNECT_POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      fersoft-connect-production-net:
        aliases:
        - postgres-fersoft-connect-production
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  redis-fersoft-connect-production:
    image: ${ARGWS_CONNECT_REDIS_IMAGE:-ghcr.io/wkarts/argws-connect-redis:latest}
    pull_policy: always
    container_name: redis-fersoft-connect-production
    restart: unless-stopped
    env_file:
    - .env
    command:
    - sh
    - -c
    - exec redis-server --port 6379 --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    expose:
    - '6379'
    volumes:
    - ${ARGWS_CONNECT_REDIS_DATA_PATH:-./volumes/redis}:/data
    networks:
      fersoft-connect-production-net:
        aliases:
        - redis-fersoft-connect-production
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  rabbitmq-fersoft-connect-production:
    image: ${ARGWS_CONNECT_RABBITMQ_IMAGE:-ghcr.io/wkarts/argws-connect-rabbitmq:management}
    pull_policy: always
    container_name: rabbitmq-fersoft-connect-production
    restart: unless-stopped
    env_file:
    - .env
    expose:
    - '5672'
    - '15672'
    - '15692'
    volumes:
    - ${ARGWS_CONNECT_RABBITMQ_DATA_PATH:-./volumes/rabbitmq}:/var/lib/rabbitmq
    networks:
      fersoft-connect-production-net:
        aliases:
        - rabbitmq-fersoft-connect-production
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  minio-fersoft-connect-production:
    image: ${ARGWS_CONNECT_MINIO_IMAGE:-ghcr.io/wkarts/argws-connect-minio:latest}
    pull_policy: always
    container_name: minio-fersoft-connect-production
    restart: unless-stopped
    env_file:
    - .env
    command: server /data --console-address ":9001"
    expose:
    - '9000'
    - '9001'
    volumes:
    - ${ARGWS_CONNECT_MINIO_DATA_PATH:-./volumes/minio}:/data
    networks:
      fersoft-connect-production-net:
        aliases:
        - minio-fersoft-connect-production
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/minio/health/live
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  nats-fersoft-connect-production:
    profiles:
    - nats
    - extended
    image: ${ARGWS_CONNECT_NATS_IMAGE:-ghcr.io/wkarts/argws-connect-nats:2.10-alpine}
    pull_policy: always
    container_name: nats-fersoft-connect-production
    restart: unless-stopped
    command:
    - -js
    - -m
    - '8222'
    - --store_dir
    - /data
    expose:
    - '4222'
    - '8222'
    volumes:
    - ${ARGWS_CONNECT_NATS_DATA_PATH:-./volumes/nats}:/data
    networks:
      fersoft-connect-production-net:
        aliases:
        - nats-fersoft-connect-production
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  zookeeper-fersoft-connect-production:
    depends_on:
      volume-init-fersoft-connect-production:
        condition: service_healthy
    profiles:
    - kafka
    - extended
    image: ${ARGWS_CONNECT_ZOOKEEPER_IMAGE:-ghcr.io/wkarts/argws-connect-zookeeper:7.5.0}
    pull_policy: always
    container_name: zookeeper-fersoft-connect-production
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    expose:
    - '2181'
    volumes:
    - ${ARGWS_CONNECT_ZOOKEEPER_DATA_PATH:-./volumes/zookeeper/data}:/var/lib/zookeeper/data
    - ${ARGWS_CONNECT_ZOOKEEPER_LOG_PATH:-./volumes/zookeeper/log}:/var/lib/zookeeper/log
    networks:
      fersoft-connect-production-net:
        aliases:
        - zookeeper-fersoft-connect-production
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  kafka-fersoft-connect-production:
    profiles:
    - kafka
    - extended
    image: ${ARGWS_CONNECT_KAFKA_IMAGE:-ghcr.io/wkarts/argws-connect-kafka:7.5.0}
    pull_policy: always
    container_name: kafka-fersoft-connect-production
    restart: unless-stopped
    depends_on:
      zookeeper-fersoft-connect-production:
        condition: service_started
      volume-init-fersoft-connect-production:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-fersoft-connect-production:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-fersoft-connect-production:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    expose:
    - '9092'
    volumes:
    - ${ARGWS_CONNECT_KAFKA_DATA_PATH:-./volumes/kafka}:/var/lib/kafka/data
    networks:
      fersoft-connect-production-net:
        aliases:
        - kafka-fersoft-connect-production
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  traccar-fersoft-connect-production:
    container_name: traccar-fersoft-connect-production
    profiles:
    - traccar
    image: ${ARGWS_CONNECT_TRACCAR_IMAGE:-ghcr.io/wkarts/argws-connect-traccar:6.15.3-alpine}
    restart: unless-stopped
    depends_on:
      traccar-postgres-fersoft-connect-production:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: 'true'
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://traccar-postgres-fersoft-connect-production:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
      WEB_PORT: '8082'
      OSMAND_PORT: '5055'
      OSMAND_ADDRESS: 0.0.0.0
      PROTOCOLS_ENABLE: osmand
      SERVER_STATISTICS: ''
      GEOCODER_ENABLE: 'false'
      TZ: ${TZ:-America/Bahia}
    expose:
    - '8082'
    - '5055'
    volumes:
    - ${ARGWS_CONNECT_TRACCAR_DATA_PATH:-./volumes/traccar}:/opt/traccar/data
    networks:
      fersoft-connect-production-net:
        aliases:
        - traccar
    healthcheck:
      test:
      - CMD-SHELL
      - wget -S --spider -T 5 http://127.0.0.1:8082/api/server 2>&1 | grep -Eq 'HTTP/[0-9.]+ (200|401)'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  traccar-postgres-fersoft-connect-production:
    container_name: traccar-postgres-fersoft-connect-production
    profiles:
    - traccar
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
      TRACCAR_DATABASE_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - "set -Eeuo pipefail\n: \"$${TRACCAR_DATABASE_PASSWORD:?TRACCAR_DATABASE_PASSWORD nao configurada}\"\ndata_directory=\"\
      $${PGDATA:-/var/lib/postgresql/data}\"\n\n# Empty volume: retain the upstream PostgreSQL initialization behavior.\n\
      if [ ! -s \"$$data_directory/PG_VERSION\" ]; then\n  exec /usr/local/bin/docker-entrypoint.sh postgres\nfi\n\n# Existing\
      \ volume: preserve data and reconcile only the missing Traccar identity.\nif ! command -v gosu >/dev/null 2>&1; then\n\
      \  echo 'gosu nao esta disponivel na imagem PostgreSQL do Traccar.' >&2\n  exit 30\nfi\n/usr/local/bin/docker-entrypoint.sh\
      \ postgres &\npostgres_pid=\"$$!\"\nstop_postgres() {\n  kill -TERM \"$$postgres_pid\" 2>/dev/null || true\n  wait \"\
      $$postgres_pid\" || true\n  exit 0\n}\ntrap stop_postgres INT TERM\n\npostgres_ready=false\nfor attempt in $$(seq 1\
      \ 60); do\n  if gosu postgres psql --no-password -h /var/run/postgresql -U postgres -d postgres -tAc 'SELECT 1' >/dev/null\
      \ 2>&1; then\n    postgres_ready=true\n    break\n  fi\n  if ! kill -0 \"$$postgres_pid\" 2>/dev/null; then\n    wait\
      \ \"$$postgres_pid\" || true\n    exit 31\n  fi\n  sleep 1\ndone\nif [ \"$$postgres_ready\" != true ]; then\n  echo\
      \ 'Nao foi possivel validar a administracao local do PostgreSQL do Traccar.' >&2\n  kill -TERM \"$$postgres_pid\" 2>/dev/null\
      \ || true\n  wait \"$$postgres_pid\" || true\n  exit 31\nfi\n\nrole_exists=\"$$(gosu postgres psql --no-password -h\
      \ /var/run/postgresql -U postgres -d postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname = 'traccar'\")\"\nrole_created=false\n\
      if [ \"$$role_exists\" != 1 ]; then\n  gosu postgres psql --no-password -v ON_ERROR_STOP=1 -v traccar_password=\"$$TRACCAR_DATABASE_PASSWORD\"\
      \ -h /var/run/postgresql -U postgres -d postgres -c \"CREATE ROLE traccar LOGIN PASSWORD :'traccar_password'\"\n  role_created=true\n\
      fi\n\ndatabase_exists=\"$$(gosu postgres psql --no-password -h /var/run/postgresql -U postgres -d postgres -tAc \"SELECT\
      \ 1 FROM pg_database WHERE datname = 'traccar'\")\"\nif [ \"$$database_exists\" != 1 ]; then\n  gosu postgres psql --no-password\
      \ -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d postgres -c 'CREATE DATABASE traccar OWNER traccar'\nelif\
      \ [ \"$$role_created\" = true ]; then\n  gosu postgres psql --no-password -v ON_ERROR_STOP=1 -h /var/run/postgresql\
      \ -U postgres -d postgres -c 'ALTER DATABASE traccar OWNER TO traccar'\nfi\n\n# Existing role passwords are intentionally\
      \ never changed.\nPGPASSWORD=\"$$TRACCAR_DATABASE_PASSWORD\" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc\
      \ 'SELECT 1' | grep -qx 1\nwait \"$$postgres_pid\"\n"
    volumes:
    - ${ARGWS_CONNECT_TRACCAR_DB_PATH:-./volumes/traccar-postgres}:/var/lib/postgresql/data
    networks:
    - fersoft-connect-production-net
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${TRACCAR_DATABASE_PASSWORD}" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc "SELECT 1" |
        grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 75s
  traccar-bootstrap-fersoft-connect-production:
    container_name: traccar-bootstrap-fersoft-connect-production
    profiles:
    - traccar
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    restart: unless-stopped
    depends_on:
      traccar-fersoft-connect-production:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - "node - <<'NODE'\n  'use strict';\n  // Internal-only one-time bootstrap. Never resets users or changes existing passwords.\n\
      \  const root = process.env.TRACCAR_INTERNAL_URL || 'http://traccar:8082';\n  const email = process.env.TRACCAR_ADMIN_EMAIL;\n\
      \  const password = process.env.TRACCAR_ADMIN_PASSWORD;\n  async function main() {\n    if (!email || !password || password.length\
      \ < 32) throw new Error('Segredos Traccar nao preparados.');\n    let cookie = '';\n    async function request(path,\
      \ method='GET', data, form=false) {\n      const response = await fetch(root+path, { method, redirect:'error', signal:AbortSignal.timeout(15000),\n\
      \        headers:{ ...(cookie?{Cookie:cookie}:{}), ...(data?{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'}:{})\
      \ },\n        body:data ? form ? new URLSearchParams(data).toString() : JSON.stringify(data) : undefined });\n     \
      \ if(!response.ok) throw new Error('Traccar bootstrap recusado (HTTP '+response.status+').');\n      const set = response.headers.getSetCookie().map(x=>x.split(';')[0]).find(x=>x.startsWith('JSESSIONID='));\
      \ if(set) cookie=set;\n      return response.status===204?null:response.json();\n    }\n    let server;\n    for(let\
      \ n=0;n<40;n++) {try {server=await request('/api/server');break;}catch {if(n===39)throw new Error('Traccar indisponivel\
      \ no bootstrap.');await new Promise(r=>setTimeout(r,3000));}}\n    if(server.newServer===true) await request('/api/users','POST',{name:'Connect\
      \ internal service',email,password});\n    await request('/api/session','POST',{email,password},true);\n    server=await\
      \ request('/api/server');\n    if(server.registration) await request('/api/server','PUT',{...server,registration:false});\n\
      \    console.log('Traccar interno validado. Registro publico desabilitado; credenciais existentes preservadas.');\n\
      \  }\n  main().catch(()=>{console.error('Falha ao preparar Traccar. Verifique os segredos sem apagar usuarios/volumes.\
      \ A API principal nao depende deste bootstrap.');process.exitCode=1;});\nNODE\ntouch /tmp/traccar-bootstrap-ready\n\
      exec tail -f /dev/null\n"
    environment:
      TRACCAR_INTERNAL_URL: http://traccar:8082
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL:-connect-admin@localhost.invalid}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:-}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/traccar-bootstrap-ready
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - fersoft-connect-production-net
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
  volume-init-fersoft-connect-production:
    container_name: volume-init-fersoft-connect-production
    profiles:
    - kafka
    - extended
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    restart: unless-stopped
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - "prepare_directory() {\n  path=\"$$1\"\n  owner=\"$$2\"\n  label=\"$$3\"\n  mkdir -p \"$$path\"\n  if [ -n \"$$(ls -A\
      \ \"$$path\")\" ]; then\n    actual=\"$$(stat -c '%u:%g' \"$$path\")\"\n    [ \"$$actual\" = \"$$owner\" ] || {\n  \
      \    echo \"$$label contem dados e pertence a $$actual; esperado $$owner. Nenhum dado foi alterado.\" >&2\n      exit\
      \ 23\n    }\n    echo \"$$label preservado\"\n    return\n  fi\n  chown --no-dereference \"$$owner\" \"$$path\"\n  chmod\
      \ u+rwx \"$$path\"\n  echo \"$$label preparado\"\n}\nprepare_directory /prepared/zookeeper-data 1000:1000 zookeeper-data\n\
      prepare_directory /prepared/zookeeper-log 1000:1000 zookeeper-log\nprepare_directory /prepared/kafka 1000:1000 kafka\n\
      touch /tmp/volume-init-ready\nexec tail -f /dev/null\n"
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/volume-init-ready
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
    - ${ARGWS_CONNECT_ZOOKEEPER_DATA_PATH:-./volumes/zookeeper/data}:/prepared/zookeeper-data
    - ${ARGWS_CONNECT_ZOOKEEPER_LOG_PATH:-./volumes/zookeeper/log}:/prepared/zookeeper-log
    - ${ARGWS_CONNECT_KAFKA_DATA_PATH:-./volumes/kafka}:/prepared/kafka
    networks:
    - fersoft-connect-production-net
  mysql-volume-init-fersoft-connect-production:
    container_name: mysql-volume-init-fersoft-connect-production
    profiles:
    - mysql
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    restart: unless-stopped
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - 'mkdir -p /prepared/mysql

      # Percona 8.0 runs as uid 1001. Ownership repair changes metadata only;

      # it never removes or initializes files in an existing data directory.

      chown --no-dereference --recursive 1001:0 /prepared/mysql

      chmod u+rwx /prepared/mysql

      touch /tmp/mysql-volume-init-ready

      exec tail -f /dev/null

      '
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/mysql-volume-init-ready
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
    - ${ARGWS_CONNECT_MYSQL_DATA_PATH:-./volumes/mysql}:/prepared/mysql
    networks:
    - fersoft-connect-production-net
networks:
  fersoft-connect-production-net:
    name: ${ARGWS_CONNECT_NETWORK_NAME:-fersoft-connect-production-net}
    driver: bridge
