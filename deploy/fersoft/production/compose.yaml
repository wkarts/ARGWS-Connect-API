      - -q
      - ping
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
