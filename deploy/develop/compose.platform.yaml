# Connect|API develop -> Platform overlay
#
# Este arquivo NAO substitui deploy/develop/compose.yaml.
# Ele adiciona a Platform ao stack develop existente, preservando o Engine,
# PostgreSQL, Redis, RabbitMQ, MinIO e volumes/instances em uso.
#
# Uso:
# docker compose --env-file .env --env-file .platform.env \
#   -f compose.yaml -f compose.platform.yaml --profile platform up -d

x-platform-env: &platform-env
  APP_NAME: Connect|API Platform
  APP_VERSION: ${CONNECT_API_VERSION:-1.0.16}
  APP_ENV: ${PLATFORM_APP_ENV:-develop}
  APP_DEBUG: "false"
  APP_TIMEZONE: ${TZ:-America/Bahia}
  ENABLE_REFERENCE_FINANCIAL_DOMAIN: "false"
  APP_SECRET_KEY: ${PLATFORM_APP_SECRET_KEY:-CHANGE_ME_PLATFORM_APP_SECRET_KEY}
  FIELD_ENCRYPTION_KEY: ${PLATFORM_FIELD_ENCRYPTION_KEY:-CHANGE_ME_PLATFORM_FIELD_ENCRYPTION_KEY}
  INTERNAL_SERVICES_PASSWORD: ${PLATFORM_INTERNAL_SERVICES_PASSWORD:-CHANGE_ME_PLATFORM_INTERNAL_PASSWORD}
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-connect.example.com}
  CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-control.connect.example.com}
  API_HOST: ${API_HOST:-api.connect.example.com}
  TENANT_DOMAIN_ROOT: ${TENANT_DOMAIN_ROOT:-connect.example.com}
  PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
  TRUSTED_HOSTS: ${PLATFORM_TRUSTED_HOSTS:-connect.example.com,control.connect.example.com,admin.connect.example.com,partner.connect.example.com,demo.connect.example.com,.connect.example.com,localhost,127.0.0.1}
  CORS_ORIGINS: ${PLATFORM_CORS_ORIGINS:-https://connect.example.com,https://control.connect.example.com,https://admin.connect.example.com,https://partner.connect.example.com,https://demo.connect.example.com}
  POSTGRES_HOST: connect-platform-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-connect_api_platform}
  POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
  POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
  POSTGRES_ADMIN_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
  POSTGRES_ADMIN_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
  TENANT_DB_PREFIX: ${TENANT_DB_PREFIX:-connect_api_tenant}
  TENANT_DB_USER_PREFIX: ${TENANT_DB_USER_PREFIX:-connect_api_t}
  REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@connect-redis:6379/10
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@connect-redis:6379/11
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-argws_connect}:${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}@connect-rabbitmq:5672/${RABBITMQ_VHOST:-argws_connect}
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-argws_connect}:${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}@connect-rabbitmq:5672/${RABBITMQ_VHOST:-argws_connect}
  S3_ENDPOINT_URL: http://connect-minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-argws_connect}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
  S3_USE_SSL: "false"
  S3_BUCKET_PREFIX: connect-api-tenant
  PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Administrador da Plataforma}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@connect.example.com}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-CHANGE_ME_PLATFORM_ADMIN_PASSWORD}
  BOOTSTRAP_DEMO_TENANT: ${BOOTSTRAP_DEMO_TENANT:-false}
  DOMAIN_RECONCILIATION_TOKEN: ${DOMAIN_RECONCILIATION_TOKEN:-CHANGE_ME_DOMAIN_TOKEN}
  CONNECT_ENGINE_BASE_URL: http://connect-engine:8080
  CONNECT_ENGINE_API_KEY: ${AUTHENTICATION_API_KEY:-CHANGE_ME_GENERATE_A_STRONG_API_KEY}
  CONNECT_ENGINE_TIMEOUT_SECONDS: ${CONNECT_ENGINE_TIMEOUT_SECONDS:-30}
  CONNECT_ENGINE_VERIFY_TLS: "false"
  PROMETHEUS_ENABLED: ${PROMETHEUS_METRICS:-true}

x-platform-app: &platform-app
  image: ${ARGWS_CONNECT_PLATFORM_API_IMAGE:-ghcr.io/wkarts/argws-connect-platform-api:develop}
  pull_policy: always
  restart: unless-stopped
  profiles: [platform]
  environment: *platform-env
  networks: [argws-connect-develop-net]

services:
  # Adiciona aliases ao runtime existente. Nenhum destes serviços é duplicado.
  api-argws-connect-develop:
    environment:
      SERVER_DISABLE_MANAGER: "true"
    networks:
      argws-connect-develop-net:
        aliases: [connect-engine, argws-connect-api]

  docs-argws-connect-develop:
    networks:
      argws-connect-develop-net:
        aliases: [connect-docs]

  redis-argws-connect-develop:
    networks:
      argws-connect-develop-net:
        aliases: [connect-redis]

  rabbitmq-argws-connect-develop:
    networks:
      argws-connect-develop-net:
        aliases: [connect-rabbitmq]

  minio-argws-connect-develop:
    networks:
      argws-connect-develop-net:
        aliases: [connect-minio]

  # Banco NOVO somente para governanca/control-plane da Platform.
  # O PostgreSQL do Engine existente permanece intacto.
  platform-postgres-argws-connect-develop:
    container_name: platform-postgres-argws-connect-develop
    image: ${ARGWS_CONNECT_PLATFORM_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:17}
    pull_policy: always
    profiles: [platform]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-connect_api_platform}
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_POSTGRES_DATA_PATH:-./volumes/platform-postgres}:/var/lib/postgresql/data
    networks:
      argws-connect-develop-net:
        aliases: [connect-platform-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '$${POSTGRES_USER}' -d '$${POSTGRES_DB}'"]
      interval: 10s
      timeout: 5s
      retries: 30

  platform-migrate-argws-connect-develop:
    container_name: platform-migrate-argws-connect-develop
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate-platform"]
    depends_on:
      platform-postgres-argws-connect-develop: {condition: service_healthy}

  platform-migrate-tenants-argws-connect-develop:
    container_name: platform-migrate-tenants-argws-connect-develop
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate-all-tenants"]
    depends_on:
      platform-migrate-argws-connect-develop: {condition: service_completed_successfully}

  platform-bootstrap-argws-connect-develop:
    container_name: platform-bootstrap-argws-connect-develop
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "bootstrap"]
    depends_on:
      platform-migrate-tenants-argws-connect-develop: {condition: service_completed_successfully}
      api-argws-connect-develop: {condition: service_healthy}
      redis-argws-connect-develop: {condition: service_healthy}
      rabbitmq-argws-connect-develop: {condition: service_healthy}
      minio-argws-connect-develop: {condition: service_healthy}

  platform-api-argws-connect-develop:
    container_name: platform-api-argws-connect-develop
    <<: *platform-app
    command: ["gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "${PLATFORM_API_WORKERS:-2}", "--timeout", "120", "--graceful-timeout", "30", "--access-logfile", "-"]
    depends_on:
      platform-bootstrap-argws-connect-develop: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5).read()\""]
      interval: 20s
      timeout: 8s
      retries: 20
      start_period: 30s
    networks:
      argws-connect-develop-net:
        aliases: [connect-platform-api]
  platform-worker-argws-connect-develop:
    container_name: platform-worker-argws-connect-develop
    <<: *platform-app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "connect.default,connect.provisioning,connect.events,connect.automations,connect.webhooks", "--loglevel=INFO", "--concurrency=${PLATFORM_CELERY_CONCURRENCY:-2}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      platform-api-argws-connect-develop: {condition: service_healthy}

  platform-scheduler-argws-connect-develop:
    container_name: platform-scheduler-argws-connect-develop
    <<: *platform-app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_CELERY_DATA_PATH:-./volumes/platform-celery}:/var/lib/celery
    depends_on:
      platform-api-argws-connect-develop: {condition: service_healthy}

  platform-web-argws-connect-develop:
    container_name: platform-web-argws-connect-develop
    image: ${ARGWS_CONNECT_PLATFORM_WEB_IMAGE:-ghcr.io/wkarts/argws-connect-platform-web:develop}
    pull_policy: always
    profiles: [platform]
    restart: unless-stopped
    depends_on:
      platform-api-argws-connect-develop: {condition: service_healthy}
    networks:
      argws-connect-develop-net:
        aliases: [connect-platform-web]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 10

  platform-gateway-argws-connect-develop:
    container_name: platform-gateway-argws-connect-develop
    image: ${ARGWS_CONNECT_PLATFORM_GATEWAY_IMAGE:-ghcr.io/wkarts/argws-connect-platform-gateway:develop}
    pull_policy: always
    profiles: [platform]
    restart: unless-stopped
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-connect.example.com}
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-control.connect.example.com}
      ADMIN_HOST: ${ADMIN_HOST:-admin.connect.example.com}
      PARTNER_PLANE_HOST: ${PARTNER_PLANE_HOST:-partner.connect.example.com}
      API_HOST: ${API_HOST:-api.connect.example.com}
      DOCS_HOST: ${DOCS_HOST:-docs.connect.example.com}
      DEMO_HOST: ${DEMO_HOST:-demo.connect.example.com}
      TENANT_DOMAIN_ROOT: ${TENANT_DOMAIN_ROOT:-connect.example.com}
    depends_on:
      api-argws-connect-develop: {condition: service_healthy}
      docs-argws-connect-develop: {condition: service_healthy}
      platform-api-argws-connect-develop: {condition: service_healthy}
      platform-web-argws-connect-develop: {condition: service_healthy}
    ports:
      - "${PLATFORM_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_GATEWAY_PORT:-38800}:80"
    networks: [argws-connect-develop-net]
