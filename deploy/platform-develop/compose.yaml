name: ${COMPOSE_PROJECT_NAME:-argws-connect-platform-develop}

# Connect|API Platform — DEVELOP / stack completa e independente.
# Nao e overlay de deploy/develop e nao compartilha project/network/volumes.
# A stack inteira sobe por padrao: Engine + DOCs + Platform + infraestrutura.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-platform-env: &platform-env
  APP_NAME: Connect|API Platform
  APP_VERSION: ${CONNECT_API_VERSION:-1.0.16}
  APP_ENV: ${PLATFORM_APP_ENV:-development}
  APP_DEBUG: "false"
  APP_TIMEZONE: ${TZ:-America/Bahia}
  ENABLE_REFERENCE_FINANCIAL_DOMAIN: "false"
  APP_SECRET_KEY: ${PLATFORM_APP_SECRET_KEY:-CHANGE_ME_PLATFORM_APP_SECRET_KEY}
  FIELD_ENCRYPTION_KEY: ${PLATFORM_FIELD_ENCRYPTION_KEY:-CHANGE_ME_PLATFORM_FIELD_ENCRYPTION_KEY}
  INTERNAL_SERVICES_PASSWORD: ${PLATFORM_INTERNAL_SERVICES_PASSWORD:-CHANGE_ME_PLATFORM_INTERNAL_PASSWORD}
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-d.connect.argws.com.br}
  CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-d.control.connect.argws.com.br}
  API_HOST: ${API_HOST:-d.api.connect.argws.com.br}
  TENANT_DOMAIN_ROOT: ${TENANT_DOMAIN_ROOT:-d.connect.argws.com.br}
  PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
  TRUSTED_HOSTS: ${PLATFORM_TRUSTED_HOSTS:-d.connect.argws.com.br,d.control.connect.argws.com.br,d.admin.connect.argws.com.br,d.partner.connect.argws.com.br,d.api.connect.argws.com.br,d.docs.connect.argws.com.br,d.demo.connect.argws.com.br,.d.connect.argws.com.br,localhost,127.0.0.1}
  CORS_ORIGINS: ${PLATFORM_CORS_ORIGINS:-https://d.connect.argws.com.br,https://d.control.connect.argws.com.br,https://d.admin.connect.argws.com.br,https://d.partner.connect.argws.com.br,https://d.demo.connect.argws.com.br}
  SMTP_ENABLED: "${SMTP_ENABLED:-false}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
  SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
  SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Connect|API Platform}"
  SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-30}"
  PASSWORD_RESET_URL: "${PASSWORD_RESET_URL:-https://d.control.connect.argws.com.br/reset-password}"
  PASSWORD_RESET_TOKEN_TTL_MINUTES: "${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}"
  PASSWORD_RESET_REQUESTS_PER_ACCOUNT_HOUR: "${PASSWORD_RESET_REQUESTS_PER_ACCOUNT_HOUR:-5}"
  PASSWORD_RESET_REQUESTS_PER_IP_HOUR: "${PASSWORD_RESET_REQUESTS_PER_IP_HOUR:-30}"
  PASSWORD_RESET_ATTEMPTS_PER_IP_HOUR: "${PASSWORD_RESET_ATTEMPTS_PER_IP_HOUR:-30}"
  POSTGRES_HOST: connect-platform-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-connect_api_platform_develop}
  POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
  POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
  POSTGRES_ADMIN_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
  POSTGRES_ADMIN_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
  TENANT_DB_PREFIX: ${TENANT_DB_PREFIX:-connect_api_tenant_develop}
  TENANT_DB_USER_PREFIX: ${TENANT_DB_USER_PREFIX:-connect_api_t_dev}
  REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@connect-redis:6379/10
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@connect-redis:6379/11
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-argws_connect}:${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}@connect-rabbitmq:5672/${RABBITMQ_VHOST:-argws_connect}
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-argws_connect}:${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}@connect-rabbitmq:5672/${RABBITMQ_VHOST:-argws_connect}
  S3_ENDPOINT_URL: ${PLATFORM_S3_ENDPOINT_URL:-http://connect-minio:9000}
  S3_PUBLIC_ENDPOINT_URL: ${PLATFORM_S3_PUBLIC_ENDPOINT_URL:-${S3_PUBLIC_ENDPOINT_URL:-}}
  S3_REGION: ${PLATFORM_S3_REGION:-${S3_REGION:-us-east-1}}
  S3_ACCESS_KEY: ${PLATFORM_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-argws_connect}}
  S3_SECRET_KEY: ${PLATFORM_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}}
  S3_USE_SSL: "${PLATFORM_S3_USE_SSL:-false}"
  S3_BUCKET_PREFIX: ${PLATFORM_S3_BUCKET_PREFIX:-${S3_BUCKET_PREFIX:-connect-api-develop-tenant}}
  PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Administrador da Plataforma}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@connect.argws.com.br}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-CHANGE_ME_PLATFORM_ADMIN_PASSWORD}
  BOOTSTRAP_DEMO_TENANT: ${BOOTSTRAP_DEMO_TENANT:-true}
  DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-Empresa Demonstração}
  DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-demo}
  DEMO_TENANT_ADMIN_NAME: ${DEMO_TENANT_ADMIN_NAME:-Administrador Demo}
  DEMO_TENANT_ADMIN_EMAIL: ${DEMO_TENANT_ADMIN_EMAIL:-admin.demo@connect.argws.com.br}
  DEMO_TENANT_ADMIN_PASSWORD: ${DEMO_TENANT_ADMIN_PASSWORD:-CHANGE_ME_DEMO_ADMIN_PASSWORD}
  DOMAIN_RECONCILIATION_TOKEN: ${DOMAIN_RECONCILIATION_TOKEN:-CHANGE_ME_DOMAIN_TOKEN}
  CONNECT_ENGINE_BASE_URL: http://connect-engine:8080
  CONNECT_ENGINE_API_KEY: ${AUTHENTICATION_API_KEY:-CHANGE_ME_GENERATE_A_STRONG_API_KEY}
  CONNECT_ENGINE_TIMEOUT_SECONDS: ${CONNECT_ENGINE_TIMEOUT_SECONDS:-30}
  CONNECT_ENGINE_VERIFY_TLS: "false"
  PROMETHEUS_ENABLED: ${PROMETHEUS_METRICS:-true}
  LOG_AGENT_URL: http://connect-log-agent:8091
  RUNTIME_LOG_RETENTION_DAYS: ${RUNTIME_LOG_RETENTION_DAYS:-30}
  CLOUDFLARE_ENABLED: "${CLOUDFLARE_ENABLED:-false}"
  CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
  CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
  CLOUDFLARE_ZONE_ID: "${CLOUDFLARE_ZONE_ID:-}"
  CLOUDFLARE_ZONE_NAME: "${CLOUDFLARE_ZONE_NAME:-}"
  CLOUDFLARE_PROXIED: "${CLOUDFLARE_PROXIED:-true}"
  CLOUDFLARE_TENANT_RECORD_TARGET: "${CLOUDFLARE_TENANT_RECORD_TARGET:-}"
  CLOUDFLARE_PROVISIONING_MODE: ${CLOUDFLARE_PROVISIONING_MODE:-wildcard}
  BACKUP_ENABLED: "${BACKUP_ENABLED:-true}"
  BACKUP_DIR: /data/backups
  BACKUP_CRON: "${BACKUP_CRON:-0 2 * * *}"
  BACKUP_KEEP_DAILY: "${BACKUP_KEEP_DAILY:-14}"
  BACKUP_KEEP_WEEKLY: "${BACKUP_KEEP_WEEKLY:-8}"
  BACKUP_KEEP_MONTHLY: "${BACKUP_KEEP_MONTHLY:-12}"
  BACKUP_COMPRESS_LEVEL: "${BACKUP_COMPRESS_LEVEL:-9}"
  BACKUP_ENCRYPTION_RECIPIENT: "${BACKUP_ENCRYPTION_RECIPIENT:-}"
  BACKUP_UPLOAD_S3: "${BACKUP_UPLOAD_S3:-true}"
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-connect-api-backups}
  BACKUP_GOOGLE_DRIVE_ENABLED: "${BACKUP_GOOGLE_DRIVE_ENABLED:-false}"
  BACKUP_GOOGLE_DRIVE_REMOTE: ${BACKUP_GOOGLE_DRIVE_REMOTE:-gdrive:connect-api-platform}
  BACKUP_DROPBOX_ENABLED: "${BACKUP_DROPBOX_ENABLED:-false}"
  BACKUP_DROPBOX_REMOTE: ${BACKUP_DROPBOX_REMOTE:-dropbox:connect-api-platform}
  PROMETHEUS_BASE_URL: http://connect-prometheus:9090
  PROMETHEUS_LIFECYCLE_ENABLED: "${PROMETHEUS_LIFECYCLE_ENABLED:-false}"
  GRAFANA_BASE_URL: http://connect-grafana:3000
  GRAFANA_SERVICE_ACCOUNT_TOKEN: "${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}"
  GRAFANA_ORG_ID: "${GRAFANA_ORG_ID:-1}"

x-platform-app: &platform-app
  image: ${ARGWS_CONNECT_PLATFORM_API_IMAGE:-ghcr.io/wkarts/argws-connect-platform-api:develop}
  pull_policy: always
  restart: unless-stopped
  environment: *platform-env
  networks: [argws-connect-platform-develop-net]
  logging: *default-logging

services:
  api-argws-connect-platform-develop:
    container_name: api-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:develop}
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: ${SERVER_URL:-https://d.api.connect.argws.com.br}
      SERVER_DISABLE_MANAGER: "true"
      DOCKER_ENV: "true"
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USERNAME:-argws_connect}:${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}@connect-engine-postgres:5432/${POSTGRES_DATABASE:-argws_connect_platform_develop}?schema=public
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@connect-redis:6379/0
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-argws_connect}:${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}@connect-rabbitmq:5672/${RABBITMQ_VHOST:-argws_connect}
      S3_ENDPOINT: connect-minio
      S3_PORT: "9000"
    depends_on:
      postgres-argws-connect-platform-develop: {condition: service_healthy}
      redis-argws-connect-platform-develop: {condition: service_healthy}
      rabbitmq-argws-connect-platform-develop: {condition: service_healthy}
      minio-argws-connect-platform-develop: {condition: service_healthy}
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_API_HOST_PORT:-38082}:8080"
    volumes:
      - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/instances}:/argws-connect/instances
    networks:
      argws-connect-platform-develop-net:
        aliases: [argws-connect-api, connect-engine]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  docs-argws-connect-platform-develop:
    container_name: docs-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_DOCS_IMAGE:-ghcr.io/wkarts/argws-connect-docs:develop}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_DOCS_HOST_PORT:-38182}:8080"
    networks:
      argws-connect-platform-develop-net:
        aliases: [connect-docs]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  postgres-argws-connect-platform-develop:
    container_name: postgres-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-argws_connect_platform_develop}
      POSTGRES_USER: ${POSTGRES_USERNAME:-argws_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    volumes:
      - ${ARGWS_CONNECT_POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      argws-connect-platform-develop-net:
        aliases: [argws-connect-postgres, connect-engine-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis-argws-connect-platform-develop:
    container_name: redis-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_REDIS_IMAGE:-ghcr.io/wkarts/argws-connect-redis:latest}
    pull_policy: always
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    volumes:
      - ${ARGWS_CONNECT_REDIS_DATA_PATH:-./volumes/redis}:/data
    networks:
      argws-connect-platform-develop-net:
        aliases: [argws-connect-redis, connect-redis]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q '^PONG$'"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  rabbitmq-argws-connect-platform-develop:
    container_name: rabbitmq-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_RABBITMQ_IMAGE:-ghcr.io/wkarts/argws-connect-rabbitmq:management}
    pull_policy: always
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-argws_connect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-argws_connect}
    volumes:
      - ${ARGWS_CONNECT_RABBITMQ_DATA_PATH:-./volumes/rabbitmq}:/var/lib/rabbitmq
    networks:
      argws-connect-platform-develop-net:
        aliases: [argws-connect-rabbitmq, connect-rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
    logging: *default-logging

  minio-argws-connect-platform-develop:
    container_name: minio-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_MINIO_IMAGE:-ghcr.io/wkarts/argws-connect-minio:latest}
    pull_policy: always
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-argws_connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
    volumes:
      - ${ARGWS_CONNECT_MINIO_DATA_PATH:-./volumes/minio}:/data
    networks:
      argws-connect-platform-develop-net:
        aliases: [argws-connect-minio, connect-minio]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging: *default-logging

  platform-postgres-argws-connect-platform-develop:
    container_name: platform-postgres-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_PLATFORM_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:17}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-connect_api_platform_develop}
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_POSTGRES_DATA_PATH:-./volumes/platform-postgres}:/var/lib/postgresql/data
    networks:
      argws-connect-platform-develop-net:
        aliases: [connect-platform-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *default-logging

  platform-migrate-argws-connect-platform-develop:
    container_name: platform-migrate-argws-connect-platform-develop
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate-platform"]
    depends_on:
      platform-postgres-argws-connect-platform-develop: {condition: service_healthy}

  platform-migrate-tenants-argws-connect-platform-develop:
    container_name: platform-migrate-tenants-argws-connect-platform-develop
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate-all-tenants"]
    depends_on:
      platform-migrate-argws-connect-platform-develop: {condition: service_completed_successfully}

  platform-bootstrap-argws-connect-platform-develop:
    container_name: platform-bootstrap-argws-connect-platform-develop
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "bootstrap"]
    depends_on:
      platform-migrate-tenants-argws-connect-platform-develop: {condition: service_completed_successfully}
      api-argws-connect-platform-develop: {condition: service_healthy}
      redis-argws-connect-platform-develop: {condition: service_healthy}
      rabbitmq-argws-connect-platform-develop: {condition: service_healthy}
      minio-argws-connect-platform-develop: {condition: service_healthy}

  platform-api-argws-connect-platform-develop:
    container_name: platform-api-argws-connect-platform-develop
    <<: *platform-app
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_BACKUPS_DATA_PATH:-./volumes/platform-backups}:/data/backups
    command: ["gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "${PLATFORM_API_WORKERS:-2}", "--timeout", "120", "--graceful-timeout", "30", "--access-logfile", "-"]
    depends_on:
      platform-bootstrap-argws-connect-platform-develop: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5).read()\""]
      interval: 20s
      timeout: 8s
      retries: 20
      start_period: 30s
    networks:
      argws-connect-platform-develop-net:
        aliases: [connect-platform-api]

  platform-worker-argws-connect-platform-develop:
    container_name: platform-worker-argws-connect-platform-develop
    <<: *platform-app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "connect.default,connect.provisioning,connect.events,connect.automations,connect.webhooks", "--loglevel=INFO", "--concurrency=${PLATFORM_CELERY_CONCURRENCY:-2}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      platform-observability-init-argws-connect-platform-develop: {condition: service_completed_successfully}
      platform-api-argws-connect-platform-develop: {condition: service_healthy}

  platform-scheduler-argws-connect-platform-develop:
    container_name: platform-scheduler-argws-connect-platform-develop
    <<: *platform-app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    depends_on:
      platform-api-argws-connect-platform-develop: {condition: service_healthy}

  platform-worker-backups-argws-connect-platform-develop:
    container_name: platform-worker-backups-argws-connect-platform-develop
    <<: *platform-app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "connect.backups", "--loglevel=INFO", "--concurrency=1", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_BACKUPS_DATA_PATH:-./volumes/platform-backups}:/data/backups
    depends_on:
      platform-api-argws-connect-platform-develop: {condition: service_healthy}

  platform-docker-proxy-argws-connect-platform-develop:
    container_name: platform-docker-proxy-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_DOCKER_PROXY_IMAGE:-ghcr.io/wkarts/argws-connect-docker-proxy:v0.5.0}
    pull_policy: always
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "0"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      argws-connect-platform-develop-net:
        aliases: [connect-docker-proxy]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  platform-log-agent-argws-connect-platform-develop:
    container_name: platform-log-agent-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_PLATFORM_API_IMAGE:-ghcr.io/wkarts/argws-connect-platform-api:develop}
    pull_policy: always
    restart: unless-stopped
    command: ["uvicorn", "app.log_agent:app", "--host", "0.0.0.0", "--port", "8091", "--workers", "1"]
    environment:
      INTERNAL_SERVICES_PASSWORD: ${PLATFORM_INTERNAL_SERVICES_PASSWORD:-CHANGE_ME_PLATFORM_INTERNAL_PASSWORD}
      DOCKER_API_URL: http://connect-docker-proxy:2375
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-argws-connect-platform-develop}
      LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-INFO}
    depends_on:
      platform-docker-proxy-argws-connect-platform-develop: {condition: service_started}
    networks:
      argws-connect-platform-develop-net:
        aliases: [connect-log-agent]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  platform-observability-init-argws-connect-platform-develop:
    container_name: platform-observability-init-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_PLATFORM_API_IMAGE:-ghcr.io/wkarts/argws-connect-platform-api:develop}
    pull_policy: always
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        set -eu
        mkdir -p /prometheus-data /grafana-data
        chown -R 65534:65534 /prometheus-data
        chmod -R u+rwX,go-rwx /prometheus-data
        chown -R 472:0 /grafana-data
        chmod -R u+rwX,g+rwX,o-rwx /grafana-data
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_PROMETHEUS_DATA_PATH:-./volumes/platform-prometheus}:/prometheus-data
      - ${ARGWS_CONNECT_PLATFORM_GRAFANA_DATA_PATH:-./volumes/platform-grafana}:/grafana-data
    networks: [argws-connect-platform-develop-net]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  platform-prometheus-argws-connect-platform-develop:
    container_name: platform-prometheus-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_PROMETHEUS_IMAGE:-ghcr.io/wkarts/argws-connect-prometheus:v3.5.0}
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat > /tmp/prometheus.yml <<'EOF'
        global:
          scrape_interval: 30s
          evaluation_interval: 30s

        scrape_configs:
          - job_name: connect-api
            metrics_path: /metrics
            static_configs:
              - targets: ["connect-platform-api:8000"]
        EOF
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time="${PROMETHEUS_RETENTION:-30d}"
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_PROMETHEUS_DATA_PATH:-./volumes/platform-prometheus}:/prometheus
    depends_on:
      platform-api-argws-connect-platform-develop: {condition: service_healthy}
    networks:
      argws-connect-platform-develop-net:
        aliases: [connect-prometheus]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  platform-grafana-argws-connect-platform-develop:
    container_name: platform-grafana-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_GRAFANA_IMAGE:-ghcr.io/wkarts/argws-connect-grafana:12.1.0}
    pull_policy: always
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://connect-grafana:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /tmp/grafana-provisioning
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /tmp/grafana-provisioning/datasources /tmp/grafana-provisioning/dashboards
        cat > /tmp/grafana-provisioning/datasources/prometheus.yml <<'EOF'
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://connect-prometheus:9090
            isDefault: true
            editable: false
        EOF
        cat > /tmp/grafana-provisioning/dashboards/dashboards.yml <<'EOF'
        apiVersion: 1
        providers:
          - name: Connect|API Platform
            folder: Connect|API Platform
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards
        EOF
        exec /run.sh
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_GRAFANA_DATA_PATH:-./volumes/platform-grafana}:/var/lib/grafana
    depends_on:
      platform-observability-init-argws-connect-platform-develop: {condition: service_completed_successfully}
      platform-prometheus-argws-connect-platform-develop: {condition: service_started}
    networks:
      argws-connect-platform-develop-net:
        aliases: [connect-grafana]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  platform-acme-argws-connect-platform-develop:
    container_name: platform-acme-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_PLATFORM_ACME_IMAGE:-ghcr.io/wkarts/argws-connect-platform-acme:develop}
    pull_policy: always
    profiles: [cloudpanel]
    restart: unless-stopped
    environment:
      CF_Token: ${CLOUDFLARE_API_TOKEN:-}
      ACME_DOMAIN: ${ACME_DOMAIN:-d.connect.argws.com.br}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-false}
      ACME_DNS_SLEEP: ${ACME_DNS_SLEEP:-20}
      ACME_CHECK_INTERVAL_SECONDS: ${ACME_CHECK_INTERVAL_SECONDS:-43200}
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_ACME_DATA_PATH:-./volumes/platform-acme}:/acme.sh
      - ${ARGWS_CONNECT_PLATFORM_CERTS_DATA_PATH:-./volumes/platform-certs}:/certs
    networks: [argws-connect-platform-develop-net]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  platform-cloudpanel-agent-argws-connect-platform-develop:
    container_name: platform-cloudpanel-agent-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_PLATFORM_CLOUDPANEL_AGENT_IMAGE:-ghcr.io/wkarts/argws-connect-platform-cloudpanel-agent:develop}
    pull_policy: always
    profiles: [cloudpanel]
    restart: unless-stopped
    user: "0:0"
    privileged: true
    pid: host
    network_mode: host
    read_only: true
    depends_on:
      platform-acme-argws-connect-platform-develop: {condition: service_started}
    environment:
      HOST_ROOT: /host
      CERT_DIR: /certs
      STATE_DIR: /state
      CLOUDPANEL_SITE_DOMAIN: ${CLOUDPANEL_SITE_DOMAIN:-d.connect.argws.com.br}
      CLOUDPANEL_WILDCARD_DOMAIN: ${CLOUDPANEL_WILDCARD_DOMAIN:-*.d.connect.argws.com.br}
      CLOUDPANEL_SITE_USER: ${CLOUDPANEL_SITE_USER:-connectapi}
      CLOUDPANEL_SITE_USER_PASSWORD: ${CLOUDPANEL_SITE_USER_PASSWORD:-}
      CLOUDPANEL_REVERSE_PROXY_URL: ${CLOUDPANEL_REVERSE_PROXY_URL:-http://127.0.0.1:${PLATFORM_GATEWAY_PORT:-38800}}
      CLOUDPANEL_SYNC_INTERVAL_SECONDS: ${CLOUDPANEL_SYNC_INTERVAL_SECONDS:-60}
    volumes:
      - /:/host:rw
      - ${ARGWS_CONNECT_PLATFORM_CERTS_DATA_PATH:-./volumes/platform-certs}:/certs:rw
      - ${ARGWS_CONNECT_PLATFORM_CLOUDPANEL_STATE_PATH:-./volumes/platform-cloudpanel-agent}:/state:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging: *default-logging

  platform-web-argws-connect-platform-develop:
    container_name: platform-web-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_PLATFORM_WEB_IMAGE:-ghcr.io/wkarts/argws-connect-platform-web:develop}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      platform-api-argws-connect-platform-develop: {condition: service_healthy}
    networks:
      argws-connect-platform-develop-net:
        aliases: [connect-platform-web]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 10
    logging: *default-logging

  platform-gateway-argws-connect-platform-develop:
    container_name: platform-gateway-argws-connect-platform-develop
    image: ${ARGWS_CONNECT_PLATFORM_GATEWAY_IMAGE:-ghcr.io/wkarts/argws-connect-platform-gateway:develop}
    pull_policy: always
    restart: unless-stopped
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-d.connect.argws.com.br}
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-d.control.connect.argws.com.br}
      ADMIN_HOST: ${ADMIN_HOST:-d.admin.connect.argws.com.br}
      PARTNER_PLANE_HOST: ${PARTNER_PLANE_HOST:-d.partner.connect.argws.com.br}
      API_HOST: ${API_HOST:-d.api.connect.argws.com.br}
      DOCS_HOST: ${DOCS_HOST:-d.docs.connect.argws.com.br}
      DEMO_HOST: ${DEMO_HOST:-d.demo.connect.argws.com.br}
      TENANT_DOMAIN_ROOT: ${TENANT_DOMAIN_ROOT:-d.connect.argws.com.br}
    depends_on:
      api-argws-connect-platform-develop: {condition: service_healthy}
      platform-api-argws-connect-platform-develop: {condition: service_healthy}
      platform-web-argws-connect-platform-develop: {condition: service_healthy}
      docs-argws-connect-platform-develop: {condition: service_healthy}
    ports:
      - "${PLATFORM_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_GATEWAY_PORT:-38802}:80"
    networks: [argws-connect-platform-develop-net]
    logging: *default-logging

networks:
  argws-connect-platform-develop-net:
    name: ${ARGWS_CONNECT_NETWORK_NAME:-argws-connect-platform-develop-net}
    driver: bridge
