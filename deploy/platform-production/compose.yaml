name: ${COMPOSE_PROJECT_NAME:-argws-connect-platform-production}

# Connect|API Platform — PRODUCTION / stack completa e independente.
# Nao e overlay de deploy/production e nao compartilha project/network/volumes.
# A stack inteira sobe por padrao: Engine + DOCs + Platform + infraestrutura.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-platform-env: &platform-env
  APP_NAME: Connect|API Platform
  APP_VERSION: ${CONNECT_API_VERSION:-1.0.16}
  APP_ENV: ${PLATFORM_APP_ENV:-production}
  APP_DEBUG: "false"
  APP_TIMEZONE: ${TZ:-America/Bahia}
  ENABLE_REFERENCE_FINANCIAL_DOMAIN: "false"
  APP_SECRET_KEY: ${PLATFORM_APP_SECRET_KEY:-CHANGE_ME_PLATFORM_APP_SECRET_KEY}
  FIELD_ENCRYPTION_KEY: ${PLATFORM_FIELD_ENCRYPTION_KEY:-CHANGE_ME_PLATFORM_FIELD_ENCRYPTION_KEY}
  INTERNAL_SERVICES_PASSWORD: ${PLATFORM_INTERNAL_SERVICES_PASSWORD:-CHANGE_ME_PLATFORM_INTERNAL_PASSWORD}
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-connect.argws.com.br}
  CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-control.connect.argws.com.br}
  API_HOST: ${API_HOST:-api.connect.argws.com.br}
  TENANT_DOMAIN_ROOT: ${TENANT_DOMAIN_ROOT:-connect.argws.com.br}
  PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
  TRUSTED_HOSTS: ${PLATFORM_TRUSTED_HOSTS:-connect.argws.com.br,control.connect.argws.com.br,admin.connect.argws.com.br,partner.connect.argws.com.br,api.connect.argws.com.br,docs.connect.argws.com.br,demo.connect.argws.com.br,.connect.argws.com.br,localhost,127.0.0.1}
  CORS_ORIGINS: ${PLATFORM_CORS_ORIGINS:-https://connect.argws.com.br,https://control.connect.argws.com.br,https://admin.connect.argws.com.br,https://partner.connect.argws.com.br,https://demo.connect.argws.com.br}
  POSTGRES_HOST: connect-platform-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-connect_api_platform}
  POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
  POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
  POSTGRES_ADMIN_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
  POSTGRES_ADMIN_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
  TENANT_DB_PREFIX: ${TENANT_DB_PREFIX:-connect_api_tenant}
  TENANT_DB_USER_PREFIX: ${TENANT_DB_USER_PREFIX:-connect_api_t}
  REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@connect-redis:6379/10
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@connect-redis:6379/11
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-argws_connect}:${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}@connect-rabbitmq:5672/${RABBITMQ_VHOST:-argws_connect}
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-argws_connect}:${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}@connect-rabbitmq:5672/${RABBITMQ_VHOST:-argws_connect}
  S3_ENDPOINT_URL: http://connect-minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-argws_connect}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
  S3_USE_SSL: "false"
  S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:-connect-api-tenant}
  PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Administrador da Plataforma}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@connect.argws.com.br}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-CHANGE_ME_PLATFORM_ADMIN_PASSWORD}
  BOOTSTRAP_DEMO_TENANT: ${BOOTSTRAP_DEMO_TENANT:-false}
  DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-Empresa Demonstração}
  DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-demo}
  DEMO_TENANT_ADMIN_NAME: ${DEMO_TENANT_ADMIN_NAME:-Administrador Demo}
  DEMO_TENANT_ADMIN_EMAIL: ${DEMO_TENANT_ADMIN_EMAIL:-admin.demo@connect.argws.com.br}
  DEMO_TENANT_ADMIN_PASSWORD: ${DEMO_TENANT_ADMIN_PASSWORD:-CHANGE_ME_DEMO_ADMIN_PASSWORD}
  DOMAIN_RECONCILIATION_TOKEN: ${DOMAIN_RECONCILIATION_TOKEN:-CHANGE_ME_DOMAIN_TOKEN}
  CONNECT_ENGINE_BASE_URL: http://connect-engine:8080
  CONNECT_ENGINE_API_KEY: ${AUTHENTICATION_API_KEY:-CHANGE_ME_GENERATE_A_STRONG_API_KEY}
  CONNECT_ENGINE_TIMEOUT_SECONDS: ${CONNECT_ENGINE_TIMEOUT_SECONDS:-30}
  CONNECT_ENGINE_VERIFY_TLS: "false"
  PROMETHEUS_ENABLED: ${PROMETHEUS_METRICS:-true}

x-platform-app: &platform-app
  image: ${ARGWS_CONNECT_PLATFORM_API_IMAGE:-ghcr.io/wkarts/argws-connect-platform-api:latest}
  pull_policy: always
  restart: unless-stopped
  environment: *platform-env
  networks: [argws-connect-platform-production-net]
  logging: *default-logging

services:
  api-argws-connect-platform-production:
    container_name: api-argws-connect-platform-production
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: ${SERVER_URL:-https://api.connect.argws.com.br}
      SERVER_DISABLE_MANAGER: "true"
      DOCKER_ENV: "true"
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USERNAME:-argws_connect}:${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}@connect-engine-postgres:5432/${POSTGRES_DATABASE:-argws_connect_platform_production}?schema=public
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@connect-redis:6379/0
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-argws_connect}:${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}@connect-rabbitmq:5672/${RABBITMQ_VHOST:-argws_connect}
      S3_ENDPOINT: connect-minio
      S3_PORT: "9000"
    depends_on:
      postgres-argws-connect-platform-production: {condition: service_healthy}
      redis-argws-connect-platform-production: {condition: service_healthy}
      rabbitmq-argws-connect-platform-production: {condition: service_healthy}
      minio-argws-connect-platform-production: {condition: service_healthy}
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_API_HOST_PORT:-38080}:8080"
    volumes:
      - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/instances}:/argws-connect/instances
    networks:
      argws-connect-platform-production-net:
        aliases: [argws-connect-api, connect-engine]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  docs-argws-connect-platform-production:
    container_name: docs-argws-connect-platform-production
    image: ${ARGWS_CONNECT_DOCS_IMAGE:-ghcr.io/wkarts/argws-connect-docs:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_DOCS_HOST_PORT:-38180}:8080"
    networks:
      argws-connect-platform-production-net:
        aliases: [connect-docs]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  postgres-argws-connect-platform-production:
    container_name: postgres-argws-connect-platform-production
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-argws_connect_platform_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-argws_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    volumes:
      - ${ARGWS_CONNECT_POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      argws-connect-platform-production-net:
        aliases: [argws-connect-postgres, connect-engine-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis-argws-connect-platform-production:
    container_name: redis-argws-connect-platform-production
    image: ${ARGWS_CONNECT_REDIS_IMAGE:-ghcr.io/wkarts/argws-connect-redis:latest}
    pull_policy: always
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    volumes:
      - ${ARGWS_CONNECT_REDIS_DATA_PATH:-./volumes/redis}:/data
    networks:
      argws-connect-platform-production-net:
        aliases: [argws-connect-redis, connect-redis]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  rabbitmq-argws-connect-platform-production:
    container_name: rabbitmq-argws-connect-platform-production
    image: ${ARGWS_CONNECT_RABBITMQ_IMAGE:-ghcr.io/wkarts/argws-connect-rabbitmq:management}
    pull_policy: always
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-argws_connect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-argws_connect}
    volumes:
      - ${ARGWS_CONNECT_RABBITMQ_DATA_PATH:-./volumes/rabbitmq}:/var/lib/rabbitmq
    networks:
      argws-connect-platform-production-net:
        aliases: [argws-connect-rabbitmq, connect-rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
    logging: *default-logging

  minio-argws-connect-platform-production:
    container_name: minio-argws-connect-platform-production
    image: ${ARGWS_CONNECT_MINIO_IMAGE:-ghcr.io/wkarts/argws-connect-minio:latest}
    pull_policy: always
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-argws_connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
    volumes:
      - ${ARGWS_CONNECT_MINIO_DATA_PATH:-./volumes/minio}:/data
    networks:
      argws-connect-platform-production-net:
        aliases: [argws-connect-minio, connect-minio]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging: *default-logging

  platform-postgres-argws-connect-platform-production:
    container_name: platform-postgres-argws-connect-platform-production
    image: ${ARGWS_CONNECT_PLATFORM_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:17}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-connect_api_platform}
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-connect_api_platform}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-CHANGE_ME_PLATFORM_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_POSTGRES_DATA_PATH:-./volumes/platform-postgres}:/var/lib/postgresql/data
    networks:
      argws-connect-platform-production-net:
        aliases: [connect-platform-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *default-logging

  platform-migrate-argws-connect-platform-production:
    container_name: platform-migrate-argws-connect-platform-production
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate-platform"]
    depends_on:
      platform-postgres-argws-connect-platform-production: {condition: service_healthy}

  platform-migrate-tenants-argws-connect-platform-production:
    container_name: platform-migrate-tenants-argws-connect-platform-production
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate-all-tenants"]
    depends_on:
      platform-migrate-argws-connect-platform-production: {condition: service_completed_successfully}

  platform-bootstrap-argws-connect-platform-production:
    container_name: platform-bootstrap-argws-connect-platform-production
    <<: *platform-app
    restart: "no"
    command: ["python", "-m", "app.cli", "bootstrap"]
    depends_on:
      platform-migrate-tenants-argws-connect-platform-production: {condition: service_completed_successfully}
      api-argws-connect-platform-production: {condition: service_healthy}
      redis-argws-connect-platform-production: {condition: service_healthy}
      rabbitmq-argws-connect-platform-production: {condition: service_healthy}
      minio-argws-connect-platform-production: {condition: service_healthy}

  platform-api-argws-connect-platform-production:
    container_name: platform-api-argws-connect-platform-production
    <<: *platform-app
    command: ["gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "${PLATFORM_API_WORKERS:-4}", "--timeout", "120", "--graceful-timeout", "30", "--access-logfile", "-"]
    depends_on:
      platform-bootstrap-argws-connect-platform-production: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5).read()\""]
      interval: 20s
      timeout: 8s
      retries: 20
      start_period: 30s
    networks:
      argws-connect-platform-production-net:
        aliases: [connect-platform-api]

  platform-worker-argws-connect-platform-production:
    container_name: platform-worker-argws-connect-platform-production
    <<: *platform-app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "connect.default,connect.provisioning,connect.events,connect.automations,connect.webhooks", "--loglevel=INFO", "--concurrency=${PLATFORM_CELERY_CONCURRENCY:-4}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      platform-api-argws-connect-platform-production: {condition: service_healthy}

  platform-scheduler-argws-connect-platform-production:
    container_name: platform-scheduler-argws-connect-platform-production
    <<: *platform-app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    volumes:
      - ${ARGWS_CONNECT_PLATFORM_CELERY_DATA_PATH:-./volumes/platform-celery}:/var/lib/celery
    depends_on:
      platform-api-argws-connect-platform-production: {condition: service_healthy}

  platform-web-argws-connect-platform-production:
    container_name: platform-web-argws-connect-platform-production
    image: ${ARGWS_CONNECT_PLATFORM_WEB_IMAGE:-ghcr.io/wkarts/argws-connect-platform-web:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      platform-api-argws-connect-platform-production: {condition: service_healthy}
    networks:
      argws-connect-platform-production-net:
        aliases: [connect-platform-web]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 10
    logging: *default-logging

  platform-gateway-argws-connect-platform-production:
    container_name: platform-gateway-argws-connect-platform-production
    image: ${ARGWS_CONNECT_PLATFORM_GATEWAY_IMAGE:-ghcr.io/wkarts/argws-connect-platform-gateway:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-connect.argws.com.br}
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-control.connect.argws.com.br}
      ADMIN_HOST: ${ADMIN_HOST:-admin.connect.argws.com.br}
      PARTNER_PLANE_HOST: ${PARTNER_PLANE_HOST:-partner.connect.argws.com.br}
      API_HOST: ${API_HOST:-api.connect.argws.com.br}
      DOCS_HOST: ${DOCS_HOST:-docs.connect.argws.com.br}
      DEMO_HOST: ${DEMO_HOST:-demo.connect.argws.com.br}
      TENANT_DOMAIN_ROOT: ${TENANT_DOMAIN_ROOT:-connect.argws.com.br}
    depends_on:
      api-argws-connect-platform-production: {condition: service_healthy}
      platform-api-argws-connect-platform-production: {condition: service_healthy}
      platform-web-argws-connect-platform-production: {condition: service_healthy}
      docs-argws-connect-platform-production: {condition: service_healthy}
    ports:
      - "${PLATFORM_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_GATEWAY_PORT:-38800}:80"
    networks: [argws-connect-platform-production-net]
    logging: *default-logging

networks:
  argws-connect-platform-production-net:
    name: ${ARGWS_CONNECT_NETWORK_NAME:-argws-connect-platform-production-net}
    driver: bridge
