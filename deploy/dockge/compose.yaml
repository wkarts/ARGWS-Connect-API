name: ${COMPOSE_PROJECT_NAME:-argws-connect-dockge}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  api:
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:latest}
    pull_policy: always
    container_name: argws_connect_api
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      DOCKER_ENV: "true"
      DATABASE_MIGRATION_MAX_ATTEMPTS: ${DATABASE_MIGRATION_MAX_ATTEMPTS:-60}
      DATABASE_MIGRATION_RETRY_SECONDS: ${DATABASE_MIGRATION_RETRY_SECONDS:-2}
      LOG_QRCODE: ${LOG_QRCODE:-true}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_API_HOST_PORT:-38080}:8080"
    volumes:
      - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/instances}:/argws-connect/instances
    networks: [argws-connect-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  docs:
    image: ${ARGWS_CONNECT_DOCS_IMAGE:-ghcr.io/wkarts/argws-connect-docs:latest}
    pull_policy: always
    container_name: argws_connect_docs
    restart: unless-stopped
    environment:
      API_REFERENCE_CONFIG: >-
        {"sources":[{"url":"openapi/connect-api.openapi.json","title":"Connect|API REST API","slug":"rest","default":true},{"url":"openapi/meta-compatible.openapi.json","title":"Connect|API Meta Compatible","slug":"meta-compatible"},{"url":"openapi/connect-api-events.asyncapi.json","title":"Connect|API Events","slug":"events"}],"theme":"none","layout":"modern","darkMode":false,"showOperationId":true,"modelsSectionLabel":"Schemas","operationTitleSource":"summary","documentDownloadType":"both","showDeveloperTools":"localhost","customCss":".light-mode{--scalar-color-accent:#2563eb;--scalar-background-1:#ffffff;--scalar-background-2:#f7f9fc;--scalar-background-3:#eef3f9;--scalar-color-1:#0f172a;--scalar-color-2:#475569;--scalar-color-3:#64748b;--scalar-border-color:#dbe4ef}.dark-mode{--scalar-color-accent:#2f6df6;--scalar-background-1:#0f172a;--scalar-background-2:#111827;--scalar-background-3:#172033;--scalar-color-1:#f8fafc;--scalar-color-2:#cbd5e1;--scalar-color-3:#94a3b8;--scalar-border-color:#263249}"}
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_DOCS_HOST_PORT:-38180}:8080"
    networks: [argws-connect-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  postgres:
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    pull_policy: always
    container_name: argws_connect_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-argws_connect_api}
      POSTGRES_USER: ${POSTGRES_USERNAME:-argws_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    expose: ["5432"]
    volumes:
      - ${ARGWS_CONNECT_POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      argws-connect-net:
        aliases: [argws-connect-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '${POSTGRES_USERNAME:-argws_connect}' -d '${POSTGRES_DATABASE:-argws_connect_api}'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  redis:
    image: ${ARGWS_CONNECT_REDIS_IMAGE:-ghcr.io/wkarts/argws-connect-redis:latest}
    pull_policy: always
    container_name: argws_connect_redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6379", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    expose: ["6379"]
    volumes:
      - ${ARGWS_CONNECT_REDIS_DATA_PATH:-./volumes/redis}:/data
    networks:
      argws-connect-net:
        aliases: [argws-connect-redis]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging: *default-logging

  rabbitmq:
    image: ${ARGWS_CONNECT_RABBITMQ_IMAGE:-ghcr.io/wkarts/argws-connect-rabbitmq:management}
    pull_policy: always
    container_name: argws_connect_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-argws_connect}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-argws_connect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-CHANGE_ME_RABBITMQ_PASSWORD}
    expose: ["5672", "15672"]
    volumes:
      - ${ARGWS_CONNECT_RABBITMQ_DATA_PATH:-./volumes/rabbitmq}:/var/lib/rabbitmq
    networks:
      argws-connect-net:
        aliases: [argws-connect-rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    logging: *default-logging

  minio:
    image: ${ARGWS_CONNECT_MINIO_IMAGE:-ghcr.io/wkarts/argws-connect-minio:latest}
    pull_policy: always
    container_name: argws_connect_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-argws_connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
    expose: ["9000", "9001"]
    volumes:
      - ${ARGWS_CONNECT_MINIO_DATA_PATH:-./volumes/minio}:/data
    networks:
      argws-connect-net:
        aliases: [argws-connect-minio]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *default-logging

  nats:
    profiles: ["nats", "extended"]
    image: ${ARGWS_CONNECT_NATS_IMAGE:-ghcr.io/wkarts/argws-connect-nats:2.10-alpine}
    pull_policy: always
    container_name: argws_connect_nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    expose: ["4222", "8222"]
    volumes:
      - ${ARGWS_CONNECT_NATS_DATA_PATH:-./volumes/nats}:/data
    networks:
      argws-connect-net:
        aliases: [argws-connect-nats]
    logging: *default-logging

  zookeeper:
    profiles: ["kafka", "extended"]
    image: ${ARGWS_CONNECT_ZOOKEEPER_IMAGE:-ghcr.io/wkarts/argws-connect-zookeeper:7.5.0}
    pull_policy: always
    container_name: argws_connect_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    expose: ["2181"]
    volumes:
      - ${ARGWS_CONNECT_ZOOKEEPER_DATA_PATH:-./volumes/zookeeper/data}:/var/lib/zookeeper/data
      - ${ARGWS_CONNECT_ZOOKEEPER_LOG_PATH:-./volumes/zookeeper/log}:/var/lib/zookeeper/log
    networks:
      argws-connect-net:
        aliases: [argws-connect-zookeeper]
    logging: *default-logging

  kafka:
    profiles: ["kafka", "extended"]
    image: ${ARGWS_CONNECT_KAFKA_IMAGE:-ghcr.io/wkarts/argws-connect-kafka:7.5.0}
    pull_policy: always
    container_name: argws_connect_kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: argws-connect-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://argws-connect-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    expose: ["9092"]
    volumes:
      - ${ARGWS_CONNECT_KAFKA_DATA_PATH:-./volumes/kafka}:/var/lib/kafka/data
    networks:
      argws-connect-net:
        aliases: [argws-connect-kafka]
    logging: *default-logging

  mysql:
    profiles: ["mysql"]
    image: ${ARGWS_CONNECT_MYSQL_IMAGE:-ghcr.io/wkarts/argws-connect-mysql:8.0}
    pull_policy: always
    container_name: argws_connect_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-argws_connect_api}
      MYSQL_USER: ${MYSQL_USERNAME:-argws_connect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    expose: ["3306"]
    volumes:
      - ${ARGWS_CONNECT_MYSQL_DATA_PATH:-./volumes/mysql}:/var/lib/mysql
    networks:
      argws-connect-net:
        aliases: [argws-connect-mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p'$${MYSQL_ROOT_PASSWORD}' --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: *default-logging

networks:
  argws-connect-net:
    name: ${ARGWS_CONNECT_NETWORK_NAME:-argws-connect-net}
    driver: bridge
