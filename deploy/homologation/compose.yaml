name: ${COMPOSE_PROJECT_NAME:-argws-connect-homolog}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  api:
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:homolog}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      DOCKER_ENV: "true"
      DATABASE_MIGRATION_MAX_ATTEMPTS: ${DATABASE_MIGRATION_MAX_ATTEMPTS:-60}
      DATABASE_MIGRATION_RETRY_SECONDS: ${DATABASE_MIGRATION_RETRY_SECONDS:-2}
      LOG_QRCODE: ${LOG_QRCODE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_API_HOST_PORT:-38081}:8080"
    volumes:
      - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/instances}:/argws-connect/instances
    networks:
      - argws-connect-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  postgres:
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    pull_policy: always
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-argws_connect_homolog}
      POSTGRES_USER: ${POSTGRES_USERNAME:-argws_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    expose: ["5432"]
    volumes:
      - ${ARGWS_CONNECT_POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      argws-connect-net:
        aliases: [argws-connect-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '${POSTGRES_USERNAME:-argws_connect}' -d '${POSTGRES_DATABASE:-argws_connect_homolog}'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  redis:
    image: ${ARGWS_CONNECT_REDIS_IMAGE:-ghcr.io/wkarts/argws-connect-redis:latest}
    pull_policy: always
    restart: unless-stopped
    command: ["redis-server", "--port", "6379", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose: ["6379"]
    volumes:
      - ${ARGWS_CONNECT_REDIS_DATA_PATH:-./volumes/redis}:/data
    networks:
      argws-connect-net:
        aliases: [argws-connect-redis]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging: *default-logging

  rabbitmq:
    image: ${ARGWS_CONNECT_RABBITMQ_IMAGE:-ghcr.io/wkarts/argws-connect-rabbitmq:management}
    pull_policy: always
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-argws_connect_homolog}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-argws_connect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    expose: ["5672", "15672"]
    volumes:
      - ${ARGWS_CONNECT_RABBITMQ_DATA_PATH:-./volumes/rabbitmq}:/var/lib/rabbitmq
    networks:
      argws-connect-net:
        aliases: [argws-connect-rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    logging: *default-logging

  minio:
    image: ${ARGWS_CONNECT_MINIO_IMAGE:-ghcr.io/wkarts/argws-connect-minio:latest}
    pull_policy: always
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-argws_connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose: ["9000", "9001"]
    volumes:
      - ${ARGWS_CONNECT_MINIO_DATA_PATH:-./volumes/minio}:/data
    networks:
      argws-connect-net:
        aliases: [argws-connect-minio]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *default-logging

networks:
  argws-connect-net:
    name: ${ARGWS_CONNECT_NETWORK_NAME:-argws-connect-homolog-net}
    driver: bridge
