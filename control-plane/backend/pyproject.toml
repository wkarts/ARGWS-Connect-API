[project]
name = "argws-connect-control-plane"
version = "0.1.0"
description = "ARGWS Connect Control Plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.8",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.15",
  "redis>=5.2",
  "aio-pika>=9.5",
  "nats-py>=2.10",
  "httpx>=0.28",
  "cryptography>=44",
  "prometheus-client>=0.21"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
