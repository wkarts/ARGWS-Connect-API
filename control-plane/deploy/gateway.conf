server {
  listen 80;
  server_name _;
  client_max_body_size 50m;
  location /api/ { proxy_pass http://api:8090/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /grafana/ { proxy_pass http://grafana:3000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://web:80; proxy_set_header Host $host; }
}
