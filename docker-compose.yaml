name: ${COMPOSE_PROJECT_NAME:-argws-connect-api}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  api:
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:latest}
    pull_policy: always
    container_name: argws_connect_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRACCAR_ENABLED: "${TRACCAR_ENABLED:-false}"
      TRACCAR_MODE: "${TRACCAR_MODE:-disabled}"
      TRACCAR_URL: "${TRACCAR_URL:-}"
      TRACCAR_RECEIVER_URL: "${TRACCAR_RECEIVER_URL:-}"
      TRACCAR_TOKEN: "${TRACCAR_TOKEN:-}"
      TRACCAR_ALLOWED_ORIGINS: "${TRACCAR_ALLOWED_ORIGINS:-}"
      TRACCAR_INTERNAL_URL: "${TRACCAR_INTERNAL_URL:-http://traccar:8082}"
      TRACCAR_INTERNAL_RECEIVER_URL: "${TRACCAR_INTERNAL_RECEIVER_URL:-http://traccar:5055}"
      TRACCAR_ADMIN_EMAIL: "${TRACCAR_ADMIN_EMAIL:-connect-admin@localhost.invalid}"
      TRACCAR_ADMIN_PASSWORD: "${TRACCAR_ADMIN_PASSWORD:-}"
      FINDHUB_HISTORY_RETENTION_DAYS: "${FINDHUB_HISTORY_RETENTION_DAYS:-30}"
      FINDHUB_MAP_TILE_URL: "${FINDHUB_MAP_TILE_URL:-}"
      FINDHUB_CREDENTIALS_KEY: "${FINDHUB_CREDENTIALS_KEY:-}"
      FINDHUB_DEFAULT_TRACKING_INTERVAL_SECONDS: "${FINDHUB_DEFAULT_TRACKING_INTERVAL_SECONDS:-60}"
      FINDHUB_MIN_TRACKING_INTERVAL_SECONDS: "${FINDHUB_MIN_TRACKING_INTERVAL_SECONDS:-30}"
      FINDHUB_LOCATION_TIMEOUT_MS: "${FINDHUB_LOCATION_TIMEOUT_MS:-30000}"
      FINDHUB_STORE_POSITION_HISTORY: "${FINDHUB_STORE_POSITION_HISTORY:-false}"
      FINDHUB_TRACCAR_TIMEOUT_MS: "${FINDHUB_TRACCAR_TIMEOUT_MS:-10000}"
      MANAGER_FEATURE_TEST_MESSAGE_CONTACTS: ${MANAGER_FEATURE_TEST_MESSAGE_CONTACTS:-false}
      MANAGER_FEATURE_INSTANCE_TEST_MESSAGE: ${MANAGER_FEATURE_INSTANCE_TEST_MESSAGE:-true}
      MANAGER_FEATURE_CONTACTS: ${MANAGER_FEATURE_CONTACTS:-false}
      MANAGER_FEATURE_MESSAGES: ${MANAGER_FEATURE_MESSAGES:-false}
      MANAGER_FEATURE_CONVERSATIONS: ${MANAGER_FEATURE_CONVERSATIONS:-false}
      OPERATIONS_INTERNAL_TOKEN: ${OPERATIONS_INTERNAL_TOKEN:-}
      OPERATIONS_AGENT_URL: ${OPERATIONS_AGENT_URL:-http://operations:8092}
      OPERATIONS_ENABLED: ${OPERATIONS_ENABLED:-false}
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      DOCKER_ENV: "true"
      DATABASE_MIGRATION_MAX_ATTEMPTS: ${DATABASE_MIGRATION_MAX_ATTEMPTS:-60}
      DATABASE_MIGRATION_RETRY_SECONDS: ${DATABASE_MIGRATION_RETRY_SECONDS:-2}
      LOG_QRCODE: ${LOG_QRCODE:-true}
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-false}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-local}
      TRANSCRIPTION_QUEUE: ${TRANSCRIPTION_QUEUE:-argws-connect.transcription}
      TRANSCRIPTION_MAX_AUDIO_BYTES: ${TRANSCRIPTION_MAX_AUDIO_BYTES:-26214400}
      TRANSCRIPTION_LOCAL_MODEL: ${TRANSCRIPTION_LOCAL_MODEL:-Xenova/whisper-small}
      TRANSCRIPTION_LOCAL_DEVICE: ${TRANSCRIPTION_LOCAL_DEVICE:-cpu}
      TRANSCRIPTION_LOCAL_DTYPE: ${TRANSCRIPTION_LOCAL_DTYPE:-q8}
      TRANSCRIPTION_MODEL_CACHE_DIR: ${TRANSCRIPTION_MODEL_CACHE_DIR:-/home/node/.cache/huggingface}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_API_HOST_PORT:-38080}:8080"
    volumes:
      - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/instances}:/argws-connect/instances
    networks:
      - argws-connect-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  transcription-worker:
    profiles: ["transcription"]
    image: ${ARGWS_CONNECT_TRANSCRIPTION_WORKER_IMAGE:-ghcr.io/wkarts/argws-connect-transcription-worker:latest}
    pull_policy: always
    container_name: argws_connect_transcription_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-false}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-local}
      TRANSCRIPTION_QUEUE: ${TRANSCRIPTION_QUEUE:-argws-connect.transcription}
      TRANSCRIPTION_WORKER_CONCURRENCY: ${TRANSCRIPTION_WORKER_CONCURRENCY:-1}
      TRANSCRIPTION_MAX_AUDIO_BYTES: ${TRANSCRIPTION_MAX_AUDIO_BYTES:-26214400}
      TRANSCRIPTION_LOCAL_MODEL: ${TRANSCRIPTION_LOCAL_MODEL:-Xenova/whisper-small}
      TRANSCRIPTION_LOCAL_DEVICE: ${TRANSCRIPTION_LOCAL_DEVICE:-cpu}
      TRANSCRIPTION_LOCAL_DTYPE: ${TRANSCRIPTION_LOCAL_DTYPE:-q8}
      TRANSCRIPTION_MODEL_CACHE_DIR: ${TRANSCRIPTION_MODEL_CACHE_DIR:-/home/node/.cache/huggingface}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${TRANSCRIPTION_WORKER_MEMORY:-2g}
    cpus: "${TRANSCRIPTION_WORKER_CPUS:-1.00}"
    pids_limit: 128
    tmpfs:
      - /tmp:size=${TRANSCRIPTION_WORKER_TMPFS_SIZE:-256m}
    volumes:
    - ${ARGWS_CONNECT_TRANSCRIPTION_MODEL_PATH:-argws-connect-transcription-models}:/home/node/.cache/huggingface
    networks:
      argws-connect-net:
        aliases:
          - transcription-worker
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/transcription-worker.ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  operations:
    profiles: ["operations"]
    image: ${ARGWS_CONNECT_API_IMAGE:-ghcr.io/wkarts/argws-connect-api:latest}
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["node", "/argws-connect/operations-agent/server.cjs"]
    environment:
      TZ: ${TZ:-America/Bahia}
      OPERATIONS_INTERNAL_TOKEN: ${OPERATIONS_INTERNAL_TOKEN:-}
      OPERATIONS_DATA_PATH: /data
      OPERATIONS_HOT_DAYS: ${OPERATIONS_HOT_DAYS:-3}
      OPERATIONS_RETENTION_DAYS: ${OPERATIONS_RETENTION_DAYS:-90}
      OPERATIONS_CHECKS: '[{"service":"api","type":"http","url":"http://api:8080/health"},{"service":"docs","type":"http","url":"http://docs:8080/health"},{"service":"database","type":"tcp","url":"tcp://postgres:5432"},{"service":"cache","type":"tcp","url":"tcp://redis:6379"},{"service":"events","type":"tcp","url":"tcp://rabbitmq:5672"},{"service":"storage","type":"http","url":"http://minio:9000/minio/health/live"}]'
    expose: ["8092"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: "0.50"
    pids_limit: 64
    volumes:
      - ${ARGWS_CONNECT_OPERATIONS_DATA_PATH:-./volumes/operations}:/data
    networks:
      argws-connect-net:
        aliases: [operations]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  docs:
    image: ${ARGWS_CONNECT_DOCS_IMAGE:-ghcr.io/wkarts/argws-connect-docs:latest}
    pull_policy: always
    container_name: argws_connect_docs
    restart: unless-stopped
    environment:
      SERVER_URL: ${SERVER_URL:-}
      API_REFERENCE_CONFIG: >-
        {"sources":[{"url":"openapi/connect-api.openapi.json","title":"Connect|API REST API","slug":"rest","default":true},{"url":"openapi/findhub.openapi.json","title":"Connect|API Google Find Hub","slug":"findhub"},{"url":"openapi/meta-compatible.openapi.json","title":"Connect|API Meta Compatible","slug":"meta-compatible"},{"url":"openapi/connect-api-events.asyncapi.json","title":"Connect|API Events","slug":"events"}],"theme":"none","layout":"modern","darkMode":false,"showOperationId":true,"modelsSectionLabel":"Schemas","operationTitleSource":"summary","documentDownloadType":"both","showDeveloperTools":"localhost","customCss":".light-mode{--scalar-color-accent:#2563eb;--scalar-background-1:#ffffff;--scalar-background-2:#f7f9fc;--scalar-background-3:#eef3f9;--scalar-color-1:#0f172a;--scalar-color-2:#475569;--scalar-color-3:#64748b;--scalar-border-color:#dbe4ef}.dark-mode{--scalar-color-accent:#2f6df6;--scalar-background-1:#0f172a;--scalar-background-2:#111827;--scalar-background-3:#172033;--scalar-color-1:#f8fafc;--scalar-color-2:#cbd5e1;--scalar-color-3:#94a3b8;--scalar-border-color:#263249}"}
    ports:
      - "${ARGWS_CONNECT_BIND_ADDRESS:-127.0.0.1}:${ARGWS_CONNECT_DOCS_HOST_PORT:-38082}:8080"
    networks:
      - argws-connect-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  postgres:
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    pull_policy: always
    container_name: argws_connect_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-argws_connect_api}
      POSTGRES_USER: ${POSTGRES_USERNAME:-argws_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    expose:
      - "5432"
    volumes:
      - ${ARGWS_CONNECT_POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      argws-connect-net:
        aliases:
          - argws-connect-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '${POSTGRES_USERNAME:-argws_connect}' -d '${POSTGRES_DATABASE:-argws_connect_api}'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  redis:
    image: ${ARGWS_CONNECT_REDIS_IMAGE:-ghcr.io/wkarts/argws-connect-redis:latest}
    pull_policy: always
    container_name: argws_connect_redis
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - ${ARGWS_CONNECT_REDIS_DATA_PATH:-./volumes/redis}:/data
    networks:
      argws-connect-net:
        aliases:
          - argws-connect-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging: *default-logging

  rabbitmq:
    image: ${ARGWS_CONNECT_RABBITMQ_IMAGE:-ghcr.io/wkarts/argws-connect-rabbitmq:management}
    pull_policy: always
    container_name: argws_connect_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-argws_connect}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-argws_connect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-CHANGE_ME_RABBITMQ_PASSWORD}
    expose:
      - "5672"
      - "15672"
    volumes:
      - ${ARGWS_CONNECT_RABBITMQ_DATA_PATH:-./volumes/rabbitmq}:/var/lib/rabbitmq
    networks:
      argws-connect-net:
        aliases:
          - argws-connect-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    logging: *default-logging

  minio:
    image: ${ARGWS_CONNECT_MINIO_IMAGE:-ghcr.io/wkarts/argws-connect-minio:latest}
    pull_policy: always
    container_name: argws_connect_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-argws_connect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - ${ARGWS_CONNECT_MINIO_DATA_PATH:-./volumes/minio}:/data
    networks:
      argws-connect-net:
        aliases:
          - argws-connect-minio
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *default-logging

  nats:
    profiles: ["nats", "extended"]
    image: ${ARGWS_CONNECT_NATS_IMAGE:-ghcr.io/wkarts/argws-connect-nats:2.10-alpine}
    pull_policy: always
    container_name: argws_connect_nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    expose:
      - "4222"
      - "8222"
    volumes:
      - ${ARGWS_CONNECT_NATS_DATA_PATH:-./volumes/nats}:/data
    networks:
      argws-connect-net:
        aliases:
          - argws-connect-nats
    logging: *default-logging

  zookeeper:
    depends_on:
      volume-init:
        condition: service_healthy
    profiles: ["kafka", "extended"]
    image: ${ARGWS_CONNECT_ZOOKEEPER_IMAGE:-ghcr.io/wkarts/argws-connect-zookeeper:7.5.0}
    pull_policy: always
    container_name: argws_connect_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    expose:
      - "2181"
    volumes:
      - ${ARGWS_CONNECT_ZOOKEEPER_DATA_PATH:-./volumes/zookeeper/data}:/var/lib/zookeeper/data
      - ${ARGWS_CONNECT_ZOOKEEPER_LOG_PATH:-./volumes/zookeeper/log}:/var/lib/zookeeper/log
    networks:
      argws-connect-net:
        aliases:
          - argws-connect-zookeeper
    logging: *default-logging
  kafka:
    profiles: ["kafka", "extended"]
    image: ${ARGWS_CONNECT_KAFKA_IMAGE:-ghcr.io/wkarts/argws-connect-kafka:7.5.0}
    pull_policy: always
    container_name: argws_connect_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
      volume-init:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: argws-connect-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://argws-connect-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    expose:
      - "9092"
    volumes:
      - ${ARGWS_CONNECT_KAFKA_DATA_PATH:-./volumes/kafka}:/var/lib/kafka/data
    networks:
      argws-connect-net:
        aliases:
          - argws-connect-kafka
    logging: *default-logging
  mysql:
    depends_on:
      mysql-volume-init:
        condition: service_healthy
    profiles: ["mysql"]
    image: ${ARGWS_CONNECT_MYSQL_IMAGE:-ghcr.io/wkarts/argws-connect-mysql:8.0}
    pull_policy: always
    container_name: argws_connect_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-argws_connect_api}
      MYSQL_USER: ${MYSQL_USERNAME:-argws_connect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    expose:
      - "3306"
    volumes:
      - ${ARGWS_CONNECT_MYSQL_DATA_PATH:-./volumes/mysql}:/var/lib/mysql
    networks:
      argws-connect-net:
        aliases:
          - argws-connect-mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p'$${MYSQL_ROOT_PASSWORD}' --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: *default-logging

  # BEGIN OPTIONAL TRACCAR
  traccar:
    profiles: [traccar]
    image: ${ARGWS_CONNECT_TRACCAR_IMAGE:-ghcr.io/wkarts/argws-connect-traccar:6.15.3-alpine}
    restart: unless-stopped
    depends_on:
      traccar-postgres:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://traccar-postgres:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
      WEB_PORT: "8082"
      OSMAND_PORT: "5055"
      OSMAND_ADDRESS: 0.0.0.0
      PROTOCOLS_ENABLE: osmand
      SERVER_STATISTICS: ""
      GEOCODER_ENABLE: "false"
      TZ: ${TZ:-America/Bahia}
    expose: ["8082", "5055"]
    volumes:
      - ${ARGWS_CONNECT_TRACCAR_DATA_PATH:-./volumes/traccar}:/opt/traccar/data
    networks:
      argws-connect-net:
        aliases: [traccar]
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider -T 5 http://127.0.0.1:8082/api/server 2>&1 | grep -Eq 'HTTP/[0-9.]+ (200|401)'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
  traccar-postgres:
    profiles: [traccar]
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
      TRACCAR_DATABASE_PASSWORD: ${TRACCAR_DATABASE_PASSWORD:-}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        set -Eeuo pipefail
        : "$${TRACCAR_DATABASE_PASSWORD:?TRACCAR_DATABASE_PASSWORD nao configurada}"
        data_directory="$${PGDATA:-/var/lib/postgresql/data}"
        postgres_pid=''
        recovery_role_pending=false

        # Empty volume: retain the upstream PostgreSQL initialization behavior.
        if [ ! -s "$$data_directory/PG_VERSION" ]; then
          exec /usr/local/bin/docker-entrypoint.sh postgres
        fi

        # Existing volume: preserve data and reconcile only the missing Traccar identity.
        if ! command -v gosu >/dev/null 2>&1; then
          echo 'gosu nao esta disponivel na imagem PostgreSQL do Traccar.' >&2
          exit 30
        fi

        start_postgres() {
          /usr/local/bin/docker-entrypoint.sh postgres &
          postgres_pid="$$!"
        }

        shutdown_postgres() {
          if [ -n "$${postgres_pid:-}" ] && kill -0 "$$postgres_pid" 2>/dev/null; then
            kill -TERM "$$postgres_pid" 2>/dev/null || true
          fi
          if [ -n "$${postgres_pid:-}" ]; then
            wait "$$postgres_pid" || true
          fi
          postgres_pid=''
        }

        demote_recovery_role() {
          [ "$$recovery_role_pending" = true ] || return 0
          if PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -v ON_ERROR_STOP=1 -h 127.0.0.1 -U traccar -d template1 -c 'ALTER ROLE traccar NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' >/dev/null; then
            recovery_role_pending=false
            return 0
          fi
          return 1
        }

        cleanup_recovery_role() {
          [ "$$recovery_role_pending" = true ] || return 0
          if demote_recovery_role; then
            return 0
          fi
          shutdown_postgres
          if printf '%s\n' 'ALTER ROLE traccar NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;' | gosu postgres postgres --single -D "$$data_directory" template1 >/dev/null; then
            recovery_role_pending=false
            return 0
          fi
          return 1
        }

        abort_recovery() {
          code="$$1"
          message="$$2"
          echo "$$message" >&2
          if ! cleanup_recovery_role; then
            echo 'Nao foi possivel remover os privilegios temporarios de recuperacao do Traccar.' >&2
          fi
          shutdown_postgres
          exit "$$code"
        }

        on_signal() {
          cleanup_recovery_role || true
          shutdown_postgres
          exit 0
        }
        trap on_signal INT TERM

        wait_for_server() {
          for attempt in $$(seq 1 60); do
            if [ -S /var/run/postgresql/.s.PGSQL.5432 ]; then
              return 0
            fi
            if ! kill -0 "$$postgres_pid" 2>/dev/null; then
              wait "$$postgres_pid" || true
              return 1
            fi
            sleep 1
          done
          return 1
        }

        start_postgres
        if ! wait_for_server; then
          shutdown_postgres
          echo 'PostgreSQL do Traccar nao ficou disponivel.' >&2
          exit 31
        fi

        # Standard clusters retain the upstream postgres superuser. Prefer that route.
        admin_ready=false
        admin_probe=''
        for attempt in $$(seq 1 60); do
          if admin_probe="$$(gosu postgres psql --no-password -h /var/run/postgresql -U postgres -d postgres -tAc 'SELECT 1' 2>&1)"; then
            admin_ready=true
            break
          fi
          if printf '%s' "$$admin_probe" | grep -Fq 'role "postgres" does not exist'; then
            break
          fi
          if ! kill -0 "$$postgres_pid" 2>/dev/null; then
            shutdown_postgres
            exit 31
          fi
          sleep 1
        done

        if [ "$$admin_ready" = true ]; then
          role_exists="$$(gosu postgres psql --no-password -h /var/run/postgresql -U postgres -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'traccar'")"
          role_created=false
          if [ "$$role_exists" != 1 ]; then
            gosu postgres psql --no-password -v ON_ERROR_STOP=1 -v traccar_password="$$TRACCAR_DATABASE_PASSWORD" -h /var/run/postgresql -U postgres -d postgres -c "CREATE ROLE traccar LOGIN PASSWORD :'traccar_password'"
            role_created=true
          fi

          database_exists="$$(gosu postgres psql --no-password -h /var/run/postgresql -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'traccar'")"
          if [ "$$database_exists" != 1 ]; then
            gosu postgres psql --no-password -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d postgres -c 'CREATE DATABASE traccar OWNER traccar'
          elif [ "$$role_created" = true ]; then
            gosu postgres psql --no-password -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d postgres -c 'ALTER DATABASE traccar OWNER TO traccar'
          fi
        else
          # A legacy cluster can have a custom initial superuser. Do not mutate an
          # existing Traccar role or password. Recover only when PostgreSQL proves that
          # both standard identities are absent, as in a never-finished first startup.
          target_probe=''
          if target_probe="$$(PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc 'SELECT 1' 2>&1)" && [ "$$target_probe" = 1 ]; then
            wait "$$postgres_pid"
            exit $$?
          fi

          if ! printf '%s' "$$admin_probe" | grep -Fq 'role "postgres" does not exist' || ! printf '%s' "$$target_probe" | grep -Fq 'role "traccar" does not exist'; then
            echo 'O volume do PostgreSQL do Traccar possui uma identidade existente que nao sera alterada automaticamente.' >&2
            [ -z "$$admin_probe" ] || printf '%s\n' "$$admin_probe" >&2
            [ -z "$$target_probe" ] || printf '%s\n' "$$target_probe" >&2
            shutdown_postgres
            exit 32
          fi

          echo 'Recuperando somente a identidade ausente do PostgreSQL do Traccar.' >&2
          shutdown_postgres
          recovery_password="$$(printf '%s' "$$TRACCAR_DATABASE_PASSWORD" | sed "s/'/''/g")"
          if ! printf "CREATE ROLE traccar LOGIN SUPERUSER CREATEDB CREATEROLE PASSWORD '%s';\n" "$$recovery_password" | gosu postgres postgres --single -D "$$data_directory" template1 >/dev/null; then
            echo 'Falha ao criar a identidade ausente do Traccar pelo modo de recuperacao do PostgreSQL.' >&2
            exit 33
          fi
          recovery_role_pending=true

          start_postgres
          if ! wait_for_server; then
            abort_recovery 33 'PostgreSQL do Traccar nao reiniciou apos a recuperacao da identidade.'
          fi
          recovery_ready=false
          for attempt in $$(seq 1 60); do
            if PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d template1 -tAc 'SELECT 1' | grep -qx 1; then
              recovery_ready=true
              break
            fi
            if ! kill -0 "$$postgres_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$$recovery_ready" != true ]; then
            abort_recovery 33 'A identidade recuperada do Traccar nao conseguiu acessar o PostgreSQL.'
          fi

          if ! database_exists="$$(PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d template1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'traccar'")"; then
            abort_recovery 33 'Nao foi possivel verificar o banco dedicado do Traccar.'
          fi
          if [ "$$database_exists" != 1 ]; then
            if ! PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -v ON_ERROR_STOP=1 -h 127.0.0.1 -U traccar -d template1 -c 'CREATE DATABASE traccar OWNER traccar'; then
              abort_recovery 33 'Nao foi possivel criar o banco dedicado do Traccar.'
            fi
          elif ! PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -v ON_ERROR_STOP=1 -h 127.0.0.1 -U traccar -d template1 -c 'ALTER DATABASE traccar OWNER TO traccar'; then
            abort_recovery 33 'Nao foi possivel atribuir o banco dedicado ao Traccar.'
          fi
          if ! demote_recovery_role; then
            abort_recovery 33 'Nao foi possivel remover os privilegios temporarios de recuperacao do Traccar.'
          fi
        fi

        # Existing role passwords are intentionally never changed.
        PGPASSWORD="$$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc 'SELECT 1' | grep -qx 1
        wait "$$postgres_pid"
    volumes:
      - ${ARGWS_CONNECT_TRACCAR_DB_PATH:-./volumes/traccar-postgres}:/var/lib/postgresql/data
    networks: [argws-connect-net]
    healthcheck:
      test: ['CMD-SHELL', 'PGPASSWORD="$${TRACCAR_DATABASE_PASSWORD}" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 75s
  traccar-bootstrap:
    profiles: [traccar]
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    restart: unless-stopped
    depends_on:
      traccar:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        node - <<'NODE'
          'use strict';
          // Internal-only one-time bootstrap. Never resets users or changes existing passwords.
          const root = process.env.TRACCAR_INTERNAL_URL || 'http://traccar:8082';
          const email = process.env.TRACCAR_ADMIN_EMAIL;
          const password = process.env.TRACCAR_ADMIN_PASSWORD;
          async function main() {
            if (!email || !password || password.length < 32) throw new Error('Segredos Traccar nao preparados.');
            let cookie = '';
            async function request(path, method='GET', data, form=false) {
              const response = await fetch(root+path, { method, redirect:'error', signal:AbortSignal.timeout(15000),
                headers:{ ...(cookie?{Cookie:cookie}:{}), ...(data?{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'}:{}) },
                body:data ? form ? new URLSearchParams(data).toString() : JSON.stringify(data) : undefined });
              if(!response.ok) throw new Error('Traccar bootstrap recusado (HTTP '+response.status+').');
              const set = response.headers.getSetCookie().map(x=>x.split(';')[0]).find(x=>x.startsWith('JSESSIONID=')); if(set) cookie=set;
              return response.status===204?null:response.json();
            }
            let server;
            for(let n=0;n<40;n++) {try {server=await request('/api/server');break;}catch {if(n===39)throw new Error('Traccar indisponivel no bootstrap.');await new Promise(r=>setTimeout(r,3000));}}
            if(server.newServer===true) await request('/api/users','POST',{name:'Connect internal service',email,password});
            await request('/api/session','POST',{email,password},true);
            server=await request('/api/server');
            if(server.registration) await request('/api/server','PUT',{...server,registration:false});
            console.log('Traccar interno validado. Registro publico desabilitado; credenciais existentes preservadas.');
          }
          main().catch(()=>{console.error('Falha ao preparar Traccar. Verifique os segredos sem apagar usuarios/volumes. A API principal nao depende deste bootstrap.');process.exitCode=1;});
        NODE
        touch /tmp/traccar-bootstrap-ready
        exec tail -f /dev/null
    environment:
      TRACCAR_INTERNAL_URL: http://traccar:8082
      TRACCAR_ADMIN_EMAIL: ${TRACCAR_ADMIN_EMAIL:-connect-admin@localhost.invalid}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/traccar-bootstrap-ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [argws-connect-net]
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
  # END OPTIONAL TRACCAR

  # BEGIN COMPOSE VOLUME INIT
  volume-init:
    profiles: ["kafka", "extended"]
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        prepare_directory() {
          path="$$1"
          owner="$$2"
          label="$$3"
          mkdir -p "$$path"
          if [ -n "$$(ls -A "$$path")" ]; then
            actual="$$(stat -c '%u:%g' "$$path")"
            [ "$$actual" = "$$owner" ] || {
              echo "$$label contem dados e pertence a $$actual; esperado $$owner. Nenhum dado foi alterado." >&2
              exit 23
            }
            echo "$$label preservado"
            return
          fi
          chown --no-dereference "$$owner" "$$path"
          chmod u+rwx "$$path"
          echo "$$label preparado"
        }
        prepare_directory /prepared/zookeeper-data 1000:1000 zookeeper-data
        prepare_directory /prepared/zookeeper-log 1000:1000 zookeeper-log
        prepare_directory /prepared/kafka 1000:1000 kafka
        touch /tmp/volume-init-ready
        exec tail -f /dev/null
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/volume-init-ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ${ARGWS_CONNECT_ZOOKEEPER_DATA_PATH:-./volumes/zookeeper/data}:/prepared/zookeeper-data
      - ${ARGWS_CONNECT_ZOOKEEPER_LOG_PATH:-./volumes/zookeeper/log}:/prepared/zookeeper-log
      - ${ARGWS_CONNECT_KAFKA_DATA_PATH:-./volumes/kafka}:/prepared/kafka
    networks: [argws-connect-net]
  # END COMPOSE VOLUME INIT

  # BEGIN COMPOSE MYSQL VOLUME INIT
  mysql-volume-init:
    profiles: ["mysql"]
    image: ghcr.io/wkarts/argws-connect-node:22-bookworm-slim
    pull_policy: always
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /prepared/mysql
        # Percona 8.0 runs as uid 1001. Ownership repair changes metadata only;
        # it never removes or initializes files in an existing data directory.
        chown --no-dereference --recursive 1001:0 /prepared/mysql
        chmod u+rwx /prepared/mysql
        touch /tmp/mysql-volume-init-ready
        exec tail -f /dev/null
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mysql-volume-init-ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ${ARGWS_CONNECT_MYSQL_DATA_PATH:-./volumes/mysql}:/prepared/mysql
    networks: [argws-connect-net]
  # END COMPOSE MYSQL VOLUME INIT

volumes:
  argws-connect-transcription-models:
    name: ${ARGWS_CONNECT_TRANSCRIPTION_MODEL_VOLUME_NAME:-argws-connect-transcription-models}

networks:
  argws-connect-net:
    name: ${ARGWS_CONNECT_NETWORK_NAME:-argws-connect-net}
    driver: bridge
