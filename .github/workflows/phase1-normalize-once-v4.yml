name: Phase 1 Normalize Once v4

on:
  push:
    branches:
      - fix/database-observability-foundation-1.0.1

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: argws
          POSTGRES_PASSWORD: argws_test_password
          POSTGRES_DB: argws_connect_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U argws -d argws_connect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: argws_root_test_password
          MYSQL_DATABASE: argws_connect_test
          MYSQL_USER: argws
          MYSQL_PASSWORD: argws_test_password
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pargws_root_test_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/database-observability-foundation-1.0.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Normalize database, Docker and observability
        run: python3 scripts/phase1_normalize_once.py

      - name: Normalize Prisma JSON paths for both providers
        run: python3 scripts/phase1_mysql_json_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Format source and Prisma schemas
        env:
          DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
          DATABASE_BOUNCER_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?pgbouncer=true
        run: |
          npx prisma format --schema ./prisma/postgresql-schema.prisma
          npx prisma format --schema ./prisma/mysql-schema.prisma
          npx prisma format --schema ./prisma/psql_bouncer-schema.prisma
          npm run lint

      - name: Validate PostgreSQL schema
        env:
          DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
        run: npx prisma validate --schema ./prisma/postgresql-schema.prisma

      - name: Validate MySQL schema
        env:
          DATABASE_CONNECTION_URI: mysql://argws:argws_test_password@127.0.0.1:53306/argws_connect_test
        run: npx prisma validate --schema ./prisma/mysql-schema.prisma

      - name: Validate PgBouncer schema and model parity
        env:
          DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
          DATABASE_BOUNCER_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?pgbouncer=true
        run: |
          npx prisma validate --schema ./prisma/psql_bouncer-schema.prisma
          python3 - <<'PY'
          from pathlib import Path
          import re
          pg = Path('prisma/postgresql-schema.prisma').read_text()
          pb = Path('prisma/psql_bouncer-schema.prisma').read_text()
          def strip_ds(value):
              return re.sub(r'datasource db \{.*?\}', 'datasource db { PROVIDER }', value, count=1, flags=re.S)
          assert strip_ds(pg) == strip_ds(pb), 'PgBouncer schema diverged from PostgreSQL models'
          PY

      - name: Fresh PostgreSQL migration and type-check
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
        run: |
          rm -rf ./prisma/migrations
          npm run db:deploy
          npm run db:generate
          npx tsc --noEmit

      - name: Fresh MySQL migration and type-check
        env:
          DATABASE_PROVIDER: mysql
          DATABASE_CONNECTION_URI: mysql://argws:argws_test_password@127.0.0.1:53306/argws_connect_test
        run: |
          rm -rf ./prisma/migrations
          npm run db:deploy
          npm run db:generate
          npx tsc --noEmit

      - name: Final PostgreSQL lint and build
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
        run: |
          npm run db:generate
          npm run lint:check
          npm run build

      - name: Keep workflow directory untouched for bot push
        run: |
          rm -f .github/workflows/database-integrity.yml
          git checkout HEAD -- .github/workflows/phase1-normalize-once.yml || true
          git checkout HEAD -- .github/workflows/phase1-normalize-once-v2.yml || true
          git checkout HEAD -- .github/workflows/phase1-normalize-once-v3.yml || true
          git checkout HEAD -- .github/workflows/phase1-normalize-once-v4.yml || true
          rm -f scripts/phase1_normalize_once.py
          rm -f scripts/phase1_mysql_json_patch.py

      - name: Commit validated Phase 1 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(platform): estabiliza banco, observabilidade e boot Docker [phase1-normalized]"
          git push origin HEAD:fix/database-observability-foundation-1.0.1
