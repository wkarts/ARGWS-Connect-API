name: Find Hub - Validate and publish development extension
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
    paths:
      - 'browser-extensions/findhub-auth/**'
      - 'scripts/build-findhub-*.cjs'
      - 'public/findhub-auth.zip'
      - '.github/workflows/findhub-extension-*.yml'
      - '.github/workflows/auto-version-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findhub-extension-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/findhub-extension-build.yml
    with:
      source_ref: ${{ github.sha }}
      channel: ${{ github.ref == 'refs/heads/develop' && 'develop' || 'candidate' }}
  publish:
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: findhub-extension-distribution
          path: extension-dist
      - name: Publish immutable prerelease, never change latest or application version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/develop
          cd extension-dist
          sha256sum --check SHA256SUMS.txt
          test "$(jq -r '.sourceRevision' extension-release.json)" = "$GITHUB_SHA"
          version="$(jq -r '.version' extension-release.json)"
          tag="findhub-extension-${version}-develop-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release immutable already exists: $tag"
          else
            gh release create "$tag" Connect-FindHub-Auth-*.zip Connect-FindHub-Auth-Setup-*.exe Connect-FindHub-Auth-Assistant-*.exe extension-release.json SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Find Hub Auth ${version} - develop ${GITHUB_SHA:0:12}" \
              --notes "Extensão e instalador Windows por usuário. É necessária confirmação manual no navegador. Binário sem assinatura Authenticode. Fonte: ${GITHUB_SHA}. Homologação Google real não está implícita no build."
          fi
