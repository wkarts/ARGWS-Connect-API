name: Find Hub - Validate and publish development extension
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
    paths:
      - 'browser-extensions/findhub-auth/**'
      - 'scripts/build-findhub-*.cjs'
      - 'scripts/verify-findhub-distribution.cjs'
      - 'test/findhub-distribution-evidence.test.cjs'
      - 'public/findhub-auth.zip'
      - '.github/workflows/findhub-extension-*.yml'
      - '.github/workflows/auto-version-release.yml'
  workflow_dispatch:
permissions:
  packages: write
  actions: write
  contents: read
concurrency:
  # One moving development channel. A commit must update this release rather
  # than creating another component-specific tag for every build.
  group: findhub-extension-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/findhub-extension-build.yml
    with:
      source_ref: ${{ github.sha }}
      channel: ${{ github.ref == 'refs/heads/develop' && 'develop' || 'candidate' }}
      upload_artifacts: ${{ github.event_name != 'pull_request' }}
  publish:
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: findhub-extension-distribution
          path: extension-dist
      - name: Publish the moving development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/develop
          current="$(git ls-remote origin refs/heads/develop | awk '{print $1}')"
          test "$current" = "$GITHUB_SHA"
          cd extension-dist
          sha256sum --check SHA256SUMS.txt
          test "$(jq -r '.sourceRevision' extension-release.json)" = "$GITHUB_SHA"
          version="$(jq -r '.version' extension-release.json)"
          tag="connect-api-develop"
          title="Connect|API develop (pré-release contínua)"
          notes="Pré-release contínua do Connect|API para develop. Os binários são substituídos a cada build válido e a versão oficial só é criada em uma release vX.Y.Z. A versão ${version} da extensão só muda quando o componente da extensão muda; a revisão do código fica registrada em extension-release.json."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Connect-FindHub-Auth-*.zip Connect-FindHub-Auth-Setup-*.exe Connect-FindHub-Auth-Assistant-*.exe extension-release.json SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease --latest=false
          else
            if ! gh release create "$tag" Connect-FindHub-Auth-*.zip Connect-FindHub-Auth-Setup-*.exe Connect-FindHub-Auth-Assistant-*.exe extension-release.json SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$title" --notes "$notes"; then
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
              gh release upload "$tag" Connect-FindHub-Auth-*.zip Connect-FindHub-Auth-Setup-*.exe Connect-FindHub-Auth-Assistant-*.exe extension-release.json SHA256SUMS.txt \
                --repo "$GITHUB_REPOSITORY" --clobber
            fi
          fi

  protected-retention:
    needs: publish
    if: >-
      always() && needs.publish.result == 'success' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/ghcr-retention.yml
    with:
      publication_sha: ${{ github.sha }}
      source_sha: ${{ github.sha }}
      branch: ${{ github.ref_name }}
    secrets: inherit
