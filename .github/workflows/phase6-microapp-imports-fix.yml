name: Phase 6 Micro App Import Cleanup

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/conversational-application-studio-phase6'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Convert injected dependencies to type-only imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/api/services/micro-app.service.ts')
          source = path.read_text()
          replacements = {
            "import { InstanceDto } from '@api/dto/instance.dto';": "import type { InstanceDto } from '@api/dto/instance.dto';",
            "import { MicroAppSessionDto, MicroAppSubmitDto } from '@api/dto/micro-app.dto';": "import type { MicroAppSessionDto, MicroAppSubmitDto } from '@api/dto/micro-app.dto';",
            "import { PrismaRepository } from '@api/repository/repository.service';": "import type { PrismaRepository } from '@api/repository/repository.service';",
            "import { Auth, ConfigService, HttpServer } from '@config/env.config';": "import type { Auth, ConfigService, HttpServer } from '@config/env.config';",
            "import { ActionExecutionService } from './action-execution.service';": "import type { ActionExecutionService } from './action-execution.service';",
            "import { CacheService } from './cache.service';": "import type { CacheService } from './cache.service';",
            "import { CapturedLocation, evaluateLocationPolicy, LocationPolicy } from './geolocation-policy';": "import { evaluateLocationPolicy } from './geolocation-policy';\nimport type { CapturedLocation, LocationPolicy } from './geolocation-policy';",
            "import { RecipeService } from './recipe.service';": "import type { RecipeService } from './recipe.service';",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'target import not found: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          npx prettier --write src/api/services/micro-app.service.ts
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/services/micro-app.service.ts
          git commit --no-verify -m 'fix(micro-app): isolate injected dependencies from runtime imports'
          git push --no-verify origin HEAD:${{ github.head_ref }}
