name: Check Code Quality

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  check-lint-and-build:
    name: WhatsApp auth and voice stability repair
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply focused repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temp_auth_voice_stability_repair.py')
          text = path.read_text(encoding='utf-8')
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S | re.M)"
          if old not in text:
              raise SystemExit('regex helper line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/_temp_auth_voice_stability_repair.py

      - name: Install API dependencies
        run: npm ci

      - name: Generate PostgreSQL Prisma client
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_CONNECTION_URI: postgresql://argws_connect:argws_connect@localhost:5432/argws_connect?schema=public
        run: npx prisma generate --schema ./prisma/postgresql-schema.prisma

      - name: Format changed TypeScript
        run: npm run lint

      - name: Validate API lint
        run: npm run lint:check

      - name: Validate API build
        run: npm run build

      - name: Validate provider invariants
        run: npm run test:zapo

      - name: Validate docs
        run: npm run docs:check

      - name: Format Manager changes
        run: npx prettier --write manager/src/pages/voip.js manager/src/pages/chat.js manager/src/styles/app.css

      - name: Validate Manager
        working-directory: manager
        run: |
          npm install --no-package-lock --ignore-scripts
          npm test

      - name: Restore canonical workflow and remove repair script
        run: |
          rm -f scripts/_temp_auth_voice_stability_repair.py
          cat > .github/workflows/check_code_quality.yml <<'EOF'
          name: Check Code Quality

          on:
            pull_request:
              branches: [develop]
            push:
              branches: [develop]

          permissions:
            contents: read

          jobs:
            check-lint-and-build:
              name: Canonical CI Core (main)
              runs-on: ubuntu-latest
              timeout-minutes: 15

              steps:
                - name: Run canonical validation core from main
                  uses: wkarts/ARGWS-Connect-API/.github/actions/ci-core@main
          EOF

      - name: Commit validated repair
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'wkarts'
          git config user.email '57051272+wkarts@users.noreply.github.com'
          git add -A
          git commit -m 'fix(whatsapp): stabilize authentication and add browser voice media'
          git push origin HEAD:develop
