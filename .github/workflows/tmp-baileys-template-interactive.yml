name: TEMP Baileys Template Interactive Compatibility

on:
  push:
    branches: [fix/baileys-template-interactive-compat]
    paths:
      - .github/workflows/tmp-baileys-template-interactive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/baileys-template-interactive-compat
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Apply compatibility correction
        run: |
          python scripts/tmp-fix-baileys-template-interactive.py
          python scripts/tmp-fix-baileys-template-interactive-v2.py

      - name: Format TypeScript
        run: npx eslint --ext .ts src --fix

      - name: Generate Prisma client
        run: |
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma validate --schema prisma/postgresql-schema.prisma
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma generate --schema prisma/postgresql-schema.prisma

      - name: Validate compatibility
        run: |
          set -euo pipefail
          npm run docs:check
          npm run test:compat
          npm run build
          npm run lint:check
          node - <<'NODE'
          const fs = require('fs')
          const engine = fs.readFileSync('src/api/services/template-engine.service.ts','utf8')
          const interaction = fs.readFileSync('src/api/services/interaction-engine.service.ts','utf8')
          const normalizer = fs.readFileSync('src/api/services/interaction-normalizer.ts','utf8')
          if (!engine.includes("mode: 'POLL_COMPAT'")) throw new Error('POLL_COMPAT missing')
          if (!engine.includes("compatibilityTransport: 'BAILEYS_OFFICIAL_POLL'")) throw new Error('Baileys poll transport missing')
          if (!engine.includes("mode: 'TEXT_COMPAT'")) throw new Error('TEXT_COMPAT missing')
          if (!normalizer.includes("type: 'poll_reply'")) throw new Error('poll_reply normalization missing')
          if (!interaction.includes('extractBaileysPollInteraction(message)')) throw new Error('Interaction Engine poll bridge missing')
          if (!engine.includes("provider === 'WHATSAPP-BAILEYS'")) throw new Error('provider capability branch missing')
          console.log('Baileys interactive compatibility structural validation: ok')
          NODE

      - name: Commit validated correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json docs test
          if ! git diff --cached --quiet; then
            git commit -m "fix(templates): usa interação compatível no Baileys"
            git push --no-verify origin HEAD:fix/baileys-template-interactive-compat
          fi
