name: Validate ZAPO raw-message and JID corrections
on:
  push:
    branches: [feat/operations-archive-zapo-catalog-groups]
    paths: [.github/workflows/review-zapo-message-contract.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://connect:connect@127.0.0.1:5432/connect
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply narrow source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, f'Unexpected source for {path}'
              p.write_text(text.replace(old, new))
          service = 'src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts'
          replace_once(service,
              "import { createPostgresStore } from '@innovatorssoft/store-postgres';",
              "import { createPostgresStore } from '@innovatorssoft/store-postgres';\nimport { getContentType } from '@innovatorssoft/zapo-js';")
          replace_once(service,
              "    if (!message || typeof message !== 'object') return 'unknown';\n    if (typeof message.conversation === 'string') return 'conversation';\n    return Object.keys(message).find((key) => message[key] !== null && message[key] !== undefined) || 'unknown';",
              "    if (!message || typeof message !== 'object' || Array.isArray(message)) return 'unknown';\n    if (typeof message.conversation === 'string') return 'conversation';\n    // Native detection skips the sender-key piggyback on real group content.\n    const contentType = getContentType(message);\n    if (contentType) return contentType;\n    // Preserve the internal-only sentinel used by handleIncomingMessage.\n    // A sender-key-only envelope must never become a regular conversation.\n    if (message.senderKeyDistributionMessage !== null && message.senderKeyDistributionMessage !== undefined) {\n      return 'senderKeyDistributionMessage';\n    }\n    return 'unknown';")
          replace_once('src/api/integrations/channel/whatsapp/zapo.jid.helpers.ts',
              "  const candidate = raw.includes('@') ? raw : `${raw.replace(/\\D/g, '')}@lid`;\n  if (candidate === '@lid') return null;",
              "  // A typed LID field may contain bare digits, never arbitrary text\n  // from which digits are extracted to manufacture another identity.\n  if (!raw.includes('@') && !/^\\d+$/.test(raw)) return null;\n  const candidate = raw.includes('@') ? raw : `${raw}@lid`;")
          replace_once('package.json',
              '"test:operations": "node --test test/operations-groups-catalog.test.cjs"',
              '"test:operations": "node --test test/operations-groups-catalog.test.cjs test/zapo-message-contract.test.cjs"')
          Path('test/zapo-message-contract.test.cjs').write_text(r'''
          'use strict';
          const { test } = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const Module = require('node:module');
          const typescript = require('typescript');
          const sdk = require('@innovatorssoft/zapo-js');
          const root = path.resolve(__dirname, '..');
          function loadTs(relative) {
            const absolute = path.join(root, relative);
            const compiled = typescript.transpileModule(fs.readFileSync(absolute, 'utf8'), {
              compilerOptions: { module: typescript.ModuleKind.CommonJS, target: typescript.ScriptTarget.ES2020 },
            }).outputText;
            const loaded = new Module(absolute, module);
            loaded.filename = absolute;
            loaded.paths = Module._nodeModulePaths(path.dirname(absolute));
            loaded._compile(compiled, absolute);
            return loaded.exports;
          }
          const jids = loadTs('src/api/integrations/channel/whatsapp/zapo.jid.helpers.ts');
          const service = fs.readFileSync(path.join(root, 'src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts'), 'utf8');
          // Exercise the actual production method body with the real pinned SDK,
          // without constructing WhatsApp, Prisma, media or external services.
          const method = service.match(/private detectMessageType\(message: any\): string \{([\s\S]*?)\n  \}/);
          assert.ok(method, 'Production message detector must be present');
          assert.match(service, /import \{ getContentType \} from '@innovatorssoft\/zapo-js'/);
          const detect = new Function('getContentType', `return function(message) {${method[1]}\n}`)(sdk.getContentType);
          const senderKey = { groupId: '123456789-987654@g.us', axolotlSenderKeyDistributionMessage: Buffer.from([1]) };
          test('group media and extended text are not discarded as sender-key messages', () => {
            for (const type of ['imageMessage', 'audioMessage', 'videoMessage', 'extendedTextMessage', 'documentMessage', 'productMessage', 'orderMessage']) {
              const input = { senderKeyDistributionMessage: senderKey, [type]: {} };
              assert.equal(detect(input), type);
              assert.equal(input.senderKeyDistributionMessage, senderKey);
            }
          });
          test('metadata and cleared proto fields cannot mask the real content type', () => {
            assert.equal(detect({ messageContextInfo: {}, senderKeyDistributionMessage: senderKey, imageMessage: null, orderMessage: {} }), 'orderMessage');
            assert.equal(detect({ imageMessage: undefined, extendedTextMessage: { text: 'fixture' } }), 'extendedTextMessage');
            assert.equal(detect({ senderKeyDistributionMessage: senderKey, conversation: '' }), 'conversation');
          });
          test('sender-key-only and protocol-only envelopes retain internal classification', () => {
            assert.equal(detect({ senderKeyDistributionMessage: senderKey }), 'senderKeyDistributionMessage');
            assert.equal(detect({ senderKeyDistributionMessage: senderKey, protocolMessage: {} }), 'protocolMessage');
            for (const value of [null, undefined, [], 12, 'text', {}]) assert.equal(detect(value), 'unknown');
          });
          test('documented raw product/order/contact/payment fields remain detectable', () => {
            for (const type of ['productMessage', 'orderMessage', 'contactMessage', 'contactsArrayMessage', 'groupInviteMessage', 'interactiveMessage', 'requestPhoneNumberMessage']) {
              assert.equal(detect({ [type]: {} }), type);
            }
          });
          test('official JID normalization preserves group/LID/newsletter namespaces', () => {
            for (const jid of ['123456789-987654@g.us', '120363123456789012@g.us', '177159062745149@lid', '120363123456789012@newsletter', 'status@broadcast']) {
              assert.equal(jids.zapoNormalizeJid(jid), jid);
              assert.equal(jids.zapoPhoneJid(jid), null);
            }
            assert.equal(jids.zapoNormalizeJid('5511999999999:12@s.whatsapp.net'), '5511999999999@s.whatsapp.net');
            assert.equal(jids.zapoPhoneJid('5511999999999'), '5511999999999@s.whatsapp.net');
            assert.equal(jids.zapoIsGroupJid('123456789-987654@g.us'), true);
            assert.equal(jids.zapoIsLidJid('177159062745149@lid'), true);
          });
          test('typed bare LID accepts digits but cannot manufacture identities from text', () => {
            assert.equal(jids.zapoKnownLidJid('177159062745149'), '177159062745149@lid');
            assert.equal(jids.zapoKnownLidJid('177159062745149@lid'), '177159062745149@lid');
            for (const value of ['lid:177159062745149', 'peer123abc456', '123-456', '', '123@s.whatsapp.net', '123@g.us']) {
              assert.equal(jids.zapoKnownLidJid(value), null);
            }
          });
          test('pinned protobuf retains raw product/order monetary units without conversion', () => {
            const product = { productMessage: { businessOwnerJid: '5511999999999@s.whatsapp.net', product: { productId: 'fixture-product', title: 'Fixture', currencyCode: 'BRL', priceAmount1000: 49900 } } };
            const order = { orderMessage: { orderId: 'fixture-order', sellerJid: '5511999999999@s.whatsapp.net', itemCount: 3, totalAmount1000: 149700, totalCurrencyCode: 'BRL' } };
            // The pinned ZAPO codec accepts IMessage directly; it does not
            // expose ProtobufJS fromObject. Long fields may decode as numbers
            // or the public Long shape with toNumber().
            const p = sdk.proto.Message.decode(sdk.proto.Message.encode(product).finish());
            const o = sdk.proto.Message.decode(sdk.proto.Message.encode(order).finish());
            const integer = value => typeof value === 'number' ? value : value.toNumber();
            assert.equal(integer(p.productMessage.product.priceAmount1000), 49900);
            assert.equal(integer(o.orderMessage.totalAmount1000), 149700);
            assert.equal(p.productMessage.businessOwnerJid, product.productMessage.businessOwnerJid);
            assert.equal(o.orderMessage.sellerJid, order.orderMessage.sellerJid);
          });
          ''')
          Path('docs/operations/zapo-raw-sends-jid-review.md').write_text('''# Revisão dos guias ZAPO: envios brutos e JIDs
          
          Base consultada: https://zapo.to/pt-br/guides/raw-sends e https://zapo.to/pt-br/reference/jid-helpers, comparadas aos exports e código da dependência fixada @innovatorssoft/zapo-js 1.6.3.
          
          ## Conteúdo bruto não depende de builder tipado
          
          O guia documenta client.message.send(jid, Proto.IMessage), incluindo productMessage, orderMessage, contactsArrayMessage, interactiveMessage e requestPhoneNumberMessage. A ausência de um builder tipado não significa ausência de transporte. Produto requer productImage previamente enviado quando a imagem é utilizada. priceAmount1000 e totalAmount1000 usam milésimos; pagamentos native-flow usam value/offset, conforme o guia. Não intercambiar essas unidades.
          
          Essa superfície envia mensagens. Não documenta uma consulta de catálogo, paginação ou CRUD de produtos. Na PR 77 a leitura de produtos/coleções continua no plugin connect-commerce pela interface pública queryWithContext, sem outra sessão ou troca de dependências. businessCatalog: true descreve essa leitura; não anuncia novas rotas REST de envio bruto ou CRUD. Testes do codec não comprovam renderização mobile/Web nem homologação de catálogo real.
          
          ## Correção de grupos
          
          O detector do adaptador utiliza getContentType da raiz pública do ZAPO. Uma senderKeyDistributionMessage junto de imagem, áudio, documento ou texto estendido não pode ocultar o conteúdo da mensagem de grupo. Envelopes contendo somente sender-key mantêm a classificação interna, sem virarem conversas. A carga original e participant/remoteJid não são reescritos por essa detecção.
          
          ## Identificadores
          
          normalizeRecipientJid, toUserJid e os classificadores oficiais permanecem a fonte de semântica. Grupo @g.us, LID @lid, canal @newsletter e status@broadcast não são números de telefone. Campo explicitamente tipado como LID aceita dígitos puros; texto misturado não é limpo para fabricar um LID. O aprendizado PN/LID continua dependendo de vínculo explícito; os helpers não consultam agenda, nome ou foto.
          
          requestPhoneNumberMessage é uma mensagem de solicitação. Não há nesse guia promessa de conversão automática LID para PN. Esta correção não a envia silenciosamente durante chamadas ou resolução de contatos.
          
          ## Validação
          
          Regressões executam o corpo do detector de produção com o SDK real instalado e os helpers reais, sem parear WhatsApp. Incluem conteúdo de grupo com sender-key, metadados, produto/pedido, preservação de namespaces, rejeição de LIDs fabricados e valores de codec. Não há alteração de rotas, schema, migrations, credenciais, nomes ou sessões.
          '''.replace('\n          ', '\n'))
          PY
      - run: npm ci --no-audit --no-fund
      - name: Format only changed TypeScript files
        run: npx eslint --fix src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts src/api/integrations/channel/whatsapp/zapo.jid.helpers.ts
      - run: npm run db:generate
      - run: npm run lint:check
      - run: npm run build
      - run: npm run test:operations
      - run: node --test test/operations-resilience.test.cjs
      - run: npm run docs:check
      - name: Commit validated corrections only to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts src/api/integrations/channel/whatsapp/zapo.jid.helpers.ts package.json test/zapo-message-contract.test.cjs docs/operations/zapo-raw-sends-jid-review.md
          git diff --cached --check
          git commit -m 'fix(zapo): preserve real group content using native message helpers'
          git push origin HEAD:feat/operations-archive-zapo-catalog-groups
