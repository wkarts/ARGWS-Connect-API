name: TEMP Conversational Platform Phase 4

on:
  push:
    branches: [feat/conversational-platform-phase4]
    paths:
      - .github/workflows/tmp-conversational-phase4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/conversational-platform-phase4
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Integrate Phase 4 UI
        run: python scripts/tmp-add-phase4-ui.py
      - name: Validate databases
        run: |
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma validate --schema prisma/postgresql-schema.prisma
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma generate --schema prisma/postgresql-schema.prisma
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' DATABASE_BOUNCER_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:6432/argws' npx prisma validate --schema prisma/psql_bouncer-schema.prisma
          DATABASE_CONNECTION_URI='mysql://argws:argws@127.0.0.1:3306/argws' npx prisma validate --schema prisma/mysql-schema.prisma
      - name: Validate full Phase 4
        run: |
          set -euo pipefail
          npm run docs:check
          npm run test:compat
          npm run build
          npm run lint:check
          node --check manager/dist/assets/template-editor-phase4.js
          grep -q 'template-editor-phase4.js' manager/dist/template-editor.html
          grep -q '/compat/meta/' manager/dist/assets/template-editor-phase4.js
          grep -q '/recipe/install/' manager/dist/assets/template-editor-phase4.js
          grep -q '/interaction/strong/' manager/dist/assets/template-editor-phase4.js
      - name: Commit validated UI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/dist docs/guides/conversational-platform-phase4.md
          if ! git diff --cached --quiet; then
            git commit -m "feat(manager): expõe política, recipes oficiais e aprovações fortes"
            git push --no-verify origin HEAD:feat/conversational-platform-phase4
          fi
