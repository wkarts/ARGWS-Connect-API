name: TEMP Template Engine Phase 1

on:
  push:
    branches: [feat/template-recipe-action-engine]
    paths:
      - .github/workflows/tmp-template-engine-phase1.yml
      - scripts/tmp-apply-template-engine-phase1.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/template-recipe-action-engine
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply schema and documentation source changes
        run: python scripts/tmp-apply-template-engine-phase1.py

      - name: Install dependencies
        run: npm ci

      - name: Format TypeScript source
        run: npx eslint --ext .ts src --fix

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/postgresql-schema.prisma

      - name: Generate documentation contracts
        run: npm run docs:generate

      - name: Validate implementation
        run: |
          set -euo pipefail
          npm run docs:check
          npm run test:compat
          npm run build
          npm run lint:check
          node --check docs/scripts/meta-compatible-schemas.mjs
          node - <<'NODE'
          const fs = require('fs')
          const graph = JSON.parse(fs.readFileSync('docs/openapi/meta-compatible.openapi.json', 'utf8'))
          const union = graph.components.schemas.MetaMessageRequest.oneOf.map((item) => item.$ref)
          if (!union.some((ref) => ref.endsWith('/MetaTemplateMessageRequest'))) throw new Error('Meta template schema ausente')
          if (!graph.components.schemas.MetaTemplateContent) throw new Error('MetaTemplateContent ausente')
          console.log('template schema contract: ok')
          NODE

      - name: Commit validated phase
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            prisma/postgresql-schema.prisma \
            prisma/psql_bouncer-schema.prisma \
            prisma/mysql-schema.prisma \
            docs/scripts/meta-compatible-schemas.mjs \
            docs/scripts/generate-openapi.mjs \
            docs/guides/meta-compatible.md \
            docs/openapi/connect-api.openapi.json \
            docs/openapi/meta-compatible.openapi.json \
            docs/openapi/coverage.json \
            docs/asyncapi/connect-api-events.asyncapi.json \
            src/api/server.module.ts \
            src/api/services/template-engine.service.ts \
            src/api/services/template-renderer.ts \
            src/api/services/template.service.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat(template): materializa catálogo e schemas canônicos"
          fi
          git push --no-verify origin HEAD:feat/template-recipe-action-engine
