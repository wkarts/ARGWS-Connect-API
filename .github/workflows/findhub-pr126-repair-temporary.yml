name: Find Hub PR126 repair validation
on:
  push:
    branches: [fix/findhub-vault-redirect-callback]
    paths: [.github/workflows/findhub-pr126-repair-temporary.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply integrity-checked correction on the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-vault-redirect-callback
          git merge-base --is-ancestor ecbbba94f6824ae03866f7af7b7faf22f68ee50d HEAD
          git diff --exit-code ecbbba94f6824ae03866f7af7b7faf22f68ee50d -- . ':!.github/workflows/findhub-pr126-repair-temporary.yml'
          python3 - <<'PY'
          import base64,gzip,hashlib,re,subprocess
          from pathlib import Path
          original = subprocess.check_output(['git','show','ac2017304338d0d64c7b93bab32d469a6a41ccce:.github/workflows/findhub-pr126-repair-temporary.yml'],text=True)
          encoded = re.search(r"packed = base64.b64decode\('([^']+)'", original).group(1)
          assert len(encoded) == 9425 and encoded[1737] == 'e', 'Unexpected staged transport'
          encoded = encoded[:1737] + encoded[1738:]
          packed = base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest() == '312c71050e48d1f11557d885179b64cad7bf2bd16f2e2be239787954f978ecbb', 'Correction transport digest mismatch'
          Path('/tmp/findhub-pr126.patch').write_bytes(gzip.decompress(packed))
          PY
          git apply --check --unidiff-zero /tmp/findhub-pr126.patch
          git apply --index --unidiff-zero /tmp/findhub-pr126.patch
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
      - name: Validate complete API and regression contracts
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint:check
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund --package-lock=false
          npm test --prefix manager
      - name: Commit validated source on the existing PR branch only
        run: |
          set -euo pipefail
          branch=fix/findhub-vault-redirect-callback
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code ecbbba94f6824ae03866f7af7b7faf22f68ee50d -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions deploy
          git add -u
          git add -f public/findhub-auth.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): confirm callback readiness and report delivery failures (0.1.6)'
          git push origin "HEAD:refs/heads/$branch"
      - name: Archive exact tested source
        if: always()
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/findhub-pr126-source.tar.gz
          git rev-parse HEAD > /tmp/findhub-pr126-source.commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-pr126-repair-source
          path: |
            /tmp/findhub-pr126-source.tar.gz
            /tmp/findhub-pr126-source.commit
          retention-days: 7
