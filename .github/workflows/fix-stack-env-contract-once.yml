name: Fix Stack Env Contract Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-stack-env-contract-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Restore global GHCR infrastructure image names
        shell: bash
        run: |
          set -euo pipefail
          for file in deploy/production/env.example deploy/develop/env.example deploy/canonical/env.example; do
            sed -i 's#^ARGWS_CONNECT_POSTGRES_IMAGE=.*#ARGWS_CONNECT_POSTGRES_IMAGE=ghcr.io/wkarts/argws-connect-postgres:15#' "$file"
            sed -i 's#^ARGWS_CONNECT_REDIS_IMAGE=.*#ARGWS_CONNECT_REDIS_IMAGE=ghcr.io/wkarts/argws-connect-redis:latest#' "$file"
            sed -i 's#^ARGWS_CONNECT_RABBITMQ_IMAGE=.*#ARGWS_CONNECT_RABBITMQ_IMAGE=ghcr.io/wkarts/argws-connect-rabbitmq:management#' "$file"
            sed -i 's#^ARGWS_CONNECT_MINIO_IMAGE=.*#ARGWS_CONNECT_MINIO_IMAGE=ghcr.io/wkarts/argws-connect-minio:latest#' "$file"
            sed -i 's#^ARGWS_CONNECT_MYSQL_IMAGE=.*#ARGWS_CONNECT_MYSQL_IMAGE=ghcr.io/wkarts/argws-connect-mysql:8.0#' "$file"
            sed -i 's#^ARGWS_CONNECT_NATS_IMAGE=.*#ARGWS_CONNECT_NATS_IMAGE=ghcr.io/wkarts/argws-connect-nats:2.10-alpine#' "$file"
            sed -i 's#^ARGWS_CONNECT_KAFKA_IMAGE=.*#ARGWS_CONNECT_KAFKA_IMAGE=ghcr.io/wkarts/argws-connect-kafka:7.5.0#' "$file"
            sed -i 's#^ARGWS_CONNECT_ZOOKEEPER_IMAGE=.*#ARGWS_CONNECT_ZOOKEEPER_IMAGE=ghcr.io/wkarts/argws-connect-zookeeper:7.5.0#' "$file"
          done

      - name: Commit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-stack-env-contract-once.yml
          git add deploy/production/env.example deploy/develop/env.example deploy/canonical/env.example
          git commit -m "fix(deploy): restaura imagens GHCR globais [skip release]"
          git push origin HEAD:main
