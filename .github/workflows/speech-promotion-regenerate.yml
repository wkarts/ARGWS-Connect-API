name: Synchronize generated speech promotion files
on:
  push:
    branches: [work/speech-promotion-review-20261010]
permissions:
  contents: write
jobs:
  regenerate:
    if: startsWith(github.event.head_commit.message, 'ci(repair)')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-transcription-main-20261010
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install compose parser for schema integrity
        run: python3 -c 'import yaml' || (sudo apt-get update && sudo apt-get install -y python3-yaml)
      - name: Regenerate only Fersoft envs and OpenAPI snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync-fersoft-deployments.py
          node docs/scripts/generate-openapi.mjs
          node docs/scripts/generate-openapi.mjs --check
          python3 scripts/sync-fersoft-deployments.py --check
          python3 test/speech-service-deployment.test.py
          python3 test/compose-env-only-deployments.test.py
          python3 test/deploy-operations.test.py
          git diff --check
      - name: Commit and push only generated files (no workflows, release or deploy)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed={'deploy/fersoft/develop/env.example','deploy/fersoft/production/env.example',
            'docs/openapi/connect-api.openapi.json','docs/openapi/findhub.openapi.json',
            'docs/openapi/coverage.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          unexpected=changed-allowed
          assert not unexpected,sorted(unexpected)
          assert changed, 'Expected to repair outdated generated files.'
          print('Generated files:',sorted(changed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- deploy/fersoft/develop/env.example deploy/fersoft/production/env.example docs/openapi/connect-api.openapi.json docs/openapi/findhub.openapi.json docs/openapi/coverage.json
          git diff --cached --check
          git commit -m 'fix(speech): regenerate main Fersoft envs and OpenAPI contracts [skip release]'
          git push origin HEAD:fix/native-transcription-main-20261010
