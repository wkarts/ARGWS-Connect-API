name: TEMP Apply Meta Compatible Always On

on:
  push:
    branches: [fix/meta-compatible-always-on]
    paths:
      - .github/workflows/tmp-apply-meta-always-on.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          ref: fix/meta-compatible-always-on
          fetch-depth: 0

      - name: Apply corrections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp-apply-meta-always-on.py
          mkdir -p prisma/postgresql-migrations/20260902010000_meta_compatibility_always_on
          printf '%s\n' \
            'ALTER TABLE "MetaCompatibility" ALTER COLUMN "enabled" SET DEFAULT true;' \
            'UPDATE "MetaCompatibility" SET "enabled" = true WHERE "enabled" = false;' \
            > prisma/postgresql-migrations/20260902010000_meta_compatibility_always_on/migration.sql
          mkdir -p prisma/mysql-migrations/20260902010000_meta_compatibility_always_on
          printf '%s\n' \
            'ALTER TABLE `MetaCompatibility` MODIFY `enabled` BOOLEAN NOT NULL DEFAULT true;' \
            'UPDATE `MetaCompatibility` SET `enabled` = true WHERE `enabled` = false;' \
            > prisma/mysql-migrations/20260902010000_meta_compatibility_always_on/migration.sql
          node docs/scripts/generate-openapi.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate corrections
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:check
          npx tsc --noEmit
          npm run test:compat
          npm run docs:check
          node - <<'NODE'
          const fs = require('fs')
          const native = JSON.parse(fs.readFileSync('docs/openapi/connect-api.openapi.json', 'utf8'))
          const graph = JSON.parse(fs.readFileSync('docs/openapi/meta-compatible.openapi.json', 'utf8'))
          if (native.components?.securitySchemes?.apiKey?.name !== 'apikey') throw new Error('native auth header is not apikey')
          if (/habilite a instância|Antes do uso, habilite/i.test(JSON.stringify(graph))) throw new Error('graph docs still require enablement')
          const controller = fs.readFileSync('src/api/compat/meta-cloud/meta-cloud-graph.controller.ts', 'utf8')
          if (/assertEnabled|compatibility is not enabled/.test(controller)) throw new Error('graph enable gate still present')
          NODE

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/compat/meta-cloud src/api/server.module.ts prisma docs test/meta-cloud .github/workflows/docs-integrity.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(meta): torna compatibilidade Graph habilitada por padrão"
          git push origin HEAD:fix/meta-compatible-always-on
