name: Fix pairing hotfix format

on:
  push:
    branches:
      - "fix/pairing-code-phone-client-1.0.10"
    paths:
      - ".github/workflows/fix-pairing-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/pairing-code-phone-client-1.0.10"
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20.x"
      - run: npm ci
      - run: npx prettier --write src/api/controllers/instance.controller.ts src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts src/api/routes/index.router.ts src/config/env.config.ts
      - run: rm .github/workflows/fix-pairing-format.yml
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(pairing): aplica formatação do hotfix"
          git push origin HEAD:fix/pairing-code-phone-client-1.0.10
