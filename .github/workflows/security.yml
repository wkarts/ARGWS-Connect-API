name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Test SARIF security gate
      run: node --test test/codeql-sarif-gate.test.cjs
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    - name: Perform CodeQL Analysis
      id: analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        output: codeql-results
        upload: never
        upload-database: false
    - name: Enforce SARIF security gate and retain complete log evidence
      if: always()
      env:
        CODEQL_ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        CODEQL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: node scripts/codeql-sarif-gate.cjs gate codeql-results
    - name: Check Code scanning availability
      id: code-scanning
      if: ${{ !cancelled() && steps.analysis.outcome == 'success' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/codeql-sarif-gate.cjs probe
    - name: Publish SARIF to available Code scanning service
      if: ${{ !cancelled() && steps.code-scanning.outputs.available == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: codeql-results
        category: "/language:${{matrix.language}}"
        wait-for-processing: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Dependency Review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
      - name: Dependency Review availability notice
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::GitHub Dependency Review is unavailable for this repository. CodeQL remains enforced; enable Dependency Graph/GitHub Advanced Security to make Dependency Review blocking."
