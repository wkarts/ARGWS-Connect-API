name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        output: codeql-results

    - name: Report CodeQL source locations without source snippets
      if: always()
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        for file in Path('codeql-results').glob('*.sarif'):
            document = json.loads(file.read_text())
            for run in document.get('runs', []):
                rules = {r['id']: r for r in run.get('tool', {}).get('driver', {}).get('rules', [])}
                for result in run.get('results', []):
                    rule_id = result.get('ruleId', 'unknown')
                    rule = rules.get(rule_id, {})
                    severity = rule.get('properties', {}).get('security-severity', result.get('level', 'warning'))
                    locations = []
                    for location in result.get('locations', []):
                        physical = location.get('physicalLocation', {})
                        locations.append({'path': physical.get('artifactLocation', {}).get('uri'), 'line': physical.get('region', {}).get('startLine')})
                    print(json.dumps({'rule': rule_id, 'severity': severity, 'locations': locations}))
                    for flow in result.get('codeFlows', []):
                        for thread in flow.get('threadFlows', []):
                            trace = []
                            for location in thread.get('locations', []):
                                physical = location.get('location', {}).get('physicalLocation', {})
                                trace.append({'path': physical.get('artifactLocation', {}).get('uri'), 'line': physical.get('region', {}).get('startLine')})
                            print(json.dumps({'rule': rule_id, 'flow': trace}))
        PY

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Dependency Review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

      - name: Dependency Review availability notice
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::GitHub Dependency Review is unavailable for this repository. CodeQL remains enforced; enable Dependency Graph/GitHub Advanced Security to make Dependency Review blocking."
