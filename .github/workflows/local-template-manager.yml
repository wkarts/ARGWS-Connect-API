name: Local Template Manager

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  manager:
    name: Manager tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Manager dependencies
        working-directory: manager
        run: npm install --no-audit --no-fund
      - name: Validate Manager tests, types and production bundle
        working-directory: manager
        run: npm test
