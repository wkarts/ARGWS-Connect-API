name: Promotion Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Protect canonical release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch main and tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

      - name: Validate promotion boundaries
        env:
          ALLOW_GOVERNANCE_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'governance:ci') || startsWith(github.head_ref, 'chore/canonical-ci-governance') }}
        run: >-
          node .github/scripts/validate-promotion.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  semver-preview:
    name: Semantic version dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preview next semantic version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          plan="$(node .github/scripts/compute-next-version.mjs "$latest" "$PR_LABELS" "$PR_TITLE")"
          version="$(jq -r '.version' <<<"$plan")"
          bump="$(jq -r '.bump' <<<"$plan")"
          previous="$(jq -r '.previous // "none"' <<<"$plan")"
          {
            echo "## Semantic Version Preview"
            echo
            echo "- Current: ${previous}"
            echo "- Planned: ${version}"
            echo "- Bump: ${bump}"
            echo "- This is a dry-run; no version file is changed by the PR."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SemVer dry-run: ${previous} -> ${version} (${bump})"
