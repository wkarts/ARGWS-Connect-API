name: Find Hub isolated wire correction validation
on:
  push:
    branches: [fix/findhub-wire-exchange]
    paths: [.github/workflows/findhub-auth-negative-probe.yml]
permissions:
  contents: write
jobs:
  validate-candidate:
    if: github.ref == 'refs/heads/fix/findhub-wire-exchange'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply exact locally tested text changes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-wire-exchange
          git diff --exit-code 241881dfea0127fd493a120d1a147a416c161182 HEAD -- src manager browser-extensions docs public scripts package.json package-lock.json deploy
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          plan = json.loads(Path('.github/findhub-wire-edits.json').read_text())
          assert len(plan) == 22
          pending = []
          for item in plan:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.github' not in path.parts
              old = path.read_bytes()
              assert hashlib.sha256(old).hexdigest() == item['before'], str(path) + ' source differs'
              text = old.decode('utf-8')
              for start, end, replacement in reversed(item['edits']):
                  assert 0 <= start <= end <= len(text)
                  text = text[:start] + replacement + text[end:]
              new = text.encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == item['after'], str(path) + ' candidate differs'
              pending.append((path, new))
          for path, new in pending:
              path.write_bytes(new)
          print('Verified all 22 edited files against local candidate SHA256 values')
          PY
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
      - name: Install existing API dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate API, protocol regressions and privacy
        run: |
          set -euo pipefail
          npm run lint:check
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          node --test test/diagnostic-privacy.test.cjs
          npm run db:generate
          npm run build
      - name: Validate the complete Manager
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit source only on the correction branch
        run: |
          set -euo pipefail
          branch=fix/findhub-wire-exchange
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 241881dfea0127fd493a120d1a147a416c161182 -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package.json package-lock.json .github/actions deploy docker-compose.yaml docker-compose.dev.yaml
          git rm .github/findhub-wire-edits.json
          git add -u
          git add -f public/findhub-auth.zip
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): align auth wire profile and acknowledge extension commands safely'
          git push origin "HEAD:refs/heads/$branch"
      - name: Archive exact validated source
        if: always()
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/findhub-wire-source.tar.gz
          git diff --binary 241881dfea0127fd493a120d1a147a416c161182 > /tmp/findhub-wire-source.patch
          git rev-parse HEAD > /tmp/findhub-wire-source.commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-wire-validated-source
          path: |
            /tmp/findhub-wire-source.tar.gz
            /tmp/findhub-wire-source.patch
            /tmp/findhub-wire-source.commit
          retention-days: 7
