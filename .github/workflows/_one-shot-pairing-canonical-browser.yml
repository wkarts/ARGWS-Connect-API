name: One-shot Pairing Canonical Browser Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_one-shot-pairing-canonical-browser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
      - name: Apply canonical protocol browser
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts')
          s = p.read_text()
          s = s.replace("import { release } from 'os';\n", "")
          old = """    const session = this.configService.get<ConfigSessionPhone>('CONFIG_SESSION_PHONE');\n\n    const browser: WABrowserDescription = [session.CLIENT, session.NAME, release()];\n    const browserOptions = { browser };\n"""
          new = """    const session = this.configService.get<ConfigSessionPhone>('CONFIG_SESSION_PHONE');\n\n    // Pairing-code authentication is validated more strictly by WhatsApp than QR pairing.\n    // Keep ARGWS branding separate from the protocol fingerprint and use a canonical\n    // browser tuple known to be accepted by the companion registration flow.\n    const browser: WABrowserDescription = ['Ubuntu', 'Chrome', '20.0.04'];\n    const browserOptions = { browser };\n"""
          if old not in s:
              raise SystemExit('Expected browser block not found')
          s = s.replace(old, new, 1)
          s = s.replace("    this.logger.info(`Browser: ${browser}`);", "    this.logger.info(`Session client: ${session.CLIENT}`);\n    this.logger.info(`WhatsApp protocol browser: ${browser.join(' / ')}`);")
          p.write_text(s)

          # CONFIG_SESSION_PHONE_CLIENT remains product identity only.
          for env in Path('deploy').glob('*/env.example'):
              text = env.read_text()
              lines = text.splitlines()
              changed = False
              for i, line in enumerate(lines):
                  if line.startswith('CONFIG_SESSION_PHONE_CLIENT='):
                      lines[i] = 'CONFIG_SESSION_PHONE_CLIENT=ConnectAPI'
                      changed = True
              if changed:
                  env.write_text('\n'.join(lines) + '\n')
          for env in Path('deploy').glob('*/.env.example'):
              text = env.read_text()
              lines = text.splitlines()
              changed = False
              for i, line in enumerate(lines):
                  if line.startswith('CONFIG_SESSION_PHONE_CLIENT='):
                      lines[i] = 'CONFIG_SESSION_PHONE_CLIENT=ConnectAPI'
                      changed = True
              if changed:
                  env.write_text('\n'.join(lines) + '\n')
      - run: npm ci
      - run: npm run lint:check
      - run: npm run test:compat
      - run: npm run db:generate
      - run: npm run build
      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_one-shot-pairing-canonical-browser.yml
          git add src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts deploy
          git commit -m 'fix(whatsapp): usa fingerprint canônico no pairing code [skip release]'
          git push origin HEAD:main
