name: TEMP Provider Capabilities Phase 5

on:
  push:
    branches: [feat/provider-capabilities-preview-phase5]
    paths:
      - .github/workflows/tmp-provider-capabilities-phase5.yml
      - scripts/tmp-apply-provider-capabilities-phase5.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/provider-capabilities-preview-phase5
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Apply Phase 5
        run: python scripts/tmp-apply-provider-capabilities-phase5.py

      - name: Format source
        run: npx eslint --ext .ts src --fix

      - name: Generate Prisma client
        run: |
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma validate --schema prisma/postgresql-schema.prisma
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma generate --schema prisma/postgresql-schema.prisma

      - name: Generate and validate contracts
        run: |
          npm run docs:generate
          npm run docs:check

      - name: Validate product
        run: |
          npm run test:compat
          npm run build
          npm run lint:check
          node --check manager/dist/assets/template-editor-phase5.js
          node - <<'NODE'
          const fs = require('fs')
          const planner = fs.readFileSync('src/api/services/template-transport-planner.ts','utf8')
          const service = fs.readFileSync('src/api/services/template.service.ts','utf8')
          const router = fs.readFileSync('src/api/routes/template.router.ts','utf8')
          const studio = fs.readFileSync('manager/dist/assets/template-editor-phase5.js','utf8')
          if (!planner.includes("mode: 'POLL_COMPAT'")) throw new Error('POLL_COMPAT planning missing')
          if (!planner.includes("mode: 'TEXT_COMPAT'")) throw new Error('TEXT_COMPAT planning missing')
          if (!service.includes('sideEffectFree: true')) throw new Error('side effect free marker missing')
          if (!router.includes("routerPath('capabilities')")) throw new Error('capabilities endpoint missing')
          if (!router.includes("routerPath('preview')")) throw new Error('preview endpoint missing')
          if (!studio.includes('Transporte real')) throw new Error('provider-aware Studio preview missing')
          console.log('Phase 5 structural validation: ok')
          NODE

      - name: Commit validated Phase 5
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src manager/dist package.json docs
          git add -f test/template-engine/provider-capabilities.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat(templates): adiciona capabilities e preview por provider"
            git push --no-verify origin HEAD:feat/provider-capabilities-preview-phase5
          fi
