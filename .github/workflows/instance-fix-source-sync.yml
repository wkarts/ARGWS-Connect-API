name: One-time verified source integration
on:
  push:
    branches: [fix/instance-modals-tls-job-completion]
    paths: ['.github/workflows/instance-fix-source-sync.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wkarts/ARGWS-Connect-API' && github.ref == 'refs/heads/fix/instance-modals-tls-job-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Apply audited source only after checksum and scope checks
        shell: python
        run: |
          from pathlib import Path
          import hashlib, lzma, subprocess, os
          paths = ['deploy/platform-develop/compose.yaml', 'deploy/platform-develop/env.example', 'deploy/platform-production/compose.yaml', 'deploy/platform-production/env.example', 'deploy/platform/compose.yaml', 'deploy/platform/env.example', 'docs/guides/instance-grafana-corrective.md', 'platform/control-api/app/api/routes/control_whatsapp.py', 'platform/control-api/app/core/config.py', 'platform/control-api/app/services/control_engine_instances.py', 'platform/control-api/app/services/resource_admin.py', 'platform/control-api/app/services/tls_job_completion.py', 'platform/control-api/app/workers/tasks.py', 'platform/control-api/tests/connect_platform/test_compose_grafana_scope.py', 'platform/control-api/tests/connect_platform/test_control_engine_bindings.py', 'platform/control-api/tests/connect_platform/test_grafana_local_auth.py', 'platform/control-api/tests/connect_platform/test_tls_job_completion.py', 'platform/infrastructure/grafana/integration_test.py', 'platform/web/src/__tests__/ControlInstanceBindings.spec.ts', 'platform/web/src/__tests__/InstanceModals.spec.ts', 'platform/web/src/components/ModalDialog.vue', 'platform/web/src/pages/ControlResourcesPage.vue', 'platform/web/src/pages/ControlWhatsAppPage.vue']
          parts = [Path(f'.github/instance-fix-source-{i}.xzpart') for i in range(7)]
          compressed = b''.join(p.read_bytes() for p in parts)
          assert len(compressed) == 19264
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '57b8f53b4bea68662c7d6c75da09f48e10d5c27300cad1a9e499d0e26fe40c45'
          headers = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          assert set(headers) == set(paths) and len(headers) == len(paths)
          subprocess.run(['git','apply','--check'], input=patch, check=True)
          subprocess.run(['git','apply'], input=patch, check=True)
          for part in parts: part.unlink()
          subprocess.run(['git','add','--',*paths,*(str(p) for p in parts)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          branch = 'fix/instance-modals-tls-job-completion'
          remote = subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert remote == os.environ['GITHUB_SHA'], 'Concurrent branch update; do not overwrite'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(platform): restaura modais, vínculos isolados, conclusão TLS e Grafana nos três Composes'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
