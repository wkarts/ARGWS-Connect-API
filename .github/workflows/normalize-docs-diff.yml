name: Normalize DOCs diff

on:
  push:
    branches:
      - fix/zapo-call-identity-docs-assets
    paths:
      - .github/workflows/normalize-docs-diff.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-call-identity-docs-assets
          fetch-depth: 0
      - name: Keep only functional DOCs changes
        run: python3 .github/scripts/normalize-docs-diff.py
      - name: Commit normalized DOCs diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/scripts/generate-openapi.mjs docs/DOCS-DEPLOYMENT-TOPOLOGY.md
          HUSKY=0 git commit -m "chore(docs): keep internal branding patch surgical"
          HUSKY=0 git push origin HEAD:fix/zapo-call-identity-docs-assets
