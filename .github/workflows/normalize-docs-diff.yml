name: Normalize DOCs diff

on:
  push:
    branches:
      - fix/zapo-call-identity-docs-assets
    paths:
      - .github/workflows/normalize-docs-diff.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-call-identity-docs-assets
          fetch-depth: 0
      - name: Keep only functional DOCs changes
        run: |
          git show origin/develop:docs/scripts/generate-openapi.mjs > docs/scripts/generate-openapi.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/scripts/generate-openapi.mjs')
          s = p.read_text()
          pairs = [
              ('![Connect|API REST](/openapi/branding/docs/connect-api-rest-light.png)', '![Connect|API REST](openapi/branding/docs/connect-api-rest-light.png)'),
              ('![Connect|API Meta](/openapi/branding/docs/connect-api-meta-light.png)', '![Connect|API Meta](openapi/branding/docs/connect-api-meta-light.png)'),
              ('![Connect|API Events](/openapi/branding/docs/connect-api-events-light.png)', '![Connect|API Events](openapi/branding/docs/connect-api-events-light.png)'),
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected one generated branding path: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git show origin/develop:docs/DOCS-DEPLOYMENT-TOPOLOGY.md > docs/DOCS-DEPLOYMENT-TOPOLOGY.md
          cat >> docs/DOCS-DEPLOYMENT-TOPOLOGY.md <<'EOF'

### Assets e branding no modo interno

Os documentos OpenAPI/AsyncAPI usam caminhos relativos para os assets de branding. Assim, a mesma imagem DOCs resolve logos e demais recursos tanto na raiz de um deployment standalone quanto sob `/manager/docs/` no acesso interno same-origin, sem depender de um hostname externo de documentação.
EOF

      - name: Commit normalized DOCs diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/scripts/generate-openapi.mjs docs/DOCS-DEPLOYMENT-TOPOLOGY.md
          HUSKY=0 git commit -m "chore(docs): keep internal branding patch surgical"
          HUSKY=0 git push origin HEAD:fix/zapo-call-identity-docs-assets
