name: Stabilize ZAPO identity

on:
  push:
    branches:
      - fix/zapo-identity-performance-docs
    paths:
      - .github/workflows/stabilize-zapo-identity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-identity-performance-docs
          fetch-depth: 0
      - name: Apply stable identity model
        run: python3 .github/scripts/stabilize-zapo-identity.py
      - name: Format backend changes
        run: |
          npm ci --silent
          npx prettier --write src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts
          HUSKY=0 git commit -m "fix(zapo): keep canonical remote identity stable"
          HUSKY=0 git push origin HEAD:fix/zapo-identity-performance-docs
