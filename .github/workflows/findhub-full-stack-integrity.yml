name: Find Hub - Full stack and device controls
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'deploy/*/full-stack/**'
      - 'scripts/*full-stack*'
      - 'test/full-stack-deployment.test.py'
      - 'src/api/integrations/channel/findhub/**'
      - 'manager/src/components/FindHub*'
      - '.github/workflows/findhub-full-stack-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: findhub-full-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate generated profiles and safe import
        run: |
          set -euo pipefail
          python3 scripts/sync-full-stack-deployments.py --check
          python3 test/full-stack-deployment.test.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare disposable full stack (no operator credentials)
        working-directory: deploy/develop/full-stack
        run: |
          set -euo pipefail
          python3 prepare-env.py
          python3 prepare-env.py --check
          docker compose --env-file .env -f compose.yaml config --quiet
          docker compose --env-file .env -f compose.yaml pull
      - name: Start and verify all local services
        working-directory: deploy/develop/full-stack
        run: |
          set -euo pipefail
          docker compose --env-file .env -f compose.yaml up -d
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:38082/health >/dev/null &&
              test "$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}' traccar-bootstrap-argws-connect-develop)" = exited:0; then break; fi
            sleep 3
          done
          curl -fsS --max-time 5 http://127.0.0.1:38082/health >/dev/null
          python3 - <<'PY'
          import json, subprocess
          ids=subprocess.check_output(['docker','compose','--env-file','.env','-f','compose.yaml','ps','-a','-q'],text=True).split()
          assert len(ids)==14, f'Expected 14 services, found {len(ids)}'
          for container in json.loads(subprocess.check_output(['docker','inspect',*ids])):
              name=container['Name'].lstrip('/');state=container['State']
              if name.startswith('traccar-bootstrap-'):
                  assert state['Status']=='exited' and state['ExitCode']==0, f'{name}: bootstrap did not complete'
              else:
                  assert state['Running'] and not state.get('Restarting'), f'{name}: not running'
                  assert state.get('Health',{}).get('Status','healthy')=='healthy', f'{name}: unhealthy'
              print(name, state['Status'])
          PY
          docker exec nats-argws-connect-develop wget -q -O /dev/null http://127.0.0.1:8222/healthz
          docker exec kafka-argws-connect-develop kafka-topics --bootstrap-server localhost:9092 --list >/dev/null
      - name: Remove only disposable full stack
        if: always()
        working-directory: deploy/develop/full-stack
        run: |
          if [ -f .env ]; then docker compose --env-file .env -f compose.yaml down --remove-orphans; fi
