name: Find Hub monitoring candidate validation
on:
  push:
    branches: [feat/findhub-monitoring-manager-parity]
    paths: [.github/workflows/findhub-monitoring-validation-temporary.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Verify and apply exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/findhub-monitoring-manager-parity
          git merge-base --is-ancestor 727479848a9a2cb5b3d5e41ad4ba37ac5325aafb HEAD
          git diff --exit-code 727479848a9a2cb5b3d5e41ad4ba37ac5325aafb HEAD -- . ':!.github/findhub-monitoring-staging' ':!.github/workflows/findhub-monitoring-validation-temporary.yml'
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          text = ''.join(Path(f'.github/findhub-monitoring-staging/part{i}.b64').read_text().strip() for i in range(8))
          assert len(text) == 56056, 'Staged source length mismatch'
          payload = base64.b64decode(text, validate=True)
          assert hashlib.sha256(payload).hexdigest() == 'aa63742c7e4558d55edaef65bb786707f079da91a1d5628cea75ff9bebc1cac4', 'Staged source integrity mismatch'
          Path('/tmp/findhub-monitoring.patch').write_bytes(lzma.decompress(payload))
          PY
          git apply --check /tmp/findhub-monitoring.patch
          git apply --index /tmp/findhub-monitoring.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/findhub-deployment.contract.test.cjs')
          source = path.read_text()
          changes = {
            '// The browser producer adds six paths; GET/PUT/DELETE share the Traccar path.': '// Monitoring adds five paths and six operations; settings and Traccar share method paths.',
            'assert.equal(implemented.length, 17);': 'assert.equal(implemented.length, 22);',
            'Object.keys(general.paths[route]).length, 0), 19);': 'Object.keys(general.paths[route]).length, 0), 25);',
          }
          for before, after in changes.items():
            assert source.count(before) == 1, before
            source = source.replace(before, after)
          marker = "  const start = dedicated.paths['/findhub/auth/start/{instanceName}'].post;"
          extra = """  for (const [route, methods] of [
              ['/findhub/settings/{instanceName}', ['get', 'put']],
              ['/findhub/device/{deviceId}/settings/{instanceName}', ['put']],
              ['/findhub/location/{deviceId}/{instanceName}', ['get']],
              ['/findhub/history/{deviceId}/{instanceName}', ['get']],
              ['/findhub/events/stream/{instanceName}', ['get']],
            ]) {
              assert.deepEqual(Object.keys(dedicated.paths[route]).sort(), methods, route);
              for (const method of methods) assert.deepEqual(dedicated.paths[route][method], general.paths[route][method], route);
            }
          """
          assert source.count(marker) == 1
          path.write_text(source.replace(marker, extra + marker))
          PY
      - name: Install existing API dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed owned TypeScript and validate all source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --cached --name-only --diff-filter=ACM | grep '^src/.*\.ts$')
          test "${#changed[@]}" -gt 0
          npx --no-install eslint --fix "${changed[@]}"
          npm run lint:check
          npm run docs:generate
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
      - name: Validate API contracts, isolation, tracking and build
        run: |
          set -euo pipefail
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit validated source only to isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/findhub-monitoring-manager-parity
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 727479848a9a2cb5b3d5e41ad4ba37ac5325aafb -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider src/api/integrations/channel/findhub/auth src/api/integrations/channel/findhub/crypto browser-extensions public/findhub-auth.zip package-lock.json .github/actions deploy
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'feat(findhub): add monitoring policies, scoped history and unified Manager navigation'
          git push origin "HEAD:refs/heads/$branch"
      - name: Archive exact candidate for review
        if: always()
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/findhub-monitoring-candidate.tar.gz
          git rev-parse HEAD > /tmp/findhub-monitoring-candidate.commit
          git diff --binary 727479848a9a2cb5b3d5e41ad4ba37ac5325aafb > /tmp/findhub-monitoring-candidate.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-monitoring-candidate
          path: |
            /tmp/findhub-monitoring-candidate.tar.gz
            /tmp/findhub-monitoring-candidate.commit
            /tmp/findhub-monitoring-candidate.patch
          retention-days: 7
