name: GHCR - Protected retention after publication
on:
  workflow_call:
    inputs:
      publication_sha:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      branch:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      apply:
        description: "Executar exclusões após validar publicação, inventário e proteções"
        type: boolean
        default: false
      publication_sha:
        description: "Commit publicado a validar; obrigatório no modo apply manual"
        required: false
permissions:
  contents: read
  actions: write
  packages: write
concurrency:
  group: argws-connect-protected-retention
  cancel-in-progress: false
jobs:
  retention:
    if: >-
      (inputs.branch == 'develop' || inputs.branch == 'main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Never execute PR code with package write credentials.
          ref: ${{ inputs.publication_sha || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Validate trusted source and canonical policy
        env:
          BRANCH: ${{ inputs.branch || github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" == develop || "$BRANCH" == main ]]
          python3 scripts/ghcr-retention.py --validate-policy
          python3 test/ghcr-retention.test.py
      - name: Clean stale Actions caches independently of GHCR inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_SHA: ${{ inputs.publication_sha || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          AUTOMATIC: ${{ inputs.branch != '' }}
          APPLY_REQUESTED: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          args=(--verified-sha "$PUBLISHED_SHA" --branch "$BRANCH" --output retention-cache/report.json)
          if [[ "$AUTOMATIC" == true ]]; then args+=(--source-run-id "$SOURCE_RUN_ID" --apply)
          elif [[ "$APPLY_REQUESTED" == true ]]; then args+=(--apply); fi
          python3 scripts/actions-cache-retention.py "${args[@]}"
      - name: Check image publication gate before registry enumeration
        id: image-gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_SHA: ${{ inputs.publication_sha || github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha || inputs.publication_sha || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          python3 - <<'PYGATE'
          import importlib.util, os
          spec=importlib.util.spec_from_file_location('retention','scripts/ghcr-retention.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          ready=module.verify_gate(os.environ['GITHUB_REPOSITORY'],os.environ['PUBLISHED_SHA'],os.environ['BRANCH'],os.environ['SOURCE_SHA'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('ready='+str(ready).lower()+'\n')
          print('Image retention gate:',ready,'(no waiting and no registry scan when blocked)')
          PYGATE
      - name: Single image inventory with protected plan before application
        if: steps.image-gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_SHA: ${{ inputs.publication_sha || github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha || inputs.publication_sha || github.sha }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || (inputs.branch != '' && vars.ARGWS_RETENTION_APPLY != 'false') }}
        run: |
          set -euo pipefail
          args=(--verified-sha "$PUBLISHED_SHA" --branch "$BRANCH" --source-sha "$SOURCE_SHA" --output retention-applied --images-only --max-seconds 480 --max-image-deletions 20)
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python3 -u scripts/ghcr-retention.py "${args[@]}"
      - name: Report maintenance outcome without hiding deferred work
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          report = Path('retention-applied/report.json')
          if report.exists():
            data = json.loads(report.read_text())
            line = f"GHCR retention: **{data.get('mode', 'unknown')}**, confirmed deletions: **{len(data.get('deleted', []))}**. " + data.get('reason', '')
          else:
            line = 'GHCR retention: gate blocked or execution failed before report. No completion claimed.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write(line + '\n\nActions cache has an independent report. Canonical images, Git tags and Releases remain protected.\n')
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retention-audit-${{ github.run_id }}
          path: |
            retention-cache/*.json
            retention-applied/*.json
          retention-days: 30
