name: Find Hub vault redirect validation
on:
  push:
    branches: [fix/findhub-vault-redirect-callback]
    paths: [.github/workflows/findhub-vault-validation-temporary.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Verify and apply exact local correction
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-vault-redirect-callback
          git merge-base --is-ancestor 9c8e3118965c3a01fbea16088ca8228255983154 HEAD
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          text=Path('.github/findhub-vault-correction.b64').read_text()
          assert hashlib.sha256(text.encode()).hexdigest() == '5d70206697f15762f75a66d6c6b728b73eaf88cb0fe047088db91b3335c5a51e', 'Unexpected staged transport'
          # Repair five transcription errors in transport; the tested payload digest remains unchanged.
          repairs=[(350,351,'W','S'),(2389,2390,'s',''),(2624,2625,'H','m'),(11496,11498,'DF',''),(13394,13394,'','9')]
          for start,end,old,new in reversed(repairs):
              assert text[start:end] == old
              text=text[:start]+new+text[end:]
          data=base64.b64decode(text,validate=True)
          assert hashlib.sha256(data).hexdigest() == '14ad585c73638e673a99276ae67d16a484fb4183a26ed98cc2a1b00c883a9596', 'Staged patch differs from tested source'
          Path('/tmp/findhub-vault.patch').write_bytes(gzip.decompress(data))
          PY
          git apply --check --unidiff-zero /tmp/findhub-vault.patch
          git apply --index --unidiff-zero /tmp/findhub-vault.patch
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
      - name: Install existing dependencies and validate complete API
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint:check
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit only validated source to work branch
        run: |
          set -euo pipefail
          branch=fix/findhub-vault-redirect-callback
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 9c8e3118965c3a01fbea16088ca8228255983154 -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions deploy
          git add -u
          git add browser-extensions/findhub-auth/vault-page.js browser-extensions/findhub-auth/vault-relay.js
          git add -f public/findhub-auth.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): bind vault callbacks across Google unlock redirects (0.1.5)'
          git push origin "HEAD:refs/heads/$branch"
      - name: Archive candidate and staged transport for integrity review
        if: always()
        run: |
          cp .github/findhub-vault-correction.b64 /tmp/staged-patch.b64
          git ls-files -z | tar --null -T - -czf /tmp/findhub-vault-candidate.tar.gz
          git rev-parse HEAD > /tmp/findhub-vault-candidate.commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-vault-candidate
          path: |
            /tmp/staged-patch.b64
            /tmp/findhub-vault-candidate.tar.gz
            /tmp/findhub-vault-candidate.commit
          retention-days: 7
