name: Find Hub vault redirect validation
on:
  push:
    branches: [fix/findhub-vault-redirect-callback]
    paths: [.github/workflows/findhub-vault-validation-temporary.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply independently tested cross-world ready handshake
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-vault-redirect-callback
          git merge-base --is-ancestor cc5413e6c69905ae5fc9325c88b867a7684a6eb6 HEAD
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          encoded=''
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest() == 'e8c3490f00ca48d9ade405a944225f32ed21539b6c953df78ccaf20e21cf19f7'
          Path('/tmp/findhub-ready.patch').write_bytes(gzip.decompress(data))
          PY
          git apply --check /tmp/findhub-ready.patch
          git apply --index /tmp/findhub-ready.patch
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
      - name: Validate complete API and all compatibility regressions
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint:check
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit only validated source to work branch
        run: |
          set -euo pipefail
          branch=fix/findhub-vault-redirect-callback
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 9c8e3118965c3a01fbea16088ca8228255983154 -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions deploy
          git add -u
          git add -f public/findhub-auth.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): synchronize vault worlds without execution-order assumptions'
          git push origin "HEAD:refs/heads/$branch"
      - name: Archive exact candidate for review
        if: always()
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/findhub-vault-candidate.tar.gz
          git rev-parse HEAD > /tmp/findhub-vault-candidate.commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-vault-candidate
          path: |
            /tmp/findhub-vault-candidate.tar.gz
            /tmp/findhub-vault-candidate.commit
          retention-days: 7
