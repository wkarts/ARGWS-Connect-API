name: Reconcile main release policy into develop
on:
  push:
    branches: [work/speech-promotion-review-20261010]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/sync-main-to-develop-for-release-20261010
          fetch-depth: 0
      - name: Reconcile main into develop with explicit conflict policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d3c1ab00e5316976a34636f0dd1b6d0828b6d1b5
          git fetch origin main
          test "$(git rev-parse origin/main)" = cc9ffbd2663d2f23ec21e4d853b2788fa703b249
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          echo "Merge state=$status"
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'Conflicts: %s\n' "${conflicts[*]}"
          if [ "${#conflicts[@]}" -gt 0 ]; then
            for file in "${conflicts[@]}"; do
              case "$file" in
                env.example|.env.example|deploy/*/env.example|deploy/*/.env.example|deploy/fersoft/*/env.example|docs/guides/speech-worker-diagnostics.md)
                  # The develop examples disable speech by default and already include the RabbitMQ healthcheck parameters.
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "Unexpected conflict, refusing speculative resolution: $file" >&2
                  exit 1
                  ;;
              esac
            done
          fi
          test -z "$(git ls-files -u)"
          test -f .github/RELEASE_HOLD.md
          test -f .github/scripts/release-publication-policy.py
          test -f test/release-publication-policy.test.py
          test -f transcription-service/Dockerfile
          test ! -d transcription-worker
          grep -Fq 'needs.validate.outputs.publish' .github/workflows/auto-version-release.yml
          grep -Fq 'release-publication-policy.py' .github/workflows/auto-version-release.yml
          grep -Fq 'component: [api, manager, docs, transcription-service]' .github/workflows/auto-version-release.yml
          ! grep -Fq 'transcription-worker' .github/workflows/auto-version-release.yml
          python3 - <<'PY'
          import re
          from pathlib import Path
          names=['.env.example','env.example','deploy/production/env.example',
            'deploy/develop/env.example','deploy/fersoft/production/env.example','deploy/fersoft/develop/env.example']
          for p in names:
              s=Path(p).read_text()
              vals=dict(re.findall(r'^([A-Z_]+)=(.*)$',s,re.M))
              for k in ('SPEECH_ENABLED','TRANSCRIPTION_ENABLED','DICTATION_ENABLED','MANAGER_FEATURE_TRANSCRIPTION'):
                  assert vals.get(k)=='false',(p,k,vals.get(k))
              assert 'transcription' not in vals.get('COMPOSE_PROFILES','').split(','),p
              assert vals.get('RABBITMQ_HEALTHCHECK_CONNECT_TIMEOUT')=='2',p
          PY
          python3 test/rabbitmq-healthcheck.test.py
          python3 test/speech-service-deployment.test.py
          python3 test/release-publication-policy.test.py
          python3 scripts/sync-fersoft-deployments.py --check
          git diff --cached --check
          git status --short
          git commit -m "chore(release): reconcile main guards with native speech develop"
          test "$(git show -s --format=%P HEAD | wc -w)" = 2
          mkdir -p /tmp/merged-artifact
          git diff --name-only HEAD^1 HEAD > /tmp/merged-artifact/files.txt
          git diff --binary HEAD^1 HEAD > /tmp/merged-artifact/merge.patch
          git show --format='' --name-only HEAD | head -n 100
          git show -s --format='%H%n%P%n%T' HEAD > /tmp/merged-artifact/commit-data.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, subprocess
          paths=Path('/tmp/merged-artifact/files.txt').read_text().splitlines()
          payload=[]
          for path in paths:
              p=Path(path)
              if not p.is_file():raise RuntimeError('No regular file for: '+path)
              data=p.read_bytes()
              payload.append({'path':path,'sha256':hashlib.sha256(data).hexdigest(),'content':data.decode('utf8')})
          Path('/tmp/merged-artifact/files.json').write_text(json.dumps(payload))
          PY
      - name: Record exactly reviewed Git tree object without updating refs
        env:
          OBJECT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, json, urllib.request
          from pathlib import Path
          changes=json.loads(Path('/tmp/merged-artifact/files.json').read_text())
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          base=git('rev-parse','HEAD^1^{tree}')
          expected=git('rev-parse','HEAD^{tree}')
          objects=[]
          for obj in changes:
              mode=git('ls-files','-s','--',obj['path']).split()[0]
              objects.append({'path':obj['path'],'mode':mode,'type':'blob','content':obj['content']})
          payload=json.dumps({'base_tree':base,'tree':objects},ensure_ascii=False).encode()
          request=urllib.request.Request(
            'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',
            data=payload,method='POST',
            headers={'Authorization':'Bearer '+os.environ['OBJECT_TOKEN'],
                     'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=55) as response:
              result=json.load(response)
          assert result['sha']==expected,(result['sha'],expected)
          print('Verified remote merge tree:', result['sha'])
          print('Parents:',git('rev-parse','HEAD^1'),git('rev-parse','HEAD^2'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-merged-main-protections
          path: /tmp/merged-artifact/
          retention-days: 2
          if-no-files-found: error
