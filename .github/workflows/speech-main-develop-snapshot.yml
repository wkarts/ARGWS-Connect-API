name: Check develop to main merge conflicts
on:
  push:
    branches: [work/speech-promotion-review-20261010]
permissions:
  contents: read
jobs:
  conflicts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d3c1ab00e5316976a34636f0dd1b6d0828b6d1b5
          fetch-depth: 0
          persist-credentials: false
      - name: Inventory differences without changing develop/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cc9ffbd2663d2f23ec21e4d853b2788fa703b249
          git config user.name 'CI conflict review'
          git config user.email 'ci-review@example.invalid'
          set +e
          git merge --no-commit --no-ff --no-edit cc9ffbd2663d2f23ec21e4d853b2788fa703b249 > /tmp/merge-output.txt 2>&1
          code=$?
          set -e
          mkdir -p /tmp/merge-report
          cat /tmp/merge-output.txt
          git diff --name-only --diff-filter=U | tee /tmp/merge-report/conflicts.txt
          git ls-files -u | awk '{print $4}' | sort -u > /tmp/merge-report/unmerged-files.txt
          git status --short > /tmp/merge-report/status.txt
          echo "git-merge-exit=$code" >> /tmp/merge-report/result.txt
          echo "unmerged-count=$(wc -l < /tmp/merge-report/unmerged-files.txt)" >> /tmp/merge-report/result.txt
          echo "base-develop=d3c1ab00e5316976a34636f0dd1b6d0828b6d1b5" >> /tmp/merge-report/result.txt
          echo "base-main=cc9ffbd2663d2f23ec21e4d853b2788fa703b249" >> /tmp/merge-report/result.txt
          git merge --abort || true
      - uses: actions/upload-artifact@v4
        with:
          name: develop-main-merge-conflicts
          path: /tmp/merge-report/
          retention-days: 2
          if-no-files-found: error
