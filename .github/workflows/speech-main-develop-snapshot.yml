name: Prepare reviewed native speech promotion
on:
  push:
    branches: [work/speech-promotion-review-20261010]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_PROVIDER: postgresql
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/speech-promotion-review-20261010
          path: author
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: fix/native-transcription-main-20261010
          path: candidate
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          ref: d3c1ab00e5316976a34636f0dd1b6d0828b6d1b5
          path: develop
          persist-credentials: false
      - name: Verify source commits and parser preconditions
        run: |
          test "$(git -C candidate rev-parse HEAD)" = cc9ffbd2663d2f23ec21e4d853b2788fa703b249
          test "$(git -C develop rev-parse HEAD)" = d3c1ab00e5316976a34636f0dd1b6d0828b6d1b5
          python3 -c 'import yaml'
      - name: Apply reviewed speech-only promotion, retain main release hold and RabbitMQ
        run: python3 author/.github/speech-promotion/align-main.py candidate develop
      - name: Validate deployment contracts before building
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 test/speech-service-deployment.test.py
          python3 test/compose-env-only-deployments.test.py
          python3 test/deploy-operations.test.py
          python3 scripts/sync-fersoft-deployments.py --check
          python3 scripts/sync-operations-deployments.py --check
          python3 test/rabbitmq-healthcheck.test.py
          node --test test/release-version.test.cjs
          python3 test/release-publication-policy.test.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install and validate API, docs, native speech and Manager
        working-directory: candidate
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm ci --no-audit --no-fund
          npm run lint:check
          npm run db:generate
          npm run build
          npm run docs:generate
          npm run docs:check
          npm ci --prefix transcription-service --ignore-scripts --no-audit --no-fund
          npm test --prefix transcription-service
          npm --prefix manager install --ignore-scripts --no-audit --no-fund
          MANAGER_BUILD_MODE=production npm --prefix manager run test
      - name: Stage reviewed candidate and protect current main
        working-directory: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add -u
          python3 - <<'PY'
          import subprocess
          candidates=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          prefixes=('transcription-service/','deploy/speech/','test/helpers/','test/fixtures/speech-protected-deployments.json',
            'prisma/mysql-migrations/20261007193000_speech_durable_pool/','prisma/postgresql-migrations/20261007193000_speech_durable_pool/',
            'src/api/routes/speech-upload.middleware.ts','src/api/services/speech-','docs/guides/optional-transcription-service.md',
            'scripts/speech-model','.github/actions/speech-native-smoke/','.github/scripts/preserve-speech-evidence.cjs','.github/scripts/test-rabbitmq-startup.cjs',
            '.github/workflows/speech-integrity.yml','.github/workflows/transcription-service.yml',
            'manager/src/services/retry-after.ts','manager/src/services/speech-status.ts','test/speech')
          safe=[p for p in candidates if p.startswith(prefixes) and
                not any(part in ('node_modules','dist','.cache','build') for part in p.split('/'))]
          explicit=['test/speech-service-deployment.test.py','test/speech-ci-evidence.test.cjs',
            'test/speech-durable.integration.test.ts','test/speech-source-storage.test.ts',
            'test/speech-storage.integration.test.ts','test/helpers/speech-fixture.ts','test/fixtures/speech-protected-deployments.json']
          required=sorted(set(safe+explicit))
          subprocess.run(['git','add','-f','--',*required],check=True)
          print('Staged reviewed new sources:',len(required))
          PY
          git diff --cached --check
          git diff --quiet -- .github/RELEASE_HOLD.md
          git diff --quiet -- .github/scripts/release-publication-policy.py
          test -f .github/RELEASE_HOLD.md
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/auto-version-release.yml').read_text()
          assert 'release-publication-policy.py' in text and 'needs.validate.outputs.publish' in text
          assert 'component: [api, manager, docs, transcription-service]' in text
          assert 'argws-connect-transcription-worker' not in text
          PY
          git status --short
          python3 - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          base=git('rev-parse','HEAD')
          assert base=='cc9ffbd2663d2f23ec21e4d853b2788fa703b249'
          local_tree=git('write-tree')
          base_tree=git('rev-parse','HEAD^{tree}')
          changes=[x for x in subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\\0') if x]
          entries=[]
          for p in changes:
              line=git('ls-files','-s','--',p)
              if not line:
                  entries.append({'path':p,'mode':'100644','type':'blob','sha':None})
                  continue
              mode,sha,stage_path=line.split(None,2)
              assert stage_path.startswith('0\\t'),(p,stage_path)
              dev=subprocess.run(['git','-C','../develop','rev-parse','HEAD:'+p],capture_output=True,text=True)
              if dev.returncode==0 and dev.stdout.strip()==sha:
                  entries.append({'path':p,'mode':mode,'type':'blob','sha':sha})
              else:
                  content=subprocess.check_output(['git','show',':'+p]).decode('utf-8')
                  entries.append({'path':p,'mode':mode,'type':'blob','content':content})
          assert len(entries)>80 and any(x['path']=='transcription-service/src/service.js' for x in entries),len(entries)
          payload=json.dumps({'base_tree':base_tree,'tree':entries},ensure_ascii=False).encode('utf-8')
          print('Reviewed tree entries:',len(entries),'payload bytes:',len(payload))
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',
              data=payload,method='POST',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
              'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as response:
              remote=json.load(response)
          assert remote['sha']==local_tree,(remote['sha'],local_tree)
          print('CANDIDATE_REMOTE_TREE',remote['sha'])
          out=Path(os.environ['RUNNER_TEMP'])/'speech-candidate';out.mkdir(exist_ok=True)
          (out/'reviewed-tree.json').write_text(json.dumps({'main':base,'develop':'d3c1ab00e5316976a34636f0dd1b6d0828b6d1b5',
              'tree':remote['sha'],'files':len(entries),'paths':changes},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-speech-reviewed-main-tree
          path: ${{ runner.temp }}/speech-candidate/reviewed-tree.json
          retention-days: 2
          if-no-files-found: error
