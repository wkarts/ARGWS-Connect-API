name: Find Hub response correction validation
on:
  push:
    branches: [fix/findhub-auth-response-release]
    paths: [.github/workflows/findhub-response-analysis-temporary.yml]
permissions:
  contents: write
jobs:
  correction:
    if: github.ref == 'refs/heads/fix/findhub-auth-response-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply exact source patch on isolated branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-auth-response-release
          git merge-base --is-ancestor 344748651c24b89f7bd990cb1b1d985073acd9f9 HEAD
          test -z "$(git diff --name-only 344748651c24b89f7bd990cb1b1d985073acd9f9 HEAD -- . ':!.github/workflows/findhub-response-analysis-temporary.yml' ':!.github/findhub-response-correction')"
          cat .github/findhub-response-correction/part{0..1} > /tmp/findhub-response.xz
          echo 'ce7a23b1343e2a7653665a1c818c139cc4250c5c80affb8fa418dafe31567fb1  /tmp/findhub-response.xz' | sha256sum --check
          xz -dc /tmp/findhub-response.xz > /tmp/findhub-response.patch
          git apply --check /tmp/findhub-response.patch
          git apply --index /tmp/findhub-response.patch
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
      - name: Install unchanged API dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate source, contracts, release and complete API build
        run: |
          set -euo pipefail
          npm run lint:check
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          node --test test/release-version.test.cjs test/release-web-security.test.cjs
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit validated source only on work branch
        run: |
          set -euo pipefail
          branch=fix/findhub-auth-response-release
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 344748651c24b89f7bd990cb1b1d985073acd9f9 -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions deploy docker-compose.yaml docker-compose.dev.yaml
          git rm -r .github/findhub-response-correction .github/workflows/findhub-response-analysis-temporary.yml
          git add -u
          git add -f public/findhub-auth.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): use registered Google identity and build Windows extension distribution'
          git push origin "HEAD:refs/heads/$branch"
      - name: Package tracked candidate for local verification
        if: always()
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf /tmp/findhub-response-source.tar.gz
          git rev-parse HEAD > /tmp/findhub-response.commit
          git diff --binary 344748651c24b89f7bd990cb1b1d985073acd9f9 > /tmp/findhub-response.patch
          cp public/findhub-auth.zip /tmp/Connect-FindHub-Auth-0.1.2.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-response-review
          path: |
            /tmp/findhub-response-source.tar.gz
            /tmp/findhub-response.commit
            /tmp/findhub-response.patch
            /tmp/Connect-FindHub-Auth-0.1.2.zip
          retention-days: 2
