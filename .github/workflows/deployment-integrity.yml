name: Deployment Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  compose:
    name: Compose / Single Port / Local Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare example environments
        run: |
          cp env.example .env
          cp deploy/cloudpanel/env.example deploy/cloudpanel/.env
          cp deploy/dockge/env.example deploy/dockge/.env
          cp deploy/production/env.example deploy/production/.env
          cp deploy/homologation/env.example deploy/homologation/.env

      - name: Validate Compose files
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yaml config >/dev/null
          docker compose -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose -f deploy/dockge/compose.yaml config >/dev/null
          docker compose -f deploy/production/compose.yaml config >/dev/null
          docker compose -f deploy/homologation/compose.yaml config >/dev/null
          docker compose --profile '*' -f docker-compose.yaml config >/dev/null
          docker compose --profile '*' -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose --profile '*' -f deploy/dockge/compose.yaml config >/dev/null
          docker compose --profile '*' -f deploy/production/compose.yaml config >/dev/null
          docker compose --profile '*' -f deploy/homologation/compose.yaml config >/dev/null

      - name: Enforce single-port deployment contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess

          extended_compose_files = [
              "docker-compose.yaml",
              "deploy/cloudpanel/docker-compose.yml",
              "deploy/dockge/compose.yaml",
          ]
          canonical_compose_files = [
              "deploy/production/compose.yaml",
              "deploy/homologation/compose.yaml",
          ]

          core = {"api", "postgres", "redis", "rabbitmq", "minio"}
          extended_optional = {"mysql", "nats", "zookeeper", "kafka"}
          canonical_optional = {"nats", "zookeeper", "kafka"}

          def compose_json(path: str, profiles: bool = False):
              cmd = ["docker", "compose"]
              if profiles:
                  cmd += ["--profile", "*"]
              cmd += ["-f", path, "config", "--format", "json"]
              return json.loads(subprocess.check_output(cmd, text=True))

          parsed_full = {}

          for compose_file in extended_compose_files:
              data = compose_json(compose_file, profiles=True)
              parsed_full[compose_file] = data
              services = set(data["services"])
              missing = (core | extended_optional) - services
              assert not missing, f"{compose_file}: services ausentes: {sorted(missing)}"

          for compose_file in canonical_compose_files:
              default_data = compose_json(compose_file, profiles=False)
              default_services = set(default_data["services"])
              assert default_services == core, (
                  f"{compose_file}: sem profiles deve subir apenas core {sorted(core)}, "
                  f"encontrado {sorted(default_services)}"
              )

              full_data = compose_json(compose_file, profiles=True)
              full_services = set(full_data["services"])
              expected = core | canonical_optional
              assert full_services == expected, (
                  f"{compose_file}: com profiles deve conter {sorted(expected)}, "
                  f"encontrado {sorted(full_services)}"
              )
              parsed_full[compose_file] = full_data

          for compose_file, data in parsed_full.items():
              services = data["services"]
              assert "manager" not in services, f"{compose_file}: manager separado nao e permitido"
              published = [name for name, cfg in services.items() if cfg.get("ports")]
              assert published == ["api"], f"{compose_file}: somente api pode publicar porta: {published}"
              api_ports = services["api"]["ports"]
              assert len(api_ports) == 1, f"{compose_file}: API deve publicar exatamente uma porta"
              assert int(api_ports[0]["target"]) == 8080, f"{compose_file}: target interno da API deve ser 8080"
              api_env = services["api"].get("environment", {})
              assert str(api_env.get("SERVER_PORT")) == "8080", f"{compose_file}: SERVER_PORT interno deve ser 8080"
              for service_name, cfg in services.items():
                  for mount in cfg.get("volumes", []):
                      assert mount.get("type") == "bind", f"{compose_file}: {service_name} usa volume nao-bind"
                  image = cfg.get("image", "")
                  assert image.startswith("ghcr.io/wkarts/"), f"{compose_file}: imagem fora do GHCR: {image}"

          prod = parsed_full["deploy/production/compose.yaml"]
          homolog = parsed_full["deploy/homologation/compose.yaml"]
          prod_port = int(prod["services"]["api"]["ports"][0]["published"])
          homolog_port = int(homolog["services"]["api"]["ports"][0]["published"])
          assert prod_port == 38080, f"producao: porta default deve ser 38080, encontrada {prod_port}"
          assert homolog_port == 38081, f"homologacao: porta default deve ser 38081, encontrada {homolog_port}"
          assert prod_port != homolog_port, "producao e homologacao nao podem publicar a mesma porta"
          assert prod.get("name") != homolog.get("name"), "producao e homologacao precisam de project names diferentes"

          for compose_file in canonical_compose_files:
              services = parsed_full[compose_file]["services"]
              fixed_names = [name for name, cfg in services.items() if cfg.get("container_name")]
              assert not fixed_names, f"{compose_file}: container_name fixo impede coexistencia: {fixed_names}"

          # Política de promoção: homologação acompanha latest; produção fica em SemVer promovida.
          homolog_image = homolog["services"]["api"]["image"]
          prod_image = prod["services"]["api"]["image"]
          assert homolog_image == "ghcr.io/wkarts/argws-connect-api:latest", (
              f"homologacao deve usar :latest, encontrado {homolog_image}"
          )
          assert re.fullmatch(r"ghcr\.io/wkarts/argws-connect-api:\d+\.\d+\.\d+", prod_image), (
              f"producao deve usar tag SemVer imutavel, encontrado {prod_image}"
          )

          print(f"Deployment contract OK | homolog={homolog_image} | production={prod_image}")
          PY

      - name: Validate environment contracts
        shell: bash
        run: |
          set -euo pipefail
          cmp -s env.example .env.example
          cmp -s env.example deploy/cloudpanel/env.example
          cmp -s env.example deploy/cloudpanel/.env.example
          cmp -s env.example deploy/dockge/env.example
          cmp -s env.example deploy/dockge/.env.example

          python - <<'PY'
          from pathlib import Path

          def values(path: str):
              result = {}
              for raw in Path(path).read_text().splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  result[key] = value
              return result

          prod_values = values('deploy/production/env.example')
          homolog_values = values('deploy/homologation/env.example')
          prod = set(prod_values)
          homolog = set(homolog_values)
          assert prod == homolog, (
              f"env production/homologation divergentes; "
              f"somente prod={sorted(prod-homolog)}, somente homolog={sorted(homolog-prod)}"
          )

          required = {
              'COMPOSE_PROJECT_NAME', 'COMPOSE_PROFILES', 'ARGWS_CONNECT_NETWORK_NAME',
              'ARGWS_CONNECT_BIND_ADDRESS', 'ARGWS_CONNECT_API_HOST_PORT',
              'ARGWS_CONNECT_API_IMAGE', 'DATABASE_PROVIDER', 'DATABASE_CONNECTION_URI',
              'POSTGRES_PASSWORD', 'REDIS_PASSWORD', 'RABBITMQ_DEFAULT_PASS',
              'MINIO_ROOT_PASSWORD', 'AUTHENTICATION_API_KEY', 'SERVER_PORT', 'SERVER_URL',
              'ARGWS_CONNECT_NATS_IMAGE', 'ARGWS_CONNECT_KAFKA_IMAGE',
              'ARGWS_CONNECT_ZOOKEEPER_IMAGE', 'NATS_ENABLED', 'KAFKA_ENABLED',
          }
          missing = required - prod
          assert not missing, f"variaveis obrigatorias ausentes: {sorted(missing)}"
          assert homolog_values['ARGWS_CONNECT_API_IMAGE'].endswith(':latest')
          assert not prod_values['ARGWS_CONNECT_API_IMAGE'].endswith(':latest')
          assert ':homolog' not in homolog_values['ARGWS_CONNECT_API_IMAGE']
          assert ':production' not in prod_values['ARGWS_CONNECT_API_IMAGE']
          print(f"Production/Homologation env parity OK: {len(prod)} keys")
          PY

      - name: Validate deployment scripts
        run: |
          set -euo pipefail
          for dir in deploy/production deploy/homologation; do
            for script in prepare-env.sh deploy.sh update.sh status.sh preflight.sh registry-login.sh; do
              test -x "$dir/$script"
              bash -n "$dir/$script"
            done
            test -f "$dir/nginx-location.conf.example"
            test -f "$dir/README.md"
          done

      - name: Reject environment-specific tags in image publishing
        run: |
          set -euo pipefail
          if grep -nE 'ghcr\.io/.*/argws-connect-(api|manager):(homolog|production)([[:space:]]|$)' \
            .github/workflows/ghcr-publish-application.yml; then
            echo "Tags de ambiente sao proibidas. Use :latest para homologacao e SemVer para producao." >&2
            exit 1
          fi

      - name: Login GHCR for image availability checks
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify runtime images exist
        shell: bash
        run: |
          set -euo pipefail
          prod_image="$(grep '^ARGWS_CONNECT_API_IMAGE=' deploy/production/env.example | cut -d= -f2-)"
          for image in \
            ghcr.io/wkarts/argws-connect-api:latest \
            "$prod_image" \
            ghcr.io/wkarts/argws-connect-postgres:15 \
            ghcr.io/wkarts/argws-connect-redis:latest \
            ghcr.io/wkarts/argws-connect-rabbitmq:management \
            ghcr.io/wkarts/argws-connect-minio:latest \
            ghcr.io/wkarts/argws-connect-nats:2.10-alpine \
            ghcr.io/wkarts/argws-connect-kafka:7.5.0 \
            ghcr.io/wkarts/argws-connect-zookeeper:7.5.0; do
            echo "Checking $image"
            docker manifest inspect "$image" >/dev/null
          done
