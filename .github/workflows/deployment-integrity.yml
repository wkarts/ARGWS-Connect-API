name: Deployment Integrity

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: read

jobs:
  compose:
    name: Official Stacks / Services / API + DOCs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare official environments
        run: |
          cp deploy/production/env.example deploy/production/.env
          cp deploy/develop/env.example deploy/develop/.env
          cp deploy/canonical/env.example deploy/canonical/.env
          cp deploy/homologation/env.example deploy/homologation/.env
          cp deploy/cloudpanel/env.example deploy/cloudpanel/.env
          cp deploy/dockge/env.example deploy/dockge/.env

      - name: Validate Compose syntax
        run: |
          set -euo pipefail
          for stack in production develop canonical homologation; do
            compose_file="deploy/${stack}/compose.yaml"
            docker compose -f "$compose_file" config >/dev/null
            docker compose --profile '*' -f "$compose_file" config >/dev/null
          done
          docker compose -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose --profile '*' -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose -f deploy/dockge/compose.yaml config >/dev/null
          docker compose --profile '*' -f deploy/dockge/compose.yaml config >/dev/null

      - name: Enforce official deployment contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          stacks = {
              'production': {
                  'port': 38080,
                  'docs_port': 38180,
                  'image': 'ghcr.io/wkarts/argws-connect-api:latest',
                  'docs_image': 'ghcr.io/wkarts/argws-connect-docs:latest',
                  'url': 'https://api.connect.argws.com.br',
              },
              'develop': {
                  'port': 38082,
                  'docs_port': 38182,
                  'image': 'ghcr.io/wkarts/argws-connect-api:develop',
                  'docs_image': 'ghcr.io/wkarts/argws-connect-docs:develop',
                  'url': 'https://d.api.connect.argws.com.br',
              },
              'canonical': {
                  'port': 38083,
                  'docs_port': 38183,
                  'image_regex': r'ghcr\.io/wkarts/argws-connect-api:\d+\.\d+\.\d+',
                  'docs_image_regex': r'ghcr\.io/wkarts/argws-connect-docs:\d+\.\d+\.\d+',
                  'url': 'https://c.api.connect.argws.com.br',
              },
          }
          core_resources = ('api', 'docs', 'postgres', 'redis', 'rabbitmq', 'minio')
          optional_resources = ('nats', 'zookeeper', 'kafka')
          infra_images = {
              'postgres': 'ghcr.io/wkarts/argws-connect-postgres:15',
              'redis': 'ghcr.io/wkarts/argws-connect-redis:latest',
              'rabbitmq': 'ghcr.io/wkarts/argws-connect-rabbitmq:management',
              'minio': 'ghcr.io/wkarts/argws-connect-minio:latest',
              'nats': 'ghcr.io/wkarts/argws-connect-nats:2.10-alpine',
              'zookeeper': 'ghcr.io/wkarts/argws-connect-zookeeper:7.5.0',
              'kafka': 'ghcr.io/wkarts/argws-connect-kafka:7.5.0',
          }

          def env_values(path):
              values = {}
              for raw in Path(path).read_text().splitlines():
                  line = raw.strip()
                  if line and not line.startswith('#') and '=' in line:
                      key, value = line.split('=', 1)
                      values[key] = value
              return values

          for stack, contract in stacks.items():
              compose_path = f'deploy/{stack}/compose.yaml'
              env_path = f'deploy/{stack}/env.example'
              env = env_values(env_path)

              def compose_json(all_profiles=False):
                  cmd = ['docker', 'compose']
                  if all_profiles:
                      cmd += ['--profile', '*']
                  cmd += ['-f', compose_path, 'config', '--format', 'json']
                  return json.loads(subprocess.check_output(cmd, text=True))

              default = compose_json(False)
              full = compose_json(True)
              suffix = f'argws-connect-{stack}'
              core = {f'{r}-{suffix}' for r in core_resources}
              optional = {f'{r}-{suffix}' for r in optional_resources}

              assert set(default['services']) == core, (
                  f'{stack}: core incorreto: {sorted(default["services"])}'
              )
              assert set(full['services']) == core | optional, (
                  f'{stack}: services completos incorretos: {sorted(full["services"])}'
              )

              for service_name, cfg in full['services'].items():
                  assert cfg.get('container_name') == service_name, (
                      f'{stack}: container_name deve ser igual ao service: {service_name}'
                  )
                  ports = cfg.get('ports', [])
                  if service_name == f'api-{suffix}':
                      assert len(ports) == 1, f'{stack}: API deve publicar exatamente uma porta'
                      assert int(ports[0]['target']) == 8080, f'{stack}: target API deve ser 8080'
                      assert int(ports[0]['published']) == contract['port'], (
                          f'{stack}: porta API esperada {contract["port"]}'
                      )
                  elif service_name == f'docs-{suffix}':
                      assert len(ports) == 1, f'{stack}: DOCs deve publicar exatamente uma porta'
                      assert int(ports[0]['target']) == 8080, f'{stack}: target DOCs deve ser 8080'
                      assert int(ports[0]['published']) == contract['docs_port'], (
                          f'{stack}: porta DOCs esperada {contract["docs_port"]}'
                      )
                  else:
                      assert not ports, f'{stack}: infraestrutura não pode publicar porta: {service_name}'

                  for mount in cfg.get('volumes', []):
                      assert mount.get('type') == 'bind', f'{stack}: {service_name} deve usar bind mount'

              api_service = full['services'][f'api-{suffix}']
              api_image = api_service['image']
              if 'image' in contract:
                  assert api_image == contract['image'], f'{stack}: imagem API incorreta: {api_image}'
              else:
                  assert re.fullmatch(contract['image_regex'], api_image), (
                      f'{stack}: canonical deve usar SemVer: {api_image}'
                  )

              docs_service = full['services'][f'docs-{suffix}']
              docs_image = docs_service['image']
              if 'docs_image' in contract:
                  assert docs_image == contract['docs_image'], f'{stack}: imagem DOCs incorreta: {docs_image}'
              else:
                  assert re.fullmatch(contract['docs_image_regex'], docs_image), (
                      f'{stack}: canonical DOCs deve usar SemVer: {docs_image}'
                  )
                  assert api_image.rsplit(':', 1)[1] == docs_image.rsplit(':', 1)[1], (
                      f'{stack}: API e DOCs canonical devem usar a mesma SemVer'
                  )

              for resource, expected_image in infra_images.items():
                  service = full['services'][f'{resource}-{suffix}']
                  assert service['image'] == expected_image, (
                      f'{stack}: imagem de {resource} deve ser global no GHCR: {service["image"]}'
                  )

              assert env['COMPOSE_PROJECT_NAME'] == suffix
              assert env['ARGWS_CONNECT_NETWORK_NAME'] == f'{suffix}-net'
              assert int(env['ARGWS_CONNECT_API_HOST_PORT']) == contract['port']
              assert int(env['ARGWS_CONNECT_DOCS_HOST_PORT']) == contract['docs_port']
              assert env['SERVER_URL'] == contract['url']

              raw_compose = Path(compose_path).read_text()
              assert 'pg_isready -U \\"$${POSTGRES_USER}\\" -d \\"$${POSTGRES_DB}\\"' in raw_compose, (
                  f'{stack}: healthcheck PostgreSQL deve expandir POSTGRES_USER/POSTGRES_DB no container'
              )
              assert "'$${POSTGRES_USER}'" not in raw_compose

          print('Official deployment contract OK')
          PY

      - name: Validate environment parity and image channels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def values(path):
              out = {}
              for raw in Path(path).read_text().splitlines():
                  line = raw.strip()
                  if line and not line.startswith('#') and '=' in line:
                      k, v = line.split('=', 1)
                      out[k] = v
              return out

          prod = values('deploy/production/env.example')
          dev = values('deploy/develop/env.example')
          canonical = values('deploy/canonical/env.example')

          required = {
              'COMPOSE_PROJECT_NAME', 'ARGWS_CONNECT_NETWORK_NAME', 'ARGWS_CONNECT_API_HOST_PORT',
              'ARGWS_CONNECT_DOCS_HOST_PORT', 'ARGWS_CONNECT_API_IMAGE', 'ARGWS_CONNECT_DOCS_IMAGE', 'ARGWS_CONNECT_POSTGRES_IMAGE', 'ARGWS_CONNECT_REDIS_IMAGE',
              'ARGWS_CONNECT_RABBITMQ_IMAGE', 'ARGWS_CONNECT_MINIO_IMAGE', 'SERVER_URL',
              'DATABASE_CONNECTION_URI', 'CACHE_REDIS_URI', 'RABBITMQ_URI', 'S3_ENDPOINT',
              'POSTGRES_PASSWORD', 'REDIS_PASSWORD', 'RABBITMQ_DEFAULT_PASS', 'MINIO_ROOT_PASSWORD',
          }
          for name, env in [('production', prod), ('develop', dev), ('canonical', canonical)]:
              missing = required - set(env)
              assert not missing, f'{name}: variaveis ausentes: {sorted(missing)}'

          assert prod['ARGWS_CONNECT_API_IMAGE'] == 'ghcr.io/wkarts/argws-connect-api:latest'
          assert prod['ARGWS_CONNECT_DOCS_IMAGE'] == 'ghcr.io/wkarts/argws-connect-docs:latest'
          assert dev['ARGWS_CONNECT_API_IMAGE'] == 'ghcr.io/wkarts/argws-connect-api:develop'
          assert dev['ARGWS_CONNECT_DOCS_IMAGE'] == 'ghcr.io/wkarts/argws-connect-docs:develop'
          assert re.fullmatch(r'ghcr\.io/wkarts/argws-connect-api:\d+\.\d+\.\d+', canonical['ARGWS_CONNECT_API_IMAGE'])
          assert re.fullmatch(r'ghcr\.io/wkarts/argws-connect-docs:\d+\.\d+\.\d+', canonical['ARGWS_CONNECT_DOCS_IMAGE'])
          assert canonical['ARGWS_CONNECT_API_IMAGE'].rsplit(':',1)[1] == canonical['ARGWS_CONNECT_DOCS_IMAGE'].rsplit(':',1)[1]

          for env in (prod, dev, canonical):
              assert env['ARGWS_CONNECT_POSTGRES_IMAGE'] == 'ghcr.io/wkarts/argws-connect-postgres:15'
              assert env['ARGWS_CONNECT_REDIS_IMAGE'] == 'ghcr.io/wkarts/argws-connect-redis:latest'
              assert env['ARGWS_CONNECT_RABBITMQ_IMAGE'] == 'ghcr.io/wkarts/argws-connect-rabbitmq:management'
              assert env['ARGWS_CONNECT_MINIO_IMAGE'] == 'ghcr.io/wkarts/argws-connect-minio:latest'

          print('Environment channels OK')
          PY

      - name: Validate homologation, CloudPanel and Dockge DOCs contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          cases = [
              ('homologation', 'deploy/homologation/compose.yaml', 'deploy/homologation/env.example', 'docs', 38181, 'ghcr.io/wkarts/argws-connect-docs:develop'),
              ('cloudpanel', 'deploy/cloudpanel/docker-compose.yml', 'deploy/cloudpanel/env.example', 'docs', 38180, 'ghcr.io/wkarts/argws-connect-docs:latest'),
              ('dockge', 'deploy/dockge/compose.yaml', 'deploy/dockge/env.example', 'docs', 38180, 'ghcr.io/wkarts/argws-connect-docs:latest'),
          ]
          def env_values(path):
              out = {}
              for raw in Path(path).read_text().splitlines():
                  line = raw.strip()
                  if line and not line.startswith('#') and '=' in line:
                      k,v=line.split('=',1); out[k]=v
              return out
          for name, compose, envfile, service, port, image in cases:
              cfg=json.loads(subprocess.check_output(['docker','compose','-f',compose,'config','--format','json'], text=True))
              docs=cfg['services'][service]
              ports=docs.get('ports',[])
              assert len(ports)==1 and int(ports[0]['target'])==8080 and int(ports[0]['published'])==port, f'{name}: porta DOCs inválida'
              assert docs['image']==image, f'{name}: imagem DOCs inválida: {docs["image"]}'
              env=env_values(envfile)
              assert int(env['ARGWS_CONNECT_DOCS_HOST_PORT'])==port
              assert env['ARGWS_CONNECT_DOCS_IMAGE']==image
          print('Auxiliary DOCs deployment contract OK')
          PY

      - name: Validate deployment scripts
        run: |
          set -euo pipefail
          for dir in deploy/production deploy/develop deploy/canonical; do
            for script in prepare-env.sh deploy.sh update.sh status.sh preflight.sh registry-login.sh; do
              test -x "$dir/$script"
              bash -n "$dir/$script"
            done
          done

      - name: Login GHCR for image checks
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify runtime images exist
        shell: bash
        run: |
          set -euo pipefail
          canonical_image="$(grep '^ARGWS_CONNECT_API_IMAGE=' deploy/canonical/env.example | cut -d= -f2-)"
          for image in \
            ghcr.io/wkarts/argws-connect-api:latest \
            ghcr.io/wkarts/argws-connect-api:develop \
            ghcr.io/wkarts/argws-connect-docs:develop \
            "$canonical_image" \
            ghcr.io/wkarts/argws-connect-postgres:15 \
            ghcr.io/wkarts/argws-connect-redis:latest \
            ghcr.io/wkarts/argws-connect-rabbitmq:management \
            ghcr.io/wkarts/argws-connect-minio:latest \
            ghcr.io/wkarts/argws-connect-nats:2.10-alpine \
            ghcr.io/wkarts/argws-connect-kafka:7.5.0 \
            ghcr.io/wkarts/argws-connect-zookeeper:7.5.0; do
            echo "Checking $image"
            docker manifest inspect "$image" >/dev/null
          done
