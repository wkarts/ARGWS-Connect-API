name: Deployment Integrity

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: read

jobs:
  compose:
    name: Compose / Single Port / Deployment Channels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare example environments
        run: |
          cp env.example .env
          cp deploy/cloudpanel/env.example deploy/cloudpanel/.env
          cp deploy/dockge/env.example deploy/dockge/.env
          cp deploy/production/env.example deploy/production/.env
          cp deploy/homologation/env.example deploy/homologation/.env

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yaml config >/dev/null
          docker compose -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose -f deploy/dockge/compose.yaml config >/dev/null
          docker compose -f deploy/production/compose.yaml config >/dev/null
          docker compose -f deploy/homologation/compose.yaml config >/dev/null
          docker compose --profile '*' -f docker-compose.yaml config >/dev/null
          docker compose --profile '*' -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose --profile '*' -f deploy/dockge/compose.yaml config >/dev/null
          docker compose --profile '*' -f deploy/production/compose.yaml config >/dev/null
          docker compose --profile '*' -f deploy/homologation/compose.yaml config >/dev/null
          stable="$(tr -d '[:space:]' < VERSION)"
          ARGWS_CONNECT_API_IMAGE="ghcr.io/wkarts/argws-connect-api:${stable}" \
            docker compose --env-file deploy/production/.env \
              -f deploy/production/compose.yaml -f deploy/canonical/compose.yaml config >/dev/null

      - name: Enforce deployment contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          core = {"api", "postgres", "redis", "rabbitmq", "minio"}
          optional = {"nats", "zookeeper", "kafka"}
          extended_optional = {"mysql", "nats", "zookeeper", "kafka"}
          stable = Path("VERSION").read_text().strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+", stable), stable

          def compose_json(files, profiles=False, env_file=None, extra_env=None):
              cmd = ["docker", "compose"]
              if profiles:
                  cmd += ["--profile", "*"]
              if env_file:
                  cmd += ["--env-file", env_file]
              for f in files:
                  cmd += ["-f", f]
              cmd += ["config", "--format", "json"]
              env = os.environ.copy()
              if extra_env:
                  env.update(extra_env)
              return json.loads(subprocess.check_output(cmd, text=True, env=env))

          extended = [
              "docker-compose.yaml",
              "deploy/cloudpanel/docker-compose.yml",
              "deploy/dockge/compose.yaml",
          ]
          for path in extended:
              data = compose_json([path], profiles=True)
              missing = (core | extended_optional) - set(data["services"])
              assert not missing, f"{path}: services ausentes: {sorted(missing)}"

          prod_default = compose_json(["deploy/production/compose.yaml"])
          prod = compose_json(["deploy/production/compose.yaml"], profiles=True)
          homolog_default = compose_json(["deploy/homologation/compose.yaml"])
          homolog = compose_json(["deploy/homologation/compose.yaml"], profiles=True)
          canonical = compose_json(
              ["deploy/production/compose.yaml", "deploy/canonical/compose.yaml"],
              profiles=True,
              env_file="deploy/production/.env",
              extra_env={"ARGWS_CONNECT_API_IMAGE": f"ghcr.io/wkarts/argws-connect-api:{stable}"},
          )

          assert set(prod_default["services"]) == core
          assert set(homolog_default["services"]) == core
          assert set(prod["services"]) == core | optional
          assert set(homolog["services"]) == core | optional
          assert set(canonical["services"]) == core | optional

          def assert_single_port(label, data, expected_port):
              services = data["services"]
              assert "manager" not in services, f"{label}: manager separado nao permitido"
              published = [name for name, cfg in services.items() if cfg.get("ports")]
              assert published == ["api"], f"{label}: somente API pode publicar porta: {published}"
              ports = services["api"]["ports"]
              assert len(ports) == 1
              assert int(ports[0]["target"]) == 8080
              assert int(ports[0]["published"]) == expected_port
              assert str(services["api"].get("environment", {}).get("SERVER_PORT")) == "8080"
              for service_name, cfg in services.items():
                  for mount in cfg.get("volumes", []):
                      assert mount.get("type") == "bind", f"{label}: {service_name} volume nao-bind"
                  image = cfg.get("image", "")
                  assert image.startswith("ghcr.io/wkarts/"), f"{label}: imagem fora do GHCR: {image}"

          assert_single_port("production", prod, 38080)
          assert_single_port("canonical", canonical, 38080)
          assert_single_port("homologation", homolog, 38081)

          prod_image = prod["services"]["api"]["image"]
          homolog_image = homolog["services"]["api"]["image"]
          canonical_image = canonical["services"]["api"]["image"]
          assert prod_image == "ghcr.io/wkarts/argws-connect-api:latest", prod_image
          assert homolog_image == "ghcr.io/wkarts/argws-connect-api:develop", homolog_image
          assert canonical_image == f"ghcr.io/wkarts/argws-connect-api:{stable}", canonical_image

          assert prod.get("name") == canonical.get("name"), "canonical deve usar o mesmo project name da producao"
          assert prod["networks"] == canonical["networks"], "canonical nao pode alterar redes da producao"

          prod_normalized = copy.deepcopy(prod)
          canonical_normalized = copy.deepcopy(canonical)
          canonical_normalized["services"]["api"]["image"] = prod_normalized["services"]["api"]["image"]
          assert prod_normalized == canonical_normalized, "canonical pode diferir da producao somente na imagem da API"

          print(
              f"Deployment OK | homolog=:develop | production=:latest | canonical=:{stable} | "
              "production/canonical port=38080"
          )
          PY

      - name: Validate environment contracts
        shell: bash
        run: |
          set -euo pipefail
          cmp -s env.example .env.example
          cmp -s env.example deploy/cloudpanel/env.example
          cmp -s env.example deploy/cloudpanel/.env.example
          cmp -s env.example deploy/dockge/env.example
          cmp -s env.example deploy/dockge/.env.example

          python - <<'PY'
          from pathlib import Path

          def values(path: str):
              result = {}
              for raw in Path(path).read_text().splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  result[key] = value
              return result

          prod = values('deploy/production/env.example')
          homolog = values('deploy/homologation/env.example')
          assert set(prod) == set(homolog), (
              f"production/homologation env keys divergentes: "
              f"prod-only={sorted(set(prod)-set(homolog))}, homolog-only={sorted(set(homolog)-set(prod))}"
          )
          assert prod['ARGWS_CONNECT_API_IMAGE'] == 'ghcr.io/wkarts/argws-connect-api:latest'
          assert homolog['ARGWS_CONNECT_API_IMAGE'] == 'ghcr.io/wkarts/argws-connect-api:develop'
          canonical = values('deploy/canonical/env.example')
          assert set(canonical) == {'ARGWS_CONNECT_CANONICAL_VERSION'}
          if canonical['ARGWS_CONNECT_CANONICAL_VERSION']:
              import re
              assert re.fullmatch(r'\d+\.\d+\.\d+', canonical['ARGWS_CONNECT_CANONICAL_VERSION'])
          print(f"Environment channels OK: production={prod['ARGWS_CONNECT_API_IMAGE']} homolog={homolog['ARGWS_CONNECT_API_IMAGE']}")
          PY

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          for dir in deploy/production deploy/homologation; do
            for script in prepare-env.sh deploy.sh update.sh status.sh preflight.sh registry-login.sh; do
              test -x "$dir/$script"
              bash -n "$dir/$script"
            done
            test -f "$dir/nginx-location.conf.example"
            test -f "$dir/README.md"
          done
          for script in deploy.sh update.sh status.sh preflight.sh; do
            bash -n "deploy/canonical/$script"
          done
          test -f deploy/canonical/compose.yaml
          test -f deploy/canonical/env.example
          test -f deploy/canonical/README.md

      - name: Login GHCR for infrastructure checks
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify shared runtime infrastructure images
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            ghcr.io/wkarts/argws-connect-postgres:15 \
            ghcr.io/wkarts/argws-connect-redis:latest \
            ghcr.io/wkarts/argws-connect-rabbitmq:management \
            ghcr.io/wkarts/argws-connect-minio:latest \
            ghcr.io/wkarts/argws-connect-nats:2.10-alpine \
            ghcr.io/wkarts/argws-connect-kafka:7.5.0 \
            ghcr.io/wkarts/argws-connect-zookeeper:7.5.0; do
            echo "Checking $image"
            docker manifest inspect "$image" >/dev/null
          done
