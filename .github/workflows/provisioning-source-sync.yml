name: Temporary reviewed provisioning source synchronization

# Source transfer only. No deployment or access to user infrastructure.
# Removed before merge; all changes are validated in the pull request.
on:
  push:
    branches: ['fix/provisioning-universal-installer']
    paths: ['.github/provisioning-source-sync.part*', '.github/workflows/provisioning-source-sync.yml']
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'wkarts/ARGWS-Connect-API' && github.ref == 'refs/heads/fix/provisioning-universal-installer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and apply reviewed patch
        shell: python
        run: |
          import hashlib, lzma, os, pathlib, subprocess
          branch = 'refs/heads/fix/provisioning-universal-installer'
          assert os.environ['GITHUB_REF'] == branch
          assert os.environ['GITHUB_REPOSITORY'] == 'wkarts/ARGWS-Connect-API'
          payload = b''.join(pathlib.Path(f'.github/provisioning-source-sync.part{i}').read_bytes() for i in range(4))
          patch = lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest() == '6dfa72ad0b13281d705d6bb288478af3a19bd737376b1f018ab9056070be2095'
          def git(*args, **kwargs): return subprocess.run(['git', *args], check=True, **kwargs)
          git('merge-base', '--is-ancestor', '3acb32eac79f0ccc9f05b99efdfa6dc538e6acf4', 'HEAD')
          git('apply', '--unidiff-zero', '--check', '--index', '-', input=patch)
          git('apply', '--unidiff-zero', '--index', '-', input=patch)
          names = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          expected = {
              'OPERATIONS-CONTRACT.md', 'install-connect.py',
              'docs/guides/platform-ssl-instances-corrective.md', 'docs/guides/universal-installer.md',
              'platform/control-api/app/providers/cloudflare.py', 'platform/control-api/app/services/domains.py',
              'platform/control-api/app/services/managed_dns.py', 'platform/control-api/app/services/tls_status.py',
              'platform/control-api/app/workers/tasks.py',
              'platform/control-api/tests/connect_platform/test_provisioning_audit.py',
              'platform/control-api/tests/connect_platform/test_tls_automation.py',
              'platform/infrastructure/acme/cloudflare_dns.py', 'platform/infrastructure/acme/service.py',
              'platform/infrastructure/cloudpanel-agent/integration_test.py',
              'platform/infrastructure/cloudpanel-agent/service.py', 'platform/infrastructure/tls_common.py',
              'test/installer/integration_compose.py', 'test/installer/test_installer.py',
          }
          expected.update(f'deploy/{stack}/{file}' for stack in ('platform', 'platform-develop', 'platform-production') for file in ('README.md', 'compose.yaml', 'env.example'))
          assert names == expected, (names - expected, expected - names)
          git('diff', '--cached', '--check')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'fix(provisioning): corrige DNS e CloudPanel e adiciona instalador universal')
          git('push', 'origin', 'HEAD:' + branch)
