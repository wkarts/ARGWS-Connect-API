name: Apply DOCs Deployments Fix

on:
  push:
    branches: [fix/connect-api-docs-deployments]
    paths:
      - .github/workflows/apply-docs-deployments-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          ref: fix/connect-api-docs-deployments
          fetch-depth: 0

      - name: Rebuild correction script
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/apply-docs-deployments.part* > /tmp/apply-docs-deployments.py
          python3 -m py_compile /tmp/apply-docs-deployments.py

      - name: Apply deployment integration
        run: python3 /tmp/apply-docs-deployments.py

      - name: Prepare example environments
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/production/env.example deploy/production/.env
          cp deploy/homologation/env.example deploy/homologation/.env
          cp deploy/develop/env.example deploy/develop/.env
          cp deploy/canonical/env.example deploy/canonical/.env
          cp deploy/cloudpanel/env.example deploy/cloudpanel/.env
          cp deploy/dockge/env.example deploy/dockge/.env

      - name: Validate every deployment Compose
        shell: bash
        run: |
          set -euo pipefail
          for stack in production homologation develop canonical; do
            docker compose -f "deploy/${stack}/compose.yaml" config >/dev/null
            docker compose --profile '*' -f "deploy/${stack}/compose.yaml" config >/dev/null
          done
          docker compose -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose --profile '*' -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose -f deploy/dockge/compose.yaml config >/dev/null
          docker compose --profile '*' -f deploy/dockge/compose.yaml config >/dev/null

      - name: Validate scripts and documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          for stack in production homologation develop canonical; do
            bash -n "deploy/${stack}/deploy.sh"
            bash -n "deploy/${stack}/preflight.sh"
          done
          bash -n deploy/cloudpanel/deploy.sh
          node --check .github/scripts/apply-version.mjs
          node docs/scripts/generate-openapi.mjs --check

      - name: Keep workflow files for direct connector update
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            .github/workflows/auto-version-release.yml \
            .github/workflows/deployment-integrity.yml \
            .github/workflows/image-promotion-integrity.yml
          rm -rf .github/tmp
          rm -f deploy/production/.env deploy/homologation/.env deploy/develop/.env deploy/canonical/.env deploy/cloudpanel/.env deploy/dockge/.env

      - name: Commit validated deployment correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(docs): integra service DOCs em todos os deployments"
          git push origin HEAD:fix/connect-api-docs-deployments
