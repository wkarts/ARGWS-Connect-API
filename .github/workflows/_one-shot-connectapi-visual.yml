name: One-shot ConnectAPI Visual Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_one-shot-connectapi-visual.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated ConnectAPI identity changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts')
          text = service.read_text(encoding='utf-8')
          old = "const browser: WABrowserDescription = ['🅲🅾🅽🅽🅴🅲🆃​|🅰🅿🅸', 'Chrome', '20.0.04'];"
          new = "const browser: WABrowserDescription = ['Connect|API', 'Chrome', '20.0.04'];"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one browser identity occurrence, found {text.count(old)}')
          service.write_text(text.replace(old, new), encoding='utf-8')

          old_footer = 'r&&r!==""&&i.jsxs("span",{children:[e("footer.clientName"),": ",i.jsx("strong",{children:r})]})'
          new_footer = 'r&&r!==""&&i.jsx("span",{children:i.jsx("strong",{children:r})})'
          matches = []
          for bundle in Path('manager/dist/assets').glob('index-*.js'):
              content = bundle.read_text(encoding='utf-8')
              count = content.count(old_footer)
              if count:
                  matches.append((bundle, count))
                  if count != 1:
                      raise SystemExit(f'Expected one footer occurrence in {bundle}, found {count}')
                  bundle.write_text(content.replace(old_footer, new_footer), encoding='utf-8')
          if len(matches) != 1:
              raise SystemExit(f'Expected footer in exactly one Manager bundle, found {matches}')

          index = Path('manager/dist/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace(
              '<meta name="description" content="ARGWS Connect API — Communication & Integration Platform" />',
              '<meta name="description" content="Connect|API — Communication & Integration Platform" />',
          )
          html = html.replace('<title>ARGWS Connect API</title>', '<title>Connect|API</title>')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Validate API
        run: |
          npm ci
          npm run lint:check
          npm run test:compat
          npm run db:generate
          npm run build

      - name: Verify exact result
        shell: bash
        run: |
          grep -F "const browser: WABrowserDescription = ['Connect|API', 'Chrome', '20.0.04'];" src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          grep -F '<title>Connect|API</title>' manager/dist/index.html
          if grep -R -F 'e("footer.clientName"),": "' manager/dist/assets/index-*.js; then
            echo 'Legacy footer label still present in rendered footer' >&2
            exit 1
          fi

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_one-shot-connectapi-visual.yml
          git add src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts manager/dist/index.html manager/dist/assets/index-*.js
          git commit -m 'fix(branding): adota Connect|API no pairing e Manager [skip release]'
          git push origin HEAD:main
