name: One-shot Auth Socket Stability Fix

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/_one-shot-fix-auth-socket-stability.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Apply deterministic WhatsApp auth and Socket.IO compatibility fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          baileys_path = Path('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts')
          text = baileys_path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              "  private protocolAuthMode: 'qrcode' | 'pairing-code' = 'qrcode';\n  private suppressNextReconnect = false;",
              "  private protocolAuthMode: 'qrcode' | 'pairing-code' = 'qrcode';\n  private connectionGeneration = 0;",
              'replace suppressNextReconnect with connectionGeneration',
          )

          text = replace_once(
              text,
              "  public get connectionStatus() {\n    return this.stateConnection;\n  }",
              "  public get connectionStatus() {\n    return this.stateConnection;\n  }\n\n  public setPairingCode(pairingCode?: string) {\n    this.instance.qrcode.pairingCode = pairingCode ?? null;\n  }",
              'add pairing-code state setter',
          )

          text = replace_once(
              text,
              "  private async connectionUpdate({ qr, connection, lastDisconnect }: Partial<ConnectionState>) {\n    if (qr) {",
              "  private async connectionUpdate(\n    { qr, connection, lastDisconnect }: Partial<ConnectionState>,\n    client: WASocket = this.client,\n    generation: number = this.connectionGeneration,\n  ) {\n    if (generation !== this.connectionGeneration || client !== this.client) {\n      return;\n    }\n\n    if (qr) {",
              'guard connectionUpdate by client generation',
          )

          text = replace_once(
              text,
              "      // Pairing code is an explicit authentication operation and must not\n      // be regenerated every time WhatsApp rotates the QR code. Repeated calls\n      // invalidate the code that the user is currently typing on the phone.\n      this.instance.qrcode.pairingCode = null;",
              "      // Pairing code is explicit and independent from QR rotation.\n      // Only QR mode clears pairing state; pairing mode must preserve a code\n      // already returned to the user while WhatsApp rotates its QR challenge.\n      if (this.protocolAuthMode === 'qrcode') {\n        this.instance.qrcode.pairingCode = null;\n      }",
              'preserve pairing code during pairing mode',
          )

          text = replace_once(
              text,
              "      qrcode.toDataURL(qr, optsQrcode, (error, base64) => {\n        if (error) {",
              "      qrcode.toDataURL(qr, optsQrcode, (error, base64) => {\n        if (generation !== this.connectionGeneration || client !== this.client) {\n          return;\n        }\n\n        if (error) {",
              'ignore stale QR callback',
          )

          text = replace_once(
              text,
              "    if (connection === 'close') {\n      if (this.suppressNextReconnect) {\n        this.suppressNextReconnect = false;\n        return;\n      }\n\n      const statusCode =",
              "    if (connection === 'close') {\n      if (generation !== this.connectionGeneration || client !== this.client) {\n        return;\n      }\n\n      const statusCode =",
              'remove one-shot reconnect suppression',
          )

          text = replace_once(
              text,
              "    const qrCodeBrowser: WABrowserDescription = [\n      process.env.WHATSAPP_PROTOCOL_BROWSER_CLIENT || '🅲🅾🅽🅽🅴🅲🆃​|🅰🅿🅸',\n      process.env.WHATSAPP_PROTOCOL_BROWSER_NAME || 'Chrome',\n      process.env.WHATSAPP_PROTOCOL_BROWSER_VERSION || '20.0.04',\n    ];",
              "    // QR keeps the ARGWS/custom identity. Pairing deliberately uses\n    // a separate canonical fingerprint below because WhatsApp validates it\n    // more strictly during companion-device registration.\n    const qrCodeBrowser: WABrowserDescription = [\n      process.env.WHATSAPP_PROTOCOL_BROWSER_CLIENT || session.CLIENT,\n      process.env.WHATSAPP_PROTOCOL_BROWSER_NAME || session.NAME,\n      process.env.WHATSAPP_PROTOCOL_BROWSER_VERSION || '20.0.04',\n    ];",
              'restore configurable QR fingerprint',
          )

          text = replace_once(
              text,
              "    this.endSession = false;\n\n    this.client = makeWASocket(socketConfig);",
              "    this.endSession = false;\n\n    const generation = ++this.connectionGeneration;\n    const client = makeWASocket(socketConfig);\n    this.client = client;",
              'create generation-scoped client',
          )

          text = replace_once(
              text,
              "      useVoiceCallsBaileys(this.localSettings.wavoipToken, this.client, this.connectionStatus.state as any, true);",
              "      useVoiceCallsBaileys(this.localSettings.wavoipToken, client, this.connectionStatus.state as any, true);",
              'bind voice calls to local client',
          )

          text = replace_once(text, "    this.eventHandler();", "    this.eventHandler(client, generation);", 'bind event handler')
          text = replace_once(text, "    this.client.ws.on('CB:call', (packet) => {", "    client.ws.on('CB:call', (packet) => {", 'bind call listener')
          text = replace_once(text, "    this.client.ws.on('CB:ack,class:call', (packet) => {", "    client.ws.on('CB:ack,class:call', (packet) => {", 'bind call ack listener')

          old_switch = """  private async switchAuthenticationMode(mode: 'qrcode' | 'pairing-code', number?: string): Promise<WASocket> {
    const normalizedPhoneNumber = number?.replace(/\\D/g, '');

    if (mode === 'pairing-code' && !normalizedPhoneNumber) {
      throw new BadRequestException('Pairing-code phone number is required');
    }

    if (
      this.client &&
      this.protocolAuthMode === mode &&
      (mode === 'qrcode' || this.phoneNumber === normalizedPhoneNumber)
    ) {
      return this.client;
    }

    const previousClient = this.client;
    if (previousClient?.ws) {
      this.suppressNextReconnect = true;
      previousClient.ws.close();
      await delay(250);
    }

    this.instance.qrcode = { count: 0 };
    this.phoneNumber = mode === 'pairing-code' ? normalizedPhoneNumber : undefined;

    return await this.connectToWhatsapp(this.phoneNumber, mode);
  }
"""

          new_switch = """  private async switchAuthenticationMode(mode: 'qrcode' | 'pairing-code', number?: string): Promise<WASocket> {
    const normalizedPhoneNumber = number?.replace(/\\D/g, '');

    if (mode === 'pairing-code' && !normalizedPhoneNumber) {
      throw new BadRequestException('Pairing-code phone number is required');
    }

    // A live QR socket may be reused only while it still owns a usable QR.
    // Pairing requests are always fresh explicit operations so a previous or
    // expired pairing attempt can never poison the next request.
    if (
      mode === 'qrcode' &&
      this.client &&
      this.protocolAuthMode === 'qrcode' &&
      (this.instance.qrcode?.code || this.instance.qrcode?.base64)
    ) {
      return this.client;
    }

    const previousClient = this.client;

    // Invalidate callbacks/listeners from the previous client before closing
    // its transport. This removes the race where a late `connection.update`
    // from the old socket reconnects or mutates the newly created client.
    ++this.connectionGeneration;

    if (previousClient?.ws) {
      try {
        previousClient.ws.close();
      } catch (error) {
        this.logger.warn(`Error closing previous WhatsApp socket: ${error?.message || error}`);
      }
    }

    this.instance.qrcode = { count: 0 };
    this.phoneNumber = mode === 'pairing-code' ? normalizedPhoneNumber : undefined;

    return await this.connectToWhatsapp(this.phoneNumber, mode);
  }
"""
          text = replace_once(text, old_switch, new_switch, 'replace authentication mode transition')

          text = replace_once(
              text,
              "  private eventHandler() {\n    this.client.ev.process(async (events) => {\n      this.eventProcessingQueue = this.eventProcessingQueue.then(async () => {\n        try {\n          if (!this.endSession) {",
              "  private eventHandler(client: WASocket, generation: number) {\n    client.ev.process(async (events) => {\n      this.eventProcessingQueue = this.eventProcessingQueue.then(async () => {\n        try {\n          if (generation !== this.connectionGeneration || client !== this.client) {\n            return;\n          }\n\n          if (!this.endSession) {",
              'scope Baileys event handler to client generation',
          )

          text = replace_once(
              text,
              "            if (events['connection.update']) {\n              this.connectionUpdate(events['connection.update']);\n            }",
              "            if (events['connection.update']) {\n              await this.connectionUpdate(events['connection.update'], client, generation);\n            }",
              'await guarded connection update',
          )

          baileys_path.write_text(text, encoding='utf-8')

          controller_path = Path('src/api/controllers/instance.controller.ts')
          text = controller_path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              "    const timeoutMs = pairingCodeRequested ? 10000 : 5000;",
              "    const timeoutMs = pairingCodeRequested ? 15000 : 10000;",
              'increase auth readiness timeout',
          )

          text = replace_once(
              text,
              "    if (pairingCodeRequested && !qrCode?.pairingCode) {\n      throw new BadRequestException(\n        'Unable to generate pairing code. Confirm the international phone number and try again.',\n      );\n    }\n\n    return qrCode;",
              "    if (pairingCodeRequested && !qrCode?.pairingCode) {\n      throw new BadRequestException(\n        'Unable to generate pairing code. Confirm the international phone number and try again.',\n      );\n    }\n\n    if (!pairingCodeRequested && !qrCode?.code && !qrCode?.base64) {\n      throw new BadRequestException('Unable to generate QR code. Try again.');\n    }\n\n    return qrCode;",
              'fail explicitly when QR is absent',
          )

          text = replace_once(
              text,
              "    const maskedNumber = `${'*'.repeat(Math.max(0, number.length - 4))}${number.slice(-4)}`;\n    this.logger.info(`Explicit pairing code generated for ${maskedNumber}`);\n\n    return { ...qrCode, pairingCode };",
              "    if (typeof instance.setPairingCode === 'function') {\n      instance.setPairingCode(pairingCode);\n    }\n\n    const maskedNumber = `${'*'.repeat(Math.max(0, number.length - 4))}${number.slice(-4)}`;\n    this.logger.info(`Explicit pairing code generated for ${maskedNumber}`);\n\n    return { ...qrCode, pairingCode };",
              'persist explicit pairing code in service state',
          )

          controller_path.write_text(text, encoding='utf-8')

          websocket_path = Path('src/api/integrations/event/websocket/websocket.controller.ts')
          text = websocket_path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              "        if (!apiKey) {\n          this.logger.error('Connection rejected: apiKey not provided');\n          return next(new Error('apiKey is required'));\n        }",
              "        if (!apiKey) {\n          const remoteAddress = socket.request?.socket?.remoteAddress || socket.handshake.address;\n\n          // Backward-compatible Manager handshake: the stable Manager connects\n          // through Socket.IO without placing the API key in the Engine.IO\n          // handshake. The network allowlist above is still mandatory.\n          // API-key validation remains mandatory whenever a key is supplied.\n          if (this.isAllowedNetworkAddress(remoteAddress)) {\n            this.logger.info(`Trusted Manager Socket.IO connection accepted: ${socket.id}`);\n            return next();\n          }\n\n          this.logger.error('Connection rejected: apiKey not provided');\n          return next(new Error('apiKey is required'));\n        }",
              'restore Manager Socket.IO handshake compatibility',
          )

          text = replace_once(
              text,
              "      this.logger.info(`Authenticated user connected: ${socket.id}`);",
              "      this.logger.info(`Socket.IO user connected: ${socket.id}`);",
              'neutral Socket.IO connection log',
          )

          text = replace_once(
              text,
              "    this.logger.info('Socket.io initialized with network allowlist and mandatory API-key authentication');",
              "    this.logger.info('Socket.io initialized with network allowlist and Manager-compatible API-key authentication');",
              'Socket.IO startup log',
          )

          websocket_path.write_text(text, encoding='utf-8')

          print('Patch applied successfully.')

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Compatibility tests
        run: npm run test:compat

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Verify auth invariants
        shell: python
        run: |
          from pathlib import Path

          baileys = Path('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts').read_text(encoding='utf-8')
          controller = Path('src/api/controllers/instance.controller.ts').read_text(encoding='utf-8')
          websocket = Path('src/api/integrations/event/websocket/websocket.controller.ts').read_text(encoding='utf-8')

          checks = {
              'QR personalized fingerprint': "process.env.WHATSAPP_PROTOCOL_BROWSER_CLIENT || session.CLIENT" in baileys,
              'Pairing canonical fingerprint': "['Ubuntu', 'Chrome', '20.0.04']" in baileys,
              'No suppressNextReconnect': 'suppressNextReconnect' not in baileys,
              'No arbitrary 250ms socket switch': 'await delay(250);' not in baileys,
              'Generation guard enabled': 'connectionGeneration' in baileys,
              'Pairing state setter': 'setPairingCode' in baileys and 'instance.setPairingCode' in controller,
              'QR missing becomes explicit error': 'Unable to generate QR code. Try again.' in controller,
              'Manager Socket.IO compatibility': 'Trusted Manager Socket.IO connection accepted' in websocket,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{'OK' if ok else 'FAIL'}: {name}")

          if failed:
              raise SystemExit('Invariant checks failed: ' + ', '.join(failed))

      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/_one-shot-fix-auth-socket-stability.yml
          git add \
            src/api/controllers/instance.controller.ts \
            src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts \
            src/api/integrations/event/websocket/websocket.controller.ts

          git commit -m "fix(develop): estabiliza QR pairing e Socket.IO [skip release]"
          git push origin HEAD:develop
