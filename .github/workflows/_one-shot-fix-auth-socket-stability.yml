name: One-shot Auth Socket Stability Fix

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/_one-shot-fix-auth-socket-stability.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Apply targeted patch
        run: python .github/scripts/_one_shot_fix_auth_socket_stability.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Compatibility tests
        run: npm run test:compat

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_one-shot-fix-auth-socket-stability.yml
          git rm .github/scripts/_one_shot_fix_auth_socket_stability.py
          git add src/api/controllers/instance.controller.ts
          git add src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          git add src/api/integrations/event/websocket/websocket.controller.ts
          git commit -m "fix(develop): estabiliza QR pairing e Socket.IO [skip release]"
          git push origin HEAD:develop
