name: Platform Integrity

on:
  pull_request:
    branches: [develop]
    paths:
      - "platform/**"
      - "deploy/platform/**"
      - "deploy/develop/compose.platform.yaml"
      - "deploy/develop/platform.env.example"
      - ".github/workflows/platform-integrity.yml"
  push:
    branches: [develop]
    paths:
      - "platform/**"
      - "deploy/platform/**"
      - "deploy/develop/compose.platform.yaml"
      - "deploy/develop/platform.env.example"
      - ".github/workflows/platform-integrity.yml"

permissions:
  contents: read

jobs:
  platform:
    name: Control API / Vue / Deployment Profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/control-api/requirements.txt

      - name: Install Control API dependencies
        run: pip install -r platform/control-api/requirements.txt

      - name: Validate Platform integration contracts
        run: |
          python platform/scripts/validate_platform_integration.py
          python platform/scripts/validate_project.py
          python -m compileall -q platform/control-api/app

      - name: Test Control API canonical scope
        env:
          APP_ENV: testing
          CONNECT_ENGINE_API_KEY: test-connect-engine-key-123456
        run: PYTHONPATH=platform/control-api pytest -q platform/control-api/tests/connect_platform

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Validate Platform Web
        working-directory: platform/web
        run: |
          npm install --no-audit --no-fund
          node ../scripts/validate_frontend_syntax.mjs src
          npm run typecheck
          npm run test:run
          npm run build

      - name: Prepare disposable Platform environment
        run: |
          cp deploy/platform/env.example deploy/platform/.env
          cp deploy/develop/env.example deploy/develop/.env
          cp deploy/develop/platform.env.example deploy/develop/.platform.env

      - name: Validate Platform deployment profiles
        run: |
          set -euo pipefail
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml config >/dev/null
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml --profile docs config >/dev/null
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml --profile platform config >/dev/null
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml --profile platform --profile observability config >/dev/null
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml -f deploy/platform/compose.local-build.yaml --profile platform config >/dev/null

      - name: Validate in-place develop to Platform upgrade
        working-directory: deploy/develop
        run: |
          set -euo pipefail
          docker compose --env-file .env --env-file .platform.env \
            -f compose.yaml -f compose.platform.yaml --profile platform config >/dev/null
          rendered="$(docker compose --env-file .env --env-file .platform.env -f compose.yaml -f compose.platform.yaml --profile platform config)"
          grep -q 'api-argws-connect-develop:' <<<"$rendered"
          grep -q 'connect-platform-api:' <<<"$rendered"
          grep -q 'connect-platform-web:' <<<"$rendered"
          grep -q 'connect-platform-postgres:' <<<"$rendered"
          test "$(grep -c '^  connect-engine:' <<<"$rendered" || true)" -eq 0

      - name: Validate Platform operational scripts
        run: |
          set -euo pipefail
          for script in prepare-env.sh deploy.sh update.sh status.sh preflight.sh registry-login.sh profile.sh; do
            bash -n "deploy/platform/$script"
          done
