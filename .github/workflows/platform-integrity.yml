name: Platform Integrity

on:
  pull_request:
    branches: [develop]
    paths:
      - "platform/**"
      - "deploy/platform/**"
      - "deploy/platform-develop/**"
      - "deploy/platform-production/**"
      - ".github/workflows/platform-integrity.yml"
  push:
    branches: [develop]
    paths:
      - "platform/**"
      - "deploy/platform/**"
      - "deploy/platform-develop/**"
      - "deploy/platform-production/**"
      - ".github/workflows/platform-integrity.yml"

permissions:
  contents: read

jobs:
  platform:
    name: Control API / Vue / Platform Deployments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/control-api/requirements.txt

      - name: Install Control API dependencies
        run: pip install -r platform/control-api/requirements.txt

      - name: Validate Platform integration contracts
        run: |
          python platform/scripts/validate_platform_integration.py
          python platform/scripts/validate_project.py
          python -m compileall -q platform/control-api/app

      - name: Test Control API canonical scope
        env:
          APP_ENV: testing
          CONNECT_ENGINE_API_KEY: test-connect-engine-key-123456
        run: PYTHONPATH=platform/control-api pytest -q platform/control-api/tests/connect_platform

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Validate Platform Web
        working-directory: platform/web
        run: |
          npm install --no-audit --no-fund
          node ../scripts/validate_frontend_syntax.mjs src
          npm run typecheck
          npm run test:run
          npm run build

      - name: Prepare disposable Platform environments
        run: |
          cp deploy/platform/env.example deploy/platform/.env
          cp deploy/platform-develop/env.example deploy/platform-develop/.env
          cp deploy/platform-production/env.example deploy/platform-production/.env

      - name: Validate generic Platform deployment profiles
        run: |
          set -euo pipefail
          grep -q '^name: ${COMPOSE_PROJECT_NAME:-argws-connect-platform}$' deploy/platform/compose.yaml
          grep -q '^name: ${COMPOSE_PROJECT_NAME:-argws-connect-platform}$' deploy/platform/compose.local-build.yaml
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml config >/dev/null
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml --profile docs config >/dev/null
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml --profile platform config >/dev/null
          docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml --profile platform --profile observability config >/dev/null
          local_build_json="$(docker compose --env-file deploy/platform/.env -f deploy/platform/compose.yaml -f deploy/platform/compose.local-build.yaml --profile platform config --format json)"
          jq -e '.name == "argws-connect-platform"' <<<"$local_build_json" >/dev/null

      - name: Validate standalone Platform develop stack
        run: |
          set -euo pipefail
          test ! -e deploy/develop/compose.platform.yaml
          test ! -e deploy/develop/platform.env.example
          grep -q '^name: ${COMPOSE_PROJECT_NAME:-argws-connect-platform-develop}$' deploy/platform-develop/compose.yaml
          grep -q '^COMPOSE_PROJECT_NAME=argws-connect-platform-develop$' deploy/platform-develop/.env
          grep -q '^ARGWS_CONNECT_NETWORK_NAME=argws-connect-platform-develop-net$' deploy/platform-develop/.env
          grep -q '^ARGWS_CONNECT_API_IMAGE=ghcr.io/wkarts/argws-connect-api:develop$' deploy/platform-develop/.env
          grep -q '^ARGWS_CONNECT_DOCS_IMAGE=ghcr.io/wkarts/argws-connect-docs:develop$' deploy/platform-develop/.env
          grep -q '^ARGWS_CONNECT_PLATFORM_API_IMAGE=ghcr.io/wkarts/argws-connect-platform-api:develop$' deploy/platform-develop/.env
          grep -q '^ARGWS_CONNECT_PLATFORM_WEB_IMAGE=ghcr.io/wkarts/argws-connect-platform-web:develop$' deploy/platform-develop/.env
          grep -q '^ARGWS_CONNECT_PLATFORM_GATEWAY_IMAGE=ghcr.io/wkarts/argws-connect-platform-gateway:develop$' deploy/platform-develop/.env
          rendered="$(docker compose --env-file deploy/platform-develop/.env -f deploy/platform-develop/compose.yaml config)"
          rendered_json="$(docker compose --env-file deploy/platform-develop/.env -f deploy/platform-develop/compose.yaml config --format json)"
          jq -e '.name == "argws-connect-platform-develop"' <<<"$rendered_json" >/dev/null
          for service in \
            api-argws-connect-platform-develop \
            docs-argws-connect-platform-develop \
            postgres-argws-connect-platform-develop \
            redis-argws-connect-platform-develop \
            rabbitmq-argws-connect-platform-develop \
            minio-argws-connect-platform-develop \
            platform-postgres-argws-connect-platform-develop \
            platform-api-argws-connect-platform-develop \
            platform-worker-argws-connect-platform-develop \
            platform-scheduler-argws-connect-platform-develop \
            platform-web-argws-connect-platform-develop \
            platform-gateway-argws-connect-platform-develop; do
            grep -q "^  ${service}:" <<<"$rendered"
          done
          grep -q 'argws-connect-platform-develop-net' <<<"$rendered"

      - name: Validate standalone Platform production stack
        run: |
          set -euo pipefail
          grep -q '^name: ${COMPOSE_PROJECT_NAME:-argws-connect-platform-production}$' deploy/platform-production/compose.yaml
          grep -q '^COMPOSE_PROJECT_NAME=argws-connect-platform-production$' deploy/platform-production/.env
          grep -q '^ARGWS_CONNECT_NETWORK_NAME=argws-connect-platform-production-net$' deploy/platform-production/.env
          grep -q '^ARGWS_CONNECT_API_IMAGE=ghcr.io/wkarts/argws-connect-api:latest$' deploy/platform-production/.env
          grep -q '^ARGWS_CONNECT_DOCS_IMAGE=ghcr.io/wkarts/argws-connect-docs:latest$' deploy/platform-production/.env
          grep -q '^ARGWS_CONNECT_PLATFORM_API_IMAGE=ghcr.io/wkarts/argws-connect-platform-api:latest$' deploy/platform-production/.env
          grep -q '^ARGWS_CONNECT_PLATFORM_WEB_IMAGE=ghcr.io/wkarts/argws-connect-platform-web:latest$' deploy/platform-production/.env
          grep -q '^ARGWS_CONNECT_PLATFORM_GATEWAY_IMAGE=ghcr.io/wkarts/argws-connect-platform-gateway:latest$' deploy/platform-production/.env
          rendered="$(docker compose --env-file deploy/platform-production/.env -f deploy/platform-production/compose.yaml config)"
          rendered_json="$(docker compose --env-file deploy/platform-production/.env -f deploy/platform-production/compose.yaml config --format json)"
          jq -e '.name == "argws-connect-platform-production"' <<<"$rendered_json" >/dev/null
          for service in \
            api-argws-connect-platform-production \
            docs-argws-connect-platform-production \
            postgres-argws-connect-platform-production \
            redis-argws-connect-platform-production \
            rabbitmq-argws-connect-platform-production \
            minio-argws-connect-platform-production \
            platform-postgres-argws-connect-platform-production \
            platform-api-argws-connect-platform-production \
            platform-worker-argws-connect-platform-production \
            platform-scheduler-argws-connect-platform-production \
            platform-web-argws-connect-platform-production \
            platform-gateway-argws-connect-platform-production; do
            grep -q "^  ${service}:" <<<"$rendered"
          done
          grep -q 'argws-connect-platform-production-net' <<<"$rendered"

      - name: Validate Platform operational scripts
        run: |
          set -euo pipefail
          for script in prepare-env.sh deploy.sh update.sh status.sh preflight.sh registry-login.sh profile.sh; do
            bash -n "deploy/platform/$script"
          done
          for stack in platform-develop platform-production; do
            for script in prepare-env.sh deploy.sh update.sh status.sh preflight.sh registry-login.sh; do
              bash -n "deploy/${stack}/$script"
            done
          done
