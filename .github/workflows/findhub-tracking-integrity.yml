name: Find Hub - Tracking and canonical retention integrity
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/api/integrations/channel/findhub/**'
      - 'src/api/routes/**'
      - 'src/api/services/**'
      - 'src/api/server.module.ts'
      - 'src/main.ts'
      - 'manager/src/**'
      - 'scripts/*traccar*'
      - 'scripts/ghcr-retention.py'
      - '.github/retention-policy.json'
      - '.github/workflows/*retention*'
      - '.github/workflows/findhub-tracking-integrity.yml'
      - 'test/*tracking*'
      - 'test/*traccar*'
      - 'test/ghcr-retention.test.py'
      - 'deploy/**'
      - 'Docker/swarm/**'
      - 'docker-compose*.yaml'
  push:
    branches: [develop, main]
    paths:
      - 'src/api/integrations/channel/findhub/**'
      - 'src/api/routes/**'
      - 'src/api/services/**'
      - 'src/api/server.module.ts'
      - 'src/main.ts'
      - '.github/retention-policy.json'
      - '.github/workflows/findhub-tracking-integrity.yml'
      - 'scripts/*traccar*'
      - 'scripts/ghcr-retention.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Canonical history is append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/ghcr-retention.py --validate-policy
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA:.github/retention-policy.json" 2>/dev/null; then
            git show "$BASE_SHA:.github/retention-policy.json" > /tmp/previous-retention-policy.json
            python3 scripts/ghcr-retention.py --validate-policy --previous-policy /tmp/previous-retention-policy.json
          fi
      - name: Tracking, destination and retention regressions
        run: npm run test:tracking
      - name: Validate every existing optional deployment
        run: |
          python3 scripts/sync-traccar-deployments.py --check
          python3 scripts/sync-findhub-deployments.py --check
          python3 scripts/sync-operations-deployments.py --check
          python3 scripts/check-traccar-compose.py
      - name: Recover a legacy Traccar PostgreSQL identity through the official Compose
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          legacy_data="$(mktemp -d)"
          runtime_env="$(mktemp)"
          cleanup() {
            docker compose --env-file "$runtime_env" -f deploy/fersoft/production/compose.yaml --profile traccar down --remove-orphans || true
            docker rm -f traccar-legacy-init || true
            # PostgreSQL owns its initialized files. Remove them from a disposable
            # container instead of letting a permission-only cleanup failure mask
            # a successful recovery assertion on the GitHub runner.
            docker run --rm --user 0:0 -v "$legacy_data:/data" postgres:15 sh -ec 'find /data -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +' || true
            rmdir "$legacy_data" || true
            rm -f "$runtime_env" || true
          }
          trap cleanup EXIT

          docker run -d --name traccar-legacy-init \
            -e POSTGRES_USER=legacy_owner \
            -e POSTGRES_PASSWORD="$password" \
            -e POSTGRES_DB=legacy_bootstrap \
            -v "$legacy_data:/var/lib/postgresql/data" \
            postgres:15
          for attempt in $(seq 1 60); do
            if docker exec traccar-legacy-init pg_isready -U legacy_owner -d legacy_bootstrap; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker logs traccar-legacy-init
              exit 1
            fi
            sleep 1
          done
          docker rm -f traccar-legacy-init

          cat > "$runtime_env" <<EOF
          COMPOSE_PROJECT_NAME=traccar-legacy-recovery
          COMPOSE_PROFILES=traccar
          ARGWS_CONNECT_NETWORK_NAME=traccar-legacy-recovery-net
          ARGWS_CONNECT_TRACCAR_DB_PATH=$legacy_data
          TRACCAR_DATABASE_PASSWORD=$password
          TZ=America/Bahia
          EOF

          docker compose --env-file "$runtime_env" -f deploy/fersoft/production/compose.yaml --profile traccar up -d --force-recreate traccar-postgres-fersoft-connect-production
          for attempt in $(seq 1 90); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' traccar-postgres-fersoft-connect-production 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              docker logs traccar-postgres-fersoft-connect-production
              exit 1
            fi
            sleep 1
          done

          docker exec traccar-postgres-fersoft-connect-production sh -ec 'PGPASSWORD="$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc "SELECT 1" | grep -qx 1'
          docker exec traccar-postgres-fersoft-connect-production sh -ec 'PGPASSWORD="$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc "SELECT rolsuper::text FROM pg_roles WHERE rolname = current_user" | grep -qx false'
          docker exec traccar-postgres-fersoft-connect-production sh -ec 'PGPASSWORD="$TRACCAR_DATABASE_PASSWORD" psql --no-password -h 127.0.0.1 -U traccar -d traccar -tAc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = current_database()" | grep -qx traccar'
      - name: Start disposable official Traccar and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "TRACCAR_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "TRACCAR_ADMIN_EMAIL=connect-test@example.invalid" >> "$GITHUB_ENV"
          echo "TRACCAR_ENABLED=true" >> "$GITHUB_ENV"
          echo "TRACCAR_MODE=internal" >> "$GITHUB_ENV"
          echo "TRACCAR_INTERNAL_URL=http://127.0.0.1:18082" >> "$GITHUB_ENV"
          echo "TRACCAR_INTERNAL_RECEIVER_URL=http://127.0.0.1:15055" >> "$GITHUB_ENV"
          echo "TRACCAR_INTEGRATION_TEST=true" >> "$GITHUB_ENV"
          docker network create findhub-integration
          docker run -d --name findhub-test-db --network findhub-integration -e POSTGRES_DB=traccar -e POSTGRES_USER=traccar -e POSTGRES_PASSWORD="$password" postgres:15
          for i in $(seq 1 40); do docker exec findhub-test-db pg_isready -U traccar -d traccar && break; sleep 2; done
          docker run -d --name findhub-test-server --network findhub-integration -p 127.0.0.1:18082:8082 -p 127.0.0.1:15055:5055 \
            -e CONFIG_USE_ENVIRONMENT_VARIABLES=true -e DATABASE_DRIVER=org.postgresql.Driver \
            -e DATABASE_URL=jdbc:postgresql://findhub-test-db:5432/traccar -e DATABASE_USER=traccar -e DATABASE_PASSWORD="$password" \
            -e WEB_PORT=8082 -e OSMAND_PORT=5055 -e PROTOCOLS_ENABLE=osmand -e SERVER_STATISTICS= -e GEOCODER_ENABLE=false traccar/traccar:6.15.3-alpine
      - name: Verify bootstrap twice and real official API and socket
        run: |
          node scripts/traccar-bootstrap.cjs
          node scripts/traccar-bootstrap.cjs
          node test/traccar-live.integration.cjs
      - name: Remove only disposable test resources
        if: always()
        run: |
          docker rm -f findhub-test-server findhub-test-db || true
          docker network rm findhub-integration || true
