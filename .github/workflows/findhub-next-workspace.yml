name: Find Hub final source validation
on:
  push:
    branches: [fix/findhub-exchange-windows-assistant]
    paths: [.github/workflows/findhub-next-workspace.yml]
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply pinned source and Windows-safe IDs
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-exchange-windows-assistant
          git merge-base --is-ancestor 794a8c9e20781c2ddfa56e1e2df4d9fdd05f3b16 HEAD
          cat .github/findhub-next/part{0..3} | base64 --decode > /tmp/findhub-next.xz
          echo 'd0cf7c771b60be5a63ff5b63f96d3b3b0f35e69a627f05f0fe26cce44905568e  /tmp/findhub-next.xz' | sha256sum --check
          xz -dc /tmp/findhub-next.xz > /tmp/findhub-next.patch
          git apply --check /tmp/findhub-next.patch
          git apply --index /tmp/findhub-next.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('browser-extensions/findhub-auth/windows-assistant/src/install.rs')
          s = p.read_text()
          anchor = 'include!(concat!(env!("OUT_DIR"), "/payload.rs"));'
          addition = '''
          // Unique across concurrent operations even on a coarse Windows system clock.
          fn unique_id() -> String {
              use std::sync::atomic::{AtomicU64, Ordering};
              static NEXT: AtomicU64 = AtomicU64::new(0);
              format!("{}-{}-{}", std::process::id(),
                  SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default().as_nanos(),
                  NEXT.fetch_add(1, Ordering::Relaxed))
          }
          '''
          old = 'let stamp=SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_nanos();'
          old_temp = 'format!("findhub-rust-test-{}-{}",std::process::id(),SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_nanos())'
          assert s.count(anchor) == s.count(old) == s.count(old_temp) == 1
          p.write_text(s.replace(anchor, anchor + addition).replace(old, 'let stamp=unique_id();').replace(old_temp, 'format!("findhub-rust-test-{}",unique_id())'))
          p = Path('manager/src/services/findhub-auth-state.ts')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Validate API and contracts
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --cached --name-only --diff-filter=ACM | grep '^src/.*\.ts$')
          npx --no-install eslint --fix "${files[@]}"
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
          npm run lint:check
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          node --test test/diagnostic-privacy.test.cjs test/findhub-distribution.test.cjs
          npm run db:generate
          npm run build
      - name: Validate Rust and complete Manager
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          manifest=browser-extensions/findhub-auth/windows-assistant/Cargo.toml
          cargo +1.90.0 fmt --manifest-path "$manifest"
          cargo +1.90.0 test --manifest-path "$manifest" --locked --offline
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit only this validated candidate
        run: |
          set -euo pipefail
          branch=fix/findhub-exchange-windows-assistant
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 794a8c9e20781c2ddfa56e1e2df4d9fdd05f3b16 -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions deploy docker-compose.yaml docker-compose.dev.yaml
          git rm -r .github/findhub-next .github/workflows/findhub-next-workspace.yml .github/workflows/findhub-windows-candidate.yml
          git add -u
          git add -f public/findhub-auth.zip
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = 'manager/src/services/findhub-auth-state.ts'
          data = Path(p).read_bytes().rstrip(b'\r\n \t') + b'\n'
          Path(p).write_bytes(data)
          oid = subprocess.check_output(['git','hash-object','-w','--stdin'], input=data).decode().strip()
          subprocess.run(['git','update-index','--cacheinfo','100644',oid,p],check=True)
          assert subprocess.check_output(['git','show',':'+p]) == data
          assert data.endswith(b'\n') and not data.endswith(b'\n\n')
          assert all(line == line.rstrip(b' \t\r') for line in data.splitlines())
          print('Verified normalized frontend bytes', oid)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): preserve opaque auth tokens and ship native Windows assistant'
          git push origin "HEAD:refs/heads/$branch"
      - name: Archive tested source
        if: always()
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/findhub-source.tar.gz
          git diff --binary 794a8c9e20781c2ddfa56e1e2df4d9fdd05f3b16 > /tmp/findhub-source.patch
          git rev-parse HEAD > /tmp/findhub-source.commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-validated-source
          path: |
            /tmp/findhub-source.tar.gz
            /tmp/findhub-source.patch
            /tmp/findhub-source.commit
          retention-days: 7
