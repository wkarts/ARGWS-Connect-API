name: Find Hub - validate Rust assistant source
on:
  push:
    branches: [fix/findhub-exchange-windows-assistant]
    paths: [.github/workflows/findhub-next-workspace.yml]
permissions:
  contents: write
jobs:
  correction:
    if: github.ref == 'refs/heads/fix/findhub-exchange-windows-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply pinned source on work branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-exchange-windows-assistant
          git merge-base --is-ancestor 794a8c9e20781c2ddfa56e1e2df4d9fdd05f3b16 HEAD
          test -z "$(git diff --name-only 794a8c9e20781c2ddfa56e1e2df4d9fdd05f3b16 HEAD -- . ':!.github/findhub-next' ':!.github/workflows/findhub-next-workspace.yml')"
          cat .github/findhub-next/part{0..3} | base64 --decode > /tmp/findhub-next.xz
          echo 'd0cf7c771b60be5a63ff5b63f96d3b3b0f35e69a627f05f0fe26cce44905568e  /tmp/findhub-next.xz' | sha256sum --check
          xz -dc /tmp/findhub-next.xz > /tmp/findhub-next.patch
          git apply --check /tmp/findhub-next.patch
          git apply --index /tmp/findhub-next.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('manager/src/services/findhub-auth-state.ts')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
      - name: Install unchanged API dependencies
        run: npm ci --no-audit --no-fund
      - name: Format owned changes and validate Rust installation core
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --cached --name-only --diff-filter=ACM | grep '^src/.*\.ts$')
          test "${#files[@]}" -gt 0
          npx --no-install eslint --fix "${files[@]}"
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          manifest=browser-extensions/findhub-auth/windows-assistant/Cargo.toml
          cargo +1.90.0 fmt --manifest-path "$manifest"
          cargo +1.90.0 test --manifest-path "$manifest" --locked --offline
      - name: Validate API, protocol, diagnostics and documentation
        run: |
          set -euo pipefail
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
          npm run lint:check
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          node --test test/diagnostic-privacy.test.cjs test/findhub-distribution.test.cjs
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit validated code without merge or deployment
        run: |
          set -euo pipefail
          branch=fix/findhub-exchange-windows-assistant
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 794a8c9e20781c2ddfa56e1e2df4d9fdd05f3b16 -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions deploy docker-compose.yaml docker-compose.dev.yaml
          git rm -r .github/findhub-next .github/workflows/findhub-next-workspace.yml
          git add -u
          git add -f public/findhub-auth.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): preserve login artifact and add native Rust Windows assistant'
          git push origin "HEAD:refs/heads/$branch"
      - name: Archive candidate for review
        if: always()
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf /tmp/findhub-next-source.tar.gz
          git rev-parse HEAD > /tmp/findhub-next.commit
          git diff --binary 794a8c9e20781c2ddfa56e1e2df4d9fdd05f3b16 > /tmp/findhub-next-candidate.patch
          cp public/findhub-auth.zip /tmp/Connect-FindHub-Auth-candidate.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-next-source-review
          path: |
            /tmp/findhub-next-source.tar.gz
            /tmp/findhub-next.commit
            /tmp/findhub-next-candidate.patch
            /tmp/Connect-FindHub-Auth-candidate.zip
          retention-days: 2
