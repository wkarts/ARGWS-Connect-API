name: Temporary Runtime Manager Repair

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/_temp-runtime-manager-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply lifecycle hardening
        run: python3 .github/scripts/harden-instance-cleanup.py

      - name: Install API dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate API
        run: |
          npm run lint:check
          npm run build
          npm run test:zapo

      - name: Validate Manager
        working-directory: manager
        env:
          MANAGER_BUILD_MODE: development
        run: npm test

      - name: Commit validated lifecycle hardening
        run: |
          git config user.name "wkarts"
          git config user.email "57051272+wkarts@users.noreply.github.com"
          git add src/api/services/monitor.service.ts
          git commit -m "fix(instance): guarantee persistent cleanup after provider purge errors"
          git push origin HEAD:develop
