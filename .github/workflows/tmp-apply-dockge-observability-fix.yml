name: Temporary Apply Dockge Observability Fix

on:
  push:
    branches: [fix/platform-dockge-observability-config]
    paths:
      - ".github/workflows/tmp-apply-dockge-observability-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/platform-dockge-observability-config
          fetch-depth: 0

      - name: Apply fix
        run: python tools/tmp_apply_dockge_observability_fix.py

      - name: Validate compose files
        run: |
          set -euo pipefail
          for stack in platform platform-develop platform-production; do
            cp "deploy/${stack}/env.example" "deploy/${stack}/.env"
            docker compose --env-file "deploy/${stack}/.env" -f "deploy/${stack}/compose.yaml" config >/dev/null
          done

      - name: Validate self-contained observability contract
        run: |
          set -euo pipefail
          for stack in platform platform-develop platform-production; do
            compose="deploy/${stack}/compose.yaml"
            ! grep -q '../../platform/infrastructure/' "$compose"
            grep -q '^configs:$' "$compose"
            grep -q 'platform-prometheus-config' "$compose"
            grep -q 'platform-grafana-prometheus-datasource' "$compose"
            grep -q 'platform-grafana-dashboard-provider' "$compose"
          done

      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name "wkarts"
          git config user.email "57051272+wkarts@users.noreply.github.com"
          git add deploy/platform/compose.yaml deploy/platform-develop/compose.yaml deploy/platform-production/compose.yaml
          git commit -m "fix(platform): torna observabilidade autocontida no Dockge"
          git push origin HEAD:fix/platform-dockge-observability-config
