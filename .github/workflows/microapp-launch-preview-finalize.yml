name: Micro App Launch Preview Finalize

on:
  push:
    branches:
      - fix/microapp-launch-preview-ux

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/microapp-launch-preview-ux
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python3 scripts/apply-microapp-launch-preview.py
      - name: Validate
        run: |
          npx eslint --fix src/api/services/micro-app-auto-launch.ts src/api/services/template-engine.service.ts
          npx eslint src/api/services/micro-app-auto-launch.ts src/api/services/template-engine.service.ts
          node --check manager/dist/assets/template-studio-microapp-preview.js
          npx tsx ./test/template-studio/microapp-preview.test.ts
          npm run test:compat
          npm run docs:check
          git diff --check
      - name: Commit canonical outputs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/services/micro-app-auto-launch.ts src/api/services/template-engine.service.ts manager/dist/template-editor.html manager/dist/assets/template-studio-microapp-preview.js package.json
          git add -f test/template-studio/microapp-preview.test.ts
          git commit --no-verify -m 'fix(microapp): preview app and prefer CTA launch'
          git push --no-verify origin HEAD:fix/microapp-launch-preview-ux
