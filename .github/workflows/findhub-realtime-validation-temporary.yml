name: Find Hub realtime candidate validation
on:
  push:
    branches: [feat/findhub-realtime-traccar-retention]
    paths: [.github/workflows/findhub-realtime-validation-temporary.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply hash-verified candidate without touching deployed environments
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/findhub-realtime-traccar-retention
          git merge-base --is-ancestor 727479848a9a2cb5b3d5e41ad4ba37ac5325aafb HEAD
          python3 - <<'PY'
          import base64,hashlib,lzma
          from pathlib import Path
          parts=sorted(Path('.github/findhub-realtime-source').glob('part*'))
          assert len(parts)==20
          data=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(data).hexdigest()=='94bb36b2e62dc087015e995021049b52cf6af30132764454dcaa6327ca9fe803','Source transport integrity mismatch'
          Path('/tmp/tracking.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --check --unidiff-zero /tmp/tracking.patch
          git apply --index --unidiff-zero /tmp/tracking.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/api/integrations/channel/findhub/services/traccar-client.ts')
          s=p.read_text()
          assert s.count('while (true)') == 1
          p.write_text(s.replace('while (true)', 'while (size <= 4 * 1024 * 1024)'))
          PY
          python3 scripts/sync-operations-deployments.py
          python3 scripts/sync-findhub-deployments.py
          python3 scripts/sync-traccar-deployments.py
          npm run docs:generate
      - name: Install existing dependencies and format changed TypeScript only
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          mapfile -t files < <(git diff --cached --name-only --diff-filter=ACM | grep '^src/.*\.ts$')
          if [ "${#files[@]}" -gt 0 ]; then npx --no-install eslint --fix "${files[@]}"; fi
          npm run lint:check
      - name: Validate complete API and canonical retention in simulation only
        run: |
          set -euo pipefail
          python3 scripts/sync-operations-deployments.py --check
          python3 scripts/sync-findhub-deployments.py --check
          python3 scripts/sync-traccar-deployments.py --check
          python3 scripts/ghcr-retention.py --validate-policy
          npm run docs:check
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Validate all existing Compose variants with Traccar disabled, internal and external
        run: python3 scripts/check-traccar-compose.py
      - name: Start disposable official Traccar and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "TRACCAR_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "TRACCAR_ADMIN_EMAIL=connect-test@example.invalid" >> "$GITHUB_ENV"
          echo "TRACCAR_ENABLED=true" >> "$GITHUB_ENV"
          echo "TRACCAR_MODE=internal" >> "$GITHUB_ENV"
          echo "TRACCAR_INTERNAL_URL=http://127.0.0.1:18082" >> "$GITHUB_ENV"
          echo "TRACCAR_INTERNAL_RECEIVER_URL=http://127.0.0.1:15055" >> "$GITHUB_ENV"
          echo "TRACCAR_INTEGRATION_TEST=true" >> "$GITHUB_ENV"
          docker network create findhub-integration
          docker run -d --name findhub-test-db --network findhub-integration -e POSTGRES_DB=traccar -e POSTGRES_USER=traccar -e POSTGRES_PASSWORD="$password" postgres:15
          for i in $(seq 1 40); do docker exec findhub-test-db pg_isready -U traccar -d traccar && break; sleep 2; done
          docker run -d --name findhub-test-server --network findhub-integration -p 127.0.0.1:18082:8082 -p 127.0.0.1:15055:5055 \
            -e CONFIG_USE_ENVIRONMENT_VARIABLES=true -e DATABASE_DRIVER=org.postgresql.Driver \
            -e DATABASE_URL=jdbc:postgresql://findhub-test-db:5432/traccar -e DATABASE_USER=traccar -e DATABASE_PASSWORD="$password" \
            -e WEB_PORT=8082 -e OSMAND_PORT=5055 -e PROTOCOLS_ENABLE=osmand -e SERVER_STATISTICS= -e GEOCODER_ENABLE=false traccar/traccar:6.15.3-alpine
      - name: Verify idempotent bootstrap, official REST, OsmAnd and WebSocket with synthetic positions
        run: |
          node scripts/traccar-bootstrap.cjs
          node scripts/traccar-bootstrap.cjs
          node test/traccar-live.integration.cjs
      - name: Archive candidate before separating workflow publication
        run: |
          git add -- deploy Docker/swarm docs
          git diff --binary HEAD > /tmp/validated-tracking.patch
          git ls-files -z | tar --null -T - -czf /tmp/validated-tracking-source.tar.gz
      - name: Commit validated non-workflow source only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/findhub-realtime-traccar-retention
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 727479848a9a2cb5b3d5e41ad4ba37ac5325aafb -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions browser-extensions/findhub-auth
          git reset HEAD -- .github/workflows
          git add -u -- . ':!.github/workflows'
          git add -- deploy Docker/swarm docs
          git rm -r .github/findhub-realtime-source
          git diff --cached --quiet -- .github/workflows
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'feat(findhub): add realtime map, account history and optional native Traccar'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/validated-tracking.commit
      - name: Remove only disposable test containers
        if: always()
        run: |
          docker rm -f findhub-test-server findhub-test-db || true
          docker network rm findhub-integration || true
      - name: Archive diagnostic candidate if validation failed
        if: always()
        run: |
          if [ ! -f /tmp/validated-tracking-source.tar.gz ]; then git add -- deploy Docker/swarm docs; git ls-files -z | tar --null -T - -czf /tmp/validated-tracking-source.tar.gz; fi
          if [ ! -f /tmp/validated-tracking.patch ]; then git diff --binary HEAD > /tmp/validated-tracking.patch; fi
          if [ ! -f /tmp/validated-tracking.commit ]; then git rev-parse HEAD > /tmp/validated-tracking.commit; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-realtime-validated-source
          path: |
            /tmp/validated-tracking-source.tar.gz
            /tmp/validated-tracking.patch
            /tmp/validated-tracking.commit
          retention-days: 7
