name: Find Hub - Validate receiver parity correction
on:
  push:
    branches: [fix/findhub-receiver-crypto-parity]
    paths: [.github/workflows/findhub-parity-workspace.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      DATABASE_PROVIDER: postgresql
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply checked correction and remove temporary files
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bc7d61a066e6859634c867beb6a56c57e9b87097 HEAD
          cat .github/findhub-parity-source/part* | base64 -d | xz -d > /tmp/findhub-parity.patch
          echo '96b2df3c2e2f5d5801626638fdd111a3bb7d217539c1f70d23ab447a4d1e89ec  /tmp/findhub-parity.patch' | sha256sum -c -
          git apply --check /tmp/findhub-parity.patch
          git apply /tmp/findhub-parity.patch
          rm -r .github/findhub-parity-source
          rm .github/workflows/findhub-parity-workspace.yml
      - name: Install locked API dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate complete API and compatibility
        run: |
          set -euo pipefail
          {
            npm run db:generate
            npm run lint:check
            npm run docs:check
            npm run test:compat
            npm run build
          } > /tmp/findhub-parity-api.log 2>&1 || { tail -n 160 /tmp/findhub-parity-api.log; exit 1; }
          grep -E '# (tests|pass|fail)|scenarios passed|regression:|compatibility:|Ran [0-9]+ tests|Build success|synchronized' /tmp/findhub-parity-api.log || true
      - name: Validate complete Manager
        working-directory: manager
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm test > /tmp/findhub-parity-manager.log 2>&1 || { tail -n 160 /tmp/findhub-parity-manager.log; exit 1; }
          grep -E '# (tests|pass|fail)|built in' /tmp/findhub-parity-manager.log || true
      - name: Verify protected scope and publish validated source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed='''docs/guides/findhub-protocol-parity.md
          manager/scripts/findhub-channel.test.mjs
          manager/src/views/ChannelsView.vue
          src/api/integrations/channel/findhub/crypto/findhub-crypto.ts
          src/api/integrations/channel/findhub/protocol/fcm.client.ts
          src/api/integrations/channel/findhub/services/findhub-protocol.client.ts
          src/api/integrations/channel/findhub/services/findhub-runtime.service.ts
          test/findhub-live-parity.test.cjs
          test/findhub-tracking.test.cjs
          test/fixtures/findhub-location-parity.json'''.split()
          subprocess.run(['git','add','-u'],check=True)
          subprocess.run(['git','add','-f','--',*allowed],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only','bc7d61a066e6859634c867beb6a56c57e9b87097'],text=True).splitlines()
          assert set(changed)==set(allowed), f'Unexpected changes: {set(changed)^set(allowed)}'
          print('Protected sources, auth, extension and deploy unchanged. Files:',len(changed))
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(findhub): align network crypto and preserve asynchronous location updates'
          git push origin HEAD:refs/heads/fix/findhub-receiver-crypto-parity
          mkdir -p /tmp/findhub-parity-validated
          git rev-parse HEAD | tee /tmp/findhub-parity-validated/commit.txt
          git rev-parse HEAD^{tree} | tee /tmp/findhub-parity-validated/tree.txt
          git diff --binary bc7d61a066e6859634c867beb6a56c57e9b87097 HEAD > /tmp/findhub-parity-validated/correction.patch
          git archive --format=tar.gz HEAD > /tmp/findhub-parity-validated/source.tar.gz
          cp /tmp/findhub-parity-api.log /tmp/findhub-parity-manager.log /tmp/findhub-parity-validated/
      - uses: actions/upload-artifact@v4
        with:
          name: findhub-parity-validated
          path: /tmp/findhub-parity-validated
          retention-days: 7
