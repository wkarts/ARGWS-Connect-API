name: Temporary Zapo Formatter Repair

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply exact formatter repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts')
          text = path.read_text(encoding='utf-8')
          old = "      audio = (await this.resolveMediaInput(data.audio, file, 'audio/ogg; codecs=opus', 'audio/ogg; codecs=opus')).buffer;"
          new = "      audio = (await this.resolveMediaInput(data.audio, file, 'audio/ogg; codecs=opus', 'audio/ogg; codecs=opus'))\n        .buffer;"
          if old not in text:
              raise SystemExit('Expected Zapo audio line was not found; refusing broad rewrite')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          FILE='src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts'
          HASH="$(sha256sum "$FILE" | awk '{print $1}')"
          python - "$HASH" <<'PY'
          from pathlib import Path
          import re
          import sys

          digest = sys.argv[1]
          manifest = Path('MANIFEST.sha256')
          text = manifest.read_text(encoding='utf-8')
          target = 'src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts'
          pattern = rf'^[0-9a-f]{{64}}  {re.escape(target)}$'
          replacement = f'{digest}  {target}'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('Zapo manifest entry was not found exactly once')
          manifest.write_text(updated, encoding='utf-8', newline='\n')
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts MANIFEST.sha256
          git commit -m 'fix(ci): apply canonical Prettier layout for Zapo audio'
          git push origin HEAD:develop
