name: Temporary reviewed Tauri source import

# Development transfer only. Exact source payload, allowlist and Git tree checked.
# Removed before the final PR build; does not execute a deployer or connect to a VPS.
on:
  push:
    branches: ['feat/connect-deployer-tauri-rust']
    paths:
      - '.github/tauri-source-part-*.xz'
      - '.github/workflows/tauri-source-sync.yml'
permissions:
  contents: write
jobs:
  import-reviewed-source:
    if: github.repository == 'wkarts/ARGWS-Connect-API' && github.ref == 'refs/heads/feat/connect-deployer-tauri-rust'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Apply only the reviewed deployer replacement
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, shutil, subprocess, tempfile
          from PIL import Image
          branch = 'refs/heads/feat/connect-deployer-tauri-rust'
          assert os.environ['GITHUB_REF'] == branch
          assert os.environ['GITHUB_REPOSITORY'] == 'wkarts/ARGWS-Connect-API'
          def git(*args, **kw):
              return subprocess.check_output(['git', *args], **kw)
          assert git('rev-parse', 'HEAD^').decode().strip() == '4a9925b7618266e020a6c395d07efe6ccf60f6ed'
          assert git('rev-parse', 'HEAD^:' ).decode().strip() == '0bf6925c1917649b87623676a84c7c6081adbc31'
          parts = [pathlib.Path(f'.github/tauri-source-part-{i}.xz') for i in range(9)]
          packed = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(packed).hexdigest() == 'aa89632579db48954cde4901ff4311ae12b802166084e16a57803bafddcdb92e'
          records = json.loads(lzma.decompress(packed))
          assert len(records) == 100
          workflow_path = '.github/workflows/connect-deployer-binaries.yml'
          deferred = None
          for item in records:
              name = item['path']
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith('tools/connect-deployer/') or name in {
                  'README.md', 'docs/guides/connect-deployer-binaries.md', workflow_path}
              if name == workflow_path:
                  deferred = item['text'].encode()
                  continue  # Workflow writes are performed by the repository connector separately.
              if item.get('delete'):
                  path.unlink()
                  continue
              if item.get('generate_icon'): continue
              path.parent.mkdir(parents=True, exist_ok=True)
              if 'copy_from' in item:
                  assert item['copy_from'] == 'install-connect.py'
                  data = pathlib.Path(item['copy_from']).read_bytes()
              elif 'base64' in item:
                  data = base64.b64decode(item['base64'], validate=True)
              else:
                  data = item['text'].encode()
              path.write_bytes(data)
              path.chmod(item['mode'])
          # Reproduce the submitted icon derivatives, then verify all original icon hashes.
          root = pathlib.Path('tools/connect-deployer')
          icon_dir = root/'src-tauri/icons'
          image = Image.open(icon_dir/'icon.png')
          for size, name in [(32, '32x32.png'), (128, '128x128.png'), (256, '128x128@2x.png')]:
              image.resize((size, size), Image.Resampling.LANCZOS).save(icon_dir/name)
          image.save(icon_dir/'icon.ico', format='ICO')
          image.save(icon_dir/'icon.icns', format='ICNS')
          source = json.loads((root/'SOURCE-IMPORT.json').read_text())['files']
          for path in icon_dir.iterdir():
              expected = source[path.relative_to(root).as_posix()]['sha256']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, str(path)
          git('add', '-A', '--', 'tools/connect-deployer', 'README.md', 'docs/guides/connect-deployer-binaries.md')
          # Compare the intended final tree without the temporary transfer files.
          with tempfile.TemporaryDirectory() as tmp:
              index = pathlib.Path(tmp)/'index'
              shutil.copyfile('.git/index', index)
              env = dict(os.environ, GIT_INDEX_FILE=str(index))
              git('rm', '--cached', '--', *map(str, parts), '.github/workflows/tauri-source-sync.yml', env=env)
              blob = git('hash-object', '-w', '--stdin', input=deferred).decode().strip()
              git('update-index', '--cacheinfo', f'100644,{blob},{workflow_path}', env=env)
              assert git('write-tree', env=env).decode().strip() == 'e4cf53d940435ce38e27b05fb0b66bc3e907a7dd'
          changed = git('diff', '--cached', '--name-only').decode().splitlines()
          assert all(p.startswith('tools/connect-deployer/') or p in {'README.md', 'docs/guides/connect-deployer-binaries.md'} for p in changed)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'feat(deployer): substitui launcher Python pelo Tauri/Rust fornecido')
          git('push', 'origin', 'HEAD:' + branch)
