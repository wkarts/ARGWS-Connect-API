name: Canonical registry inventory (read only)
on:
  push:
    branches: [feat/findhub-realtime-traccar-retention]
    paths: [.github/workflows/retention-inventory-temporary.yml]
permissions:
  contents: read
  packages: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install registry reader
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Read protected aliases and canonical digests only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p inventory
          python3 - <<'PY'
          import json, os, subprocess
          owner=os.environ['GITHUB_REPOSITORY'].split('/')[0]
          output={}
          for package in ['argws-connect-api','argws-connect-manager','argws-connect-docs']:
              output[package]={}
              for tag in ['1.1.3','latest','develop']:
                  image=f'ghcr.io/{owner}/{package}:{tag}'
                  try:
                      result=subprocess.run(['skopeo','inspect','--raw','docker://'+image],capture_output=True,check=True,timeout=45)
                      manifest=json.loads(result.stdout)
                      digest=subprocess.run(['skopeo','inspect','--format','{{.Digest}}','docker://'+image],capture_output=True,check=True,timeout=45).stdout.decode().strip()
                      output[package][tag]={'digest':digest,'mediaType':manifest.get('mediaType'),'children':[x.get('digest') for x in manifest.get('manifests',[])]}
                  except Exception:
                      output[package][tag]={'error':'NOT_VERIFIED_PRESERVE'}
          with open('inventory/canonical-aliases.json','w') as f:json.dump(output,f,indent=2)
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-registry-inventory
          path: inventory/canonical-aliases.json
          retention-days: 7
