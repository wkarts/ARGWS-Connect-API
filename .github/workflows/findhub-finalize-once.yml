name: FindHub Finalize Once

on:
  push:
    branches:
      - feat/google-find-hub-channel

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/google-find-hub-channel
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Find Hub TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          crypto = Path('src/api/integrations/channel/findhub/crypto/findhub-crypto.ts')
          text = crypto.read_text()
          text = text.replace('let state = Buffer.alloc(16);', 'let state: Buffer = Buffer.alloc(16);')
          crypto.write_text(text)

          fcm = Path('src/api/integrations/channel/findhub/protocol/fcm.client.ts')
          text = fcm.read_text()
          text = text.replace('body,\n  });', 'body: Uint8Array.from(body),\n  });', 1)
          text = text.replace('function encodeheartbeatStat()', 'function encodeHeartbeatStat()')
          text = text.replace('while (true) {', 'while (this.receiveBuffer.length > 0) {')
          fcm.write_text(text)

          nova = Path('src/api/integrations/channel/findhub/protocol/nova.client.ts')
          text = nova.read_text()
          text = text.replace('body: payload,', 'body: Uint8Array.from(payload),')
          nova.write_text(text)

          protocol = Path('src/api/integrations/channel/findhub/services/findhub-protocol.client.ts')
          text = protocol.read_text()
          text = text.replace(
              "public async locate(_device: FindHubDevice): Promise<FindHubPosition[]> {\n    throw new Error(",
              "public async locate(_device: FindHubDevice): Promise<FindHubPosition[]> {\n    void _device;\n    throw new Error(",
          )
          protocol.write_text(text)

      - name: Auto-format Find Hub backend
        run: >-
          npx eslint --fix --ext .ts
          src/api/integrations/channel/findhub
          src/api/dto/findhub.dto.ts
          src/validate/findhub.schema.ts

      - name: Generate OpenAPI and AsyncAPI
        run: npm run docs:generate

      - name: Remove one-time workflow
        run: rm .github/workflows/findhub-finalize-once.yml

      - name: Commit generated result
        shell: bash
        run: |
          git config user.name "wkarts"
          git config user.email "57051272+wkarts@users.noreply.github.com"
          git add src/api/integrations/channel/findhub src/api/dto/findhub.dto.ts src/validate/findhub.schema.ts docs/openapi docs/asyncapi .github/workflows/findhub-finalize-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          HUSKY=0 git commit -m "chore(findhub): finalize formatting and generated contracts"
          git push origin HEAD:feat/google-find-hub-channel
