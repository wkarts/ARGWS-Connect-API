name: One-shot Session Client Env

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: contains(github.event.head_commit.message, 'prepara padronização do client de sessão')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize official env templates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          value = '🅲🅾🅽🅽🅴🅲🆃​|🅰🅿🅸'
          files = [
              Path('deploy/production/env.example'),
              Path('deploy/develop/env.example'),
              Path('deploy/canonical/env.example'),
              Path('deploy/homologation/env.example'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              replaced = False
              for i, line in enumerate(lines):
                  if line.startswith('CONFIG_SESSION_PHONE_CLIENT='):
                      lines[i] = f'CONFIG_SESSION_PHONE_CLIENT={value}'
                      replaced = True
              if not replaced:
                  raise SystemExit(f'Missing CONFIG_SESSION_PHONE_CLIENT in {path}')
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          grep -n '^CONFIG_SESSION_PHONE_CLIENT=' deploy/production/env.example deploy/develop/env.example deploy/canonical/env.example deploy/homologation/env.example
      - name: Validate
        run: |
          npm ci
          npm run lint:check
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Commit normalized envs and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_one-shot-session-client-env.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(config): padroniza identidade de sessão CONNECT API [skip release]'
          git push origin HEAD:main
