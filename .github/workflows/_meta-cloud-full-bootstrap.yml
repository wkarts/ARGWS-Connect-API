name: Meta Cloud Compatibility Full Bootstrap

on:
  push:
    branches:
      - feature/meta-cloud-compatible-v1

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[meta-full-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v5
        with:
          ref: feature/meta-cloud-compatible-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Materialize full implementation
        run: python3 .github/scripts/_implement_meta_cloud_full.py

      - name: Normalize implementation against current project types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = Path('src/api/compat/meta-cloud/meta-cloud-version.ts')
          version.write_text("export const isMetaGraphVersion = (version: string) => /^v[0-9]+\\.[0-9]+$/.test(version || '');\n", encoding='utf-8')

          router = Path('src/api/compat/meta-cloud/meta-cloud-graph.router.ts')
          text = router.read_text(encoding='utf-8')
          local = "export const isMetaGraphVersion = (version: string) => /^v[0-9]+\\.[0-9]+$/.test(version || '');\n\n"
          text = text.replace(local, '')
          anchor = "import { MetaCloudRateLimiter } from './meta-cloud-rate-limiter';\n"
          if "from './meta-cloud-version'" not in text:
              if anchor not in text:
                  raise SystemExit('graph router import anchor not found')
              text = text.replace(anchor, anchor + "import { isMetaGraphVersion } from './meta-cloud-version';\n", 1)
          text = text.replace('req.file,', '(req as any).file,')
          router.write_text(text, encoding='utf-8')

          media = Path('src/api/compat/meta-cloud/meta-cloud-media.service.ts')
          text = media.read_text(encoding='utf-8')
          text = text.replace('file: Express.Multer.File | undefined', 'file: any')
          media.write_text(text, encoding='utf-8')

          graph = Path('src/api/compat/meta-cloud/meta-cloud-graph.controller.ts')
          text = graph.read_text(encoding='utf-8')
          text = text.replace('file: Express.Multer.File,', 'file: any,')
          graph.write_text(text, encoding='utf-8')

          adapter = Path('src/api/compat/meta-cloud/meta-cloud-message.adapter.ts')
          text = adapter.read_text(encoding='utf-8')
          text = text.replace("          participant: key?.participant,\n", '')
          adapter.write_text(text, encoding='utf-8')

          p = Path('test/meta-cloud/contract.test.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "import { isMetaGraphVersion } from '../../src/api/compat/meta-cloud/meta-cloud-graph.router';",
              "import { isMetaGraphVersion } from '../../src/api/compat/meta-cloud/meta-cloud-version';",
          )
          marker = 'const calls: string[] = [];'
          if 'async function main() {' not in text:
              if marker not in text:
                  raise SystemExit('contract test marker not found')
              text = text.replace(marker, 'async function main() {\n' + marker, 1)
              text = text.rstrip() + '\n}\n\nvoid main();\n'
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install packages
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Compatibility tests
        run: npm run test:compat

      - name: Apply repository lint autofix
        run: npm run lint

      - name: Lint check
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Remove bootstrap implementation files
        run: |
          rm -f .github/scripts/_implement_meta_cloud_full.py
          rm -f .github/workflows/_meta-cloud-full-bootstrap.yml

      - name: Commit validated implementation
        run: |
          git config user.name "wkarts"
          git config user.email "57051272+wkarts@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(meta-compat): implementa Meta Cloud Compatible Layer v1 [meta-full-generated]"
          git push origin HEAD:feature/meta-cloud-compatible-v1
