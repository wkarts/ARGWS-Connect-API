name: Apply verified local template source package (one time)
on:
  push:
    branches: [feat/local-template-catalog]
    paths: [.github/workflows/apply-local-template-catalog-once.yml]
permissions:
  contents: write
concurrency:
  group: apply-local-template-catalog-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wkarts/ARGWS-Connect-API' && github.ref == 'refs/heads/feat/local-template-catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify source package and apply only to this branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fa612808994faacb820d5f2be950f73c090c5994 HEAD
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, re, subprocess
          folder = pathlib.Path('scripts/.local-template-apply')
          encoded = ''.join((folder / f'part-{i:02d}.b64').read_text().strip() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 119681, 'Unexpected patch size'
          assert hashlib.sha256(patch).hexdigest() == '6f0cbf016b450461fcb73fbefb7d580b9fb364e3a4716290e3c7bda4f428f28d', 'Patch integrity failure'
          paths = re.findall(rb'^diff --git a/(\S+) b/(\S+)$', patch, re.M)
          assert len(paths) == 37, 'Unexpected file count'
          for left, right in paths:
              path = right.decode()
              assert left == right and not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              assert path == '.gitignore' or path.startswith(('docs/guides/', 'docs/scripts/', 'manager/src/', 'prisma/', 'src/', 'test/'))
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          print('Verified patch applied: 37 source files. No production system accessed.')
          PY
          node docs/scripts/generate-openapi.mjs
          node docs/scripts/generate-openapi.mjs --check
          git add docs/openapi/connect-api.openapi.json docs/openapi/meta-compatible.openapi.json docs/openapi/coverage.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(templates): persist, manage and serve instance-scoped local templates'
          git push origin HEAD:refs/heads/feat/local-template-catalog
          echo "Applied source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No merge, release, image publication, database migration or WhatsApp delivery was executed.' >> "$GITHUB_STEP_SUMMARY"
