name: Connect API Branding Bootstrap

on:
  push:
    branches: [feat/connect-api-branding]

permissions:
  contents: write

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/connect-api-branding
          fetch-depth: 0
      - name: Apply branding
        run: python3 .github/scripts/_apply_connect_api_branding.py
      - name: Validate branding
        run: |
          node --check manager/dist/assets/argws-runtime-fixes.js
          python3 -m json.tool manager/dist/manifest.webmanifest >/dev/null
          grep -Fq '<title>Connect|API</title>' manager/dist/index.html
          grep -Fq 'Connect|API' manager/dist/manifest.webmanifest
          test -f manager/dist/favicon.svg
          test -f manager/dist/apple-touch-icon.png
          test -f manager/dist/icons/icon-192x192.png
          test -f manager/dist/icons/icon-512x512.png
          test -f manager/dist/assets/images/argws-connect-logo-horizontal.svg
          test -f manager/dist/assets/images/argws-connect-logo-dark.svg
          test -f manager/dist/assets/images/argws-connect-compact-symbol.png
          ! grep -E -n 'ARGWS Connect API|ARGWS Connect|Connect Manager' manager/dist/index.html manager/dist/manifest.webmanifest manager/dist/assets/index-CO3NSIFj.js
          test ! -d manager/dist/assets/branding
      - name: Commit branding
        run: |
          git config user.name wkarts
          git config user.email 57051272+wkarts@users.noreply.github.com
          git add -A
          git status --short
          git commit -m 'feat(branding): aplica identidade pública Connect|API [branding-applied]'
          git push origin HEAD:feat/connect-api-branding
