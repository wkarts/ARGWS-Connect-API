name: Connect|API Deployer

on:
  pull_request:
    paths:
      - 'tools/connect-deployer/**'
      - 'deploy/**/compose.yaml'
      - 'deploy/**/docker-compose.yml'
      - 'deploy/**/env.example'
      - '.github/workflows/connect-deployer.yml'
  push:
    branches: [develop]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix tools/connect-deployer

  binaries:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        include:
          - target: node22-win-x64
            suffix: win-x64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/connect-deployer/build-assets.cjs
      - run: npx --yes @yao-pkg/pkg@6.23.0 --no-signature tools/connect-deployer/index.cjs --targets ${{ matrix.target }} --output argws-connect-deployer-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: argws-connect-deployer-${{ matrix.suffix }}-${{ github.sha }}
          path: argws-connect-deployer-${{ matrix.suffix }}
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: argws-connect-deployer-win-x64.exe-${{ github.sha }}
          path: release
      - name: Generate checksum
        working-directory: release
        run: sha256sum argws-connect-deployer-win-x64.exe > SHA256SUMS.txt
      - name: Generate build provenance
        working-directory: release
        env:
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node -e "require('fs').writeFileSync('connect-deployer-release.json', JSON.stringify({channel:'stable', version:process.env.RELEASE_VERSION, sourceRevision:process.env.SOURCE_REVISION, binary:'argws-connect-deployer-win-x64.exe'}, null, 2)+'\\n')"
      - name: Publish Windows binary to the tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          asset="release/argws-connect-deployer-win-x64.exe"
          checksum="release/SHA256SUMS.txt"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" "$checksum" release/connect-deployer-release.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" "$checksum" release/connect-deployer-release.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Connect|API Deployer $GITHUB_REF_NAME" \
              --generate-notes

  publish-develop:
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v5
        with:
          name: argws-connect-deployer-win-x64.exe-${{ github.sha }}
          path: release
      - name: Generate checksum
        working-directory: release
        run: sha256sum argws-connect-deployer-win-x64.exe > SHA256SUMS.txt
      - name: Generate build provenance
        working-directory: release
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: node -e "require('fs').writeFileSync('connect-deployer-release.json', JSON.stringify({channel:'develop', sourceRevision:process.env.SOURCE_REVISION, binary:'argws-connect-deployer-win-x64.exe'}, null, 2)+'\\n')"
      - name: Publish the moving development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not let a delayed runner overwrite a newer develop build.
          current="$(git ls-remote origin refs/heads/develop | awk '{print $1}')"
          test "$current" = "$GITHUB_SHA"
          tag="connect-api-develop"
          title="Connect|API develop (pré-release contínua)"
          notes="Pré-release contínua do Connect|API para develop. Os binários são substituídos a cada build válido e a versão oficial só é criada em uma release vX.Y.Z."
          asset="release/argws-connect-deployer-win-x64.exe"
          checksum="release/SHA256SUMS.txt"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$checksum" release/connect-deployer-release.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease --latest=false
          else
            if ! gh release create "$tag" "$asset" "$checksum" release/connect-deployer-release.json --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "$title" --notes "$notes"; then
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
              gh release upload "$tag" "$asset" "$checksum" release/connect-deployer-release.json --repo "$GITHUB_REPOSITORY" --clobber
            fi
          fi
