name: Connect|API Deployer

on:
  pull_request:
    paths:
      - 'tools/connect-deployer/**'
      - 'deploy/**/compose.yaml'
      - 'deploy/**/docker-compose.yml'
      - 'deploy/**/env.example'
      - '.github/workflows/connect-deployer.yml'
  push:
    branches: [develop, main]
    tags:
      - 'v*'
    paths:
      - 'tools/connect-deployer/**'
      - 'deploy/**/compose.yaml'
      - 'deploy/**/docker-compose.yml'
      - 'deploy/**/env.example'
      - '.github/workflows/connect-deployer.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix tools/connect-deployer

  binaries:
    if: github.event_name == 'push'
    needs: test
    strategy:
      matrix:
        include:
          - target: node22-win-x64
            suffix: win-x64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/connect-deployer/build-assets.cjs
      - run: npx --yes @yao-pkg/pkg@6.23.0 --no-signature tools/connect-deployer/index.cjs --targets ${{ matrix.target }} --output argws-connect-deployer-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: argws-connect-deployer-${{ matrix.suffix }}-${{ github.sha }}
          path: argws-connect-deployer-${{ matrix.suffix }}
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: argws-connect-deployer-win-x64.exe-${{ github.sha }}
          path: release
      - name: Generate checksum
        working-directory: release
        run: sha256sum argws-connect-deployer-win-x64.exe > SHA256SUMS.txt
      - name: Publish Windows binary to the tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          asset="release/argws-connect-deployer-win-x64.exe"
          checksum="release/SHA256SUMS.txt"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" "$checksum" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" "$checksum" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Connect|API Deployer $GITHUB_REF_NAME" \
              --generate-notes
          fi
