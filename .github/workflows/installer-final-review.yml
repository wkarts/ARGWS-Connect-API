name: Temporary installer credential isolation source update
on:
  push:
    branches: ['fix/provisioning-universal-installer']
    paths: ['.github/installer-final-review.patch', '.github/workflows/installer-final-review.yml']
permissions:
  contents: write
jobs:
  reviewed-update:
    if: github.repository == 'wkarts/ARGWS-Connect-API' && github.ref == 'refs/heads/fix/provisioning-universal-installer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only reviewed installer security fix
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess
          branch = 'refs/heads/fix/provisioning-universal-installer'
          assert os.environ['GITHUB_REF'] == branch
          assert os.environ['GITHUB_REPOSITORY'] == 'wkarts/ARGWS-Connect-API'
          patch = pathlib.Path('.github/installer-final-review.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == '6ba93e8dd568179a7e5b8cf9266b7943440c975839e5243035fdcefc4acc122f'
          def git(*args, **kwargs): return subprocess.run(['git', *args], check=True, **kwargs)
          git('merge-base', '--is-ancestor', '311504cc307c21ea954c04e5c56ed1584c0c9489', 'HEAD')
          git('apply', '--unidiff-zero', '--check', '--index', '-', input=patch)
          git('apply', '--unidiff-zero', '--index', '-', input=patch)
          names = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert names == {'install-connect.py', 'test/installer/test_installer.py'}
          git('diff', '--cached', '--check')
          subprocess.run(['python', '-B', '-m', 'unittest', 'discover', '-s', 'test/installer'], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'fix(installer): isola login temporário e mantém modo plano sem gravação')
          git('push', 'origin', 'HEAD:' + branch)
