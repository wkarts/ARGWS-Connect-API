name: Normalize approved template contract (one time)

on:
  push:
    branches: [feat/local-template-catalog]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/local-template-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
      - name: Normalize semantic guides and schema descriptions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/scripts/meta-compatible-schemas.mjs': [
                  ("Business mantém o envio oficial. ZAPO/Baileys executam modelo local persistido como texto; sem aprovação Meta e sem fallback de conteúdo.",
                   "Business mantém o envio oficial. ZAPO/Baileys executam o template persistido da instância com status APPROVED e sem fallback de conteúdo."),
              ],
              'docs/guides/messages.md': [
                  ('## Modelos locais e templates oficiais', '## Templates por instância e templates Business'),
                  ('`sendTemplate` agora distingue a integração: Business continua no método oficial;\nZAPO/Baileys usam o catálogo persistido por instância `LocalTemplate`, renderizado\nexplicitamente como texto. Não são templates aprovados pela Meta. A listagem e o\nenvio Graph também expõem esse contrato. Veja [Modelos locais](local-templates.md)\npara migrations, administração, parâmetros, revisão e limitações de formato.',
                   '`sendTemplate` distingue a integração: Business continua no método oficial;\nZAPO/Baileys usam o catálogo persistido por instância `LocalTemplate`. Esses registros\nsão expostos como `APPROVED`; `enabled`/`available` controlam a disponibilidade.\nA categoria é `OPENING` (Abertura de conversa no HUB). A listagem e o envio Graph\nexpõem o mesmo contrato. Veja [Templates por instância](local-templates.md).'),
              ],
              'docs/guides/meta-compatible.md': [
                  ('- `WHATSAPP-BAILEYS` e `WHATSAPP-ZAPO`: catálogo local persistido por instância, com `source=connectapi_local`, `execution=rendered_text`, `meta_approved=false` e estados `LOCAL_READY`/`LOCAL_DISABLED`;',
                   '- `WHATSAPP-BAILEYS` e `WHATSAPP-ZAPO`: catálogo persistido por instância, com `source=connectapi_local`, `execution=rendered_text`, `status=APPROVED`, `approved=true` e categoria `OPENING`;'),
                  ('- `type: template` agora é aceito em `/messages`: Business preserva o envio oficial; conexões locais validam e executam exclusivamente um cadastro disponível. Modelo inexistente/desabilitado, versão divergente ou parâmetros inválidos impedem o envio.',
                   '- `type: template` é aceito em `/messages`: Business preserva o envio oficial; ZAPO/Baileys validam e executam exclusivamente o template persistido disponível. Template inexistente/desabilitado, versão divergente ou parâmetros inválidos impedem o envio.'),
                  ('Consulte [Modelos locais e integração com o HUB](local-templates.md).',
                   'Consulte [Templates por instância e integração com o HUB](local-templates.md).'),
              ],
              'docs/guides/troubleshooting.md': [
                  ('`source=connectapi_local` e `status=LOCAL_READY`, e depois a caixa deve ser reconciliada.',
                   '`source=connectapi_local`, `status=APPROVED`, `approved=true` e categoria `OPENING`; depois a caixa deve ser reconciliada.'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {filename}: {old[:80]}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Regenerate and verify OpenAPI
        run: |
          npm run docs:generate
          npm run docs:check
      - name: Remove one-time workflow and commit result
        run: |
          git rm .github/workflows/normalize-template-contract-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'docs(templates): align approved opening contract'
            HUSKY=0 git push origin HEAD:feat/local-template-catalog
          fi
