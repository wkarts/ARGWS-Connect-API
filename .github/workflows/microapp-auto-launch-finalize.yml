name: Micro App Auto Launch Finalize

on:
  push:
    branches:
      - feat/microapp-auto-launch-demo

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/microapp-auto-launch-demo
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Apply implementation patch
        run: python3 scripts/apply-microapp-auto-launch.py
      - name: Validate
        run: |
          npx eslint --fix src/api/services/template-engine.service.ts src/api/services/micro-app.service.ts src/api/services/micro-app-auto-launch.ts src/api/server.module.ts
          npx eslint src/api/services/template-engine.service.ts src/api/services/micro-app.service.ts src/api/services/micro-app-auto-launch.ts src/api/server.module.ts
          npx tsx ./test/micro-app/auto-launch.test.ts
          node -e "JSON.parse(require('fs').readFileSync('docs/examples/microapp-internal-showcase.argws','utf8')); console.log('demo bundle: ok')"
          npm run docs:check
          git diff --check
      - name: Commit canonical outputs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/services/template-engine.service.ts src/api/services/micro-app.service.ts src/api/services/micro-app-auto-launch.ts src/api/server.module.ts package.json docs/examples/microapp-internal-showcase.argws docs/guides/micro-app-auto-launch-demo.md scripts/apply-microapp-auto-launch.py
          git add -f test/micro-app/auto-launch.test.ts
          git commit --no-verify -m 'feat(microapp): auto-generate internal launch links and offline showcase'
          git push --no-verify origin HEAD:feat/microapp-auto-launch-demo
