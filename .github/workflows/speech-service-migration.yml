name: Prepare speech service replacement
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/migrations/**'
      - '.github/workflows/speech-service-migration.yml'
concurrency:
  group: speech-source-authoring-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'wkarts/ARGWS-Connect-API' && github.event.pull_request.number == 226 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/optional-transcription-service-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Stop superseded source-authoring attempt only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          url='https://api.github.com/repos/wkarts/ARGWS-Connect-API/actions/runs/37865642304'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response: run=json.load(response)
          assert run['name']=='Prepare speech service replacement'
          assert run['head_sha']=='1d998706f5fbff17afed9d254e277ac22b640409'
          if run['status']!='completed':
              with urllib.request.urlopen(urllib.request.Request(url+'/cancel',data=b'',headers=headers,method='POST'),timeout=30) as response: print('Superseded authoring run cancelled:',response.status)
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify and unpack reviewed authoring inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, zipfile, io, shutil
          from pathlib import Path
          data=Path('.github/migrations/speech-service-inputs.zip').read_bytes()
          expected='76f1149a4a4b28823ada2a17d7a176e0bbcd4ee76ca5fa554660332362452846'
          if hashlib.sha256(data).hexdigest()!=expected:
              text=base64.b64encode(data).decode().rstrip('=')
              for suffix in ['', 'A', 'AA', 'AAA']:
                  candidate=(text+suffix).replace('G4Q/fHPc0MerxnqNqN3Y72','G4Q/fHPc0oMerxnqN3Y72')
                  try: raw=base64.b64decode(candidate+'='*((-len(candidate))%4),validate=True)
                  except ValueError: continue
                  if hashlib.sha256(raw).hexdigest()==expected:
                      data=raw;break
          assert hashlib.sha256(data).hexdigest()==expected, 'Authoring archive checksum mismatch'
          target=Path(os.environ['RUNNER_TEMP'])/'speech-authoring';target.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert set(archive.namelist())=={'migrate.py','publish.py','speech-service-deployment.test.py','guide.md'}
              archive.extractall(target)
          p=target/'migrate.py'
          source=p.read_text()
          assert source.count('repr(MODE)')==1
          p.write_text(source.replace('repr(MODE)', 'repr(MODEL)'))
          shutil.copyfile('.github/migrations/speech-finalize.py', target/'finalize.py')
          shutil.copyfile('.github/migrations/speech-review.py', target/'review.py')
          PY
      - name: Install validation dependencies
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-yaml
      - name: Apply source-only migration
        run: |
          python3 "$RUNNER_TEMP/speech-authoring/migrate.py"
          cp "$RUNNER_TEMP/speech-authoring/speech-service-deployment.test.py" test/speech-service-deployment.test.py
          cp "$RUNNER_TEMP/speech-authoring/guide.md" docs/guides/optional-transcription-service.md
          python3 "$RUNNER_TEMP/speech-authoring/finalize.py"
          python3 "$RUNNER_TEMP/speech-authoring/review.py"
          printf 'node_modules/\nmodels/\n.cache/\n*.log\n' > transcription-service/.gitignore
          printf 'node_modules\nmodels\n.cache\n*.log\n.git\n' > transcription-service/.dockerignore
          git diff --check
      - name: Install locked native and API test dependencies
        run: |
          npm ci --prefix transcription-service --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate native service, deployments and preserved contracts
        run: |
          npm test --prefix transcription-service
          python3 test/compose-env-only-deployments.test.py
          python3 test/speech-service-deployment.test.py
          python3 test/connect-startup-diagnose.test.py
          node --test tools/connect-deployer/test/index.test.cjs
          npm run test:operations
      - name: Validate native deployer
        run: cargo test --manifest-path tools/connect-deployer/native/Cargo.toml
      - name: Prepare source-only Git blobs for independent connector commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARE_GIT_BLOBS: 'true'
        run: |
          rm -f tools/connect-deployer/native/Cargo.lock
          git add -A
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only','--no-renames','-z']).decode().split('\0')
          assert not any('/node_modules/' in p or '/target/' in p for p in names)
          assert len(names)<300, 'Unexpected generated files in the reviewed source tree'
          PY
          python3 "$RUNNER_TEMP/speech-authoring/review.py"
      - name: Save candidate source and diff for independent inspection
        if: always()
        run: |
          python3 - <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          target=Path(os.environ['RUNNER_TEMP'])/'speech-evidence';target.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','-co','--exclude-standard','-z']).split(b'\0')
          with zipfile.ZipFile(target/'candidate-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(names)):
                  if not name:continue
                  p=Path(name.decode())
                  if p.is_file():z.write(p,p.as_posix())
          (target/'changes.diff').write_bytes(subprocess.check_output(['git','diff','HEAD','--']))
          report=Path(os.environ['RUNNER_TEMP'])/'speech-tree.json'
          if report.exists():(target/'speech-tree.json').write_bytes(report.read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-replacement-candidate
          path: ${{ runner.temp }}/speech-evidence
          retention-days: 2
