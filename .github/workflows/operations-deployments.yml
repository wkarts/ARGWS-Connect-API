name: Operations Deployment and Statistics
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: Check generated templates without rewriting sources
        run: |
          python3 scripts/sync-operations-deployments.py --check
          python3 scripts/sync-fersoft-deployments.py --check
      - name: Validate declarative deployment templates
        run: |
          python3 test/deploy-operations.test.py
          python3 test/compose-env-only-deployments.test.py
          python3 test/package-operations-deployments.test.py
      - name: Validate all active layouts with operations enabled and disabled
        run: python3 test/operations-compose-contract.py
      - name: Test statistics calculations, privacy and archived runtime reads
        run: node --test test/operations-statistics.test.cjs test/operations-statistics-http.test.cjs
      - name: Enforce Compose plus environment deployment contract
        run: |
          set -euo pipefail
          ! find deploy -type f \( -name '*.py' -o -name '*.sh' -o -name '*.cjs' \) -print -quit | grep -q .
          ! find deploy -type d -name full-stack -print -quit | grep -q .
      - name: Package deployment templates without runtime secrets
        run: python3 scripts/package-operations-deployments.py --revision "$(git rev-parse HEAD)"
      - name: Upload verified deployment package
        # PRs retain integrity evidence in logs and the step summary; publishing keeps transport required.
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: connect-deployments-operations
          path: Connect-API-Deployments-Operations.zip
          if-no-files-found: error
          retention-days: 7
