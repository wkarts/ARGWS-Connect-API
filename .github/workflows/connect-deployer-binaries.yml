name: Connect Deployer - Build Binaries

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'tools/connect-deployer/**'
      - 'install-connect.py'
      - 'VERSION'
      - '.github/workflows/connect-deployer-binaries.yml'
      - '.github/workflows/auto-version-release.yml'
      - 'docs/guides/connect-deployer-binaries.md'
  push:
    branches: [develop]
    paths:
      - 'tools/connect-deployer/**'
      - 'install-connect.py'
      - 'VERSION'
      - '.github/workflows/connect-deployer-binaries.yml'
      - '.github/workflows/auto-version-release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact release commit from the canonical application release workflow
        required: false
        type: string
        default: ''
      release_tag:
        description: Existing stable application release; never creates a new release/tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: connect-deployer-${{ github.event_name }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Bind binaries to Connect API source
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate project revision and release ownership
        id: source
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, pathlib, re, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          sha = git('rev-parse', 'HEAD')
          version = pathlib.Path('VERSION').read_text().strip()
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          tag = os.environ.get('RELEASE_TAG', '')
          if tag:
              assert os.environ['GITHUB_REF'] == 'refs/heads/main', 'Stable assets require main'
              assert os.environ['GITHUB_EVENT_NAME'] != 'pull_request'
              assert tag == 'v' + version, 'Release tag and project version differ'
              assert git('rev-parse', 'refs/tags/' + tag + '^{commit}') == sha
              subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'refs/remotes/origin/main'], check=True)
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + tag,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              assert release['tag_name'] == tag and not release['draft'] and not release['prerelease']
              channel = 'stable'
          else:
              channel = 'pr' if os.environ['GITHUB_EVENT_NAME'] == 'pull_request' else (
                  'develop' if os.environ['GITHUB_REF'] == 'refs/heads/develop' else 'manual')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\nversion={version}\nchannel={channel}\n')

  resolve:
    name: Resolve shared Rust and npm locks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/connect-deployer
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.90.0'
          rustflags: ''
          cache: false
      - name: Resolve once, never independently on each platform
        run: |
          python3 scripts/validate-project.py
          test -f Cargo.lock && test -f package-lock.json
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- Cargo.lock package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: connect-tauri-source-locks
          path: |
            tools/connect-deployer/Cargo.lock
            tools/connect-deployer/package-lock.json
          if-no-files-found: error
          retention-days: 30

  agents:
    name: Static Linux agent / ${{ matrix.arch }}
    needs: [plan, resolve]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tools/connect-deployer
    env:
      CONNECT_DEPLOYER_EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
      AGENT_ARCH: ${{ matrix.arch }}
      AGENT_TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: connect-tauri-source-locks
          path: tools/connect-deployer
      - name: Native musl toolchain (no QEMU)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools pkg-config ca-certificates
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.90.0'
          rustflags: ''
          target: ${{ matrix.target }}
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/connect-deployer -> target
          key: agent-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Test and compile the static agent
        run: |
          cargo test --locked -p deployer-protocol -p connect-deploy-agent
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export CC_x86_64_unknown_linux_musl=musl-gcc
          export CC_aarch64_unknown_linux_musl=musl-gcc
          cargo build --locked --release -p connect-deploy-agent --target "$AGENT_TARGET"
          python3 scripts/agent-artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: connect-deploy-agent-${{ matrix.arch }}
          path: tools/connect-deployer/dist/agents/*
          if-no-files-found: error
          retention-days: 30

  build:
    name: Tauri desktop / ${{ matrix.target }}
    needs: [plan, resolve, agents]
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            config: src-tauri/tauri.windows.conf.json
          - runner: ubuntu-24.04
            target: linux-x64
            config: src-tauri/tauri.linux.conf.json
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            config: src-tauri/tauri.linux.conf.json
          - runner: macos-14
            target: macos-arm64
            config: src-tauri/tauri.macos.conf.json
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tools/connect-deployer
        shell: bash
    env:
      CONNECT_DEPLOYER_EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
      CONNECT_DEPLOYER_CHANNEL: ${{ needs.plan.outputs.channel }}
      CONNECT_DEPLOYER_RELEASE_TAG: ${{ inputs.release_tag }}
      CONNECT_DEPLOYER_TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
    steps:
      - name: Preserve imported source bytes
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: connect-tauri-source-locks
          path: tools/connect-deployer
      - uses: actions/download-artifact@v5
        with:
          name: connect-deploy-agent-amd64
          path: .agents/amd64
      - uses: actions/download-artifact@v5
        with:
          name: connect-deploy-agent-arm64
          path: .agents/arm64
      - name: Linux WebView and bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential pkg-config xdg-utils
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/connect-deployer/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.90.0'
          rustflags: ''
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/connect-deployer -> target
          key: desktop-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Verify source and embed BOTH static agents
        run: |
          python scripts/prepare-ci.py
          npm ci --no-audit --no-fund
      - name: Build graphical Tauri application and installers
        run: npm run tauri:build -- --locked --config "${{ matrix.config }}"
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Exercise native binary without GUI, SSH or deploy
        run: python scripts/smoke-tauri.py
      - name: Package GUI installers and identity
        run: python scripts/package-tauri.py
      - uses: actions/upload-artifact@v4
        with:
          name: connect-deploy-desktop-${{ matrix.target }}
          path: tools/connect-deployer/dist/release/*
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify four GUI packages and both static agents
    needs: [plan, agents, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: connect-deploy-*
          path: deployer-assets
          merge-multiple: true
      - name: Validate checksums, architectures and revision
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: python3 tools/connect-deployer/scripts/verify_assets.py deployer-assets
      - uses: actions/upload-artifact@v4
        with:
          name: connect-deployer-manifest
          path: deployer-assets/CONNECT-DEPLOYER-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  attach-to-application-release:
    name: Attach Tauri binaries to existing Connect API release
    needs: [plan, agents, build, verify]
    if: inputs.release_tag != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: connect-deploy-*
          path: deployer-assets
          merge-multiple: true
      - name: Recheck assets before publication
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_CHANNEL: stable
        run: python3 tools/connect-deployer/scripts/verify_assets.py deployer-assets
      - name: Upload without creating release or overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" deployer-assets/* --repo "$GITHUB_REPOSITORY"
