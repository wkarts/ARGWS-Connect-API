name: Release Contract Integrity

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/scripts/apply-version.mjs'
      - '.github/scripts/compute-next-version.mjs'
      - '.github/workflows/auto-version-release.yml'
      - '.github/workflows/release-contract.yml'
      - 'test/release-version.test.cjs'
  push:
    branches: [main, develop]
    paths:
      - '.github/scripts/apply-version.mjs'
      - '.github/scripts/compute-next-version.mjs'
      - '.github/workflows/auto-version-release.yml'
      - '.github/workflows/release-contract.yml'
      - 'test/release-version.test.cjs'

permissions:
  contents: read

jobs:
  contract:
    name: Version and frozen canonical safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - run: node --test test/release-version.test.cjs
