name: Baileys Interactive Finalize

on:
  push:
    branches:
      - fix/baileys-interactive-rendering

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/baileys-interactive-rendering
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Apply provider transport patch
        run: python3 scripts/apply-baileys-interactive-rendering.py
      - name: Validate targeted transport
        run: |
          npx eslint --fix src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts src/api/integrations/channel/whatsapp/helpers/interactiveMessage.helper.ts src/api/services/template-transport-planner.ts src/api/services/template-engine.service.ts
          npx eslint src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts src/api/integrations/channel/whatsapp/helpers/interactiveMessage.helper.ts src/api/services/template-transport-planner.ts src/api/services/template-engine.service.ts
          npx tsx ./test/template-engine/baileys-native-interactive.test.ts
          npm run test:compat
          npm run docs:check
          git diff --check
      - name: Commit canonical outputs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts src/api/integrations/channel/whatsapp/helpers/interactiveMessage.helper.ts src/api/services/template-transport-planner.ts src/api/services/template-engine.service.ts package.json docs/guides/baileys-interactive-rendering.md
          git add -f test/template-engine/baileys-native-interactive.test.ts
          git commit --no-verify -m 'fix(baileys): restore interactive rendering on web desktop'
          git push --no-verify origin HEAD:fix/baileys-interactive-rendering
