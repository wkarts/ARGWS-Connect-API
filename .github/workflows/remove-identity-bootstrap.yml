name: Remove automatic identity bootstrap

on:
  push:
    branches:
      - fix/zapo-identity-performance-docs
    paths:
      - .github/workflows/remove-identity-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-identity-performance-docs
          fetch-depth: 0
      - name: Remove automatic historical identity scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts')
          s = p.read_text()
          s2 = s.replace('  private identityBootstrapPromise: Promise<void> | null = null;\n  private identityBootstrapDone = false;\n', '', 1)
          s2 = s2.replace('    if (this.isRegistered()) this.bootstrapIdentityState();\n', '', 1)
          s2, count = re.subn(r'  private bootstrapIdentityState\(\): void \{\n.*?\n  \}\n\n', '', s2, count=1, flags=re.S)
          if count != 1 or s2 == s:
              raise SystemExit('Automatic identity bootstrap block not found')
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts
          HUSKY=0 git commit -m "fix(zapo): keep identity resolution event driven"
          HUSKY=0 git push origin HEAD:fix/zapo-identity-performance-docs
