name: Remove automatic identity bootstrap

on:
  push:
    branches:
      - fix/zapo-identity-performance-docs
    paths:
      - .github/workflows/remove-identity-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-identity-performance-docs
          fetch-depth: 0
      - name: Remove automatic historical identity scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts')
          s = p.read_text()
          replacements = [
            ("  private identityBootstrapPromise: Promise<void> | null = null;\n  private identityBootstrapDone = false;\n", ""),
            ("    if (this.isRegistered()) this.bootstrapIdentityState();\n", ""),
            ("""  private bootstrapIdentityState(): void {
    if (this.identityBootstrapDone || this.identityBootstrapPromise) return;
    this.identityBootstrapPromise = this.reconcileIdentityRows()
      .catch((error: Error) => this.logger.warn(`ZAPO identity bootstrap failed: ${error?.message || error}`))
      .finally(() => {
        this.identityBootstrapDone = true;
        this.identityBootstrapPromise = null;
      });
  }

""", ""),
          ]
          for old, new in replacements:
            if s.count(old) != 1:
              raise SystemExit('Expected identity bootstrap block not found exactly once')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts
          HUSKY=0 git commit -m "fix(zapo): keep identity resolution event driven"
          HUSKY=0 git push origin HEAD:fix/zapo-identity-performance-docs
