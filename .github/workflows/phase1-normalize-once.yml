name: Phase 1 Normalize Once

on:
  push:
    branches:
      - fix/database-observability-foundation-1.0.1

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-normalized]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: argws
          POSTGRES_PASSWORD: argws_test_password
          POSTGRES_DB: argws_connect_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U argws -d argws_connect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: argws_root_test_password
          MYSQL_DATABASE: argws_connect_test
          MYSQL_USER: argws
          MYSQL_PASSWORD: argws_test_password
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pargws_root_test_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/database-observability-foundation-1.0.1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Normalize Phase 1 files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          root = Path('.')

          # ------------------------------------------------------------------
          # 1) Canonical database history for a NEW product/database.
          #    There is no legacy database to upgrade, so migrations must
          #    create canonical ARGWS Connect names from the beginning.
          # ------------------------------------------------------------------
          for provider in ('postgresql', 'mysql'):
              migrations = root / 'prisma' / f'{provider}-migrations'
              for sql_path in migrations.glob('*/migration.sql'):
                  text = sql_path.read_text(encoding='utf-8')
                  text = text.replace('ConnectaiSetting', 'ConnectAISetting')
                  text = text.replace('connectaiIdFallback', 'connectAIIdFallback')
                  text = text.replace('Connectai', 'ConnectAI')
                  sql_path.write_text(text, encoding='utf-8')

              rename_dir = migrations / '20260830010000_argws_connect_rename'
              if rename_dir.exists():
                  shutil.rmtree(rename_dir)

          pg_old = root / 'prisma/postgresql-migrations/20240825130616_change_to_evolution_bot'
          pg_new = root / 'prisma/postgresql-migrations/20240825130616_change_to_connect_bot'
          if pg_old.exists() and not pg_new.exists():
              pg_old.rename(pg_new)

          for provider in ('postgresql', 'mysql'):
              base = root / 'prisma' / f'{provider}-migrations'
              evo = base / '20250515211815_add_evoai_table'
              canonical = base / '20250515211815_add_connect_ai_table'
              if evo.exists() and not canonical.exists():
                  evo.rename(canonical)

          # ------------------------------------------------------------------
          # 2) MySQL runtime parity with PostgreSQL/current application code.
          # ------------------------------------------------------------------
          mysql_schema_path = root / 'prisma/mysql-schema.prisma'
          mysql = mysql_schema_path.read_text(encoding='utf-8')
          mysql = mysql.replace('  typebotSessionId             String?\n', '')

          def edit_model(schema: str, model_name: str, editor):
              pattern = re.compile(rf'(model {re.escape(model_name)} \{{.*?\n\}})', re.S)
              match = pattern.search(schema)
              if not match:
                  raise RuntimeError(f'Model not found: {model_name}')
              block = editor(match.group(1))
              return schema[:match.start(1)] + block + schema[match.end(1):]

          def typebot_editor(block: str):
              if 'splitMessages' not in block:
                  block = block.replace(
                      '  triggerValue    String?\n',
                      '  triggerValue    String?\n'
                      '  splitMessages   Boolean?         @default(false)\n'
                      '  timePerChar     Int?             @default(50) @db.Int\n'
                  )
              return block

          def typebot_setting_editor(block: str):
              if 'splitMessages' not in block:
                  block = block.replace(
                      '  ignoreJids        Json?\n',
                      '  ignoreJids        Json?\n'
                      '  splitMessages     Boolean?  @default(false)\n'
                      '  timePerChar       Int?      @default(50) @db.Int\n'
                  )
              return block

          def label_editor(block: str):
              if '@@unique([labelId, instanceId])' not in block:
                  block = block.replace(
                      '  instanceId   String\n}',
                      '  instanceId   String\n\n  @@unique([labelId, instanceId])\n}'
                  )
              return block

          def is_on_whatsapp_editor(block: str):
              block = block.replace('  jidOptions String\n', '  jidOptions String   @db.Text\n')
              if re.search(r'^\s*lid\s+', block, re.M) is None:
                  block = block.replace(
                      '  jidOptions String   @db.Text\n',
                      '  jidOptions String   @db.Text\n  lid        String?  @db.VarChar(100)\n'
                  )
              return block

          mysql = edit_model(mysql, 'Typebot', typebot_editor)
          mysql = edit_model(mysql, 'TypebotSetting', typebot_setting_editor)
          mysql = edit_model(mysql, 'Label', label_editor)
          mysql = edit_model(mysql, 'IsOnWhatsapp', is_on_whatsapp_editor)
          mysql_schema_path.write_text(mysql, encoding='utf-8')

          # Keep fields added earlier instead of dropping them in the Kafka migration.
          kafka_mysql = root / 'prisma/mysql-migrations/20250918183910_add_kafka_integration/migration.sql'
          if kafka_mysql.exists():
              text = kafka_mysql.read_text(encoding='utf-8')
              text = text.replace('ALTER TABLE `IsOnWhatsapp` DROP COLUMN `lid`,\n    MODIFY', 'ALTER TABLE `IsOnWhatsapp` MODIFY')
              text = text.replace(
                  'ALTER TABLE `Typebot` DROP COLUMN `splitMessages`,\n    DROP COLUMN `timePerChar`,\n    MODIFY',
                  'ALTER TABLE `Typebot` MODIFY'
              )
              text = text.replace(
                  'ALTER TABLE `TypebotSetting` DROP COLUMN `splitMessages`,\n    DROP COLUMN `timePerChar`,\n    MODIFY',
                  'ALTER TABLE `TypebotSetting` MODIFY'
              )
              kafka_mysql.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 3) PgBouncer is PostgreSQL with a different datasource only.
          # ------------------------------------------------------------------
          pg_schema = (root / 'prisma/postgresql-schema.prisma').read_text(encoding='utf-8')
          bouncer_ds = '''datasource db {
            provider  = "postgresql"
            url       = env("DATABASE_BOUNCER_CONNECTION_URI")
            directUrl = env("DATABASE_CONNECTION_URI")
          }'''
          pg_bouncer = re.sub(r'datasource db \{.*?\}', bouncer_ds, pg_schema, count=1, flags=re.S)
          (root / 'prisma/psql_bouncer-schema.prisma').write_text(pg_bouncer, encoding='utf-8')

          # ------------------------------------------------------------------
          # 4) Safer but useful logging + explicit QR terminal output.
          # ------------------------------------------------------------------
          logger = r'''import dayjs from 'dayjs';
          import { createHash } from 'crypto';
          import fs from 'fs';

          import { configService, Log } from './env.config';
          const packageJson = JSON.parse(fs.readFileSync('./package.json', 'utf8'));

          const formatDateLog = (timestamp: number) =>
            dayjs(timestamp)
              .toDate()
              .toString()
              .replace(/\sGMT.+/, '');

          enum Color {
            LOG = '\x1b[32m',
            INFO = '\x1b[34m',
            WARN = '\x1b[33m',
            ERROR = '\x1b[31m',
            DEBUG = '\x1b[36m',
            VERBOSE = '\x1b[37m',
            DARK = '\x1b[30m',
          }

          enum Command {
            RESET = '\x1b[0m',
            BRIGHT = '\x1b[1m',
          }

          enum Level {
            LOG = Color.LOG + '%s' + Command.RESET,
            DARK = Color.DARK + '%s' + Command.RESET,
            INFO = Color.INFO + '%s' + Command.RESET,
            WARN = Color.WARN + '%s' + Command.RESET,
            ERROR = Color.ERROR + '%s' + Command.RESET,
            DEBUG = Color.DEBUG + '%s' + Command.RESET,
            VERBOSE = Color.VERBOSE + '%s' + Command.RESET,
          }

          enum Type {
            LOG = 'LOG',
            WARN = 'WARN',
            INFO = 'INFO',
            DARK = 'DARK',
            ERROR = 'ERROR',
            DEBUG = 'DEBUG',
            VERBOSE = 'VERBOSE',
          }

          enum Background {
            LOG = '\x1b[42m',
            INFO = '\x1b[44m',
            WARN = '\x1b[43m',
            DARK = '\x1b[40m',
            ERROR = '\x1b[41m',
            DEBUG = '\x1b[46m',
            VERBOSE = '\x1b[47m',
          }

          const hashValue = (value: string | Buffer) =>
            createHash('sha256').update(value).digest('hex').slice(0, 12);

          const describeLogValue = (value: unknown): string | number | boolean => {
            if (value === null) return '[NULL]';
            if (value === undefined) return '[UNDEFINED]';
            if (typeof value === 'number' || typeof value === 'boolean') return value;
            if (typeof value === 'bigint') return `[BIGINT digits=${value.toString().length}]`;
            if (typeof value === 'string') return `[STRING length=${value.length} sha256=${hashValue(value)}]`;
            if (Buffer.isBuffer(value)) return `[BUFFER length=${value.length} sha256=${hashValue(value)}]`;
            if (value instanceof Error) {
              const errorCode = typeof (value as any).code === 'string' ? (value as any).code : 'unknown';
              return `[ERROR name=${value.name || 'Error'} code=${errorCode}]`;
            }
            if (Array.isArray(value)) return `[ARRAY length=${value.length}]`;
            if (typeof value === 'object') {
              const keys = Object.keys(value as Record<string, unknown>).slice(0, 12).sort().join(',');
              return `[OBJECT keys=${keys || 'none'}]`;
            }
            return `[${typeof value}]`;
          };

          export class Logger {
            private readonly configService = configService;
            private context: string;
            private instance: string | null = null;

            constructor(context = 'Logger') {
              this.context = context;
            }

            public setContext(value: string) {
              this.context = value;
            }

            public setInstance(value: string) {
              this.instance = value;
            }

            private console(value: unknown, type: Type) {
              const types: Type[] = [];
              this.configService.get<Log>('LOG').LEVEL.forEach((level) => types.push(Type[level]));
              if (!types.includes(type)) return;

              const descriptor = describeLogValue(value);
              if (configService.get<Log>('LOG').COLOR) {
                console.log(
                  Command.BRIGHT + Level[type],
                  '[ARGWS Connect API]',
                  Command.BRIGHT + Color[type],
                  this.instance ? `[${this.instance}]` : '',
                  Command.BRIGHT + Color[type],
                  `v${packageJson.version}`,
                  Command.BRIGHT + Color[type],
                  process.pid.toString(),
                  Command.RESET,
                  Command.BRIGHT + Color[type],
                  '-',
                  Command.BRIGHT + Color.VERBOSE,
                  `${formatDateLog(Date.now())}  `,
                  Command.RESET,
                  Color[type] + Background[type] + Command.BRIGHT,
                  `${type} ` + Command.RESET,
                  Color.WARN + Command.BRIGHT,
                  `[${this.context}]` + Command.RESET,
                  Color[type] + Command.BRIGHT,
                  descriptor,
                  Command.RESET,
                );
              } else {
                console.log(
                  '[ARGWS Connect API]',
                  this.instance ? `[${this.instance}]` : '',
                  process.pid.toString(),
                  '-',
                  `${formatDateLog(Date.now())}  `,
                  `${type} `,
                  `[${this.context}]`,
                  descriptor,
                );
              }
            }

            /**
             * Emits an explicitly non-secret operational message.
             * Use only for fixed lifecycle/status text owned by the application.
             */
            public system(message: string, type: Type = Type.INFO) {
              const types: Type[] = [];
              this.configService.get<Log>('LOG').LEVEL.forEach((level) => types.push(Type[level]));
              if (!types.includes(type)) return;
              console.log('[ARGWS Connect API]', this.instance ? `[${this.instance}]` : '', `[${this.context}]`, message);
            }

            /**
             * QR is an intentional terminal surface and is independently switchable.
             * Pairing codes and other credentials must never be passed here.
             */
            public qr(value: string) {
              if (!this.configService.get<Log>('LOG').QRCODE) return;
              process.stdout.write(`\n${value}\n`);
            }

            public log(value: unknown) { this.console(value, Type.LOG); }
            public info(value: unknown) { this.console(value, Type.INFO); }
            public warn(value: unknown) { this.console(value, Type.WARN); }
            public error(value: unknown) { this.console(value, Type.ERROR); }
            public verbose(value: unknown) { this.console(value, Type.VERBOSE); }
            public debug(value: unknown) { this.console(value, Type.DEBUG); }
            public dark(value: unknown) { this.console(value, Type.DARK); }
          }
          '''
          # Remove indentation introduced by the Python heredoc.
          import textwrap
          (root / 'src/config/logger.config.ts').write_text(textwrap.dedent(logger), encoding='utf-8')

          env_path = root / 'src/config/env.config.ts'
          env = env_path.read_text(encoding='utf-8')
          if 'QRCODE: boolean;' not in env:
              env = env.replace('  BAILEYS: LogBaileys;\n};', '  BAILEYS: LogBaileys;\n  QRCODE: boolean;\n};')
          log_start = env.find('      LOG: {')
          if log_start < 0:
              raise RuntimeError('LOG config block not found')
          log_end = env.find('      },', log_start)
          log_block = env[log_start:log_end]
          if 'QRCODE:' not in log_block:
              env = env[:log_end] + "        QRCODE: process.env?.LOG_QRCODE !== 'false',\n" + env[log_end:]
          env_path.write_text(env, encoding='utf-8')

          wa_path = root / 'src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts'
          wa = wa_path.read_text(encoding='utf-8')
          qr_pattern = re.compile(
              r"\s*qrcodeTerminal\.generate\(qr, \{ small: true \}, \(qrcode\) =>\s*this\.logger\.log\(.*?\),\s*\);",
              re.S,
          )
          replacement = '''\n      qrcodeTerminal.generate(qr, { small: true }, (qrcode) => {\n        this.logger.system('WhatsApp QR code generated');\n        this.logger.qr(qrcode);\n      });'''
          wa, count = qr_pattern.subn(replacement, wa, count=1)
          if count != 1:
              raise RuntimeError('QR terminal block was not normalized')
          wa_path.write_text(wa, encoding='utf-8')

          env_example = root / '.env.example'
          env_text = env_example.read_text(encoding='utf-8')
          if 'LOG_QRCODE=' not in env_text:
              env_text = env_text.replace('LOG_COLOR=true\n', 'LOG_COLOR=true\n# Render the WhatsApp QR in container/terminal logs\nLOG_QRCODE=true\n')
          if 'DATABASE_MIGRATION_MAX_ATTEMPTS=' not in env_text:
              marker = 'DATABASE_PROVIDER=postgresql\n'
              env_text = env_text.replace(
                  marker,
                  marker + 'DATABASE_MIGRATION_MAX_ATTEMPTS=30\nDATABASE_MIGRATION_RETRY_SECONDS=2\n'
              )
          env_example.write_text(env_text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 5) Local health endpoint: health must not depend on WhatsApp Web.
          # ------------------------------------------------------------------
          router_path = root / 'src/api/routes/index.router.ts'
          router = router_path.read_text(encoding='utf-8')
          if ".get('/health'" not in router:
              router = router.replace(
                  "  .get('/', async (req, res) => {",
                  "  .get('/health', (_req, res) => {\n"
                  "    res.status(HttpStatus.OK).json({\n"
                  "      status: 'ok',\n"
                  "      service: 'ARGWS Connect API',\n"
                  "      version: packageJson.version,\n"
                  "      uptime: Math.floor(process.uptime()),\n"
                  "    });\n"
                  "  })\n"
                  "  .get('/', async (req, res) => {"
              )
          router_path.write_text(router, encoding='utf-8')

          # ------------------------------------------------------------------
          # 6) Docker startup: retry DB, never print credentials, no baked env.
          # ------------------------------------------------------------------
          deploy_script = '''#!/bin/bash
          set -euo pipefail

          source ./Docker/scripts/env_functions.sh

          if [ "${DOCKER_ENV:-false}" != "true" ]; then
              export_env_vars
          fi

          provider="${DATABASE_PROVIDER:-postgresql}"
          case "$provider" in
              postgresql|mysql|psql_bouncer) ;;
              *)
                  echo "Error: Database provider '$provider' is invalid."
                  exit 1
                  ;;
          esac

          max_attempts="${DATABASE_MIGRATION_MAX_ATTEMPTS:-30}"
          retry_seconds="${DATABASE_MIGRATION_RETRY_SECONDS:-2}"
          attempt=1

          echo "Deploying ARGWS Connect database migrations for provider: $provider"
          until npm run db:deploy; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Migration failed after $attempt attempts."
                  exit 1
              fi
              echo "Database not ready or migration failed (attempt $attempt/$max_attempts); retrying in ${retry_seconds}s..."
              attempt=$((attempt + 1))
              sleep "$retry_seconds"
          done

          echo "Migration succeeded. Generating Prisma client for provider: $provider"
          npm run db:generate
          echo "Prisma generate succeeded."
          '''
          (root / 'Docker/scripts/deploy_database.sh').write_text(textwrap.dedent(deploy_script), encoding='utf-8')

          generate_path = root / 'Docker/scripts/generate_database.sh'
          generate = generate_path.read_text(encoding='utf-8')
          generate = re.sub(r'\n\s*echo "Database URL: \$DATABASE_URL"', '', generate)
          generate_path.write_text(generate, encoding='utf-8')

          dockerfile_path = root / 'Dockerfile'
          dockerfile = dockerfile_path.read_text(encoding='utf-8')
          dockerfile = dockerfile.replace('COPY --from=builder /argws-connect/.env ./.env\n', '')
          dockerfile = dockerfile.replace(
              'CMD curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1',
              'CMD curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1'
          )
          dockerfile_path.write_text(dockerfile, encoding='utf-8')

          # ------------------------------------------------------------------
          # 7) Permanent DB integrity workflow for future PRs/main.
          # ------------------------------------------------------------------
          integrity = '''name: Database Integrity

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            postgresql:
              runs-on: ubuntu-latest
              services:
                postgres:
                  image: postgres:15
                  env:
                    POSTGRES_USER: argws
                    POSTGRES_PASSWORD: argws_test_password
                    POSTGRES_DB: argws_connect_test
                  ports:
                    - 55432:5432
                  options: >-
                    --health-cmd "pg_isready -U argws -d argws_connect_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
              env:
                DATABASE_PROVIDER: postgresql
                DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                    cache: npm
                - run: npm ci
                - name: Validate PostgreSQL schema
                  run: npx prisma validate --schema ./prisma/postgresql-schema.prisma
                - name: Deploy PostgreSQL migrations on empty database
                  run: npm run db:deploy
                - name: Generate PostgreSQL client
                  run: npm run db:generate
                - name: Type-check against PostgreSQL client
                  run: npx tsc --noEmit

            mysql:
              runs-on: ubuntu-latest
              services:
                mysql:
                  image: mysql:8.0
                  env:
                    MYSQL_ROOT_PASSWORD: argws_root_test_password
                    MYSQL_DATABASE: argws_connect_test
                    MYSQL_USER: argws
                    MYSQL_PASSWORD: argws_test_password
                  ports:
                    - 53306:3306
                  options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pargws_root_test_password"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 30
              env:
                DATABASE_PROVIDER: mysql
                DATABASE_CONNECTION_URI: mysql://argws:argws_test_password@127.0.0.1:53306/argws_connect_test
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                    cache: npm
                - run: npm ci
                - name: Validate MySQL schema
                  run: npx prisma validate --schema ./prisma/mysql-schema.prisma
                - name: Deploy MySQL migrations on empty database
                  run: npm run db:deploy
                - name: Generate MySQL client
                  run: npm run db:generate
                - name: Type-check against MySQL client
                  run: npx tsc --noEmit

            psql-bouncer-schema:
              runs-on: ubuntu-latest
              env:
                DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:5432/argws_connect_test
                DATABASE_BOUNCER_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:6432/argws_connect_test?pgbouncer=true
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                    cache: npm
                - run: npm ci
                - name: Validate PgBouncer schema
                  run: npx prisma validate --schema ./prisma/psql_bouncer-schema.prisma
                - name: Verify PostgreSQL/PgBouncer model parity
                  shell: python
                  run: |
                    from pathlib import Path
                    import re
                    pg = Path('prisma/postgresql-schema.prisma').read_text()
                    pb = Path('prisma/psql_bouncer-schema.prisma').read_text()
                    def strip_ds(s):
                        return re.sub(r'datasource db \\{.*?\\}', 'datasource db { PROVIDER }', s, count=1, flags=re.S)
                    assert strip_ds(pg) == strip_ds(pb), 'PgBouncer schema diverged from PostgreSQL models'
          '''
          workflow_path = root / '.github/workflows/database-integrity.yml'
          workflow_path.write_text(textwrap.dedent(integrity), encoding='utf-8')

          # This workflow is intentionally one-shot. Remove itself from final tree.
          self_path = root / '.github/workflows/phase1-normalize-once.yml'
          if self_path.exists():
              self_path.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Prisma format and validate schemas
        env:
          DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
          DATABASE_BOUNCER_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?pgbouncer=true
        run: |
          npx prisma format --schema ./prisma/postgresql-schema.prisma
          npx prisma format --schema ./prisma/mysql-schema.prisma
          npx prisma format --schema ./prisma/psql_bouncer-schema.prisma
          npx prisma validate --schema ./prisma/postgresql-schema.prisma
          npx prisma validate --schema ./prisma/mysql-schema.prisma
          npx prisma validate --schema ./prisma/psql_bouncer-schema.prisma

      - name: Smoke PostgreSQL migrations and build
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
        run: |
          npm run db:deploy
          npm run db:generate
          npx tsc --noEmit

      - name: Smoke MySQL migrations and build
        env:
          DATABASE_PROVIDER: mysql
          DATABASE_CONNECTION_URI: mysql://argws:argws_test_password@127.0.0.1:53306/argws_connect_test
        run: |
          rm -rf ./prisma/migrations
          npm run db:deploy
          npm run db:generate
          npx tsc --noEmit

      - name: Lint normalized source
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_CONNECTION_URI: postgresql://argws:argws_test_password@127.0.0.1:55432/argws_connect_test?schema=public
        run: |
          npm run db:generate
          npm run lint:check
          npm run build

      - name: Commit normalized Phase 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
