name: Find Hub deployment and Scalar repair

on:
  push:
    branches: [fix/findhub-deploy-scalar]
    paths: [.github/workflows/findhub-deploy-materialize.yml]

permissions:
  contents: read

concurrency:
  group: findhub-deployment-repair
  cancel-in-progress: false

jobs:
  validate-and-materialize:
    if: github.repository == 'wkarts/ARGWS-Connect-API' && github.ref == 'refs/heads/fix/findhub-deploy-scalar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      HUSKY: '0'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
      - name: Materialize additive deployment and Scalar contracts
        run: python3 scripts/_materialize_findhub_deploy_fix.py
      - name: Install existing locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply project formatting only to the changed vault
        run: ./node_modules/.bin/eslint --fix src/api/integrations/channel/findhub/auth/findhub-credential-vault.ts
      - name: Validate code, mirrors, schemas and regression tests
        run: |
          npm run lint:check
          npm run docs:check
          python3 scripts/sync-operations-deployments.py --check
          npm run db:generate
          npm run test:compat
          npm run build
          git diff --check
      - name: Validate Manager
        run: |
          npm --prefix manager install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm --prefix manager run build
          npm --prefix manager run check:language
          npm --prefix manager run check:sfc
      - name: Validate effective API Compose configuration without exposing keys
        run: |
          python3 - <<'PY'
          import json, os, secrets, subprocess
          from pathlib import Path
          coverage = json.loads(Path('docs/operations/findhub-deployment-coverage.json').read_text())
          key = secrets.token_hex(32)
          env = dict(os.environ, FINDHUB_CREDENTIALS_KEY=key)
          created = []
          try:
              for item in coverage['apiServices']:
                  file = Path(item['path']).resolve()
                  local_env = file.parent / '.env'
                  template = next((p for p in (file.parent / 'env.example', file.parent / '.env.example', Path('env.example').resolve()) if p.exists()), None)
                  if not local_env.exists():
                      local_env.write_text(template.read_text() if template else '')
                      local_env.chmod(0o600)
                      created.append(local_env)
                  run = subprocess.run(['docker', 'compose', '--env-file', str(local_env), '-f', str(file), 'config', '--format', 'json'], env=env, capture_output=True, text=True)
                  if run.returncode:
                      raise SystemExit('Compose validation failed: ' + item['path'] + '\n' + run.stderr.replace(key, '[REDACTED]'))
                  actual = json.loads(run.stdout)['services'][item['service']]['environment']
                  assert actual.get('FINDHUB_CREDENTIALS_KEY') == key, item['path']
                  for name in coverage['environmentVariables']:
                      assert name in actual, item['path'] + ': ' + name
                  print('Validated API environment:', item['path'], item['service'], '(secrets hidden)')
          finally:
              for path in created:
                  path.unlink(missing_ok=True)
          PY
      - name: Smoke test the dedicated Scalar document in its real container
        run: |
          docker build -f docs/Dockerfile -t findhub-docs-validation:local .
          docker run -d --name findhub-docs-validation -p 127.0.0.1:39183:8080 -e BASE_PATH=/manager/docs -e SERVER_URL=http://127.0.0.1:8080 -e 'API_REFERENCE_CONFIG={"sources":[{"url":"openapi/connect-api.openapi.json","title":"REST","default":true},{"url":"openapi/findhub.openapi.json","title":"Google Find Hub","slug":"findhub"}]}' findhub-docs-validation:local
          trap 'docker rm -f findhub-docs-validation >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:39183/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:39183/manager/docs/openapi/findhub.openapi.json -o /tmp/findhub-served.json
          node -e 'const d=require("/tmp/findhub-served.json");const n=Object.values(d.paths).reduce((n,p)=>n+Object.keys(p).length,0);if(!d.info.title.includes("Find Hub")||Object.keys(d.paths).length!==11||n!==12)process.exit(1);console.log("Scalar Find Hub HTTP smoke passed: 11 paths, 12 operations")'
      - name: Commit validated generated files on the repair branch only
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_materialize_findhub_deploy_fix.py .github/workflows/findhub-deploy-materialize.yml
          while IFS= read -r file; do
            case "$file" in
              .env.example|env.example|docker-compose.yaml|docker-compose.dev.yaml|prepare-env.sh|preflight.sh|prepare-findhub-env.py|package.json|Docker/swarm/argws_connect_api_v2.yaml|deploy/*|docs/*|test/findhub-*|scripts/prepare-findhub-env.py|scripts/sync-findhub-deployments.py|scripts/sync-operations-deployments.py|scripts/_materialize_findhub_deploy_fix.py|src/api/integrations/channel/findhub/auth/findhub-credential-vault.ts|.github/workflows/findhub-deploy-materialize.yml) ;;
              *) echo "Unexpected modified path: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git add --update
          git add -- prepare-findhub-env.py docs/openapi/findhub.openapi.json docs/operations/findhub-deployment-coverage.json
          find deploy -name prepare-findhub-env.py -print0 | xargs -0 -r git add --
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): completar deploys, chave persistente e contratos Scalar'
          git push origin HEAD:refs/heads/fix/findhub-deploy-scalar
          printf 'Validated repair commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
