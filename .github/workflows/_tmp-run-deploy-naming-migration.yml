name: Temporary Deployment Naming Migration Runner

on:
  push:
    branches: [fix/deploy-compose-project-names]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/deploy-compose-project-names

      - name: Generate canonical naming
        run: python3 scripts/_tmp_normalize_deploy_naming.py

      - name: Prepare disposable environments
        run: |
          set -euo pipefail
          cp .env.example .env
          for dir in production develop canonical homologation cloudpanel dockge docs docs-develop platform; do
            cp "deploy/$dir/env.example" "deploy/$dir/.env"
          done
          cp deploy/develop/platform.env.example deploy/develop/.platform.env

      - name: Validate every independent Compose
        run: |
          set -euo pipefail
          for spec in \
            'docker-compose.yaml|.env.example' \
            'deploy/production/compose.yaml|deploy/production/env.example' \
            'deploy/develop/compose.yaml|deploy/develop/env.example' \
            'deploy/canonical/compose.yaml|deploy/canonical/env.example' \
            'deploy/homologation/compose.yaml|deploy/homologation/env.example' \
            'deploy/cloudpanel/docker-compose.yml|deploy/cloudpanel/env.example' \
            'deploy/dockge/compose.yaml|deploy/dockge/env.example' \
            'deploy/docs/compose.yaml|deploy/docs/env.example' \
            'deploy/docs-develop/compose.yaml|deploy/docs-develop/env.example' \
            'deploy/platform/compose.yaml|deploy/platform/env.example'; do
            compose="${spec%%|*}"; envfile="${spec##*|}"
            docker compose --env-file "$envfile" --profile '*' -f "$compose" config >/dev/null
          done

      - name: Validate develop Platform overlay
        working-directory: deploy/develop
        run: |
          set -euo pipefail
          docker compose --env-file .env --env-file .platform.env -f compose.yaml -f compose.platform.yaml --profile platform config > /tmp/develop-platform.yaml
          grep -q 'platform-api-argws-connect-develop:' /tmp/develop-platform.yaml
          grep -q 'platform-web-argws-connect-develop:' /tmp/develop-platform.yaml
          grep -q 'platform-postgres-argws-connect-develop:' /tmp/develop-platform.yaml
          grep -q 'api-argws-connect-develop:' /tmp/develop-platform.yaml

      - name: Validate Platform contracts
        run: |
          python3 platform/scripts/validate_platform_integration.py
          PYTHONPATH=platform/control-api python3 -m pytest -q platform/control-api/tests/connect_platform/test_integrated_foundation.py

      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example docker-compose.yaml deploy/README.md \
            deploy/platform/compose.yaml deploy/platform/compose.local-build.yaml deploy/platform/env.example \
            deploy/develop/compose.platform.yaml \
            deploy/homologation/compose.yaml deploy/homologation/env.example \
            deploy/cloudpanel/docker-compose.yml deploy/cloudpanel/env.example deploy/cloudpanel/.env.example \
            deploy/dockge/compose.yaml deploy/dockge/env.example deploy/dockge/.env.example \
            deploy/docs/compose.yaml deploy/docs-develop/compose.yaml \
            docs/guides/platform-runtime-modes.md \
            platform/control-api/tests/connect_platform/test_integrated_foundation.py \
            platform/scripts/validate_platform_integration.py
          git diff --cached --check
          git commit -m "fix(deploy): standardize project and service naming"
          git push origin HEAD:fix/deploy-compose-project-names
