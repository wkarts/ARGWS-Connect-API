name: One-shot Pairing Explicit Fix

on:
  push:
    branches:
      - fix/pairing-explicit-1.0.11
    paths:
      - .github/workflows/_one-shot-pairing-explicit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pairing-explicit-1.0.11
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Apply pairing-code lifecycle fix
        shell: python
        run: |
          from pathlib import Path

          controller = Path('src/api/controllers/instance.controller.ts')
          text = controller.read_text(encoding='utf-8')

          marker = """  public async createInstance(instanceData: InstanceDto) {\n"""
          helper = """  private async requestExplicitPairingCode(instance: any, number: string): Promise<wa.QrCode> {\n    if (instance.client?.authState?.creds?.registered) {\n      throw new BadRequestException('This WhatsApp session is already registered.');\n    }\n\n    const qrCode = await this.waitForQrCode(instance, false);\n    const pairingCode = await instance.client.requestPairingCode(number);\n\n    if (!pairingCode) {\n      throw new BadRequestException(\n        'Unable to generate pairing code. Confirm the international phone number and try again.',\n      );\n    }\n\n    const maskedNumber = `${'*'.repeat(Math.max(0, number.length - 4))}${number.slice(-4)}`;\n    this.logger.info(`Explicit pairing code generated for ${maskedNumber}`);\n\n    return { ...qrCode, pairingCode };\n  }\n\n"""
          if helper not in text:
              if marker not in text:
                  raise SystemExit('createInstance marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = """        if (instanceData.qrcode && instanceData.integration === Integration.WHATSAPP_BAILEYS) {\n          const pairingNumber = this.normalizePairingPhoneNumber(instanceData.number);\n          await instance.connectToWhatsapp(pairingNumber);\n          getQrcode = await this.waitForQrCode(instance, !!pairingNumber);\n        }\n"""
          new = """        if (instanceData.qrcode && instanceData.integration === Integration.WHATSAPP_BAILEYS) {\n          const pairingNumber = this.normalizePairingPhoneNumber(instanceData.number);\n\n          // QR and pairing-code are independent authentication modes.\n          // Never pass the phone number into the QR lifecycle because that would\n          // regenerate requestPairingCode() whenever Baileys rotates the QR.\n          instance.phoneNumber = undefined;\n          await instance.connectToWhatsapp();\n\n          getQrcode = pairingNumber\n            ? await this.requestExplicitPairingCode(instance, pairingNumber)\n            : await this.waitForQrCode(instance, false);\n        }\n"""
          if old not in text:
              raise SystemExit('createInstance pairing block not found')
          text = text.replace(old, new, 1)

          old = """      if (state == 'connecting') {\n        const pairingNumber = this.normalizePairingPhoneNumber(number);\n        if (pairingNumber && !instance.qrCode?.pairingCode) {\n          const pairingCode = await instance.client.requestPairingCode(pairingNumber);\n          return { ...instance.qrCode, pairingCode };\n        }\n        return instance.qrCode;\n      }\n\n      if (state == 'close') {\n        const pairingNumber = this.normalizePairingPhoneNumber(number);\n        await instance.connectToWhatsapp(pairingNumber);\n        return await this.waitForQrCode(instance, !!pairingNumber);\n      }\n"""
          new = """      if (state == 'connecting') {\n        const pairingNumber = this.normalizePairingPhoneNumber(number);\n        if (pairingNumber) {\n          // Explicit request means a fresh code for the informed phone number.\n          // Do not reuse instance.qrCode.pairingCode from an earlier request.\n          instance.phoneNumber = undefined;\n          return await this.requestExplicitPairingCode(instance, pairingNumber);\n        }\n        return instance.qrCode;\n      }\n\n      if (state == 'close') {\n        const pairingNumber = this.normalizePairingPhoneNumber(number);\n\n        instance.phoneNumber = undefined;\n        await instance.connectToWhatsapp();\n\n        return pairingNumber\n          ? await this.requestExplicitPairingCode(instance, pairingNumber)\n          : await this.waitForQrCode(instance, false);\n      }\n"""
          if old not in text:
              raise SystemExit('connectToWhatsapp pairing block not found')
          text = text.replace(old, new, 1)
          controller.write_text(text, encoding='utf-8')

          service = Path('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts')
          text = service.read_text(encoding='utf-8')
          old = """      if (this.phoneNumber) {\n        await delay(1000);\n        try {\n          this.instance.qrcode.pairingCode = await this.client.requestPairingCode(this.phoneNumber);\n        } catch (error) {\n          this.instance.qrcode.pairingCode = null;\n          this.logger.error(`Pairing code generation failed: ${error?.message || error}`);\n        }\n      } else {\n        this.instance.qrcode.pairingCode = null;\n      }\n"""
          new = """      // Pairing code is an explicit authentication operation and must not\n      // be regenerated every time WhatsApp rotates the QR code. Repeated calls\n      // invalidate the code that the user is currently typing on the phone.\n      this.instance.qrcode.pairingCode = null;\n"""
          if old not in text:
              raise SystemExit('Baileys QR pairing block not found')
          text = text.replace(old, new, 1)
          service.write_text(text, encoding='utf-8')

      - run: npm ci
      - run: npm run lint:check
      - run: npm run test:compat
      - run: npm run db:generate
      - run: npm run build

      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_one-shot-pairing-explicit.yml
          git add src/api/controllers/instance.controller.ts src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          git commit -m "fix(whatsapp): separa pairing code do ciclo de QR [skip release]"
          git push origin HEAD:fix/pairing-explicit-1.0.11
