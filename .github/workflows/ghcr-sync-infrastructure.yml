name: GHCR - Sync Infrastructure Images

on:
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: "Atualizar bases existentes explicitamente (não altera versões canônicas)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/ghcr-sync-infrastructure.yml"
      - "deploy/**"
      - "docker-compose.yaml"
      - "env.example"
      - ".env.example"
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sync runtime and build images to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          REFRESH_EXISTING: ${{ inputs.refresh_existing || false }}
        run: |
          set -euo pipefail
          sync() {
            source="$1"
            target="$2"
            if [[ "$REFRESH_EXISTING" != "true" ]] && skopeo inspect "docker://$target" >/dev/null 2>&1; then
              echo "Preserving existing base: $target"
              return 0
            fi
            echo "Syncing $source -> $target"
            skopeo copy --all "docker://$source" "docker://$target"
          }

          # Build bases used by the application images.
          sync docker.io/library/node:24-alpine              ghcr.io/${OWNER}/argws-connect-node:24-alpine
          sync docker.io/library/node:22-bookworm-slim       ghcr.io/${OWNER}/argws-connect-node:22-bookworm-slim
          sync docker.io/library/nginx:1.27-alpine           ghcr.io/${OWNER}/argws-connect-nginx:1.27-alpine

          # Core runtime used by every official stack.
          sync docker.io/library/postgres:15                 ghcr.io/${OWNER}/argws-connect-postgres:15
          sync docker.io/library/redis:latest                ghcr.io/${OWNER}/argws-connect-redis:latest
          sync docker.io/library/rabbitmq:management         ghcr.io/${OWNER}/argws-connect-rabbitmq:management
          sync quay.io/minio/minio:latest                    ghcr.io/${OWNER}/argws-connect-minio:latest

          # Optional messaging profiles. They consume no runtime resources while disabled.
          sync docker.io/library/nats:2.10-alpine            ghcr.io/${OWNER}/argws-connect-nats:2.10-alpine
          sync docker.io/confluentinc/cp-kafka:7.5.0         ghcr.io/${OWNER}/argws-connect-kafka:7.5.0
          sync docker.io/confluentinc/cp-zookeeper:7.5.0     ghcr.io/${OWNER}/argws-connect-zookeeper:7.5.0

          sync docker.io/traccar/traccar:6.15.3-alpine ghcr.io/${OWNER}/argws-connect-traccar:6.15.3-alpine
