name: One-shot Pairing String Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_one-shot-pairing-string-image.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-test-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact pairing identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts').read_text(encoding='utf-8')
          expected = "const browser: WABrowserDescription = ['🅲🅾🅽🅽🅴🅲🆃\u200b|🅰🅿🅸', 'Chrome', '20.0.04'];"
          if expected not in text:
              raise SystemExit('Expected pairing identity is not present in source')
          print('Pairing identity verified')
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish isolated test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/argws-connect-api:pairing-string-test
            ghcr.io/${{ github.repository_owner }}/argws-connect-api:pairing-string-test-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=ARGWS Connect API Pairing String Test
            org.opencontainers.image.version=1.0.12-pairing-string-test
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pairing-string-test-amd64
          cache-to: type=gha,mode=max,scope=pairing-string-test-amd64
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_one-shot-pairing-string-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_one-shot-pairing-string-image.yml
          git commit -m "chore: remove workflow temporário de teste [skip release]"
          git push origin HEAD:main
