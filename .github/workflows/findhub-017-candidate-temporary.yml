name: Find Hub 0.1.7 candidate validation and Windows prerelease
on:
  push:
    branches: [fix/findhub-web-session-retention]
    paths: [.github/workflows/findhub-017-candidate-temporary.yml]
permissions:
  contents: read
concurrency:
  group: findhub-017-candidate-build
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/fix/findhub-web-session-retention'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      HUSKY: '0'
      DATABASE_PROVIDER: postgresql
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply exactly checked source on requested branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-web-session-retention
          git merge-base --is-ancestor 47a1ba7a1487d2ab6df8d1400d482b7259e1a561 HEAD
          test -z "$(git diff --name-only 47a1ba7a1487d2ab6df8d1400d482b7259e1a561 HEAD -- . ':!.github/findhub-017-payload' ':!.github/workflows/ghcr-retention.yml' ':!.github/workflows/findhub-017-candidate-temporary.yml')"
          cat .github/findhub-017-payload/part{0..3} > /tmp/findhub-017.xz
          echo 'e564d42f273775695c67ce3b346495ee3804025922ce35495e13e1cae125609b  /tmp/findhub-017.xz' | sha256sum --check
          xz -dc /tmp/findhub-017.xz > /tmp/findhub-017.patch
          git apply --check /tmp/findhub-017.patch
          git apply --index /tmp/findhub-017.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/actions-cache-retention.test.py')
          source = path.read_text()
          before = "source.index('Install registry reader')"
          assert source.count(before) == 1, 'Unexpected cache ordering assertion'
          path.write_text(source.replace(before, "source.index('Single image inventory with protected plan before application')"))
          PY
          node scripts/build-findhub-extension.cjs
          node scripts/build-findhub-extension.cjs --check
      - name: Validate API, authentication and bounded retention
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint:check
          npm run docs:check
          npm run test:compat
          python3 test/ghcr-retention.test.py
          python3 test/actions-cache-retention.test.py
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Preserve unrelated channels and canonical protection
        run: |
          set -euo pipefail
          git diff --exit-code 47a1ba7a1487d2ab6df8d1400d482b7259e1a561 -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/integrations/channel/findhub/auth src/api/integrations/channel/findhub/crypto src/api/integrations/channel/findhub/protocol/fcm.client.ts prisma package-lock.json .github/retention-policy.json public/branding browser-extensions/findhub-auth/icons
      - name: Commit validated product source only on candidate branch
        id: source
        run: |
          set -euo pipefail
          branch=fix/findhub-web-session-retention
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git rm -r .github/findhub-017-payload
          git add -u
          git add -f public/findhub-auth.zip docs/guides/findhub-auth-017-retention-bounded.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): establish web session for 2FA and PIN; bound protected GHCR maintenance'
          git push origin "HEAD:refs/heads/$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve exact validated source
        if: always()
        run: |
          git archive --format=tar.gz HEAD > /tmp/findhub-017-source.tar.gz
          git rev-parse HEAD > /tmp/findhub-017-source.commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-017-validated-source
          path: |
            /tmp/findhub-017-source.tar.gz
            /tmp/findhub-017-source.commit
          retention-days: 7
  windows:
    needs: validate
    uses: ./.github/workflows/findhub-extension-build.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_sha }}
      channel: candidate
  registry-readonly:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Benchmark real GHCR manifests without deleting anything
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          python3 -u scripts/ghcr-retention.py --images-only --max-seconds 480 --output retention-readonly
          echo "elapsed_seconds=$(( $(date +%s) - start ))" | tee retention-readonly/timing.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('retention-readonly/report.json').read_text())
          assert report['mode']=='dry-run' and report.get('complete') and not report['deleted'], 'Real registry inventory did not finish; no deletion permitted'
          policy=json.loads(Path('.github/retention-policy.json').read_text())
          for package,pins in policy['canonical_digests'].items():
            for digest in pins.values():
              rows=[row for row in report['decisions'] if row.get('package')==package and row.get('digest')==digest]
              assert rows and all(row['decision']=='preserve' for row in rows), 'Canonical protection not demonstrated'
          print('Real registry inventory and historical canonical preservation verified, read-only.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-017-retention-readonly
          path: retention-readonly
          retention-days: 30
  publish-candidate:
    needs: [validate, windows]
    if: github.ref == 'refs/heads/fix/findhub-web-session-retention'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: findhub-extension-distribution
          path: extension-dist
      - name: Publish explicitly requested 0.1.7 prerelease, never latest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-web-session-retention
          cd extension-dist
          sha256sum --check SHA256SUMS.txt
          test "$(jq -r '.sourceRevision' extension-release.json)" = "$SOURCE_SHA"
          test "$(jq -r '.channel' extension-release.json)" = candidate
          test "$(jq -r '.version' extension-release.json)" = 0.1.7
          tag="findhub-extension-0.1.7-candidate-${SOURCE_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing immutable prerelease preserved: $tag"
          else
            gh release create "$tag" Connect-FindHub-Auth-*.zip Connect-FindHub-Auth-Setup-*.exe Connect-FindHub-Auth-Assistant-*.exe extension-release.json SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --latest=false \
              --title "Find Hub Auth 0.1.7 - Release Candidate" \
              --notes "Candidata solicitada: login web oficial antes do desbloqueio Find Hub. Aguarda confirmação de número/2FA e PIN quando exigidos pelo Google; não escolhe nem contorna os desafios. ZIP, instalador Windows por usuário e assistente nativo Rust x64. ID/ícone preservados. Binários sem assinatura Authenticode; confirmação manual no navegador continua obrigatória. Fonte: $SOURCE_SHA. Testes automatizados não substituem homologação com conta Google real. Não altera main/develop nem latest."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
