name: Release - Auto Version, Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Optional bump override for manual execution"
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: argws-connect-release-main
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'

jobs:
  validate:
    name: Validate source
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PROVIDER: postgresql
    steps:
      - name: Refuse publication outside main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'Production releases must run on main.' >&2; exit 1; }
      - name: Checkout merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run db:generate
      - run: npm run build
      - name: Validate operations, groups, catalog and release preservation
        run: |
          npm run test:operations
          node --test test/operations-resilience.test.cjs test/operations-statistics.test.cjs test/operations-statistics-http.test.cjs test/release-version.test.cjs
          python3 scripts/sync-operations-deployments.py --check
          python3 test/deploy-operations.test.py
          python3 test/operations-compose-contract.py
      - name: Validate production Manager
        run: |
          npm --prefix manager install --ignore-scripts --no-audit --no-fund
          MANAGER_BUILD_MODE=production npm --prefix manager run test
      - name: Synchronize generated docs for validation
        run: npm run docs:generate
      - run: npm run docs:check

  plan-version:
    name: Plan semantic version
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      bump: ${{ steps.plan.outputs.bump }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve merged PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')"
          title="$(jq -r '.[0].title // empty' <<<"$pr_json")"
          labels="$(jq -r '[.[0].labels[]?.name] | join(",")' <<<"$pr_json")"
          {
            echo "title=$title"
            echo "labels=$labels"
          } >> "$GITHUB_OUTPUT"
      - name: Compute next version
        id: plan
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          FORCE_BUMP: ${{ inputs.force_bump || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          labels="$LABELS"
          if [[ "$FORCE_BUMP" != "auto" && -n "$FORCE_BUMP" ]]; then
            labels="version:$FORCE_BUMP"
          fi
          plan="$(node .github/scripts/compute-next-version.mjs "$latest" "$labels" "$PR_TITLE")"
          version="$(jq -r '.version' <<<"$plan")"
          bump="$(jq -r '.bump' <<<"$plan")"
          previous="$(jq -r '.previous // ""' <<<"$plan")"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists; refusing duplicate release." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "bump=$bump"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Planned Connect|API v${version} (${bump})"

  prepare-build-bases:
    name: Prepare GHCR build bases
    needs: plan-version
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Ensure build images exist in GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_image() {
            local source="$1"
            local target="$2"
            if skopeo inspect "docker://${target}" >/dev/null 2>&1; then
              echo "Build base already available: ${target}"
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if skopeo copy --all "docker://${source}" "docker://${target}"; then
                return 0
              fi
              echo "Registry copy attempt ${attempt}/5 failed; retrying..." >&2
              sleep $((attempt * 10))
            done
            echo "Unable to seed ${target}." >&2
            return 1
          }
          ensure_image docker.io/library/node:24-alpine ghcr.io/${OWNER}/argws-connect-node:24-alpine
          ensure_image docker.io/library/node:22-bookworm-slim ghcr.io/${OWNER}/argws-connect-node:22-bookworm-slim
          ensure_image docker.io/library/nginx:1.27-alpine ghcr.io/${OWNER}/argws-connect-nginx:1.27-alpine
          ensure_image docker.io/moby/buildkit:buildx-stable-1 ghcr.io/${OWNER}/argws-connect-buildkit:buildx-stable-1

  build-native:
    name: Build ${{ matrix.component }} / ${{ matrix.arch }}
    needs: [plan-version, prepare-build-bases]
    strategy:
      fail-fast: false
      matrix:
        component: [api, manager, docs]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - component: api
            context: .
            dockerfile: ./Dockerfile
            image: argws-connect-api
          - component: manager
            context: ./manager
            dockerfile: ./manager/Dockerfile
            image: argws-connect-manager
          - component: docs
            context: .
            dockerfile: ./docs/Dockerfile
            image: argws-connect-docs
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Materialize planned version in build context
        run: node .github/scripts/apply-version.mjs "${{ needs.plan-version.outputs.version }}"
      - name: Regenerate docs for planned version
        run: node docs/scripts/generate-openapi.mjs
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=ghcr.io/${{ github.repository_owner }}/argws-connect-buildkit:buildx-stable-1
      - name: Build native image and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.plan-version.outputs.version }}
            MANAGER_BUILD_MODE=production
          labels: |
            org.opencontainers.image.title=Connect|API ${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.plan-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=release-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}-${{ matrix.arch }}
      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  version-source:
    name: Persist version metadata
    needs: [plan-version, build-native]
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - name: Ensure main still points to validated commit
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "main moved while release was being prepared ($current != $GITHUB_SHA)." >&2
            exit 1
          fi
      - name: Apply version
        run: node .github/scripts/apply-version.mjs "${{ needs.plan-version.outputs.version }}"
      - name: Synchronize generated docs for release version
        run: node docs/scripts/generate-openapi.mjs
      - name: Commit version metadata only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json RELEASE-MANIFEST.json \
            docs/openapi/connect-api.openapi.json \
            docs/openapi/meta-compatible.openapi.json \
            docs/openapi/coverage.json \
            docs/asyncapi/connect-api-events.asyncapi.json
          git diff --exit-code -- deploy/canonical
          if ! git diff --cached --quiet -- .github/workflows; then
            echo 'Release metadata must never modify workflows.' >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore(release): v${{ needs.plan-version.outputs.version }} [skip release]"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-manifests:
    name: Publish multi-arch ${{ matrix.component }}
    needs: [plan-version, version-source, build-native]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            image: argws-connect-api
          - component: manager
            image: argws-connect-manager
          - component: docs
            image: argws-connect-docs
    steps:
      - name: Download native digests
        uses: actions/download-artifact@v5
        with:
          pattern: digest-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release manifest and tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.plan-version.outputs.version }}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          repo="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("${repo}@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            -t "${repo}:${version}" \
            -t "${repo}:${major}.${minor}" \
            -t "${repo}:${major}" \
            -t "${repo}:latest" \
            -t "${repo}:sha-${{ needs.version-source.outputs.release_sha }}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${repo}:${version}"
      - name: Save manifest digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-digests
          repo="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          docker buildx imagetools inspect "${repo}:${{ needs.plan-version.outputs.version }}" > "release-digests/${{ matrix.image }}.txt"
      - name: Upload manifest report
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.image }}
          path: release-digests/${{ matrix.image }}.txt
          retention-days: 30

  release:
    name: Tag and publish GitHub Release
    needs: [plan-version, version-source, publish-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout versioned source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-source.outputs.release_sha }}
          fetch-depth: 0
      - name: Download manifest reports
        uses: actions/download-artifact@v5
        with:
          pattern: manifest-*
          path: release-digests
          merge-multiple: true
      - name: Create immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.plan-version.outputs.tag }}" "${{ needs.version-source.outputs.release_sha }}" \
            -m "Connect|API ${{ needs.plan-version.outputs.tag }}"
          git push origin "${{ needs.plan-version.outputs.tag }}"
      - name: Build image manifest report
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.plan-version.outputs.version }}"
          {
            echo "Connect|API ${version}"
            echo
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-api:${version}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-manager:${version}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-docs:${version}"
            echo
            for f in release-digests/*.txt; do
              echo "===== $(basename "$f") ====="
              cat "$f"
              echo
            done
          } > IMAGE-DIGESTS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${{ needs.plan-version.outputs.version }}.md"
          notes_args=(--generate-notes)
          if [[ -f "$notes" ]]; then
            notes_args=(--notes-file "$notes")
          fi
          gh release create "${{ needs.plan-version.outputs.tag }}" IMAGE-DIGESTS.txt \
            --target "${{ needs.version-source.outputs.release_sha }}" \
            --title "Connect|API ${{ needs.plan-version.outputs.tag }}" \
            "${notes_args[@]}"
