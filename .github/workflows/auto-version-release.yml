name: Release - Auto Version, Build and Publish

on:
  push:
    branches: [main]
  # Validate this exact release path before merge, without publication rights.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/auto-version-release.yml
      - .github/scripts/release-publication-policy.py
      - .github/RELEASE_HOLD.md
      - test/release-publication-policy.test.py
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Optional bump override for manual execution"
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-validation-pr-{0}', github.event.pull_request.number) || 'argws-connect-release-main' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'

jobs:
  validate:
    name: Validate source
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release-policy.outputs.publish }}
    env:
      DATABASE_PROVIDER: postgresql
    steps:
      - name: Refuse publication outside main
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'Production releases must run on main.' >&2; exit 1; }
      - name: Checkout merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Evaluate release publication policy
        id: release-policy
        run: python3 .github/scripts/release-publication-policy.py
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-yaml
      - name: Test release hold and publication boundaries
        run: python3 test/release-publication-policy.test.py
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run db:generate
      - run: npm run build
      - name: Validate operations, groups, catalog and release preservation
        run: |
          npm run test:operations
          node --test test/operations-resilience.test.cjs test/operations-statistics.test.cjs test/operations-statistics-http.test.cjs test/release-version.test.cjs
          python3 scripts/sync-operations-deployments.py --check
          python3 scripts/sync-fersoft-deployments.py --check
          python3 test/deploy-operations.test.py
          python3 test/compose-env-only-deployments.test.py
          python3 test/operations-compose-contract.py
      - name: Validate production Manager
        run: |
          npm --prefix manager install --ignore-scripts --no-audit --no-fund
          MANAGER_BUILD_MODE=production npm --prefix manager run test
      - name: Synchronize generated docs for validation
        run: npm run docs:generate
      - run: npm run docs:check

  plan-version:
    name: Plan semantic version
    needs: validate
    if: ${{ needs.validate.result == 'success' && needs.validate.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      bump: ${{ steps.plan.outputs.bump }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve merged PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')"
          title="$(jq -r '.[0].title // empty' <<<"$pr_json")"
          labels="$(jq -r '[.[0].labels[]?.name] | join(",")' <<<"$pr_json")"
          {
            echo "title=$title"
            echo "labels=$labels"
          } >> "$GITHUB_OUTPUT"
      - name: Compute next version
        id: plan
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          FORCE_BUMP: ${{ inputs.force_bump || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | awk '!found && /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; found=1 }')"
          labels="$LABELS"
          if [[ "$FORCE_BUMP" != "auto" && -n "$FORCE_BUMP" ]]; then
            labels="version:$FORCE_BUMP"
          fi
          plan="$(node .github/scripts/compute-next-version.mjs "$latest" "$labels" "$PR_TITLE")"
          version="$(jq -r '.version' <<<"$plan")"
          bump="$(jq -r '.bump' <<<"$plan")"
          previous="$(jq -r '.previous // ""' <<<"$plan")"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists; refusing duplicate release." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "bump=$bump"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Planned Connect|API v${version} (${bump})"

  prepare-build-bases:
    name: Prepare GHCR build bases
    needs: plan-version
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Ensure build images exist in GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_image() {
            local source="$1"
            local target="$2"
            if skopeo inspect "docker://${target}" >/dev/null 2>&1; then
              echo "Build base already available: ${target}"
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if skopeo copy --all "docker://${source}" "docker://${target}"; then
                return 0
              fi
              echo "Registry copy attempt ${attempt}/5 failed; retrying..." >&2
              sleep $((attempt * 10))
            done
            echo "Unable to seed ${target}." >&2
            return 1
          }
          ensure_image docker.io/library/node:24-alpine ghcr.io/${OWNER}/argws-connect-node:24-alpine
          ensure_image docker.io/library/node:22-bookworm-slim ghcr.io/${OWNER}/argws-connect-node:22-bookworm-slim
          ensure_image docker.io/library/nginx:1.27-alpine ghcr.io/${OWNER}/argws-connect-nginx:1.27-alpine
          ensure_image docker.io/moby/buildkit:buildx-stable-1 ghcr.io/${OWNER}/argws-connect-buildkit:buildx-stable-1

  build-native:
    name: Build ${{ matrix.component }} / ${{ matrix.arch }}
    needs: [plan-version, prepare-build-bases]
    strategy:
      fail-fast: false
      matrix:
        component: [api, manager, docs, transcription-service]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - component: api
            context: .
            dockerfile: ./Dockerfile
            image: argws-connect-api
          - component: manager
            context: ./manager
            dockerfile: ./manager/Dockerfile
            image: argws-connect-manager
          - component: docs
            context: .
            dockerfile: ./docs/Dockerfile
            image: argws-connect-docs
          - component: transcription-service
            context: ./transcription-service
            dockerfile: ./transcription-service/Dockerfile
            image: connect-transcription-service
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Materialize planned version in build context
        run: node .github/scripts/apply-version.mjs "${{ needs.plan-version.outputs.version }}"
      - name: Regenerate docs for planned version
        run: node docs/scripts/generate-openapi.mjs
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=ghcr.io/${{ github.repository_owner }}/argws-connect-buildkit:buildx-stable-1
      - name: Build native image and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.plan-version.outputs.version }}
            MANAGER_BUILD_MODE=production
          labels: |
            org.opencontainers.image.title=Connect|API ${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.plan-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=release-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}-${{ matrix.arch }}
      - name: Validate native speech before publishing a channel tag
        if: matrix.component == 'transcription-service'
        uses: ./.github/actions/speech-native-smoke
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  version-source:
    name: Persist version metadata
    needs: [plan-version, build-native]
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - name: Ensure main still points to validated commit
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "main moved while release was being prepared ($current != $GITHUB_SHA)." >&2
            exit 1
          fi
      - name: Apply version
        run: node .github/scripts/apply-version.mjs "${{ needs.plan-version.outputs.version }}"
      - name: Synchronize generated docs for release version
        run: node docs/scripts/generate-openapi.mjs
      - name: Commit version metadata only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json RELEASE-MANIFEST.json \
            docs/openapi/connect-api.openapi.json \
            docs/openapi/meta-compatible.openapi.json \
            docs/openapi/findhub.openapi.json \
            docs/openapi/coverage.json \
            docs/asyncapi/connect-api-events.asyncapi.json
          git diff --exit-code -- deploy/canonical
          if ! git diff --cached --quiet -- .github/workflows; then
            echo 'Release metadata must never modify workflows.' >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore(release): v${{ needs.plan-version.outputs.version }} [skip release]"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-manifests:
    name: Publish multi-arch ${{ matrix.component }}
    needs: [plan-version, version-source, build-native]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            image: argws-connect-api
          - component: manager
            image: argws-connect-manager
          - component: docs
            image: argws-connect-docs
          - component: transcription-service
            image: connect-transcription-service
    steps:
      - name: Download native digests
        uses: actions/download-artifact@v5
        with:
          pattern: digest-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release manifest and tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.plan-version.outputs.version }}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          repo="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("${repo}@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            -t "${repo}:${version}" \
            -t "${repo}:${major}.${minor}" \
            -t "${repo}:${major}" \
            -t "${repo}:latest" \
            -t "${repo}:sha-${{ needs.version-source.outputs.release_sha }}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${repo}:${version}"
      - name: Save manifest digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-digests
          repo="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          docker buildx imagetools inspect "${repo}:${{ needs.plan-version.outputs.version }}" > "release-digests/${{ matrix.image }}.txt"
      - name: Upload manifest report
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.image }}
          path: release-digests/${{ matrix.image }}.txt
          retention-days: 30

  findhub-extension:
    name: Build Find Hub extension distribution
    needs: [plan-version, version-source]
    uses: ./.github/workflows/findhub-extension-build.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ needs.version-source.outputs.release_sha }}
      channel: stable

  connect-deployer:
    name: Build Connect|API Deployer Windows binary
    needs: [plan-version, version-source]
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout versioned source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-source.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test deployer package
        run: npm test --prefix tools/connect-deployer
      - name: Prepare native Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          target: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Locate Windows resource compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter rc.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\rc.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$rc) { throw 'Windows SDK resource compiler missing' }
          "RC_EXE=$($rc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build native Rust Windows executable
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Stop'
          $cliProject = 'tools/connect-deployer/native/Cargo.toml'
          $guiProject = 'tools/connect-deployer/gui/Cargo.toml'
          cargo +1.90.0 test --manifest-path $cliProject
          if ($LASTEXITCODE -ne 0) { throw 'Rust deployer CLI tests failed' }
          cargo +1.90.0 test --manifest-path $guiProject
          if ($LASTEXITCODE -ne 0) { throw 'Rust deployer GUI tests failed' }
          cargo +1.90.0 build --manifest-path $cliProject --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust deployer CLI build failed' }
          cargo +1.90.0 build --manifest-path $guiProject --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust deployer GUI build failed' }
          New-Item -ItemType Directory -Force connect-deployer-dist | Out-Null
          Copy-Item tools\connect-deployer\native\target\x86_64-pc-windows-msvc\release\argws-connect-deployer.exe connect-deployer-dist\argws-connect-deployer-win-x64.exe
          Copy-Item tools\connect-deployer\gui\target\x86_64-pc-windows-msvc\release\argws-connect-deployer-gui.exe connect-deployer-dist\argws-connect-deployer-gui-win-x64.exe
      - name: Generate checksum
        working-directory: connect-deployer-dist
        shell: pwsh
        run: |
          Get-ChildItem *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File SHA256SUMS.txt -Encoding utf8
      - name: Generate build provenance
        working-directory: connect-deployer-dist
        env:
          SOURCE_REVISION: ${{ needs.version-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.plan-version.outputs.version }}
        shell: pwsh
        run: |
          @"
          {
            "channel": "stable",
            "version": "$env:RELEASE_VERSION",
            "sourceRevision": "$env:SOURCE_REVISION",
            "binary": "argws-connect-deployer-win-x64.exe",
            "guiBinary": "argws-connect-deployer-gui-win-x64.exe",
            "runtime": "rust-native",
            "iconSource": "browser-extensions/findhub-auth/icons/icon-16.png,icon-32.png,icon-48.png,icon-128.png"
          }
          "@ | Out-File connect-deployer-release.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: connect-deployer-distribution
          path: connect-deployer-dist
          if-no-files-found: error
          retention-days: 14

  release:
    name: Tag and publish GitHub Release
    needs: [plan-version, version-source, publish-manifests, findhub-extension, connect-deployer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout versioned source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-source.outputs.release_sha }}
          fetch-depth: 0
      - name: Download manifest reports
        uses: actions/download-artifact@v5
        with:
          pattern: manifest-*
          path: release-digests
          merge-multiple: true
      - name: Download tested Find Hub ZIP and Windows installer
        uses: actions/download-artifact@v5
        with:
          name: findhub-extension-distribution
          path: extension-dist
      - name: Download tested Connect|API Deployer Windows binary
        uses: actions/download-artifact@v5
        with:
          name: connect-deployer-distribution
          path: connect-deployer-dist
      - name: Verify extension publication inputs
        shell: bash
        run: |
          set -euo pipefail
          cd extension-dist
          sha256sum --check SHA256SUMS.txt
          test "$(jq -r '.sourceRevision' extension-release.json)" = "${{ needs.version-source.outputs.release_sha }}"
          cd ../connect-deployer-dist
          sha256sum --check SHA256SUMS.txt
      - name: Prepare uniquely named release checksums
        shell: bash
        run: |
          set -euo pipefail
          cp extension-dist/SHA256SUMS.txt extension-dist/Connect-FindHub-Auth-SHA256SUMS.txt
          cp connect-deployer-dist/SHA256SUMS.txt connect-deployer-dist/Connect-API-Deployer-SHA256SUMS.txt
      - name: Create immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.plan-version.outputs.tag }}" "${{ needs.version-source.outputs.release_sha }}" \
            -m "Connect|API ${{ needs.plan-version.outputs.tag }}"
          git push origin "${{ needs.plan-version.outputs.tag }}"
      - name: Build image manifest report
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.plan-version.outputs.version }}"
          {
            echo "Connect|API ${version}"
            echo
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-api:${version}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-manager:${version}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-docs:${version}"
            echo "ghcr.io/${{ github.repository_owner }}/connect-transcription-service:${version}"
            echo
            for f in release-digests/*.txt; do
              echo "===== $(basename "$f") ====="
              cat "$f"
              echo
            done
          } > IMAGE-DIGESTS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${{ needs.plan-version.outputs.version }}.md"
          notes_args=(--generate-notes)
          if [[ -f "$notes" ]]; then
            notes_args=(--notes-file "$notes")
          fi
              gh release create "${{ needs.plan-version.outputs.tag }}" IMAGE-DIGESTS.txt extension-dist/Connect-FindHub-Auth-*.zip extension-dist/Connect-FindHub-Auth-Setup-*.exe extension-dist/Connect-FindHub-Auth-Assistant-*.exe extension-dist/extension-release.json extension-dist/Connect-FindHub-Auth-SHA256SUMS.txt connect-deployer-dist/argws-connect-deployer-win-x64.exe connect-deployer-dist/argws-connect-deployer-gui-win-x64.exe connect-deployer-dist/connect-deployer-release.json connect-deployer-dist/Connect-API-Deployer-SHA256SUMS.txt \
            --target "${{ needs.version-source.outputs.release_sha }}" \
            --title "Connect|API ${{ needs.plan-version.outputs.tag }}" \
            "${notes_args[@]}"

  sync-develop:
    name: Align develop version and refresh development images
    needs: [plan-version, version-source, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-source.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Synchronize released version without overwriting develop work
        id: sync
        env:
          RELEASE_SHA: ${{ needs.version-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.plan-version.outputs.version }}
        run: node .github/scripts/sync-release-version.mjs "$RELEASE_SHA" "$RELEASE_VERSION"
      - name: Refresh API, Manager and DOCs development images
        if: steps.sync.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger push workflows. Explicit dispatch
          # refreshes only :develop and cannot start another stable release.
          gh workflow run ghcr-publish-application.yml --ref develop
          gh workflow run ghcr-publish-docs.yml --ref develop
          gh workflow run findhub-extension-release.yml --ref develop
          gh workflow run connect-deployer.yml --ref develop

  protected-retention:
    needs: [release, sync-develop, version-source]
    if: >-
      always() && needs.release.result == 'success' && needs.sync-develop.result == 'success' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/ghcr-retention.yml
    with:
      publication_sha: ${{ needs.version-source.outputs.release_sha }}
      source_sha: ${{ github.sha }}
      branch: ${{ github.ref_name }}
    secrets: inherit
