name: Manager Source Recovery

on:
  push:
    branches:
      - recovery/manager-source-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manager-source-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip recovery]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v5
        with:
          ref: recovery/manager-source-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Detect current Manager bundles
        id: bundles
        shell: bash
        run: |
          set -euo pipefail

          js_asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' manager/dist/index.html | head -n1)"
          css_asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.css' manager/dist/index.html | head -n1)"

          if [[ -z "$js_asset" || -z "$css_asset" ]]; then
            echo 'Could not detect Manager JS/CSS assets from manager/dist/index.html' >&2
            exit 1
          fi

          js_path="manager/dist${js_asset}"
          css_path="manager/dist${css_asset}"

          test -f "$js_path"
          test -f "$css_path"

          echo "js_path=$js_path" >> "$GITHUB_OUTPUT"
          echo "css_path=$css_path" >> "$GITHUB_OUTPUT"
          echo "Detected JS:  $js_path"
          echo "Detected CSS: $css_path"

      - name: Materialize readable legacy source
        shell: bash
        env:
          JS_PATH: ${{ steps.bundles.outputs.js_path }}
          CSS_PATH: ${{ steps.bundles.outputs.css_path }}
        run: |
          set -euo pipefail

          rm -rf manager/recovered
          mkdir -p manager/recovered/legacy manager/recovered/analysis

          cp "$JS_PATH" manager/recovered/legacy/index.js
          cp "$CSS_PATH" manager/recovered/legacy/index.css

          npx --yes prettier@3.6.2 --parser babel --write manager/recovered/legacy/index.js
          npx --yes prettier@3.6.2 --parser css --write manager/recovered/legacy/index.css

          node manager/recovery/analyze-bundle.mjs \
            manager/recovered/legacy/index.js \
            manager/recovered/recovery-report.json

      - name: Extract recovered components
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @babel/parser@7.28.4
          node manager/recovery/extract-components.mjs \
            manager/recovered/legacy/index.js \
            manager/recovered/analysis

      - name: Recover i18n context
        shell: bash
        run: |
          set -euo pipefail
          node manager/recovery/extract-i18n-context.mjs \
            manager/recovered/legacy/index.js \
            manager/recovered/analysis/i18n

      - name: Validate locale runtime policy
        shell: bash
        run: |
          set -euo pipefail

          node manager/recovery/generate-runtime-config.mjs \
            manager/recovered/analysis/runtime-config.default.js

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const parseConfig = (file) => {
            const source = fs.readFileSync(file, 'utf8');
            const match = source.match(/Object\.freeze\(([\s\S]+)\);\s*$/);
            if (!match) throw new Error(`Unable to parse runtime config: ${file}`);
            return JSON.parse(match[1]);
          };

          const config = parseConfig('manager/recovered/analysis/runtime-config.default.js');
          const locale = config.locale;

          if (locale.primaryLocale !== 'pt-BR') throw new Error('Primary locale must be pt-BR.');
          if (locale.defaultLocale !== 'pt-BR') throw new Error('Default locale must be pt-BR.');
          if (locale.extraLocalesEnabled !== false) throw new Error('Extra locales must be disabled by default.');
          if (JSON.stringify(locale.enabledLocales) !== JSON.stringify(['pt-BR'])) {
            throw new Error(`Only pt-BR may be enabled by default: ${JSON.stringify(locale.enabledLocales)}`);
          }
          NODE

          MANAGER_ENABLE_EXTRA_LOCALES=true \
          MANAGER_DEFAULT_LOCALE=en-US \
          MANAGER_EXTRA_LOCALES=en-US,es-ES,invalid-locale \
          node manager/recovery/generate-runtime-config.mjs /tmp/manager-runtime-extra.js

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const source = fs.readFileSync('/tmp/manager-runtime-extra.js', 'utf8');
          const match = source.match(/Object\.freeze\(([\s\S]+)\);\s*$/);
          if (!match) throw new Error('Unable to parse extra-locale runtime config.');

          const { locale } = JSON.parse(match[1]);
          if (locale.defaultLocale !== 'en-US') throw new Error('Explicit enabled default locale was not honored.');
          if (locale.extraLocalesEnabled !== true) throw new Error('Extra locale flag was not enabled.');
          if (!locale.enabledLocales.includes('pt-BR')) throw new Error('pt-BR must remain enabled.');
          if (!locale.enabledLocales.includes('en-US')) throw new Error('en-US was not enabled.');
          if (!locale.enabledLocales.includes('es-ES')) throw new Error('es-ES was not enabled.');
          if (locale.enabledLocales.includes('invalid-locale')) throw new Error('Unknown locale must be ignored.');
          NODE

      - name: Validate recovered source
        shell: bash
        run: |
          set -euo pipefail

          test -s manager/recovered/legacy/index.js
          test -s manager/recovered/legacy/index.css
          test -s manager/recovered/recovery-report.json
          test -s manager/recovered/analysis/pages/LandingPage.Fse.js
          test -s manager/recovered/analysis/pages/LoginPage.Dse.js
          test -s manager/recovered/analysis/pages/InstancesPage.CZ.js
          test -s manager/recovered/analysis/pages/InstanceDashboard.PX.js
          test -s manager/recovered/analysis/router/Router.Lse.js
          test -s manager/recovered/analysis/i18n/SidebarPtBR.Dae.js
          test -s manager/recovered/analysis/i18n/locale-context.json
          test -s manager/recovered/analysis/runtime-config.default.js
          test -s manager/recovered/analysis/inventory.json
          test -s manager/recovered/analysis/route-component-map.json
          test -s manager/recovered/analysis/architecture-hints.json

          node --input-type=module --check < manager/recovered/legacy/index.js

          grep -q 'Modern web interface for Connect|API management' manager/recovered/analysis/pages/LandingPage.Fse.js
          grep -q 'Access Manager Dashboard' manager/recovered/analysis/pages/LandingPage.Fse.js
          grep -q 'Suporte Premium' manager/recovered/analysis/i18n/SidebarPtBR.Dae.js
          grep -q '"defaultLocale": "pt-BR"' manager/recovered/analysis/i18n/locale-context.json
          grep -q '"extraLocalesDisabledByDefault": true' manager/recovered/analysis/i18n/locale-context.json
          grep -q '"missingRequired": \[\]' manager/recovered/analysis/inventory.json
          grep -q '"sourceMapReference"' manager/recovered/recovery-report.json

      - name: Commit recovered readable source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add manager/recovered

          if git diff --cached --quiet; then
            echo 'Recovered source is already synchronized.'
            exit 0
          fi

          git commit -m 'chore(manager): recover readable legacy source [skip recovery]'
          git push origin HEAD:recovery/manager-source-v1
