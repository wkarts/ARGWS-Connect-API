name: Align optional operations deployment
on:
  push:
    branches: [feat/operations-archive-zapo-catalog-groups]
    paths: [.github/workflows/align-operations-deployment.yml]
permissions:
  contents: write
jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/operations-archive-zapo-catalog-groups
      - name: Extend the contract without weakening existing checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(s, old, new):
              assert s.count(old) == 1, old
              return s.replace(old, new)
          for profile in ('develop', 'production'):
              file = Path(f'deploy/{profile}/compose.yaml')
              s = file.read_text()
              name = f'operations-argws-connect-{profile}'
              s = once(s, '  operations:\n    profiles:', f'  {name}:\n    container_name: {name}\n    profiles:')
              start = s.index(f'  {name}:\n')
              end = s.index(f'  docs-argws-connect-{profile}:\n', start)
              block = s[start:end]
              block = once(block, f'    networks: [argws-connect-{profile}-net]', f'    networks:\n      argws-connect-{profile}-net:\n        aliases: [operations]')
              file.write_text(s[:start] + block + s[end:])
              env = Path(f'deploy/{profile}/env.example')
              s = env.read_text()
              assert 'OPERATIONS_ENABLED=' not in s
              env.write_text(s + '\n# Optional operational history; add operations to COMPOSE_PROFILES to enable.\nOPERATIONS_ENABLED=false\nOPERATIONS_INTERNAL_TOKEN=\nARGWS_CONNECT_OPERATIONS_DATA_PATH=./volumes/operations\nOPERATIONS_HOT_DAYS=3\nOPERATIONS_RETENTION_DAYS=90\n')
          file = Path('.github/workflows/deployment-integrity.yml')
          s = file.read_text()
          s = once(s, "              optional = {f'{r}-{suffix}' for r in optional_resources}\n", "              optional = {f'{r}-{suffix}' for r in optional_resources}\n              if stack in ('production', 'develop'):\n                  optional.add(f'operations-{suffix}')\n")
          extra = [
              "              if stack in ('production', 'develop'):",
              "                  agent = full['services'][f'operations-{suffix}']",
              "                  assert agent.get('profiles') == ['operations'], 'Operations must remain opt-in'",
              "                  assert agent['image'] == full['services'][f'api-{suffix}']['image'], 'Agent/API image versions must match'",
              "                  assert agent.get('read_only') is True and not agent.get('privileged'), 'Operations must not be privileged'",
              "                  assert 'ALL' in agent.get('cap_drop', []), 'Operations must drop capabilities'",
              "                  assert float(agent['cpus']) <= 0.5 and agent['mem_limit'] <= 201326592, 'Operations resource limits missing'",
              "                  assert 'operations' in agent['networks'][f'{suffix}-net']['aliases'], 'Internal operations alias missing'",
              "                  assert agent['entrypoint'] == ['node', '/argws-connect/operations-agent/server.cjs'], 'Agent must not start the WhatsApp API'",
              "                  assert all('docker.sock' not in mount.get('source', '') for mount in agent.get('volumes', [])), 'Docker socket must not be exposed'",
              "                  assert f'operations-{suffix}' not in full['services'][f'api-{suffix}'].get('depends_on', {}), 'Monitoring must not block API startup'",
              "                  assert env.get('OPERATIONS_ENABLED') == 'false', 'Monitoring is opt-in for existing stacks'",
              "",
          ]
          s = once(s, "              api_service = full['services'][f'api-{suffix}']", '\n'.join(extra) + "              api_service = full['services'][f'api-{suffix}']")
          file.write_text(s)
          PY
      - name: Check syntax and full optional profiles
        run: |
          for profile in develop production; do
            cp "deploy/$profile/env.example" "deploy/$profile/.env"
            docker compose --profile '*' -f "deploy/$profile/compose.yaml" config -q
            rm "deploy/$profile/.env"
          done
      - name: Commit only deployment changes
        env:
          HUSKY: '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/develop/compose.yaml deploy/develop/env.example deploy/production/compose.yaml deploy/production/env.example .github/workflows/deployment-integrity.yml
          git commit -m 'fix(deploy): name and constrain operations agents in official stacks'
          git push origin HEAD:feat/operations-archive-zapo-catalog-groups
