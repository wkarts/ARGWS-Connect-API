name: GHCR - Publish Development Images

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: argws-connect-develop-images
  cancel-in-progress: true

jobs:
  guard:
    name: Guard develop channel
    runs-on: ubuntu-latest
    steps:
      - name: Refuse execution outside develop
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/develop" ]]; then
            echo "This workflow may publish only from refs/heads/develop (got ${GITHUB_REF})." >&2
            exit 1
          fi

  prepare-build-bases:
    name: Prepare GHCR build bases
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Ensure GHCR build bases exist
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          skopeo copy --all docker://docker.io/library/node:24-alpine docker://ghcr.io/${OWNER}/argws-connect-node:24-alpine
          skopeo copy --all docker://docker.io/library/nginx:1.27-alpine docker://ghcr.io/${OWNER}/argws-connect-nginx:1.27-alpine
          skopeo copy --all docker://docker.io/library/python:3.13-slim docker://ghcr.io/${OWNER}/argws-connect-python:3.13-slim

  build-native:
    name: Build develop ${{ matrix.component }} / ${{ matrix.arch }}
    needs: prepare-build-bases
    strategy:
      fail-fast: false
      matrix:
        component: [api, platform-api, platform-web, platform-gateway, platform-acme, platform-cloudpanel-agent]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - component: api
            context: .
            dockerfile: ./Dockerfile
            image: argws-connect-api
          - component: platform-api
            context: .
            dockerfile: ./platform/control-api/Dockerfile
            image: argws-connect-platform-api
          - component: platform-web
            context: .
            dockerfile: ./platform/web/Dockerfile
            image: argws-connect-platform-web
          - component: platform-gateway
            context: .
            dockerfile: ./platform/gateway/Dockerfile
            image: argws-connect-platform-gateway
          - component: platform-acme
            context: ./platform
            dockerfile: ./platform/infrastructure/acme/Dockerfile
            image: argws-connect-platform-acme
          - component: platform-cloudpanel-agent
            context: ./platform
            dockerfile: ./platform/infrastructure/cloudpanel-agent/Dockerfile
            image: argws-connect-platform-cloudpanel-agent
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          submodules: recursive
          fetch-depth: 0

      - name: Verify checked out branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "develop" ]]

      - name: Resolve runtime base version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native development image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.title=ARGWS Connect ${{ matrix.component }}
            org.opencontainers.image.version=develop
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=develop-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=develop-${{ matrix.component }}-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-develop-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.component }} :develop multi-arch manifest
    needs: build-native
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            image: argws-connect-api
          - component: platform-api
            image: argws-connect-platform-api
          - component: platform-web
            image: argws-connect-platform-web
          - component: platform-gateway
            image: argws-connect-platform-gateway
          - component: platform-acme
            image: argws-connect-platform-acme
          - component: platform-cloudpanel-agent
            image: argws-connect-platform-cloudpanel-agent
    steps:
      - name: Download native digests
        uses: actions/download-artifact@v5
        with:
          pattern: digest-develop-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only develop tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/develop" ]]
          repo="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("${repo}@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t "${repo}:develop" "${sources[@]}"
          docker buildx imagetools inspect "${repo}:develop"
