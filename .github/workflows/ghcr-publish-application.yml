name: GHCR - Publish Application Images

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*", "*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare-build-bases:
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Ensure GHCR build bases exist
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          skopeo copy --all docker://docker.io/library/node:24-alpine docker://ghcr.io/${OWNER}/argws-connect-node:24-alpine
          skopeo copy --all docker://docker.io/library/nginx:1.27-alpine docker://ghcr.io/${OWNER}/argws-connect-nginx:1.27-alpine

  build:
    needs: prepare-build-bases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            dockerfile: ./Dockerfile
            image: argws-connect-api
          - component: manager
            context: ./manager
            dockerfile: ./manager/Dockerfile
            image: argws-connect-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=homolog,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push ${{ matrix.component }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Print digest
        run: echo "${{ matrix.image }}=${{ steps.build.outputs.digest }}"
