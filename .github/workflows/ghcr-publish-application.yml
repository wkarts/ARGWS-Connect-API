name: GHCR - Publish Development Image

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-build-bases:
    name: Prepare GHCR build base
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Ensure GHCR build base exists
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          skopeo copy --all docker://docker.io/library/node:24-alpine docker://ghcr.io/${OWNER}/argws-connect-node:24-alpine

  build-native:
    name: Build develop / ${{ matrix.arch }}
    needs: prepare-build-bases
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve runtime base version
        id: metadata
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native development image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/argws-connect-api,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.title=ARGWS Connect API
            org.opencontainers.image.version=develop
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=develop-api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=develop-api-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-develop-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish :develop multi-arch manifest
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Download native digests
        uses: actions/download-artifact@v5
        with:
          pattern: digest-develop-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only develop tag
        shell: bash
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/argws-connect-api"
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("${repo}@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t "${repo}:develop" "${sources[@]}"
          docker buildx imagetools inspect "${repo}:develop"
