name: Find Hub - Validate observations correction
on:
  push:
    branches: [fix/findhub-live-observations-ui]
    paths: [.github/workflows/findhub-observations-workspace.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      DATABASE_PROVIDER: postgresql
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply reviewed correction and remove temporary workspace
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e7c3120ba0f1798bbe0cc9005d309b936a374f4a HEAD
          cat .github/findhub-observations-source/part* | base64 -d | xz -d > /tmp/findhub-correction.patch
          echo '035809bb1c3d3ff79761f86ee67b34249d69af1b77fd3f099b7bde306d9edea6  /tmp/findhub-correction.patch' | sha256sum -c -
          git apply --check /tmp/findhub-correction.patch
          git apply /tmp/findhub-correction.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('manager/src/views/FindHubView.vue')
          text=path.read_text()
          start=text.index('async function reloadSnapshot()')
          end=text.index('\n\n',start)
          original=text[start:end]
          account='instanceName' if 'instanceName.value' in original else 'id'
          assert f'{account}.value' in original and 'applyFindHubUpdate' in original
          if not re.search(r'\b(?:let|const) sequence\b',text):
              hook=f'watch({account}, () => {{ trackingOpen.value = false }})'
              assert hook in text and 'onBeforeUnmount(stopStream)' in text
              text=text.replace(hook,f'watch({account}, () => {{ sequence++; trackingOpen.value = false }})',1)
              text=text.replace('onBeforeUnmount(stopStream)','onBeforeUnmount(() => { sequence++; stopStream() })',1)
              declaration='let sequence = 0\n'
          else:
              declaration=''
          replacement=declaration+'''let snapshotRefreshSequence = 0
          async function reloadSnapshot() {
            const requestId = sequence
            const refreshId = ++snapshotRefreshSequence
            const currentId = ACCOUNT.value
            if (!currentId) return
            const incoming = await connect.findHubSnapshot(currentId)
            if (requestId !== sequence || refreshId !== snapshotRefreshSequence || currentId !== ACCOUNT.value) return
            snapshot.value = applyFindHubUpdate(snapshot.value, { event: 'snapshot', data: incoming }, currentId)
            devices.value = snapshot.value.devices
            if (auth.value) auth.value.historyEnabled = snapshot.value.settings.historyEnabled
          }'''.replace('ACCOUNT',account)
          assert text.count(original)==1
          path.write_text(text.replace(original,replacement,1))
          print('Snapshot refresh now rejects superseded requests and account lifecycle changes.')
          PY
          rm -r .github/findhub-observations-source
          rm .github/workflows/findhub-observations-workspace.yml
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed backend files and validate API
        run: |
          set -euo pipefail
          npx prettier --write src/api/integrations/channel/findhub/services/findhub-protocol.client.ts src/api/integrations/channel/findhub/services/findhub-runtime.service.ts
          npm run db:generate
          npm run lint:check
          npm run docs:generate
          npm run docs:check
          npm run test:compat
          npm run build
      - name: Validate complete Manager
        working-directory: manager
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
      - name: Export validated code without publishing application images
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = '''docs/asyncapi/connect-api-events.asyncapi.json
          docs/guides/findhub-observations-ui.md
          docs/openapi/connect-api.openapi.json
          docs/openapi/coverage.json
          docs/openapi/findhub.openapi.json
          docs/scripts/findhub-schemas.mjs
          manager/scripts/findhub-channel.test.mjs
          manager/scripts/findhub-live.test.mjs
          manager/src/components/FindHubInstanceCard.vue
          manager/src/components/FindHubLiveTracking.vue
          manager/src/components/FindHubPositionDetails.vue
          manager/src/services/findhub-live-state.ts
          manager/src/services/findhub-position.ts
          manager/src/views/FindHubView.vue
          src/api/integrations/channel/findhub/services/findhub-protocol.client.ts
          src/api/integrations/channel/findhub/services/findhub-runtime.service.ts
          test/findhub-tracking.test.cjs'''.split()
          subprocess.run(['git','add','-u'],check=True)
          subprocess.run(['git','add','-f','--',*allowed],check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only','e7c3120ba0f1798bbe0cc9005d309b936a374f4a'],text=True).splitlines()
          assert set(changed) <= set(allowed), f'Unexpected changes: {set(changed)-set(allowed)}'
          assert len(changed) == len(allowed), f'Missing corrections: {set(allowed)-set(changed)}'
          print('Protected sources unchanged. Changed files:',len(changed))
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(findhub): validate observed positions and consistent realtime UI'
          git push origin HEAD:refs/heads/work/findhub-observations-validated
          mkdir -p /tmp/findhub-validated
          git rev-parse HEAD > /tmp/findhub-validated/commit.txt
          git rev-parse HEAD^{tree} > /tmp/findhub-validated/tree.txt
          git diff --binary e7c3120ba0f1798bbe0cc9005d309b936a374f4a HEAD > /tmp/findhub-validated/correction.patch
          git archive --format=tar.gz HEAD > /tmp/findhub-validated/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: findhub-observations-validated
          path: /tmp/findhub-validated
          retention-days: 7
