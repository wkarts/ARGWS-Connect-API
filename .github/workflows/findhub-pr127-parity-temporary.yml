name: Find Hub PR127 parity reconciliation
on:
  push:
    branches: [feat/findhub-realtime-traccar-retention]
    paths: [.github/workflows/findhub-pr127-parity-temporary.yml]
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconcile only Find Hub models and generated Traccar container names
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/findhub-realtime-traccar-retention
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('prisma/psql_bouncer-schema.prisma');s=p.read_text();postgres=Path('prisma/postgresql-schema.prisma').read_text()
          for model in ['FindHubAccount','FindHubDevice','FindHubPosition','FindHubTraccarBinding']:
              pattern=rf'model {model} \{{.*?\n\}}'
              new=re.search(pattern,postgres,re.S)
              assert new and len(re.findall(pattern,s,re.S))==1,model
              s=re.sub(pattern,lambda _:new.group(),s,count=1,flags=re.S)
          p.write_text(s)
          normalize=lambda value:re.sub(r'datasource db \{.*?\}','datasource db { PROVIDER }',value,count=1,flags=re.S)
          assert normalize(s)==normalize(postgres)
          p=Path('scripts/sync-traccar-deployments.py');s=p.read_text();before="  header=re.search(r'^services:\\s*\\n',text,re.M)"
          assert s.count(before)==1
          s=s.replace(before,"  # Preserve the explicit container-name convention of the existing named API stacks.\n  if suffix and not swarm:\n   for service_name in (tracker,db,bootstrap):\n    service=re.sub(rf'^  {re.escape(service_name)}:\\n',f'  {service_name}:\\n    container_name: {service_name}\\n',service,count=1,flags=re.M)\n"+before)
          p.write_text(s)
          p=Path('test/traccar-deployment.test.py');s=p.read_text();before=' def test_root_helper_has_correct_relative_path(self):'
          assert s.count(before)==1
          s=s.replace(before," def test_named_official_stacks_preserve_container_identity(self):\n  for stack in ['production','develop','canonical']:\n   text=(ROOT/f'deploy/{stack}/compose.yaml').read_text()\n   for service in ['traccar','traccar-postgres','traccar-bootstrap']:\n    name=f'{service}-argws-connect-{stack}'\n    self.assertIn(f'  {name}:\\n    container_name: {name}\\n',text)\n"+before)
          p.write_text(s)
          p=Path('.github/workflows/deployment-integrity.yml');s=p.read_text()
          a="optional_resources = ('nats', 'zookeeper', 'kafka')"
          assert s.count(a)==1
          s=s.replace(a,"optional_resources = ('nats', 'zookeeper', 'kafka', 'traccar', 'traccar-postgres', 'traccar-bootstrap')")
          a="              'kafka': 'ghcr.io/wkarts/argws-connect-kafka:7.5.0',"
          assert s.count(a)==1
          s=s.replace(a,a+"\n              'traccar': 'ghcr.io/wkarts/argws-connect-traccar:6.15.3-alpine',\n              'traccar-postgres': 'ghcr.io/wkarts/argws-connect-postgres:15',\n              'traccar-bootstrap': 'ghcr.io/wkarts/argws-connect-node:22-bookworm-slim',")
          a="              api_service = full['services'][f'api-{suffix}']"
          assert s.count(a)==1
          s=s.replace(a,a+"\n              for resource in ('traccar', 'traccar-postgres', 'traccar-bootstrap'):\n                  name = f'{resource}-{suffix}'\n                  cfg = full['services'][name]\n                  assert cfg.get('profiles') == ['traccar'], f'{stack}: {name} deve ser opcional'\n                  assert name not in api_service.get('depends_on', {}), f'{stack}: Traccar nao pode bloquear a API'\n                  assert not cfg.get('privileged') and not cfg.get('network_mode'), f'{stack}: Traccar deve usar somente a rede interna'\n")
          Path('/tmp/deployment-integrity.yml').write_text(s)
          PY
          python3 scripts/sync-traccar-deployments.py
          python3 test/traccar-deployment.test.py
          python3 scripts/check-traccar-compose.py
      - name: Execute strengthened official deployment assertions
        shell: bash
        run: |
          set -euo pipefail
          for stack in production develop canonical homologation cloudpanel dockge; do cp "deploy/$stack/env.example" "deploy/$stack/.env"; done
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          source=Path('/tmp/deployment-integrity.yml').read_text()
          blocks=re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY",source,re.S)
          assert len(blocks)==3
          for block in blocks:exec(compile(textwrap.dedent(block),'<deployment-contract>','exec'),{})
          PY
      - name: Stage validated workflow object without modifying branch workflow via Actions token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/workflow-blob.json').write_text(json.dumps({'content':Path('/tmp/deployment-integrity.yml').read_text(),'encoding':'utf-8'}))
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/workflow-blob.json --jq .sha > /tmp/validated-workflow.sha
          cat /tmp/validated-workflow.sha
      - name: Commit only validated model and deployment source on feature branch
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/findhub-realtime-traccar-retention
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud browser-extensions/findhub-auth package-lock.json
          git add prisma/psql_bouncer-schema.prisma scripts/sync-traccar-deployments.py deploy/production/compose.yaml deploy/develop/compose.yaml deploy/canonical/compose.yaml
          git add -f test/traccar-deployment.test.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): keep PgBouncer parity and explicit optional container identities'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/parity.commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-pr127-parity-proof
          path: |
            /tmp/deployment-integrity.yml
            /tmp/validated-workflow.sha
            /tmp/parity.commit
          retention-days: 7
