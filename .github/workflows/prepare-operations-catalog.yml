name: Prepare and validate operations groups catalog
on:
  push:
    branches: [feat/operations-archive-zapo-catalog-groups]
    paths:
      - .github/workflows/prepare-operations-catalog.yml
      - scripts/apply-ops-catalog-groups.py
      - src/api/integrations/channel/whatsapp/zapo.catalog.adapter.ts
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: '0'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://connect:local-test@127.0.0.1:5432/connect
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/operations-archive-zapo-catalog-groups
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply reviewed anchored edits
        run: python3 scripts/apply-ops-catalog-groups.py
      - run: npm ci --no-audit --no-fund
      - name: Format only touched backend files
        run: |
          git diff --name-only e74912bab289b812d99591261e1f39519fdc2338 -- src/ | grep '\.ts$' | xargs -r npx eslint --fix
      - run: npm run db:generate
      - run: npm run lint:check
      - run: npm run build
      - run: npm run test:operations
      - run: npm --prefix manager install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix manager run test
      - run: npm run docs:generate && npm run docs:check
      - name: Verify Compose and backup syntax
        run: |
          bash -n scripts/connect-stack-backup.sh
          for dir in develop production; do
            cp .env.example "deploy/$dir/.env"
            docker compose --env-file "deploy/$dir/.env" -f "deploy/$dir/compose.yaml" config -q
            rm "deploy/$dir/.env"
          done
      - name: Commit validated changes on feature branch only
        run: |
          rm scripts/apply-ops-catalog-groups.py .github/workflows/prepare-operations-catalog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src manager/src manager/public .env.example env.example Dockerfile deploy/develop/compose.yaml deploy/production/compose.yaml scripts/connect-stack-backup.sh package.json docs .github/workflows/prepare-operations-catalog.yml scripts/apply-ops-catalog-groups.py
          git commit -m 'feat(operations): integrate private archives and ZAPO commerce with group fixes'
          git push origin HEAD:feat/operations-archive-zapo-catalog-groups
      - name: Upload validation diff on failure
        if: failure()
        run: git diff > /tmp/connect-integration.diff
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: connect-integration-diff
          path: /tmp/connect-integration.diff
