name: TEMP - Voice ticket docs sync

on:
  push:
    branches: [feat/voice-media-ticket-security]

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/voice-media-ticket-security
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate canonical API contracts
        run: npm run docs:generate

      - name: Commit generated contracts when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/openapi/connect-api.openapi.json docs/openapi/coverage.json docs/openapi/meta-compatible.openapi.json docs/asyncapi/connect-api-events.asyncapi.json; then
            echo "Generated contracts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi/connect-api.openapi.json docs/openapi/coverage.json docs/openapi/meta-compatible.openapi.json docs/asyncapi/connect-api-events.asyncapi.json
          git commit -m "docs(voice): sync media ticket API contract"
          git push origin HEAD:feat/voice-media-ticket-security
