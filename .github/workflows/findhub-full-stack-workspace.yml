name: Find Hub full stack workspace
on:
  push:
    branches: [feat/findhub-full-stack-device-controls]
    paths: [.github/workflows/findhub-full-stack-workspace.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/findhub-full-stack-device-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: '0'
      DATABASE_PROVIDER: postgresql
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: Apply verified isolated source candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/findhub-full-stack-device-controls
          git merge-base --is-ancestor 47147e11cdb862a23404e89e37cf82ee2a773223 HEAD
          test -z "$(git diff --name-only 47147e11cdb862a23404e89e37cf82ee2a773223 HEAD -- . ':!.github/workflows/findhub-full-stack-workspace.yml')"
          : > /tmp/full-stack-source.xz
          for sha in b638ed2bc98ec007a34b5718cb904a9d981e3955 28c338ea8705d3cd72883303fde2cb0109ed82e8 9cf1655be1def18c981d83efe1335624ec007570; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 -d >> /tmp/full-stack-source.xz
          done
          echo '2b1b98c1173b63db905c9f6f620d6e051cb3928b8ab0a751b6a689264e5d1fcc  /tmp/full-stack-source.xz' | sha256sum --check
          xz -dc /tmp/full-stack-source.xz > /tmp/full-stack-source.patch
          git apply --unidiff-zero --check /tmp/full-stack-source.patch
          git apply --unidiff-zero --index /tmp/full-stack-source.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/api/integrations/channel/findhub/findhub.router.ts')
          s=p.read_text()
          before='await this.dataValidate({\n            request: req,\n            schema: findHubDeviceAvatarSchema,'
          assert s.count(before)==1
          p.write_text(s.replace(before,before.replace('this.dataValidate({','this.dataValidate<FindHubDeviceAvatarDto>({')))
          PY
          python3 scripts/sync-full-stack-deployments.py
          npm run docs:generate
      - name: Install existing dependencies and check TypeScript
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          mapfile -t files < <(git diff --cached --name-only --diff-filter=ACM | grep '^src/.*\.ts$')
          npx --no-install eslint --fix "${files[@]}"
          npm run lint:check
      - name: Complete API tests and build
        run: |
          set -euo pipefail
          python3 scripts/sync-full-stack-deployments.py --check
          python3 test/full-stack-deployment.test.py
          python3 scripts/sync-findhub-deployments.py --check
          python3 scripts/sync-traccar-deployments.py --check
          python3 scripts/sync-operations-deployments.py --check
          npm run docs:check
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Complete Manager tests types and build
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Verify protected channels credentials and deployment parents
        run: |
          set -euo pipefail
          git diff --exit-code 47147e11cdb862a23404e89e37cf82ee2a773223 -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/integrations/channel/connect src/api/compat/meta-cloud src/api/provider src/api/integrations/channel/findhub/auth browser-extensions public/findhub-auth.zip package.json package-lock.json .github/retention-policy.json deploy/develop/compose.yaml deploy/develop/env.example deploy/production/compose.yaml deploy/production/env.example
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','47147e11cdb862a23404e89e37cf82ee2a773223'],text=True).splitlines()
          assert not any(p.endswith('/.env') or p=='.env' or 'node_modules/' in p for p in paths)
          for p in paths:
              if '-migrations/' in p:
                  assert '/20260924020000_findhub_device_avatar/' in p, p
          print('Protected source and secret-path checks passed')
          PY
      - name: Store verified workflow for authorized integration
        run: |
          set -euo pipefail
          mkdir -p .github/full-stack-verified
          cp .github/workflows/findhub-full-stack-integrity.yml .github/full-stack-verified/integrity.yml.txt
          git rm --cached .github/workflows/findhub-full-stack-integrity.yml
          rm .github/workflows/findhub-full-stack-integrity.yml
      - name: Commit validated source on feature branch only
        run: |
          set -euo pipefail
          branch=feat/findhub-full-stack-device-controls
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git add -u
          git add .github/full-stack-verified/integrity.yml.txt
          for profile in develop production; do
            for file in compose.yaml env.example prepare-env.py prepare-env.sh deploy.sh README.md prepare-operations-env.py prepare-findhub-env.py prepare-traccar-env.py traccar-bootstrap.cjs; do
              git add -f "deploy/$profile/full-stack/$file"
            done
          done
          git add docs/openapi/*.json docs/asyncapi/*.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'feat(findhub): full stack deployments, bounded request timeout, live modal and device avatars'
          git push origin "HEAD:refs/heads/$branch"
      - name: Archive source-only candidate
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/full-stack-review
          git ls-files -z | tar --null -T - -czf /tmp/full-stack-review/source.tar.gz
          git diff --binary 47147e11cdb862a23404e89e37cf82ee2a773223 > /tmp/full-stack-review/source.patch
          git rev-parse HEAD > /tmp/full-stack-review/source.commit
          if [ -d manager/dist ]; then tar -czf /tmp/full-stack-review/manager-dist.tar.gz -C manager/dist .; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-full-stack-validated
          path: /tmp/full-stack-review
          retention-days: 7
