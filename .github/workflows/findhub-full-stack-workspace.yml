name: Find Hub full stack workspace
on:
  push:
    branches: [feat/findhub-full-stack-device-controls]
    paths: [.github/workflows/findhub-full-stack-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: Export exact tracked source and existing validation tools
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail
          mkdir -p /tmp/findhub-full-stack
          git archive --format=tar.gz HEAD > /tmp/findhub-full-stack/source.tar.gz
          git rev-parse HEAD > /tmp/findhub-full-stack/source.commit
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix manager --ignore-scripts --no-audit --no-fund
          tar -czf /tmp/findhub-full-stack/tools.tar.gz node_modules manager/node_modules
          docker compose version > /tmp/findhub-full-stack/docker-compose.version
          cp /usr/libexec/docker/cli-plugins/docker-compose /tmp/findhub-full-stack/docker-compose 2>/dev/null || cp /usr/lib/docker/cli-plugins/docker-compose /tmp/findhub-full-stack/docker-compose
      - uses: actions/upload-artifact@v4
        with:
          name: findhub-full-stack-source
          path: /tmp/findhub-full-stack/source.*
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: findhub-full-stack-validation-tools
          path: |
            /tmp/findhub-full-stack/tools.tar.gz
            /tmp/findhub-full-stack/docker-compose*
          retention-days: 1
