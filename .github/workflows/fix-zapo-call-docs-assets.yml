name: Apply targeted ZAPO call and DOCs fix

on:
  push:
    branches:
      - fix/zapo-call-identity-docs-assets
    paths:
      - .github/workflows/fix-zapo-call-docs-assets.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-call-identity-docs-assets
          fetch-depth: 0

      - name: Apply surgical fixes
        run: python3 .github/scripts/fix-zapo-call-docs-assets.py

      - name: Format changed sources
        run: |
          npx --yes prettier@3.6.2 --write \
            src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts \
            src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts \
            docs/scripts/generate-openapi.mjs \
            docs/DOCS-DEPLOYMENT-TOPOLOGY.md

      - name: Commit targeted fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts \
            src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts \
            docs/scripts/generate-openapi.mjs \
            docs/openapi/connect-api.openapi.json \
            docs/openapi/meta-compatible.openapi.json \
            docs/asyncapi/connect-api-events.asyncapi.json \
            docs/DOCS-DEPLOYMENT-TOPOLOGY.md
          HUSKY=0 git commit -m "fix(zapo): resolve incoming call identity on demand"
          HUSKY=0 git push origin HEAD:fix/zapo-call-identity-docs-assets
