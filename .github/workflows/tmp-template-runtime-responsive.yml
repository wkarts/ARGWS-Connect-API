name: TEMP Template Runtime Responsive

on:
  push:
    branches: [feat/conversational-platform-phase4]
    paths:
      - .github/workflows/tmp-template-runtime-responsive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/conversational-platform-phase4
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci

      - name: Apply runtime and responsive corrections
        run: python scripts/tmp-fix-template-runtime-responsive.py

      - name: Format TypeScript
        run: npx eslint --ext .ts src --fix

      - name: Validate Prisma schemas
        run: |
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma validate --schema prisma/postgresql-schema.prisma
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' DATABASE_BOUNCER_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:6432/argws' npx prisma validate --schema prisma/psql_bouncer-schema.prisma
          DATABASE_CONNECTION_URI='mysql://argws:argws@127.0.0.1:3306/argws' npx prisma validate --schema prisma/mysql-schema.prisma
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma generate --schema prisma/postgresql-schema.prisma

      - name: Validate runtime and Studio
        run: |
          set -euo pipefail
          npm run docs:check
          npm run test:compat
          npx vitest run test/template-runtime/foundation.test.ts
          npm run build
          npm run lint:check
          node --check manager/dist/assets/template-editor.js
          node --check manager/dist/assets/template-editor-v2.js
          node --check manager/dist/assets/template-editor-phase4.js
          node - <<'NODE'
          const fs = require('fs')
          const service = fs.readFileSync('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts','utf8')
          const studio = fs.readFileSync('manager/dist/assets/template-editor-v2.js','utf8')
          const css = fs.readFileSync('manager/dist/assets/template-editor.css','utf8')
          for (const required of [
            'message?.key?.fromMe ? null : extractBaileysInteraction',
            'private messageForPersistence(',
            'delete messageData.interaction',
            'delete messageData.pollUpdates',
          ]) if (!service.includes(required)) throw new Error(`runtime missing ${required}`)
          for (const required of ['ACCEPTED_BY_PROVIDER','PENDING_OR_UNKNOWN','humanError'])
            if (!studio.includes(required)) throw new Error(`studio diagnostic missing ${required}`)
          for (const required of ['@media (max-width: 1360px)','@media (max-width: 1024px)','@media (max-width: 680px)','scroll-snap-type:x proximity','overflow-wrap:anywhere'])
            if (!css.includes(required)) throw new Error(`responsive CSS missing ${required}`)
          if (css.includes('min-width: 1180px')) throw new Error('legacy fixed width remains')
          console.log('Template runtime/responsive structural validation: ok')
          NODE

      - name: Commit validated product corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src manager/dist
          git add -f test/template-runtime/foundation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(templates): corrige persistência pós-envio e responsividade"
            git push --no-verify origin HEAD:feat/conversational-platform-phase4
          fi
