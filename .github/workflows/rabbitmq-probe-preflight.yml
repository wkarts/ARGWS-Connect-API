name: RabbitMQ image preflight
on:
  push:
    branches: [work/rabbitmq-healthcheck-preflight-20261009]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            sha: afceea41d34d156199f2a353a8da8de325a7c5bd
          - branch: develop
            sha: ca78e4783f7bd9eb6087812bb86b3a11269a7148
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect actual mirrored image without starting or modifying any installed broker
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rabbitmq-preflight"
          mkdir -p "$out"
          image=ghcr.io/wkarts/argws-connect-rabbitmq:management
          docker pull "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          docker image inspect --format '{"id":{{json .Id}},"digests":{{json .RepoDigests}},"architecture":{{json .Architecture}},"os":{{json .Os}}}' "$digest" > "$out/image.json"
          printf '%s\n' "$SOURCE_SHA" > "$out/source-sha.txt"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint sh "$digest" -ec 'command -v bash; command -v timeout; timeout 2 bash -ec "exit 0"; bash --version | head -1; timeout --version | head -1' > "$out/probe-capabilities.txt"
          git archive --format=zip --output="$out/source.zip" HEAD
          cat "$out/image.json" "$out/probe-capabilities.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rabbitmq-preflight-${{ matrix.branch }}
          path: ${{ runner.temp }}/rabbitmq-preflight
          retention-days: 3
          if-no-files-found: error
