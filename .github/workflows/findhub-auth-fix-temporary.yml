name: Find Hub auth correction validation
on:
  push:
    branches: [fix/findhub-auth-exchange-icon]
    paths: [.github/workflows/findhub-auth-fix-temporary.yml]
permissions:
  contents: write
jobs:
  correction:
    if: github.ref == 'refs/heads/fix/findhub-auth-exchange-icon'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply verified Find Hub source patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-auth-exchange-icon
          git merge-base --is-ancestor 2bd9f3bfb0cf088453aab72df261f2e64ea29f2f HEAD
          test -z "$(git diff --name-only 2bd9f3bfb0cf088453aab72df261f2e64ea29f2f HEAD -- . ':!.github/workflows/findhub-auth-fix-temporary.yml' ':!.github/findhub-auth-correction')"
          cat .github/findhub-auth-correction/part{0..3} > /tmp/findhub-auth-fix.xz
          echo '2150af2b52cea0d8440e602f991453d1f337842ff4d2025133f3f94e087d5919  /tmp/findhub-auth-fix.xz' | sha256sum --check
          xz -dc /tmp/findhub-auth-fix.xz > /tmp/findhub-auth-fix.patch
          git apply --check /tmp/findhub-auth-fix.patch
          git apply --index /tmp/findhub-auth-fix.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/api/integrations/channel/findhub/auth/google-auth.transport.ts')
          s = p.read_text()
          assert s.count('    let timer: ReturnType<typeof setTimeout>;\n') == 1
          assert s.count('    timer = setTimeout(() => {') == 1
          p.write_text(s.replace('    let timer: ReturnType<typeof setTimeout>;\n', '').replace('    timer = setTimeout(() => {', '    const timer = setTimeout(() => {'))
          p = Path('src/api/integrations/channel/findhub/auth/google-play-auth.client.ts')
          s = p.read_text()
          old = r'if (!token || /[\s\x00-\x1f\x7f]/.test(token)) throw new FindHubAuthError(9101);'
          new = r'if (!token || /\s/.test(token) || Array.from(token).some((char) => char.charCodeAt(0) < 32 || char.charCodeAt(0) === 127)) throw new FindHubAuthError(9101);'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Install unchanged API dependencies
        run: npm ci --no-audit --no-fund
      - name: Resize exact user-supplied official artwork and build extension
        run: |
          set -euo pipefail
          echo '6968e17ff8f88417d50c88b5082008ecfb93cad840834c6dc9e034e2f6709926  public/branding/connect-api/core/connect-api-app-icon-dark.png' | sha256sum --check
          node <<'JS'
          const fs = require('node:fs');
          const sharp = require('sharp');
          (async () => {
            fs.mkdirSync('browser-extensions/findhub-auth/icons', { recursive: true });
            for (const size of [16, 32, 48, 128]) {
              await sharp('public/branding/connect-api/core/connect-api-app-icon-dark.png')
                .resize(size, size, { kernel: 'lanczos3', fit: 'contain' })
                .png({ compressionLevel: 9 })
                .toFile(`browser-extensions/findhub-auth/icons/icon-${size}.png`);
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
      - name: Format changed owned source and run API checks
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --cached --name-only --diff-filter=ACM | grep '^src/.*\.ts$')
          test "${#files[@]}" -gt 0
          npx --no-install eslint --fix "${files[@]}"
          npm run lint:check
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit validated correction on work branch only
        run: |
          set -euo pipefail
          branch=fix/findhub-auth-exchange-icon
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 2bd9f3bfb0cf088453aab72df261f2e64ea29f2f -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions deploy docker-compose.yaml docker-compose.dev.yaml
          git rm -r .github/findhub-auth-correction .github/workflows/findhub-auth-fix-temporary.yml
          git add -u
          git add -f browser-extensions/findhub-auth/icons public/findhub-auth.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): repair Google auth exchange and brand browser extension'
          git push origin "HEAD:refs/heads/$branch"
      - name: Package tracked candidate for local review
        if: always()
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf /tmp/findhub-auth-fix-source.tar.gz
          git rev-parse HEAD > /tmp/findhub-auth-fix.commit
          git diff --binary 2bd9f3bfb0cf088453aab72df261f2e64ea29f2f > /tmp/findhub-auth-fix.patch
          cp public/findhub-auth.zip /tmp/Connect-FindHub-Auth-0.1.1.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findhub-auth-fix-review
          path: |
            /tmp/findhub-auth-fix-source.tar.gz
            /tmp/findhub-auth-fix.commit
            /tmp/findhub-auth-fix.patch
            /tmp/Connect-FindHub-Auth-0.1.1.zip
          retention-days: 2
