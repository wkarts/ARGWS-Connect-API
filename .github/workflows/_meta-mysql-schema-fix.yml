name: Meta Compatibility MySQL Schema Fix

on:
  push:
    branches:
      - feature/meta-cloud-compatible-v1

permissions:
  contents: write

jobs:
  fix-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[mysql-meta-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v5
        with:
          ref: feature/meta-cloud-compatible-v1
          fetch-depth: 0

      - name: Fix MySQL MetaCompatibility Boolean native type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('prisma/mysql-schema.prisma')
          text = p.read_text(encoding='utf-8')
          old = '  enabled    Boolean  @default(false) @db.Boolean\n  webhookUrl String?  @db.VarChar(500)\n'
          new = '  enabled    Boolean  @default(false)\n  webhookUrl String?  @db.VarChar(500)\n'
          if old not in text:
              raise SystemExit('MetaCompatibility MySQL Boolean anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/_meta-mysql-schema-fix.yml

      - name: Commit fix
        run: |
          git config user.name "wkarts"
          git config user.email "57051272+wkarts@users.noreply.github.com"
          git add -A
          git commit -m "fix(meta-compat): alinha MetaCompatibility ao schema MySQL [mysql-meta-fixed]"
          git push origin HEAD:feature/meta-cloud-compatible-v1
