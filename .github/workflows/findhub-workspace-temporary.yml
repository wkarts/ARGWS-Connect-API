name: Find Hub isolated correction workspace
on:
  push:
    branches: [fix/findhub-dedicated-channel-auth]
    paths: [.github/workflows/findhub-workspace-temporary.yml]
permissions:
  contents: read
jobs:
  workspace:
    if: github.ref == 'refs/heads/fix/findhub-dedicated-channel-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare exact frontend dependencies for isolated validation
        run: |
          npm ci --prefix manager --ignore-scripts
          npm install --prefix /tmp/findhub-tools --ignore-scripts --no-audit --no-fund prettier@3.4.2 tsx@4.20.5
          tar -czf /tmp/findhub-manager-dependencies.tar.gz manager/node_modules
          tar -czf /tmp/findhub-tools.tar.gz -C /tmp/findhub-tools node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: findhub-validation-dependencies
          path: |
            /tmp/findhub-manager-dependencies.tar.gz
            /tmp/findhub-tools.tar.gz
          retention-days: 1
