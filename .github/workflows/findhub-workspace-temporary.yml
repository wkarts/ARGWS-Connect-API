name: Find Hub isolated correction workspace
on:
  push:
    branches: [fix/findhub-dedicated-channel-auth]
    paths: [.github/workflows/findhub-workspace-temporary.yml]
permissions:
  contents: write
jobs:
  workspace:
    if: github.ref == 'refs/heads/fix/findhub-dedicated-channel-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PROVIDER: postgresql
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: Apply verified source correction only on work branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/findhub-dedicated-channel-auth
          git merge-base --is-ancestor 4cff04113c675ef97219b77c67a54adc3115bd8e HEAD
          test -z "$(git diff --name-only 4cff04113c675ef97219b77c67a54adc3115bd8e HEAD -- . ':!.github/workflows/findhub-workspace-temporary.yml' ':!.github/findhub-correction')"
          cat .github/findhub-correction/part{0..7} > /tmp/findhub-correction.xz
          echo 'cc5a47557a1b4c3e774b5d2e7ffecfc8a1a879b609c88852827c192b4e123e69  /tmp/findhub-correction.xz' | sha256sum --check
          xz -dc /tmp/findhub-correction.xz > /tmp/findhub-correction.patch
          git apply --check /tmp/findhub-correction.patch
          git apply --index /tmp/findhub-correction.patch
          python3 scripts/sync-findhub-deployments.py
          node scripts/build-findhub-extension.cjs
          npm run docs:generate
      - name: Install existing API dependencies
        run: npm ci --no-audit --no-fund
      - name: Format only changed TypeScript and check all source
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --cached --name-only --diff-filter=ACM | grep '^src/.*\.ts$')
          test "${#files[@]}" -gt 0
          npx --no-install eslint --fix "${files[@]}"
          npm run lint:check
      - name: Validate contracts, regressions and complete API build
        run: |
          set -euo pipefail
          python3 scripts/sync-findhub-deployments.py --check
          npm run docs:check
          npm run test:compat
          npm run db:generate
          npm run build
      - name: Validate complete Manager
        run: |
          set -euo pipefail
          npm install --prefix manager --no-audit --no-fund
          npm test --prefix manager
      - name: Commit validated change on work branch only
        run: |
          set -euo pipefail
          branch=fix/findhub-dedicated-channel-auth
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code 4cff04113c675ef97219b77c67a54adc3115bd8e -- src/api/integrations/channel/whatsapp src/api/integrations/channel/meta src/api/compat/meta-cloud src/api/provider package-lock.json .github/actions
          git rm -r .github/findhub-correction
          git add -u
          git add -f public/findhub-auth.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(findhub): isolate channel screens and add assisted browser auth'
          git push origin "HEAD:refs/heads/$branch"
