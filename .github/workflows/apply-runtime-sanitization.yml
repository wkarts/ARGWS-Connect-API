name: Apply runtime sanitization patch

on:
  push:
    branches:
      - fix/zapo-identity-performance-docs
    paths:
      - .github/workflows/apply-runtime-sanitization.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-identity-performance-docs
          fetch-depth: 0

      - name: Apply surgical fixes
        run: python3 .github/scripts/apply-runtime-sanitization.py

      - name: Format changed files
        run: |
          npm ci --silent
          npm --prefix manager install --no-audit --no-fund
          npx prettier --write src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts src/api/integrations/event/event.controller.ts src/api/integrations/event/rabbitmq/rabbitmq.controller.ts src/api/routes/view.router.ts
          npx prettier --write manager/src/services/normalizers.ts manager/src/services/current.ts

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts src/api/integrations/event/event.controller.ts src/api/integrations/event/rabbitmq/rabbitmq.controller.ts src/api/routes/view.router.ts manager/src/services/normalizers.ts manager/src/services/current.ts
          git commit -m "fix(runtime): sanitize ZAPO identity and speed up manager"
          git push origin HEAD:fix/zapo-identity-performance-docs
