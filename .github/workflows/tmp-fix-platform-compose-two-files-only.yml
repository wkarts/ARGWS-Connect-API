name: Temporary Fix Platform Compose Two Files Only

on:
  push:
    branches: [fix/platform-compose-two-files-only]
    paths:
      - ".github/workflows/tmp-fix-platform-compose-two-files-only.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/platform-compose-two-files-only
          fetch-depth: 0

      - name: Apply compose-only runtime fix
        run: python tools/tmp_fix_platform_compose_two_files_only.py

      - name: Validate Compose schema
        run: |
          set -euo pipefail
          for stack in platform platform-develop platform-production; do
            cp "deploy/${stack}/env.example" "deploy/${stack}/.env"
            docker compose --env-file "deploy/${stack}/.env" -f "deploy/${stack}/compose.yaml" config >/dev/null
            test ! -e "deploy/${stack}/observability"
            ! grep -q '^configs:$' "deploy/${stack}/compose.yaml"
            ! grep -q '../../platform/infrastructure/' "deploy/${stack}/compose.yaml"
            ! grep -q './observability/' "deploy/${stack}/compose.yaml"
            grep -q 'cat > /tmp/prometheus.yml' "deploy/${stack}/compose.yaml"
            grep -q 'GF_PATHS_PROVISIONING: /tmp/grafana-provisioning' "deploy/${stack}/compose.yaml"
          done

      - name: Validate mirrored image runtime contracts
        run: |
          set -euo pipefail
          docker pull ghcr.io/wkarts/argws-connect-prometheus:v3.5.0
          docker pull ghcr.io/wkarts/argws-connect-grafana:12.1.0
          docker run --rm --entrypoint /bin/sh ghcr.io/wkarts/argws-connect-prometheus:v3.5.0 -ec 'test -x /bin/prometheus && echo prometheus-ok'
          docker run --rm --entrypoint /bin/sh ghcr.io/wkarts/argws-connect-grafana:12.1.0 -ec 'test -x /run.sh && test -w /tmp && echo grafana-ok'

      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name "wkarts"
          git config user.email "57051272+wkarts@users.noreply.github.com"
          git add -A deploy/platform deploy/platform-develop deploy/platform-production
          git commit -m "fix(platform): mantém stacks autocontidas em compose e env"
          git push origin HEAD:fix/platform-compose-two-files-only
