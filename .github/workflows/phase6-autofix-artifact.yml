name: Phase 6 Autofix Artifact

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/conversational-application-studio-phase6'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Normalize planner import
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/api/services/template-engine.service.ts';
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes('getProviderTemplateCapabilities,')) {
            source = source.replace(
              /import \{\s*planTemplateTransport,\s*TemplateRenderEnvelope,\s*TemplateTransportPlan,\s*\} from '\.\/template-transport-planner';/,
              "import {\n  getProviderTemplateCapabilities,\n  planTemplateTransport,\n  TemplateRenderEnvelope,\n  TemplateTransportPlan,\n} from './template-transport-planner';",
            );
          }
          source = source.replace(
            /  public capabilities\(provider\?: string\) \{[\s\S]*?\n  \}\n\n  private async sendBaileysPollCompatibility/,
            "  public capabilities(provider?: string) {\n    return getProviderTemplateCapabilities(provider);\n  }\n\n  private async sendBaileysPollCompatibility",
          );
          if (source.includes("require('./template-transport-planner')")) {
            throw new Error('capabilities normalization did not apply');
          }
          fs.writeFileSync(file, source);
          NODE
      - name: Autofix TypeScript
        run: npm run lint
      - name: Format Phase 6 tests and Manager assets
        run: >-
          npx prettier --write
          test/template-engine/interaction-model-v2.test.ts
          test/template-engine/policy-bindings.test.ts
          test/interaction-engine/geolocation-policy.test.ts
          test/micro-app/foundation.test.ts
          test/phase6.test.ts
          manager/dist/assets/template-editor-phase5.js
          manager/dist/assets/template-editor-phase6.js
      - name: Generate canonical documentation contracts
        run: npm run docs:generate
      - name: Validate generated and runtime syntax
        run: |
          npm run lint:check
          node --check manager/dist/assets/template-editor-phase5.js
          node --check manager/dist/assets/template-editor-phase6.js
          node -e "JSON.parse(require('fs').readFileSync('docs/openapi/connect-api.openapi.json','utf8')); JSON.parse(require('fs').readFileSync('docs/openapi/coverage.json','utf8'))"
      - name: Commit canonical outputs
        run: |
          if git diff --quiet; then
            echo 'No canonical changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src manager/dist/assets/template-editor-phase5.js manager/dist/assets/template-editor-phase6.js docs/openapi/connect-api.openapi.json docs/openapi/coverage.json
          git add -f test/template-engine/interaction-model-v2.test.ts test/template-engine/policy-bindings.test.ts test/interaction-engine/geolocation-policy.test.ts test/micro-app/foundation.test.ts test/phase6.test.ts
          git commit -m 'chore(phase6): apply canonical lint and docs generation'
          git push origin HEAD:${{ github.head_ref }}
