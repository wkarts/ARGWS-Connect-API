name: Phase 6 Autofix Artifact

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'feat/conversational-application-studio-phase6'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Normalize planner import
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/api/services/template-engine.service.ts';
          let source = fs.readFileSync(file, 'utf8');
          const importNeedle = "import {\n  planTemplateTransport,\n  TemplateRenderEnvelope,\n  TemplateTransportPlan,\n} from './template-transport-planner';";
          const importReplacement = "import {\n  getProviderTemplateCapabilities,\n  planTemplateTransport,\n  TemplateRenderEnvelope,\n  TemplateTransportPlan,\n} from './template-transport-planner';";
          if (!source.includes(importNeedle)) throw new Error('planner import block not found');
          source = source.replace(importNeedle, importReplacement);
          const methodNeedle = `  public capabilities(provider?: string) {
            return planTemplateTransport(provider, { text: '', buttons: [], interactions: [] }).provider
              ? require('./template-transport-planner').getProviderTemplateCapabilities(provider)
              : null;
          }`;
          const methodReplacement = `  public capabilities(provider?: string) {
            return getProviderTemplateCapabilities(provider);
          }`;
          if (!source.includes(methodNeedle)) throw new Error('capabilities method not found');
          source = source.replace(methodNeedle, methodReplacement);
          fs.writeFileSync(file, source);
          NODE
      - name: Autofix TypeScript
        run: npm run lint
      - name: Format Phase 6 tests and Manager assets
        run: >-
          npx prettier --write
          test/template-engine/interaction-model-v2.test.ts
          test/template-engine/policy-bindings.test.ts
          test/interaction-engine/geolocation-policy.test.ts
          test/micro-app/foundation.test.ts
          test/phase6.test.ts
          manager/dist/assets/template-editor-phase5.js
          manager/dist/assets/template-editor-phase6.js
      - name: Generate canonical documentation contracts
        run: npm run docs:generate
      - name: Validate generated and runtime syntax
        run: |
          npm run lint:check
          node --check manager/dist/assets/template-editor-phase5.js
          node --check manager/dist/assets/template-editor-phase6.js
          node -e "JSON.parse(require('fs').readFileSync('docs/openapi/connect-api.openapi.json','utf8')); JSON.parse(require('fs').readFileSync('docs/openapi/coverage.json','utf8'))"
      - name: Pack autofixed sources and contracts
        run: >-
          tar -czf phase6-autofix.tgz
          src
          manager/dist/assets/template-editor-phase5.js
          manager/dist/assets/template-editor-phase6.js
          test
          docs/openapi/connect-api.openapi.json
          docs/openapi/coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-autofix
          path: phase6-autofix.tgz
          retention-days: 1
