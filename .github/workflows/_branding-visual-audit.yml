name: Connect API Visual Asset Audit

on:
  push:
    branches: [feat/connect-api-branding]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decode active embedded logo
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          for name in ['argws-connect-logo-horizontal.svg', 'argws-connect-logo-dark.svg']:
              text = Path('manager/dist/assets/images', name).read_text(encoding='utf-8')
              m = re.search(r'base64,([^"\']+)', text)
              if not m:
                  raise SystemExit(f'{name}: no embedded raster found')
              out = Path('/tmp') / (name + '.png')
              out.write_bytes(base64.b64decode(m.group(1)))
              print(out)
          PY
      - name: OCR visible wordmark
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          for f in /tmp/argws-connect-logo-*.svg.png; do
            echo "=== $f ==="
            tesseract "$f" stdout 2>/dev/null || true
          done
