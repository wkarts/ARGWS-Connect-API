name: Temporary Zapo Runtime Dependency Repair

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install runtime compatibility alias
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact 'zapo-js@npm:@innovatorssoft/zapo-js@1.6.3' --ignore-scripts
          mkdir -p scripts
          cat > scripts/check-zapo-runtime.cjs <<'NODE'
          'use strict';

          const aliasUtil = require.resolve('zapo-js/util');
          const aliasPackage = require('zapo-js/package.json');
          const scopedPackage = require('@innovatorssoft/zapo-js/package.json');

          if (aliasPackage.version !== scopedPackage.version) {
            throw new Error(
              `Zapo alias mismatch: alias=${aliasPackage.version} scoped=${scopedPackage.version}`,
            );
          }

          require('@innovatorssoft/store-postgres');

          console.log(`Zapo runtime dependencies OK (${scopedPackage.version}) -> ${aliasUtil}`);
          NODE
          npm pkg set 'scripts.runtime:deps:check=node ./scripts/check-zapo-runtime.cjs'
          npm pkg set 'scripts.build=tsc --noEmit && tsup && npm run runtime:deps:check'

      - name: Verify exact runtime dependency path
        shell: bash
        run: |
          set -euo pipefail
          npm run runtime:deps:check
          node -e "require('@innovatorssoft/store-postgres'); console.log('store-postgres load OK')"

      - name: Refresh tracked manifest entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          manifest = Path('MANIFEST.sha256')
          if not manifest.exists():
              raise SystemExit(0)

          text = manifest.read_text(encoding='utf-8')
          targets = ('package.json', 'package-lock.json', 'scripts/check-zapo-runtime.cjs')
          for target in targets:
              path = Path(target)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              pattern = rf'^[0-9a-f]{{64}}  {re.escape(target)}$'
              replacement = f'{digest}  {target}'
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count == 1:
                  text = updated
              else:
                  if text and not text.endswith('\n'):
                      text += '\n'
                  text += replacement + '\n'
          manifest.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit runtime repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json scripts/check-zapo-runtime.cjs MANIFEST.sha256
          git commit -m 'fix(runtime): resolve Zapo package alias required by stores and VOIP'
          git push origin HEAD:develop
