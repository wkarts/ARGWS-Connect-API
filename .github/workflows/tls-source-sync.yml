name: Temporary reviewed TLS source synchronization

# Development-only transfer. No deployment or access to a user's server.
# Removed before the corrective PR is merged.
on:
  push:
    branches: ['fix/automatic-ssl-cloudpanel-reconciliation']
    paths: ['.github/tls-source.*.xzpart', '.github/workflows/tls-source-sync.yml']
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'wkarts/ARGWS-Connect-API' && github.ref == 'refs/heads/fix/automatic-ssl-cloudpanel-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and commit the reviewed source patch
        shell: python
        run: |
          import hashlib, lzma, os, pathlib, subprocess
          branch = 'refs/heads/fix/automatic-ssl-cloudpanel-reconciliation'
          assert os.environ['GITHUB_REF'] == branch
          assert os.environ['GITHUB_REPOSITORY'] == 'wkarts/ARGWS-Connect-API'
          compressed = b''.join(pathlib.Path(f'.github/tls-source.{n}.xzpart').read_bytes() for n in (1, 2, 3))
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '87816e02c12494ef8a4a6a02cefccd271f39f16295636f2443321b69f8f7247d'
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, **kwargs)
          git('merge-base', '--is-ancestor', 'babb73ef58ef7be5a43ce7854a586621d5cfe955', 'HEAD')
          git('apply', '--check', '--index', '-', input=patch)
          git('apply', '--index', '-', input=patch)
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(names) == 54
          for name in names:
              assert name.startswith(('deploy/', 'platform/', 'docs/guides/')) or name == 'OPERATIONS-CONTRACT.md', name
          git('diff', '--cached', '--check')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'fix(platform): automatiza SSL wildcard e corrige instâncias, acesso e recuperação do pool')
          git('push', 'origin', 'HEAD:' + branch)
