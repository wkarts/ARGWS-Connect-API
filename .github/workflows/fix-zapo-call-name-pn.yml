name: Apply final ZAPO call identity fix

on:
  push:
    branches:
      - fix/zapo-call-name-pn-final
    paths:
      - .github/workflows/fix-zapo-call-name-pn.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-call-name-pn-final
          fetch-depth: 0
      - name: Apply surgical call identity patch
        run: python3 .github/scripts/fix-zapo-call-name-pn.py
      - name: Format changed TypeScript only
        run: npx prettier --write src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts
      - name: Commit final fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts src/api/integrations/channel/whatsapp/zapo.whatsapp.service.ts
          HUSKY=0 git commit -m "fix(zapo): preserve caller name and phone candidates"
          HUSKY=0 git push origin HEAD:fix/zapo-call-name-pn-final
