name: One-shot Develop Auth Contracts

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip auth-contracts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply contracts
        run: node scripts/apply-develop-auth-contracts.mjs

      - name: Generate Prisma client
        env:
          DATABASE_PROVIDER: postgresql
        run: npm run db:generate

      - name: Format generated TypeScript
        run: npm run lint

      - name: Verify lint
        run: npm run lint:check

      - name: Compatibility tests
        run: npm run test:compat

      - name: TypeScript and application build
        run: npm run build

      - name: Verify required contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F "WHATSAPP_PROTOCOL_BROWSER_CLIENT || '🅲🅾🅽🅽🅴🅲🆃​|🅰🅿🅸'" src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          grep -F "const pairingCodeBrowser: WABrowserDescription = ['Ubuntu', 'Chrome', '20.0.04'];" src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          grep -F "socket.handshake.auth?.apikey" src/api/integrations/event/websocket/websocket.controller.ts
          grep -F "WEBSOCKET_ALLOWED_IPS" src/api/integrations/event/websocket/websocket.controller.ts
          grep -F 'auth:r?{apikey:r}:{}' manager/dist/assets/index-CO3NSIFj.js

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src manager/dist/assets PAIRING-CODE-COMPATIBILITY.md .env.example env.example deploy
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(develop): separa fingerprints e endurece Socket.IO [skip auth-contracts] [skip release]'
          git push origin HEAD:develop
