name: One-shot Develop Auth Contracts

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip auth-contracts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply contracts
        run: node scripts/apply-develop-auth-contracts.mjs

      - name: Narrow Baileys provider type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/api/controllers/instance.controller.ts')
          content = path.read_text(encoding='utf-8')
          needle = 'await instance.prepareQrConnection();'
          replacement = """if (!('prepareQrConnection' in instance) || typeof instance.prepareQrConnection !== 'function') {
              throw new BadRequestException('QR connection is only available for the Baileys provider');
            }
            await instance.prepareQrConnection();"""
          count = content.count(needle)
          if count == 0:
              raise SystemExit('prepareQrConnection call not found for provider narrowing')
          path.write_text(content.replace(needle, replacement), encoding='utf-8')
          print(f'Narrowed {count} Baileys QR call(s).')
          PY

      - name: Generate Prisma client
        env:
          DATABASE_PROVIDER: postgresql
        run: npm run db:generate

      - name: Format generated TypeScript
        run: npm run lint

      - name: Verify lint
        run: npm run lint:check

      - name: Compatibility tests
        run: npm run test:compat

      - name: TypeScript and application build
        run: npm run build

      - name: Verify required contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F "WHATSAPP_PROTOCOL_BROWSER_CLIENT" src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          grep -F "pairingCodeBrowser" src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
          grep -F "socket.handshake.auth?.apikey" src/api/integrations/event/websocket/websocket.controller.ts
          grep -F "ALLOWED_IPS" src/api/integrations/event/websocket/websocket.controller.ts
          grep -F "WEBSOCKET_ALLOWED_IPS" src/config/env.config.ts
          grep -F "auth:" manager/dist/assets/index-CO3NSIFj.js
          grep -F "apikey" manager/dist/assets/index-CO3NSIFj.js

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src manager/dist/assets PAIRING-CODE-COMPATIBILITY.md .env.example env.example deploy
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(develop): separa fingerprints e endurece Socket.IO [skip auth-contracts] [skip release]'
          git push origin HEAD:develop
