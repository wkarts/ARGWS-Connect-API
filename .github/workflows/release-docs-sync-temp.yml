name: Temporary Release Docs Sync

on:
  push:
    branches:
      - release/v1.0.24

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[docs-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/v1.0.24
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: Regenerate canonical contracts
        run: node docs/scripts/generate-openapi.mjs
      - name: Commit synchronized generated contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi/connect-api.openapi.json \
            docs/openapi/meta-compatible.openapi.json \
            docs/openapi/coverage.json \
            docs/asyncapi/connect-api-events.asyncapi.json
          if git diff --cached --quiet; then
            echo "Generated contracts are already synchronized."
            exit 0
          fi
          git commit -m "chore(docs): synchronize release contracts [docs-sync]"
          git push origin HEAD:release/v1.0.24
