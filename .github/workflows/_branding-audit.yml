name: Connect API Branding Audit

on:
  push:
    branches:
      - feat/connect-api-branding

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find legacy visible branding
        run: |
          echo '=== Legacy labels ==='
          grep -RIn --binary-files=without-match -E 'ARGWS Connect API|ARGWS Connect|Connect\|API' manager/dist | head -n 200 || true
          echo '=== Branding asset references ==='
          grep -RIn --binary-files=without-match -E 'branding/|favicon|manifest\.webmanifest|apple-touch|web-app-manifest' manager/dist/*.html manager/dist/*.webmanifest manager/dist/assets/*.js 2>/dev/null | head -n 200 || true
