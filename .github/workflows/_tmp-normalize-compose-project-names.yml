name: Temporary Deployment Naming Normalizer

on:
  push:
    branches: [fix/deploy-compose-project-names]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/deploy-compose-project-names

      - name: Normalize project, network, service and container names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          RESOURCES = ('api','docs','postgres','redis','rabbitmq','minio','nats','zookeeper','kafka','mysql')

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def rename_key_and_refs(text, old, new):
              text = text.replace(f'\n  {old}:\n', f'\n  {new}:\n')
              text = text.replace(f'\n      {old}:\n', f'\n      {new}:\n')
              text = text.replace(f'\n      {old}: {{condition:', f'\n      {new}: {{condition:')
              text = text.replace(f'\n      - {old}\n', f'\n      - {new}\n')
              text = text.replace(f'depends_on: [{old}]', f'depends_on: [{new}]')
              return text

          def add_container_name(text, service):
              marker = f'\n  {service}:\n'
              if marker not in text:
                  raise SystemExit(f'service not found while adding container_name: {service}')
              start = text.index(marker) + 1
              end_match = re.search(r'(?m)^  [a-z0-9][a-z0-9_-]*:\s*$', text[start + len(f'  {service}:\n'):])
              end = start + len(f'  {service}:\n') + end_match.start() if end_match else len(text)
              block = text[start:end]
              if re.search(r'(?m)^    container_name:', block):
                  return text
              return text.replace(marker, marker + f'    container_name: {service}\n', 1)

          def set_container_name(text, old_container, service):
              token = f'container_name: {old_container}'
              return text.replace(token, f'container_name: {service}') if token in text else add_container_name(text, service)

          def service_block(text, service):
              marker = f'\n  {service}:\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'service block not found: {service}')
              start += 1
              section_end = text.find('\nnetworks:\n', start)
              if section_end < 0:
                  section_end = len(text)
              offset = start + len(f'  {service}:\n')
              match = re.search(r'(?m)^  [a-z0-9][a-z0-9_-]*:\s*$', text[offset:section_end])
              end = offset + match.start() if match else section_end
              return start, end

          def set_network_aliases(text, service, network, aliases):
              start, end = service_block(text, service)
              block = text[start:end]
              aliases_text = ', '.join(aliases)
              list_form = f'    networks: [{network}]'
              map_form = f'    networks:\n      {network}:'
              if list_form in block:
                  block = block.replace(list_form, f'    networks:\n      {network}:\n        aliases: [{aliases_text}]', 1)
              elif map_form in block:
                  alias_match = re.search(r'(?m)^        aliases: \[([^\]]*)\]$', block)
                  if alias_match:
                      existing = [item.strip() for item in alias_match.group(1).split(',') if item.strip()]
                      merged = existing + [item for item in aliases if item not in existing]
                      block = block[:alias_match.start()] + f'        aliases: [{", ".join(merged)}]' + block[alias_match.end():]
                  else:
                      block = block.replace(map_form, map_form + f'\n        aliases: [{aliases_text}]', 1)
              else:
                  block = block.rstrip() + f'\n    networks:\n      {network}:\n        aliases: [{aliases_text}]\n'
              return text[:start] + block + text[end:]

          def normalize_generic_stack(path, deployment, *, existing_container_names):
              text = read(path).replace('argws-connect-net', f'argws-connect-{deployment}-net')
              for old in RESOURCES:
                  new = f'{old}-argws-connect-{deployment}'
                  if f'\n  {old}:\n' not in text:
                      continue
                  text = rename_key_and_refs(text, old, new)
                  text = set_container_name(text, f'argws_connect_{old}', new) if existing_container_names else add_container_name(text, new)
              write(path, text)

          # Root/default API deployment.
          root = read('docker-compose.yaml').replace('argws-connect-net', 'argws-connect-api-net')
          for old in RESOURCES:
              new = f'{old}-argws-connect-api'
              if f'\n  {old}:\n' not in root:
                  continue
              root = rename_key_and_refs(root, old, new)
              root = set_container_name(root, f'argws_connect_{old}', new)
          write('docker-compose.yaml', root)
          write('.env.example', read('.env.example').replace('ARGWS_CONNECT_NETWORK_NAME=argws-connect-net', 'ARGWS_CONNECT_NETWORK_NAME=argws-connect-api-net'))

          normalize_generic_stack('deploy/cloudpanel/docker-compose.yml', 'cloudpanel', existing_container_names=True)
          normalize_generic_stack('deploy/dockge/compose.yaml', 'dockge', existing_container_names=True)
          normalize_generic_stack('deploy/homologation/compose.yaml', 'homologation', existing_container_names=False)

          docs = read('deploy/docs/compose.yaml').replace('docs-argws-connect-standalone', 'docs-argws-connect-docs')
          write('deploy/docs/compose.yaml', docs)
          docs_dev = read('deploy/docs-develop/compose.yaml').replace('docs-argws-connect-standalone-develop', 'docs-argws-connect-docs-develop')
          write('deploy/docs-develop/compose.yaml', docs_dev)

          platform_map = {
              'connect-engine': 'api-argws-connect-platform',
              'connect-docs': 'docs-argws-connect-platform',
              'connect-engine-postgres': 'postgres-argws-connect-platform',
              'connect-redis': 'redis-argws-connect-platform',
              'connect-rabbitmq': 'rabbitmq-argws-connect-platform',
              'connect-minio': 'minio-argws-connect-platform',
              'connect-platform-postgres': 'platform-postgres-argws-connect-platform',
              'connect-platform-migrate': 'platform-migrate-argws-connect-platform',
              'connect-platform-migrate-tenants': 'platform-migrate-tenants-argws-connect-platform',
              'connect-platform-bootstrap': 'platform-bootstrap-argws-connect-platform',
              'connect-platform-api': 'platform-api-argws-connect-platform',
              'connect-platform-worker': 'platform-worker-argws-connect-platform',
              'connect-platform-scheduler': 'platform-scheduler-argws-connect-platform',
              'connect-platform-web': 'platform-web-argws-connect-platform',
              'connect-gateway': 'platform-gateway-argws-connect-platform',
          }
          text = read('deploy/platform/compose.yaml').replace('connect-internal', 'argws-connect-platform-net')
          for old, new in platform_map.items():
              text = rename_key_and_refs(text, old, new)
          for service in platform_map.values():
              text = add_container_name(text, service)
          for service, aliases in {
              platform_map['connect-engine']: ['connect-engine','argws-connect-api'],
              platform_map['connect-docs']: ['connect-docs'],
              platform_map['connect-engine-postgres']: ['connect-engine-postgres','argws-connect-postgres'],
              platform_map['connect-redis']: ['connect-redis','argws-connect-redis'],
              platform_map['connect-rabbitmq']: ['connect-rabbitmq','argws-connect-rabbitmq'],
              platform_map['connect-minio']: ['connect-minio','argws-connect-minio'],
              platform_map['connect-platform-postgres']: ['connect-platform-postgres'],
              platform_map['connect-platform-api']: ['connect-platform-api'],
              platform_map['connect-platform-web']: ['connect-platform-web'],
          }.items():
              text = set_network_aliases(text, service, 'argws-connect-platform-net', aliases)
          write('deploy/platform/compose.yaml', text)

          local_build = read('deploy/platform/compose.local-build.yaml')
          for old in ('connect-engine','connect-docs','connect-platform-api','connect-platform-web','connect-gateway'):
              local_build = rename_key_and_refs(local_build, old, platform_map[old])
          write('deploy/platform/compose.local-build.yaml', local_build)

          develop_map = {
              'connect-platform-postgres': 'platform-postgres-argws-connect-develop',
              'connect-platform-migrate': 'platform-migrate-argws-connect-develop',
              'connect-platform-migrate-tenants': 'platform-migrate-tenants-argws-connect-develop',
              'connect-platform-bootstrap': 'platform-bootstrap-argws-connect-develop',
              'connect-platform-api': 'platform-api-argws-connect-develop',
              'connect-platform-worker': 'platform-worker-argws-connect-develop',
              'connect-platform-scheduler': 'platform-scheduler-argws-connect-develop',
              'connect-platform-web': 'platform-web-argws-connect-develop',
              'connect-gateway': 'platform-gateway-argws-connect-develop',
          }
          overlay = read('deploy/develop/compose.platform.yaml')
          for old, new in develop_map.items():
              overlay = rename_key_and_refs(overlay, old, new)
          for service in develop_map.values():
              overlay = add_container_name(overlay, service)
          for service, aliases in {
              develop_map['connect-platform-postgres']: ['connect-platform-postgres'],
              develop_map['connect-platform-api']: ['connect-platform-api'],
              develop_map['connect-platform-web']: ['connect-platform-web'],
          }.items():
              overlay = set_network_aliases(overlay, service, 'argws-connect-develop-net', aliases)
          write('deploy/develop/compose.platform.yaml', overlay)

          tests = read('platform/control-api/tests/connect_platform/test_integrated_foundation.py')
          replacements = {
              '"connect-engine:"': '"api-argws-connect-platform:"',
              '"connect-platform-api:"': '"platform-api-argws-connect-platform:"',
              '"connect-platform-web:"': '"platform-web-argws-connect-platform:"',
              '"connect-gateway:"': '"platform-gateway-argws-connect-platform:"',
              '"connect-platform-postgres:"': '"platform-postgres-argws-connect-develop:"',
          }
          for old, new in replacements.items():
              tests = tests.replace(old, new)
          write('platform/control-api/tests/connect_platform/test_integrated_foundation.py', tests)

          validator = read('platform/scripts/validate_platform_integration.py').replace(
              '("connect-engine", "connect-docs", "connect-platform-api", "connect-platform-web", "connect-gateway")',
              '("api-argws-connect-platform", "docs-argws-connect-platform", "platform-api-argws-connect-platform", "platform-web-argws-connect-platform", "platform-gateway-argws-connect-platform")'
          )
          write('platform/scripts/validate_platform_integration.py', validator)

          platform_ci = read('.github/workflows/platform-integrity.yml')
          platform_ci = platform_ci.replace("grep -q 'connect-platform-api:'", "grep -q 'platform-api-argws-connect-develop:'")
          platform_ci = platform_ci.replace("grep -q 'connect-platform-web:'", "grep -q 'platform-web-argws-connect-develop:'")
          platform_ci = platform_ci.replace("grep -q 'connect-platform-postgres:'", "grep -q 'platform-postgres-argws-connect-develop:'")
          write('.github/workflows/platform-integrity.yml', platform_ci)

          deployment_ci = read('.github/workflows/deployment-integrity.yml')
          deployment_ci = deployment_ci.replace(
              "('homologation', 'deploy/homologation/compose.yaml', 'deploy/homologation/env.example', 'docs', 38181,",
              "('homologation', 'deploy/homologation/compose.yaml', 'deploy/homologation/env.example', 'docs-argws-connect-homologation', 38181,"
          ).replace(
              "('cloudpanel', 'deploy/cloudpanel/docker-compose.yml', 'deploy/cloudpanel/env.example', 'docs', 38180,",
              "('cloudpanel', 'deploy/cloudpanel/docker-compose.yml', 'deploy/cloudpanel/env.example', 'docs-argws-connect-cloudpanel', 38180,"
          ).replace(
              "('dockge', 'deploy/dockge/compose.yaml', 'deploy/dockge/env.example', 'docs', 38180,",
              "('dockge', 'deploy/dockge/compose.yaml', 'deploy/dockge/env.example', 'docs-argws-connect-dockge', 38180,"
          )
          prepare_marker = '          cp deploy/dockge/env.example deploy/dockge/.env\n'
          if 'cp deploy/platform/env.example deploy/platform/.env' not in deployment_ci:
              deployment_ci = deployment_ci.replace(prepare_marker, prepare_marker + '          cp deploy/platform/env.example deploy/platform/.env\n')
          naming_step = '''\n      - name: Enforce project, service, container and network naming contract\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 - <<'PY'\n          import json\n          import subprocess\n          from pathlib import Path\n\n          cases = [\n              ('api', 'docker-compose.yaml', '.env.example', 'argws-connect-api'),\n              ('production', 'deploy/production/compose.yaml', 'deploy/production/env.example', 'argws-connect-production'),\n              ('develop', 'deploy/develop/compose.yaml', 'deploy/develop/env.example', 'argws-connect-develop'),\n              ('canonical', 'deploy/canonical/compose.yaml', 'deploy/canonical/env.example', 'argws-connect-canonical'),\n              ('homologation', 'deploy/homologation/compose.yaml', 'deploy/homologation/env.example', 'argws-connect-homologation'),\n              ('cloudpanel', 'deploy/cloudpanel/docker-compose.yml', 'deploy/cloudpanel/env.example', 'argws-connect-cloudpanel'),\n              ('dockge', 'deploy/dockge/compose.yaml', 'deploy/dockge/env.example', 'argws-connect-dockge'),\n              ('docs', 'deploy/docs/compose.yaml', 'deploy/docs/env.example', 'argws-connect-docs'),\n              ('docs-develop', 'deploy/docs-develop/compose.yaml', 'deploy/docs-develop/env.example', 'argws-connect-docs-develop'),\n              ('platform', 'deploy/platform/compose.yaml', 'deploy/platform/env.example', 'argws-connect-platform'),\n          ]\n\n          def env_values(path):\n              values = {}\n              for raw in Path(path).read_text().splitlines():\n                  line = raw.strip()\n                  if line and not line.startswith('#') and '=' in line:\n                      key, value = line.split('=', 1)\n                      values[key] = value\n              return values\n\n          for deployment, compose, envfile, project in cases:\n              env = env_values(envfile)\n              assert env.get('COMPOSE_PROJECT_NAME') == project, f'{deployment}: COMPOSE_PROJECT_NAME inválido'\n              cfg = json.loads(subprocess.check_output(['docker','compose','--env-file',envfile,'--profile','*','-f',compose,'config','--format','json'], text=True))\n              assert cfg.get('name') == project, f'{deployment}: Compose name inválido: {cfg.get("name")}'\n              for service, service_cfg in cfg.get('services', {}).items():\n                  assert service.endswith('-' + project), f'{deployment}: service fora do padrão: {service}'\n                  assert service_cfg.get('container_name') == service, f'{deployment}: container_name deve ser igual ao service: {service}'\n              network_names = {item.get('name') for item in cfg.get('networks', {}).values()}\n              expected_network = project + '-net'\n              assert expected_network in network_names, f'{deployment}: network {expected_network} ausente: {sorted(network_names)}'\n\n          print('Deployment naming contract OK')\n          PY\n'''
          marker = '      - name: Enforce official deployment contract\n'
          if 'Enforce project, service, container and network naming contract' not in deployment_ci:
              deployment_ci = deployment_ci.replace(marker, naming_step + '\n' + marker)
          write('.github/workflows/deployment-integrity.yml', deployment_ci)

          guide = read('docs/guides/platform-runtime-modes.md')
          if '### Convenção dos services' not in guide:
              guide += '''\n\n### Convenção dos services\n\nTodo service de um deployment independente segue `recurso-argws-connect-deployment`, e o `container_name` deve ser idêntico ao service. Exemplos: `api-argws-connect-develop`, `docs-argws-connect-platform`, `platform-api-argws-connect-platform`. Aliases internos estáveis (`connect-engine`, `connect-platform-api`, `argws-connect-postgres` etc.) podem existir para desacoplar comunicação interna da nomenclatura física.\n\nNo overlay `deploy/develop/compose.platform.yaml`, os serviços já existentes mantêm seus nomes `*-argws-connect-develop` e os novos componentes usam `platform-*-argws-connect-develop`.\n'''
          write('docs/guides/platform-runtime-modes.md', guide)

          deploy_readme = read('deploy/README.md')
          if '## Convenção canônica de nomenclatura' not in deploy_readme:
              deploy_readme += '''\n\n## Convenção canônica de nomenclatura\n\n- project: `argws-connect-<deployment>`\n- network: `argws-connect-<deployment>-net`\n- service: `<recurso>-argws-connect-<deployment>`\n- `container_name`: idêntico ao service\n- overlays não criam novo project name; herdam a stack-base.\n'''
          write('deploy/README.md', deploy_readme)
          PY

      - name: Validate generated naming locally
        run: |
          set -euo pipefail
          cp deploy/platform/env.example deploy/platform/.env
          for spec in \
            'docker-compose.yaml|.env.example' \
            'deploy/production/compose.yaml|deploy/production/env.example' \
            'deploy/develop/compose.yaml|deploy/develop/env.example' \
            'deploy/canonical/compose.yaml|deploy/canonical/env.example' \
            'deploy/homologation/compose.yaml|deploy/homologation/env.example' \
            'deploy/cloudpanel/docker-compose.yml|deploy/cloudpanel/env.example' \
            'deploy/dockge/compose.yaml|deploy/dockge/env.example' \
            'deploy/docs/compose.yaml|deploy/docs/env.example' \
            'deploy/docs-develop/compose.yaml|deploy/docs-develop/env.example' \
            'deploy/platform/compose.yaml|deploy/platform/env.example'; do
            compose="${spec%%|*}"; envfile="${spec##*|}"
            docker compose --env-file "$envfile" --profile '*' -f "$compose" config >/dev/null
          done
          rm -f deploy/platform/.env

      - name: Commit normalized deployment contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deploy): standardize project and service naming"
          git push origin HEAD:fix/deploy-compose-project-names
