name: Apply pairing code hotfix

on:
  push:
    branches:
      - "fix/pairing-code-phone-client-1.0.10"
    paths:
      - ".github/workflows/apply-pairing-hotfix.yml"

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "fix/pairing-code-phone-client-1.0.10"
          fetch-depth: 0

      - name: Apply corrections
        run: python3 scripts/apply-pairing-hotfix.py

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pairing): corrige código de pareamento e identidade da sessão"
          git push origin HEAD:fix/pairing-code-phone-client-1.0.10
