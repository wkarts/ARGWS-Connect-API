name: Dedupe ZAPO alias merge

on:
  push:
    branches:
      - fix/zapo-identity-performance-docs
    paths:
      - .github/workflows/dedupe-zapo-alias-merge.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zapo-identity-performance-docs
          fetch-depth: 0
      - name: Make alias merge idempotent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts')
          s = p.read_text()
          pairs = [
            ("""      if (lidJid && phoneJid) {
        this.rememberAlias(lidJid, phoneJid);
        void this.mergeCanonicalIdentityRecords(lidJid, phoneJid).catch((error: Error) => this.logger.warn(error));
      }""", """      if (lidJid && phoneJid) {
        const mapping = this.rememberAlias(lidJid, phoneJid);
        if (mapping?.changed) {
          void this.mergeCanonicalIdentityRecords(lidJid, phoneJid).catch((error: Error) => this.logger.warn(error));
        }
      }"""),
            ("""    if (phoneJid && lidJid && !isOwnPeer) {
      this.rememberAlias(lidJid, phoneJid);
      void this.mergeCanonicalIdentityRecords(lidJid, phoneJid).catch((error: Error) => this.logger.warn(error));
    }""", """    if (phoneJid && lidJid && !isOwnPeer) {
      const mapping = this.rememberAlias(lidJid, phoneJid);
      if (mapping?.changed) {
        void this.mergeCanonicalIdentityRecords(lidJid, phoneJid).catch((error: Error) => this.logger.warn(error));
      }
    }"""),
            ("""  ): { lidJid: string; phoneJid: string } | null {""", """  ): { lidJid: string; phoneJid: string; changed: boolean } | null {"""),
            ("""    aliases?.set(lidJid, phoneJid);
    this.lidToPhone.set(this.identityKey(lidJid), phoneJid);
    return { lidJid, phoneJid };""", """    aliases?.set(lidJid, phoneJid);
    const key = this.identityKey(lidJid);
    const previous = this.lidToPhone.get(key);
    if (previous === phoneJid) return { lidJid, phoneJid, changed: false };
    this.lidToPhone.set(key, phoneJid);
    return { lidJid, phoneJid, changed: true };"""),
            ("""    if (!mapping) return;
    void this.mergeCanonicalIdentityRecords(mapping.lidJid, mapping.phoneJid).catch((error: Error) =>""", """    if (!mapping?.changed) return;
    void this.mergeCanonicalIdentityRecords(mapping.lidJid, mapping.phoneJid).catch((error: Error) =>"""),
          ]
          for old, new in pairs:
            if s.count(old) != 1:
              raise SystemExit('Expected alias block not found exactly once')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Format and commit
        run: |
          npm ci --silent
          npx prettier --write src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/integrations/channel/whatsapp/zapo.identity.extensions.ts
          HUSKY=0 git commit -m "perf(zapo): dedupe canonical alias merges"
          HUSKY=0 git push origin HEAD:fix/zapo-identity-performance-docs
