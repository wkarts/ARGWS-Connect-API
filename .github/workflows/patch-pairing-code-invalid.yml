name: Patch Pairing Code Invalid

on:
  push:
    branches:
      - fix/pairing-code-invalid-1.0.11

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pairing-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pairing-code-invalid-1.0.11
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm

      - name: Apply pairing-code protocol fix
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts')
          service = service_path.read_text(encoding='utf-8')

          old_import = "  BufferJSON,\n  CacheStore,"
          new_import = "  BufferJSON,\n  Browsers,\n  CacheStore,"
          if old_import not in service and new_import not in service:
              raise SystemExit('Baileys import anchor not found')
          service = service.replace(old_import, new_import, 1)

          old_browser = "    const browser: WABrowserDescription = [session.CLIENT, session.NAME, release()];\n    const browserOptions = { browser };"
          new_browser = "    // Pairing by phone number is stricter than QR pairing: WhatsApp rejects custom/non-canonical\n    // platform labels and Baileys rc.9 can still return a locally generated but dead code.\n    // CONFIG_SESSION_PHONE_CLIENT remains the ARGWS presentation label exposed by the Manager;\n    // the transport socket intentionally uses a canonical browser descriptor.\n    const browser: WABrowserDescription = Browsers.ubuntu(session.NAME || 'Chrome');\n    const browserOptions = { browser };"
          if old_browser not in service and new_browser not in service:
              raise SystemExit('Browser configuration anchor not found')
          service = service.replace(old_browser, new_browser, 1)

          old_pairing = """      if (this.phoneNumber) {
        await delay(1000);
        try {
          this.instance.qrcode.pairingCode = await this.client.requestPairingCode(this.phoneNumber);
        } catch (error) {
          this.instance.qrcode.pairingCode = null;
          this.logger.error(`Pairing code generation failed: ${error?.message || error}`);
        }
      } else {
        this.instance.qrcode.pairingCode = null;
      }
"""
          new_pairing = """      if (this.phoneNumber) {
        // Do not rotate a valid pairing code on every QR refresh. A regenerated code invalidates
        // the one already displayed to the user before it can be entered on the phone.
        if (!this.instance.qrcode.pairingCode) {
          await delay(1000);
          try {
            this.instance.qrcode.pairingCode = await this.client.requestPairingCode(this.phoneNumber);
          } catch (error) {
            this.instance.qrcode.pairingCode = null;
            this.logger.error(`Pairing code generation failed: ${error?.message || error}`);
          }
        }
      } else {
        this.instance.qrcode.pairingCode = null;
      }
"""
          if old_pairing not in service and new_pairing not in service:
              raise SystemExit('Pairing generation anchor not found')
          service = service.replace(old_pairing, new_pairing, 1)

          # release() was used only to construct the custom browser tuple. Keep the import clean.
          service = service.replace("import { release } from 'os';\n", '')
          service_path.write_text(service, encoding='utf-8')

          test_path = Path('test/pairing-code.compat.test.ts')
          test_path.write_text("""import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';
import { resolve } from 'node:path';

const source = readFileSync(
  resolve(process.cwd(), 'src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts'),
  'utf8',
);

assert.match(
  source,
  /Browsers\\.ubuntu\\(session\\.NAME \\|\\| 'Chrome'\\)/,
  'pairing transport must use a canonical Baileys browser descriptor',
);
assert.doesNotMatch(
  source,
  /\\[session\\.CLIENT, session\\.NAME, release\\(\\)\\]/,
  'the branded presentation label must not be sent as the WhatsApp pairing platform',
);
assert.match(
  source,
  /this\\.phoneNumber\\) \\{[\\s\\S]*?!this\\.instance\\.qrcode\\.pairingCode/,
  'pairing code must not be regenerated on every QR refresh',
);

console.log('Pairing-code compatibility contract validated.');
""", encoding='utf-8')

          quality_path = Path('.github/workflows/check-code-quality.yml')
          quality = quality_path.read_text(encoding='utf-8')
          anchor = "      - name: Check build\n        run: npm run build\n"
          addition = "      - name: Check pairing-code compatibility\n        run: npx tsx ./test/pairing-code.compat.test.ts\n"
          if addition not in quality:
              if anchor not in quality:
                  raise SystemExit('Code quality workflow anchor not found')
              quality = quality.replace(anchor, addition + anchor, 1)
          quality_path.write_text(quality, encoding='utf-8')

      - name: Validate source
        run: |
          npm ci
          npm run lint:check
          npx tsx ./test/pairing-code.compat.test.ts
          npm run db:generate
          npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts test/pairing-code.compat.test.ts .github/workflows/check-code-quality.yml
          git commit -m "fix(whatsapp): estabiliza pairing code com browser canônico [pairing-patched]"
          git push origin HEAD:fix/pairing-code-invalid-1.0.11
