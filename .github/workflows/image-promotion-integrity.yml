name: Image Promotion Integrity

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "deploy/production/**"
      - "deploy/develop/**"
      - "deploy/canonical/**"
      - "deploy/docs/**"
      - "deploy/platform/**"
      - ".github/workflows/ghcr-publish-application.yml"
      - ".github/workflows/ghcr-publish-docs.yml"
      - ".github/workflows/auto-version-release.yml"
      - ".github/workflows/image-promotion-integrity.yml"
      - "RELEASE-AUTOMATION.md"
      - "DEVELOPMENT-FLOW.md"
  push:
    branches: [main, develop]
    paths:
      - "deploy/production/**"
      - "deploy/develop/**"
      - "deploy/canonical/**"
      - "deploy/docs/**"
      - "deploy/platform/**"
      - ".github/workflows/ghcr-publish-application.yml"
      - ".github/workflows/ghcr-publish-docs.yml"
      - ".github/workflows/auto-version-release.yml"
      - ".github/workflows/image-promotion-integrity.yml"
      - "RELEASE-AUTOMATION.md"
      - "DEVELOPMENT-FLOW.md"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate branch and image promotion policy
        shell: bash
        run: |
          set -euo pipefail

          prod="$(grep '^ARGWS_CONNECT_API_IMAGE=' deploy/production/env.example | cut -d= -f2-)"
          develop="$(grep '^ARGWS_CONNECT_API_IMAGE=' deploy/develop/env.example | cut -d= -f2-)"
          canonical="$(grep '^ARGWS_CONNECT_API_IMAGE=' deploy/canonical/env.example | cut -d= -f2-)"
          prod_docs="$(grep '^ARGWS_CONNECT_DOCS_IMAGE=' deploy/production/env.example | cut -d= -f2-)"
          develop_docs="$(grep '^ARGWS_CONNECT_DOCS_IMAGE=' deploy/develop/env.example | cut -d= -f2-)"
          canonical_docs="$(grep '^ARGWS_CONNECT_DOCS_IMAGE=' deploy/canonical/env.example | cut -d= -f2-)"

          [[ "$prod" == "ghcr.io/wkarts/argws-connect-api:latest" ]]
          [[ "$develop" == "ghcr.io/wkarts/argws-connect-api:develop" ]]
          [[ "$canonical" =~ ^ghcr\.io/wkarts/argws-connect-api:[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$prod_docs" == "ghcr.io/wkarts/argws-connect-docs:latest" ]]
          [[ "$develop_docs" == "ghcr.io/wkarts/argws-connect-docs:develop" ]]
          [[ "$canonical_docs" =~ ^ghcr\.io/wkarts/argws-connect-docs:[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${canonical##*:}" == "${canonical_docs##*:}" ]]

          # develop: API/Platform e DOCs são canais móveis independentes.
          grep -q 'branches: \[develop\]' .github/workflows/ghcr-publish-application.yml
          grep -q 'component: \[api, platform-api, platform-web, platform-gateway, platform-acme, platform-cloudpanel-agent, pgbouncer\]' .github/workflows/ghcr-publish-application.yml
          grep -q 'image: argws-connect-api' .github/workflows/ghcr-publish-application.yml
          grep -q 'image: argws-connect-platform-api' .github/workflows/ghcr-publish-application.yml
          grep -q 'image: argws-connect-platform-web' .github/workflows/ghcr-publish-application.yml
          grep -q 'image: argws-connect-platform-gateway' .github/workflows/ghcr-publish-application.yml
          grep -q 'image: argws-connect-platform-acme' .github/workflows/ghcr-publish-application.yml
          grep -q 'image: argws-connect-platform-cloudpanel-agent' .github/workflows/ghcr-publish-application.yml
          grep -q 'docker buildx imagetools create -t "${repo}:develop"' .github/workflows/ghcr-publish-application.yml
          grep -q 'refs/heads/develop' .github/workflows/ghcr-publish-application.yml

          grep -q 'branches: \[develop\]' .github/workflows/ghcr-publish-docs.yml
          grep -q 'argws-connect-docs' .github/workflows/ghcr-publish-docs.yml
          grep -q 'docker buildx imagetools create -t "${repo}:develop"' .github/workflows/ghcr-publish-docs.yml
          grep -q 'refs/heads/develop' .github/workflows/ghcr-publish-docs.yml

          if grep -q 'setup-qemu' .github/workflows/ghcr-publish-application.yml .github/workflows/ghcr-publish-docs.yml; then
            echo "Develop must use native amd64/arm64 runners, not QEMU." >&2
            exit 1
          fi

          if grep -nE 'argws-connect-(api|platform-api|platform-web|platform-gateway|platform-acme|platform-cloudpanel-agent|pgbouncer):(latest|homolog|production|[0-9]+\.[0-9]+\.[0-9]+)' .github/workflows/ghcr-publish-application.yml; then
            echo "Develop application workflow may publish only :develop." >&2
            exit 1
          fi

          if grep -nE 'argws-connect-docs:(latest|homolog|production|[0-9]+\.[0-9]+\.[0-9]+)' .github/workflows/ghcr-publish-docs.yml; then
            echo "Develop DOCs workflow may publish only :develop." >&2
            exit 1
          fi

          # main owns stable SemVer/latest for API, Platform and DOCs.
          grep -q 'branches: \[main\]' .github/workflows/auto-version-release.yml
          grep -Fq 'component: [api, docs, platform-api, platform-web, platform-gateway, platform-acme, platform-cloudpanel-agent, pgbouncer]' .github/workflows/auto-version-release.yml
          grep -q 'image: argws-connect-api' .github/workflows/auto-version-release.yml
          grep -q 'image: argws-connect-platform-api' .github/workflows/auto-version-release.yml
          grep -q 'image: argws-connect-platform-web' .github/workflows/auto-version-release.yml
          grep -q 'image: argws-connect-platform-gateway' .github/workflows/auto-version-release.yml
          grep -q 'image: argws-connect-platform-acme' .github/workflows/auto-version-release.yml
          grep -q 'image: argws-connect-platform-cloudpanel-agent' .github/workflows/auto-version-release.yml
          grep -q 'image: argws-connect-docs' .github/workflows/auto-version-release.yml
          grep -q '"${repo}:latest"' .github/workflows/auto-version-release.yml
          grep -q 'gh release create' .github/workflows/auto-version-release.yml

          # Runtime stack channels.
          grep -q 'argws-connect-api:latest' deploy/production/compose.yaml
          grep -q 'argws-connect-docs:latest' deploy/production/compose.yaml
          grep -q 'argws-connect-api:develop' deploy/develop/compose.yaml
          grep -q 'argws-connect-docs:develop' deploy/develop/compose.yaml
          grep -Eq 'argws-connect-api:[0-9]+\.[0-9]+\.[0-9]+' deploy/canonical/compose.yaml
          grep -Eq 'argws-connect-docs:[0-9]+\.[0-9]+\.[0-9]+' deploy/canonical/compose.yaml

      - name: Validate independent stack identities
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^COMPOSE_PROJECT_NAME=argws-connect-production$' deploy/production/env.example
          grep -q '^COMPOSE_PROJECT_NAME=argws-connect-develop$' deploy/develop/env.example
          grep -q '^COMPOSE_PROJECT_NAME=argws-connect-canonical$' deploy/canonical/env.example
          grep -q '^ARGWS_CONNECT_API_HOST_PORT=38080$' deploy/production/env.example
          grep -q '^ARGWS_CONNECT_API_HOST_PORT=38082$' deploy/develop/env.example
          grep -q '^ARGWS_CONNECT_API_HOST_PORT=38083$' deploy/canonical/env.example
          grep -q '^ARGWS_CONNECT_DOCS_HOST_PORT=38180$' deploy/production/env.example
          grep -q '^ARGWS_CONNECT_DOCS_HOST_PORT=38182$' deploy/develop/env.example
          grep -q '^ARGWS_CONNECT_DOCS_HOST_PORT=38183$' deploy/canonical/env.example
          grep -q '^COMPOSE_PROJECT_NAME=argws-connect-docs$' deploy/docs/env.example
          grep -q '^ARGWS_CONNECT_DOCS_HOST_PORT=38280$' deploy/docs/env.example
