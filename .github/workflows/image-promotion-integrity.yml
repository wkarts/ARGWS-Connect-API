name: Image Promotion Integrity

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "deploy/production/**"
      - "deploy/homologation/**"
      - "deploy/canonical/**"
      - ".github/workflows/ghcr-publish-application.yml"
      - ".github/workflows/auto-version-release.yml"
      - ".github/workflows/image-promotion-integrity.yml"
      - "RELEASE-AUTOMATION.md"
      - "DEVELOPMENT-FLOW.md"
      - "VERSION"
  push:
    branches: [main, develop]
    paths:
      - "deploy/production/**"
      - "deploy/homologation/**"
      - "deploy/canonical/**"
      - ".github/workflows/ghcr-publish-application.yml"
      - ".github/workflows/auto-version-release.yml"
      - ".github/workflows/image-promotion-integrity.yml"
      - "RELEASE-AUTOMATION.md"
      - "DEVELOPMENT-FLOW.md"
      - "VERSION"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate branch and image promotion policy
        shell: bash
        run: |
          set -euo pipefail

          prod="$(grep '^ARGWS_CONNECT_API_IMAGE=' deploy/production/env.example | cut -d= -f2-)"
          homolog="$(grep '^ARGWS_CONNECT_API_IMAGE=' deploy/homologation/env.example | cut -d= -f2-)"
          stable="$(tr -d '[:space:]' < VERSION)"

          [[ "$homolog" == "ghcr.io/wkarts/argws-connect-api:develop" ]]
          [[ "$prod" == "ghcr.io/wkarts/argws-connect-api:latest" ]]
          [[ "$stable" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          grep -q 'ARGWS_CONNECT_API_IMAGE:?ARGWS_CONNECT_API_IMAGE canonical' deploy/canonical/compose.yaml
          grep -q '../../VERSION' deploy/canonical/deploy.sh
          grep -q 'ghcr.io/wkarts/argws-connect-api:${version}' deploy/canonical/deploy.sh

          [[ "$prod" != *":develop" ]]
          [[ "$homolog" != *":latest" ]]
          [[ "$prod" != *":production" ]]
          [[ "$homolog" != *":homolog" ]]

          grep -q 'branches: \[develop\]' .github/workflows/ghcr-publish-application.yml
          grep -q 'argws-connect-api:develop' .github/workflows/ghcr-publish-application.yml

          if grep -nE 'argws-connect-api:(latest|homolog|production|[0-9]+\.[0-9]+\.[0-9]+)' \
            .github/workflows/ghcr-publish-application.yml; then
            echo "The develop workflow may publish only argws-connect-api:develop." >&2
            exit 1
          fi

          grep -q 'branches: \[main\]' .github/workflows/auto-version-release.yml
          grep -q 'argws-connect-api:develop' deploy/homologation/compose.yaml
          grep -q 'argws-connect-api:latest' deploy/production/compose.yaml

          echo "Channels OK: homolog=:develop production=:latest canonical=:${stable}"

      - name: Validate canonical stable overlay
        run: |
          set -euo pipefail
          bash -n deploy/canonical/deploy.sh
          bash -n deploy/canonical/preflight.sh
          bash -n deploy/canonical/update.sh
          bash -n deploy/canonical/status.sh
          grep -q 'docker manifest inspect' deploy/canonical/preflight.sh
          grep -q '../production/compose.yaml' deploy/canonical/deploy.sh
          grep -q 'exec bash ../canonical/deploy.sh' deploy/production/promote.sh
