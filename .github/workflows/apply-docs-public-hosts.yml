name: Apply DOCs Public Hosts

on:
  push:
    branches: [fix/connect-api-docs-deployments]
    paths:
      - .github/workflows/apply-docs-public-hosts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/connect-api-docs-deployments
          fetch-depth: 0

      - name: Apply topology
        run: python3 .github/scripts/apply-docs-public-hosts.py

      - name: Prepare environments
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          for stack in production homologation develop canonical; do cp "deploy/${stack}/env.example" "deploy/${stack}/.env"; done
          cp deploy/cloudpanel/env.example deploy/cloudpanel/.env
          cp deploy/dockge/env.example deploy/dockge/.env
          cp deploy/docs/env.example deploy/docs/.env
          cp deploy/docs-develop/env.example deploy/docs-develop/.env

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f docker-compose.yaml config >/dev/null
          for stack in production homologation develop canonical docs docs-develop; do
            docker compose --env-file "deploy/${stack}/env.example" -f "deploy/${stack}/compose.yaml" config >/dev/null
          done
          docker compose --env-file deploy/cloudpanel/env.example -f deploy/cloudpanel/docker-compose.yml config >/dev/null
          docker compose --env-file deploy/dockge/env.example -f deploy/dockge/compose.yaml config >/dev/null

      - name: Validate public URL policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://docs.connect.argws.com.br$' .env.example
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://docs.connect.argws.com.br$' deploy/production/env.example
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://docs.connect.argws.com.br$' deploy/homologation/env.example
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://docs.connect.argws.com.br$' deploy/canonical/env.example
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://d.docs.connect.argws.com.br$' deploy/develop/env.example
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://docs.connect.argws.com.br$' deploy/cloudpanel/env.example
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://docs.connect.argws.com.br$' deploy/dockge/env.example
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://docs.connect.argws.com.br$' deploy/docs/env.example
          grep -q '^ARGWS_CONNECT_DOCS_PUBLIC_URL=https://d.docs.connect.argws.com.br$' deploy/docs-develop/env.example
          for stack in docs docs-develop; do
            for script in deploy.sh update.sh status.sh preflight.sh; do bash -n "deploy/${stack}/${script}"; done
          done

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Runtime smoke test DOCs develop
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file deploy/docs-develop/env.example -f deploy/docs-develop/compose.yaml up -d --pull always
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:38282/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          $ready
          curl -fsS http://127.0.0.1:38282/ >/dev/null
          curl -fsS http://127.0.0.1:38282/openapi/connect-api.openapi.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>JSON.parse(s))"
          docker compose --env-file deploy/docs-develop/env.example -f deploy/docs-develop/compose.yaml down --remove-orphans

      - name: Clean generated env files
        if: always()
        run: rm -f .env deploy/production/.env deploy/homologation/.env deploy/develop/.env deploy/canonical/.env deploy/cloudpanel/.env deploy/dockge/.env deploy/docs/.env deploy/docs-develop/.env

      - name: Commit validated topology
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example docker-compose.yaml deploy docs/guides/deployment.md
          if ! git diff --cached --quiet; then
            git commit -m "feat(docs): adiciona hostnames oficiais e standalone develop"
            git push origin HEAD:fix/connect-api-docs-deployments
          fi
