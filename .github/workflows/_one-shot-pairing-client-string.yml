name: One-shot Pairing Client String Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_one-shot-pairing-client-string.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
      - name: Change only pairing client string
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts')
          text = path.read_text(encoding='utf-8')
          old = "const browser: WABrowserDescription = ['Ubuntu', 'Chrome', '20.0.04'];"
          new = "const browser: WABrowserDescription = ['🅲🅾🅽🅽🅴🅲🆃\u200b|🅰🅿🅸', 'Chrome', '20.0.04'];"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one browser tuple, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff -- src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts
      - run: npm ci
      - run: npm run lint:check
      - run: npm run test:compat
      - run: npm run db:generate
      - run: npm run build
      - name: Commit validated string-only test and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_one-shot-pairing-client-string.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts .github/workflows/_one-shot-pairing-client-string.yml
          git diff --cached --check
          git commit -m "test(whatsapp): usa identidade CONNECT API no pairing"
          git push origin HEAD:main
