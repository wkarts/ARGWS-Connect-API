name: TEMP Apply Meta Compatible Schemas

on:
  push:
    branches: [feat/meta-compatible-schemas]
    paths:
      - .github/workflows/tmp-apply-meta-schemas.yml
      - scripts/tmp-apply-meta-schemas.py
      - docs/scripts/meta-compatible-schemas.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout schema branch
        uses: actions/checkout@v5
        with:
          ref: feat/meta-compatible-schemas
          fetch-depth: 0

      - name: Sync current develop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop

      - name: Apply generator changes
        run: |
          set -euo pipefail
          python scripts/tmp-apply-meta-schemas.py
          node docs/scripts/generate-openapi.mjs

      - name: Validate generated schema catalog
        run: |
          set -euo pipefail
          npm ci
          npm run docs:check
          node --check docs/scripts/meta-compatible-schemas.mjs
          node - <<'NODE'
          const fs = require('fs')
          const native = JSON.parse(fs.readFileSync('docs/openapi/connect-api.openapi.json', 'utf8'))
          const graph = JSON.parse(fs.readFileSync('docs/openapi/meta-compatible.openapi.json', 'utf8'))
          const requiredGraphSchemas = [
            'MetaMessageRequest', 'MetaTextMessageRequest', 'MetaImageMessageRequest',
            'MetaVideoMessageRequest', 'MetaDocumentMessageRequest', 'MetaAudioMessageRequest',
            'MetaLocationMessageRequest', 'MetaContactsMessageRequest', 'MetaReactionMessageRequest',
            'MetaInteractiveMessageRequest', 'MetaReadReceiptRequest', 'MetaMediaUploadRequest',
            'MetaMediaUploadResponse', 'MetaMediaResponse', 'MetaTemplateListResponse',
            'MetaWebhookPayload', 'MetaMessageResponse', 'GraphError'
          ]
          for (const name of requiredGraphSchemas) {
            if (!graph.components?.schemas?.[name]) throw new Error(`missing Graph schema: ${name}`)
          }
          for (const name of ['MetaCompatibilityConfig', 'MetaCompatibilityUpdateRequest']) {
            if (!native.components?.schemas?.[name]) throw new Error(`missing native bridge schema: ${name}`)
          }
          const media200 = graph.paths['/{version}/{phoneNumberId}/media'].post.responses['200'].content['application/json'].schema
          if (media200.$ref !== '#/components/schemas/MetaMediaUploadResponse') throw new Error('media upload response is not schema-backed')
          const template200 = graph.paths['/{version}/{businessAccountId}/message_templates'].get.responses['200'].content['application/json'].schema
          if (template200.$ref !== '#/components/schemas/MetaTemplateListResponse') throw new Error('template response is not schema-backed')
          const mediaGet200 = graph.paths['/{version}/{mediaId}'].get.responses['200'].content['application/json'].schema
          if (mediaGet200.$ref !== '#/components/schemas/MetaMediaResponse') throw new Error('media describe response is not schema-backed')
          console.log('Meta Compatible schema catalog: ok')
          NODE

      - name: Commit validated schema catalog
        run: |
          set -euo pipefail
          git add docs/scripts/generate-openapi.mjs docs/scripts/meta-compatible-schemas.mjs docs/openapi docs/guides/meta-compatible.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(meta): publica schemas completos da camada Graph"
          fi
          git push --no-verify origin HEAD:feat/meta-compatible-schemas
