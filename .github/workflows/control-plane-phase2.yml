name: Control Plane Phase 2

on:
  pull_request:
    paths:
      - "control-plane/**"
      - "platform-template/**"
      - "scripts/export-platform-template.py"
      - ".github/workflows/control-plane-phase2.yml"
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "platform-template/**"
      - "scripts/export-platform-template.py"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m compileall app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Control Plane Compose
        run: |
          cp control-plane/deploy/env.example control-plane/deploy/.env
          docker compose -f control-plane/deploy/compose.yaml config >/dev/null
      - name: Enforce gateway-only published port
        run: |
          python - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output([
              'docker','compose','-f','control-plane/deploy/compose.yaml','config','--format','json'
          ], text=True))
          published = [name for name,cfg in data['services'].items() if cfg.get('ports')]
          assert published == ['gateway'], f'Only gateway may publish a host port: {published}'
          PY

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/export-platform-template.py
      - uses: actions/upload-artifact@v4
        with:
          name: ARGWS-Platform-Template
          path: dist/ARGWS-Platform-Template.zip
          if-no-files-found: error
