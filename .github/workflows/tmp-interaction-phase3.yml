name: TEMP Interaction Phase 3

on:
  push:
    branches: [feat/interaction-template-editor-phase3]
    paths:
      - .github/workflows/tmp-interaction-phase3.yml
      - scripts/tmp-apply-interaction-phase3.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/interaction-template-editor-phase3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Apply Phase 3 wiring and schemas
        run: python scripts/tmp-apply-interaction-phase3.py

      - name: Install dependencies
        run: npm ci

      - name: Format TypeScript source
        run: npx eslint --ext .ts src --fix

      - name: Validate Prisma schemas
        run: |
          set -euo pipefail
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma validate --schema prisma/postgresql-schema.prisma
          DATABASE_BOUNCER_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:6432/argws?pgbouncer=true' DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma validate --schema prisma/psql_bouncer-schema.prisma
          DATABASE_CONNECTION_URI='mysql://argws:argws@127.0.0.1:3306/argws' npx prisma validate --schema prisma/mysql-schema.prisma
          DATABASE_CONNECTION_URI='postgresql://argws:argws@127.0.0.1:5432/argws' npx prisma generate --schema prisma/postgresql-schema.prisma

      - name: Generate documentation contracts
        run: npm run docs:generate

      - name: Validate Phase 3
        run: |
          set -euo pipefail
          npm run docs:check
          npm run test:compat
          npm run build
          npm run lint:check
          node --check manager/dist/assets/template-editor.js
          node --check manager/dist/assets/template-editor-launcher.js
          node - <<'NODE'
          const fs = require('fs')
          const pg = fs.readFileSync('prisma/postgresql-schema.prisma', 'utf8')
          const mysql = fs.readFileSync('prisma/mysql-schema.prisma', 'utf8')
          const pgb = fs.readFileSync('prisma/psql_bouncer-schema.prisma', 'utf8')
          for (const [name, text] of [['postgres', pg], ['mysql', mysql], ['pgbouncer', pgb]]) {
            if (!text.includes('model TemplateInteractionSession {')) throw new Error(`${name}: interaction session model missing`)
          }
          const manager = fs.readFileSync('manager/dist/template-editor.html', 'utf8')
          if (!manager.includes('Template Studio')) throw new Error('Template Studio shell missing')
          const native = JSON.parse(fs.readFileSync('docs/openapi/connect-api.openapi.json', 'utf8'))
          if (!native.paths['/template/create/{instanceName}']) throw new Error('template create route missing')
          if (!native.paths['/template/edit/{instanceName}']) throw new Error('template edit route missing')
          console.log('phase 3 structural validation: ok')
          NODE

      - name: Commit validated Phase 3
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            prisma/postgresql-schema.prisma \
            prisma/psql_bouncer-schema.prisma \
            prisma/mysql-schema.prisma \
            prisma/postgresql-migrations/20260902070000_interaction_engine/migration.sql \
            prisma/mysql-migrations/20260902070000_interaction_engine/migration.sql \
            src/api/server.module.ts \
            src/api/controllers/template.controller.ts \
            src/api/integrations/event/event.manager.ts \
            src/api/integrations/channel/whatsapp/whatsapp.baileys.service.ts \
            src/api/integrations/channel/meta/whatsapp.business.service.ts \
            src/api/services/interaction-normalizer.ts \
            src/api/services/interaction-engine.service.ts \
            src/api/services/template-engine.service.ts \
            src/api/services/template.service.ts \
            src/api/dto/template.dto.ts \
            src/validate/template.schema.ts \
            src/validate/templateEdit.schema.ts \
            src/validate/message.schema.ts \
            manager/dist/index.html \
            manager/dist/template-editor.html \
            manager/dist/assets/template-editor.css \
            manager/dist/assets/template-editor.js \
            manager/dist/assets/template-editor-launcher.js \
            docs/README.md \
            docs/guides/interactions-template-studio.md \
            docs/openapi \
            docs/asyncapi
          git add -f test/interaction-engine/foundation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat(interactions): materializa Interaction Engine e Template Studio"
          fi
          git push --no-verify origin HEAD:feat/interaction-template-editor-phase3
