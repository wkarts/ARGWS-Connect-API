name: Normalize Deployment Stacks Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-deployment-stacks-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize production and generate develop/canonical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          stable = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', stable), stable

          prod_dir = Path('deploy/production')
          prod_env_path = prod_dir / 'env.example'
          prod_env = prod_env_path.read_text()

          # Production always tracks :latest and uses stack-scoped internal DNS names.
          prod_env = re.sub(
              r'^ARGWS_CONNECT_API_IMAGE=.*$',
              'ARGWS_CONNECT_API_IMAGE=ghcr.io/wkarts/argws-connect-api:latest',
              prod_env,
              flags=re.M,
          )
          prod_env = re.sub(
              r'^# Política de imagem:.*$',
              '# Política de imagem: produção acompanha somente :latest.',
              prod_env,
              flags=re.M,
          )
          host_map = {
              'argws-connect-postgres': 'postgres-argws-connect-production',
              'argws-connect-redis': 'redis-argws-connect-production',
              'argws-connect-rabbitmq': 'rabbitmq-argws-connect-production',
              'argws-connect-minio': 'minio-argws-connect-production',
              'argws-connect-nats': 'nats-argws-connect-production',
              'argws-connect-kafka': 'kafka-argws-connect-production',
              'argws-connect-zookeeper': 'zookeeper-argws-connect-production',
          }
          for old, new in host_map.items():
              prod_env = prod_env.replace(old, new)
          prod_env_path.write_text(prod_env)

          def make_env(stack: str, port: int, url: str, image: str) -> str:
              text = prod_env
              text = text.replace('ARGWS Connect API - PRODUCAO / STACK LOCAL COMPLETA', f'ARGWS Connect API - {stack.upper()} / STACK LOCAL COMPLETA')
              text = text.replace('produção acompanha somente :latest.', f'{stack} usa {image.rsplit(":", 1)[1]}.')
              text = text.replace('argws-connect-production', f'argws-connect-{stack}')
              text = text.replace('postgres-argws-connect-production', f'postgres-argws-connect-{stack}')
              text = text.replace('redis-argws-connect-production', f'redis-argws-connect-{stack}')
              text = text.replace('rabbitmq-argws-connect-production', f'rabbitmq-argws-connect-{stack}')
              text = text.replace('minio-argws-connect-production', f'minio-argws-connect-{stack}')
              text = text.replace('nats-argws-connect-production', f'nats-argws-connect-{stack}')
              text = text.replace('kafka-argws-connect-production', f'kafka-argws-connect-{stack}')
              text = text.replace('zookeeper-argws-connect-production', f'zookeeper-argws-connect-{stack}')
              text = re.sub(r'^ARGWS_CONNECT_API_HOST_PORT=.*$', f'ARGWS_CONNECT_API_HOST_PORT={port}', text, flags=re.M)
              text = re.sub(r'^ARGWS_CONNECT_API_IMAGE=.*$', f'ARGWS_CONNECT_API_IMAGE={image}', text, flags=re.M)
              text = re.sub(r'^SERVER_NAME=.*$', f'SERVER_NAME=argws-connect-api-{stack}', text, flags=re.M)
              text = re.sub(r'^SERVER_URL=.*$', f'SERVER_URL={url}', text, flags=re.M)
              text = re.sub(r'^WEBSOCKET_ALLOWED_HOSTS=.*$', f'WEBSOCKET_ALLOWED_HOSTS=127.0.0.1,::1,{url.removeprefix("https://")}', text, flags=re.M)
              text = text.replace('argws_connect_api', f'argws_connect_{stack}')
              text = re.sub(r'^CONFIG_SESSION_PHONE_CLIENT=.*$', f'CONFIG_SESSION_PHONE_CLIENT=ARGWS Connect API {stack.title()}', text, flags=re.M)
              return text

          def make_compose(stack: str, port: int, image: str) -> str:
              text = (prod_dir / 'compose.yaml').read_text()
              text = text.replace('production', stack)
              text = text.replace('ghcr.io/wkarts/argws-connect-api:latest', image)
              text = text.replace('38080', str(port))
              return text

          prepare_template = r'''#!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"

          STACK_NAME="__STACK__"
          IMAGE_POLICY="__IMAGE__"

          if [[ ! -f env.example ]]; then
            echo "ERRO: env.example nao encontrado."
            exit 1
          fi

          if [[ ! -f .env ]]; then
            cp env.example .env
            chmod 600 .env
            python3 - <<'PYENV'
          from pathlib import Path
          import re
          import secrets
          path = Path('.env')
          text = path.read_text()
          placeholders = sorted(set(re.findall(r'CHANGE_ME_[A-Z0-9_]+', text)))
          for placeholder in placeholders:
              value = secrets.token_hex(48 if 'API_KEY' in placeholder else 40 if 'TOKEN' in placeholder else 32)
              text = text.replace(placeholder, value)
          path.write_text(text)
          print(f'.env criado com {len(placeholders)} segredos fortes.')
          PYENV
          else
            echo ".env existente preservado; somente enderecos legados serao normalizados."
          fi

          python3 - <<'PYENV'
          from pathlib import Path
          import re
          stack = '__STACK__'
          path = Path('.env')
          text = path.read_text()
          resources = ('postgres','redis','rabbitmq','minio','nats','kafka','zookeeper')
          for resource in resources:
              text = text.replace(f'argws-connect-{resource}', f'{resource}-argws-connect-{stack}')
              text = re.sub(rf'{resource}-argws-connect-(production|develop|canonical)(?![-a-z0-9])', f'{resource}-argws-connect-{stack}', text)
          text = re.sub(r'^COMPOSE_PROJECT_NAME=.*$', f'COMPOSE_PROJECT_NAME=argws-connect-{stack}', text, flags=re.M)
          text = re.sub(r'^ARGWS_CONNECT_NETWORK_NAME=.*$', f'ARGWS_CONNECT_NETWORK_NAME=argws-connect-{stack}-net', text, flags=re.M)
          text = re.sub(r'^ARGWS_CONNECT_API_IMAGE=.*$', 'ARGWS_CONNECT_API_IMAGE=__IMAGE__', text, flags=re.M)
          path.write_text(text)
          PYENV
          chmod 600 .env
          echo "Stack ${STACK_NAME} preparada."
          '''

          preflight_template = r'''#!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"

          [[ -f .env ]] || { echo "ERRO: .env inexistente. Execute ./prepare-env.sh."; exit 1; }

          get_value() { grep -E "^${1}=" .env | tail -n1 | cut -d= -f2-; }
          required=(POSTGRES_PASSWORD REDIS_PASSWORD RABBITMQ_DEFAULT_PASS MINIO_ROOT_PASSWORD AUTHENTICATION_API_KEY METRICS_PASSWORD WA_BUSINESS_TOKEN_WEBHOOK)
          for key in "${required[@]}"; do
            value="$(get_value "$key")"
            [[ -n "$value" && "$value" != CHANGE_ME* ]] || { echo "ERRO: configure ${key} no .env."; exit 1; }
          done

          api_image="$(get_value ARGWS_CONNECT_API_IMAGE)"
          __IMAGE_CHECK__

          if command -v sysctl >/dev/null 2>&1; then
            overcommit="$(sysctl -n vm.overcommit_memory 2>/dev/null || true)"
            if [[ "$overcommit" != "1" ]]; then
              echo "AVISO: Redis recomenda vm.overcommit_memory=1 no host."
              echo "Execute: sudo sysctl -w vm.overcommit_memory=1"
            fi
          fi

          image_vars=(ARGWS_CONNECT_API_IMAGE ARGWS_CONNECT_POSTGRES_IMAGE ARGWS_CONNECT_REDIS_IMAGE ARGWS_CONNECT_RABBITMQ_IMAGE ARGWS_CONNECT_MINIO_IMAGE)
          profiles=",$(get_value COMPOSE_PROFILES),"
          [[ "$profiles" == *,nats,* || "$profiles" == *,extended,* ]] && image_vars+=(ARGWS_CONNECT_NATS_IMAGE)
          [[ "$profiles" == *,kafka,* || "$profiles" == *,extended,* ]] && image_vars+=(ARGWS_CONNECT_KAFKA_IMAGE ARGWS_CONNECT_ZOOKEEPER_IMAGE)
          for key in "${image_vars[@]}"; do
            image="$(get_value "$key")"
            [[ -n "$image" ]] || { echo "ERRO: ${key} nao definido."; exit 1; }
            echo "Verificando ${image}..."
            docker manifest inspect "$image" >/dev/null 2>&1 || { echo "ERRO: imagem indisponivel: ${image}"; exit 1; }
          done

          docker compose --env-file .env -f compose.yaml config >/dev/null
          docker compose --env-file .env --profile '*' -f compose.yaml config >/dev/null
          echo "Preflight __STACK__ concluido. Imagem: ${api_image}."
          '''

          deploy_template = r'''#!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          ./prepare-env.sh
          mkdir -p ./volumes/{instances,postgres,redis,rabbitmq,minio,nats,kafka,zookeeper/data,zookeeper/log,logs,backups}
          ./preflight.sh
          docker compose --env-file .env -f compose.yaml pull
          docker compose --env-file .env -f compose.yaml up -d --remove-orphans
          docker compose --env-file .env -f compose.yaml ps
          echo "API: __URL__"
          echo "Manager: __URL__/manager"
          echo "Health: __URL__/health"
          '''

          update_template = r'''#!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          ./prepare-env.sh
          ./preflight.sh
          docker compose --env-file .env -f compose.yaml pull
          docker compose --env-file .env -f compose.yaml up -d --remove-orphans
          docker compose --env-file .env -f compose.yaml ps
          '''

          status_template = r'''#!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          docker compose --env-file .env -f compose.yaml ps
          '''

          stack_specs = {
              'production': (38080, 'https://api.connect.argws.com.br', 'ghcr.io/wkarts/argws-connect-api:latest'),
              'develop': (38082, 'https://d.api.connect.argws.com.br', 'ghcr.io/wkarts/argws-connect-api:develop'),
              'canonical': (38083, 'https://c.api.connect.argws.com.br', f'ghcr.io/wkarts/argws-connect-api:{stable}'),
          }

          for stack, (port, url, image) in stack_specs.items():
              target = Path('deploy') / stack
              target.mkdir(parents=True, exist_ok=True)
              if stack != 'production':
                  (target / 'compose.yaml').write_text(make_compose(stack, port, image))
                  (target / 'env.example').write_text(make_env(stack, port, url, image))
                  for filename in ('registry-login.sh',):
                      shutil.copy2(prod_dir / filename, target / filename)
              prep = prepare_template.replace('__STACK__', stack).replace('__IMAGE__', image)
              (target / 'prepare-env.sh').write_text(prep)
              if stack == 'production':
                  check = '[[ "$api_image" == "ghcr.io/wkarts/argws-connect-api:latest" ]] || { echo "ERRO: production deve usar :latest."; exit 1; }'
              elif stack == 'develop':
                  check = '[[ "$api_image" == "ghcr.io/wkarts/argws-connect-api:develop" ]] || { echo "ERRO: develop deve usar :develop."; exit 1; }'
              else:
                  check = '[[ "$api_image" =~ ^ghcr\\.io/wkarts/argws-connect-api:[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || { echo "ERRO: canonical exige SemVer X.Y.Z."; exit 1; }'
              (target / 'preflight.sh').write_text(preflight_template.replace('__STACK__', stack).replace('__IMAGE_CHECK__', check))
              (target / 'deploy.sh').write_text(deploy_template.replace('__URL__', url))
              (target / 'update.sh').write_text(update_template)
              (target / 'status.sh').write_text(status_template)
              (target / 'nginx-location.conf.example').write_text(f'''location / {{
              proxy_pass http://127.0.0.1:{port};
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              client_max_body_size 136m;
              }}
              ''')
              for script in ('prepare-env.sh','preflight.sh','deploy.sh','update.sh','status.sh','registry-login.sh'):
                  p = target / script
                  if p.exists(): p.chmod(0o755)
              (target / 'README.md').write_text(f'''# ARGWS Connect API — {stack.title()}

              Stack independente `{stack}`.

              - URL: `{url}`
              - Porta local padrão: `{port}`
              - API image: `{image}`
              - Única porta publicada: API
              - Manager: `{url}/manager`
              - Persistência: `./volumes/...`
              - Serviços core: API, PostgreSQL, Redis, RabbitMQ e MinIO
              - Profiles opcionais: `nats`, `kafka`, `extended`

              Convenção dos services: `<recurso>-argws-connect-{stack}`.

              ```bash
              ./prepare-env.sh
              ./deploy.sh
              ```
              ''')

          # Production env was normalized above; ensure its policy and URL are preserved.
          prod_env_path.write_text(prod_env)

          # Remove obsolete promotion helper; production/canonical are now independent deployments.
          for obsolete in ('deploy/production/promote.sh', 'deploy/canonical/promote.sh'):
              p = Path(obsolete)
              if p.exists(): p.unlink()
          PY

      - name: Commit normalized stacks and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-deployment-stacks-once.yml
          git add deploy/production deploy/develop deploy/canonical
          git commit -m "fix(deploy): isola production develop canonical por service [skip release]"
          git push origin HEAD:main
