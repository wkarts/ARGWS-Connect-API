name: Speech native recognition smoke
description: Verify a built image by digest with real pinned GGML recognition inside the full pool resource limit
inputs:
  image:
    description: Immutable published digest or local native test image
    required: true
runs:
  using: composite
  steps:
    - name: Provision pinned smoke model outside the image
      shell: bash
      run: |
        set -euo pipefail
        node scripts/speech-model-provision.cjs whisper-base-q5_1 "${RUNNER_TEMP}/speech-models"
    - name: Recognize two real recordings with the same native process
      shell: bash
      env:
        SPEECH_SMOKE_IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        docker run --rm --init --read-only --network none \
          --cap-drop ALL --security-opt no-new-privileges \
          --memory 1280m --memory-swap 1280m --cpus 1 --pids-limit 128 \
          --tmpfs /tmp:size=128m,mode=1777,noexec,nosuid,nodev \
          --mount "type=bind,source=${RUNNER_TEMP}/speech-models,target=/models,readonly" \
          -e SPEECH_WHISPER_MODEL_FILE=/models/whisper.cpp/base-q5_1/ggml-base-q5_1.bin \
          -e SPEECH_WHISPER_MODEL_SHA256=422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898 \
          -e SPEECH_INFERENCE_THREADS=1 -e SPEECH_SMOKE_EXPECT_CGROUP_BYTES=1342177280 \
          --entrypoint node "${SPEECH_SMOKE_IMAGE}" scripts/native-smoke.cjs \
          | tee "${RUNNER_TEMP}/speech-native-smoke-${RUNNER_ARCH}.json"
    - name: Preserve native measurements
      uses: actions/upload-artifact@v4
      with:
        name: speech-native-smoke-${{ github.job }}-${{ runner.arch }}
        path: ${{ runner.temp }}/speech-native-smoke-${{ runner.arch }}.json
        retention-days: 7
        if-no-files-found: error
