<!doctype html>
<html lang="pt-BR" data-connect-docs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F5FD6" />
    <meta name="application-name" content="Connect|API DOCs" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Connect|API DOCs" />
    <meta name="description" content="Documentação oficial do Connect|API: REST, Meta Compatible e Eventos." />
    <meta property="og:title" content="Connect|API DOCs" />
    <meta property="og:description" content="Documentação oficial do Connect|API: REST, Meta Compatible e Eventos." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="branding/connect-api-docs-light.png" />
    <title>Connect|API DOCs</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script>
      ;(() => {
        const key = 'connect-api-docs-theme'
        let theme = null

        try {
          const stored = localStorage.getItem(key)
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (error) {
          // Storage can be unavailable in privacy-restricted contexts.
        }

        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }

        document.documentElement.dataset.connectDocsTheme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      html {
        scroll-padding-top: 66px;
        background: #ffffff;
      }

      body {
        background: #ffffff;
      }

      .connect-docs-brandbar {
        box-sizing: border-box;
        width: 100%;
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 8px 18px;
        border-bottom: 1px solid #e5e7eb;
        background: rgba(255, 255, 255, 0.97);
        position: sticky;
        top: 0;
        z-index: 100;
        isolation: isolate;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition:
          background-color 160ms ease,
          border-color 160ms ease;
      }

      .connect-docs-brandbar__brand,
      .connect-docs-brandbar__brand img {
        display: block;
      }

      .connect-docs-brandbar__brand {
        min-width: 0;
      }

      .connect-docs-brandbar__brand img {
        height: 38px;
        width: auto;
        max-width: min(440px, 72vw);
        object-fit: contain;
      }

      .connect-docs-brandbar__actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }

      .connect-docs-server-form {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .connect-docs-server-input {
        box-sizing: border-box;
        width: min(360px, 34vw);
        height: 36px;
        border: 1px solid #dbe2ea;
        border-radius: 9px;
        background: #ffffff;
        color: #0f172a;
        padding: 0 11px;
        font: 500 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        outline: none;
      }

      .connect-docs-server-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
      }

      .connect-docs-server-input[readonly] {
        background: #f8fafc;
        color: #475569;
        cursor: default;
      }

      .connect-docs-server-button {
        height: 36px;
        border: 1px solid #2563eb;
        border-radius: 9px;
        background: #2563eb;
        color: #ffffff;
        padding: 0 12px;
        cursor: pointer;
        font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .connect-docs-server-button:disabled {
        border-color: #cbd5e1;
        background: #e2e8f0;
        color: #64748b;
        cursor: default;
      }

      .connect-docs-brandbar__label {
        color: #64748b;
        font: 500 12px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .connect-docs-theme-toggle {
        width: 36px;
        height: 36px;
        border: 1px solid #dbe2ea;
        border-radius: 9px;
        background: #ffffff;
        color: #334155;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease;
      }

      .connect-docs-theme-toggle:hover {
        background: #f8fafc;
      }

      .connect-docs-theme-toggle:focus-visible {
        outline: 2px solid #1f5fd6;
        outline-offset: 2px;
      }

      .connect-docs-theme-toggle svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .connect-docs-theme-toggle__moon {
        display: none;
      }

      #app {
        min-height: calc(100vh - 58px);
      }

      html[data-connect-docs-theme='dark'],
      html[data-connect-docs-theme='dark'] body {
        background: #0b1220;
      }

      html[data-connect-docs-theme='dark'] .connect-docs-brandbar {
        border-bottom-color: #243042;
        background: rgba(11, 18, 32, 0.97);
      }

      html[data-connect-docs-theme='dark'] .connect-docs-server-input {
        border-color: #334155;
        background: #111827;
        color: #e2e8f0;
      }

      html[data-connect-docs-theme='dark'] .connect-docs-server-input[readonly] {
        background: #172033;
        color: #94a3b8;
      }

      html[data-connect-docs-theme='dark'] .connect-docs-brandbar__label {
        color: #94a3b8;
      }

      html[data-connect-docs-theme='dark'] .connect-docs-theme-toggle {
        border-color: #334155;
        background: #111827;
        color: #e2e8f0;
      }

      html[data-connect-docs-theme='dark'] .connect-docs-theme-toggle:hover {
        background: #172033;
      }

      html[data-connect-docs-theme='dark'] .connect-docs-theme-toggle__sun {
        display: none;
      }

      html[data-connect-docs-theme='dark'] .connect-docs-theme-toggle__moon {
        display: block;
      }

      @media (max-width: 980px) {
        .connect-docs-brandbar__label {
          display: none;
        }

        .connect-docs-server-input {
          width: min(300px, 38vw);
        }
      }

      @media (max-width: 640px) {
        html {
          scroll-padding-top: 60px;
        }

        .connect-docs-brandbar {
          min-height: 52px;
          padding: 7px 10px;
          gap: 8px;
        }

        .connect-docs-brandbar__brand img {
          height: 32px;
          max-width: 42vw;
        }

        .connect-docs-server-input {
          width: 34vw;
          min-width: 130px;
          height: 34px;
        }

        .connect-docs-server-button,
        .connect-docs-theme-toggle {
          width: 34px;
          height: 34px;
          padding: 0;
        }

        .connect-docs-server-button {
          font-size: 0;
        }

        .connect-docs-server-button::after {
          content: '✓';
          font-size: 14px;
        }

        #app {
          min-height: calc(100vh - 52px);
        }
      }
    </style>
  </head>

  <body>
    <header class="connect-docs-brandbar" aria-label="Connect|API DOCs">
      <div class="connect-docs-brandbar__brand">
        <img
          id="connect-docs-brand-logo"
          src="branding/connect-api-docs-light.png"
          data-light-src="branding/connect-api-docs-light.png"
          data-dark-src="branding/connect-api-docs-dark.png"
          alt="Connect|API DOCs"
        />
      </div>
      <div class="connect-docs-brandbar__actions">
        <form id="connect-docs-server-form" class="connect-docs-server-form" autocomplete="off">
          <input
            id="connect-docs-server-input"
            class="connect-docs-server-input"
            type="url"
            inputmode="url"
            placeholder="https://api.seudominio.com"
            aria-label="Servidor da API"
            spellcheck="false"
          />
          <button id="connect-docs-server-button" class="connect-docs-server-button" type="submit">Aplicar</button>
        </form>
        <button
          id="connect-docs-theme-toggle"
          class="connect-docs-theme-toggle"
          type="button"
          aria-label="Alternar para modo escuro"
          aria-pressed="false"
          title="Alternar tema claro/escuro"
        >
          <svg class="connect-docs-theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="connect-docs-theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
          </svg>
        </button>
        <span class="connect-docs-brandbar__label">API Reference</span>
      </div>
    </header>

    <div id="app"></div>
    <script src="{{env "CDN_URL"}}"></script>
    <script>
      const basePath = '{{env "BASE_PATH" | js}}'.replace(/\/$/, '')
      const envApiServerUrl = normalizeApiServerUrl('{{env "SERVER_URL" | js}}')
      const serverStorageKey = 'connect-api-docs-server-url'
      const themeStorageKey = 'connect-api-docs-theme'
      let currentTheme = document.documentElement.dataset.connectDocsTheme === 'dark' ? 'dark' : 'light'
      let manualApiServerUrl = ''
      let activeApiServerUrl = envApiServerUrl
      let scalarObserver = null

      try {
        manualApiServerUrl = normalizeApiServerUrl(localStorage.getItem(serverStorageKey) || '')
      } catch (error) {
        manualApiServerUrl = ''
      }

      if (!activeApiServerUrl) activeApiServerUrl = manualApiServerUrl

      function normalizeApiServerUrl(value) {
        const normalized = String(value || '').trim().replace(/\/+$/, '')
        if (!normalized) return ''

        try {
          const parsed = new URL(normalized)
          if (!['http:', 'https:'].includes(parsed.protocol)) return ''
          return parsed.href.replace(/\/$/, '')
        } catch (error) {
          return ''
        }
      }

      function setTheme(theme, persist = true) {
        currentTheme = theme === 'dark' ? 'dark' : 'light'
        const isDark = currentTheme === 'dark'
        const root = document.documentElement
        const themeMeta = document.querySelector('meta[name="theme-color"]')
        const brandLogo = document.getElementById('connect-docs-brand-logo')
        const toggle = document.getElementById('connect-docs-theme-toggle')

        root.dataset.connectDocsTheme = currentTheme
        root.style.colorScheme = currentTheme

        if (themeMeta) themeMeta.setAttribute('content', isDark ? '#0B1220' : '#1F5FD6')

        if (brandLogo) {
          brandLogo.src = isDark ? brandLogo.dataset.darkSrc : brandLogo.dataset.lightSrc
        }

        if (toggle) {
          toggle.setAttribute('aria-pressed', String(isDark))
          toggle.setAttribute('aria-label', isDark ? 'Alternar para modo claro' : 'Alternar para modo escuro')
        }

        syncDocumentPresentation()

        if (persist) {
          try {
            localStorage.setItem(themeStorageKey, currentTheme)
          } catch (error) {
            // Ignore storage errors; the active session still keeps the selected theme.
          }
        }
      }

      function syncScalarTheme() {
        const scalarRoot = document.querySelector('#app .scalar-app')
        if (!scalarRoot) return

        scalarRoot.classList.toggle('dark-mode', currentTheme === 'dark')
        scalarRoot.classList.toggle('light-mode', currentTheme === 'light')
      }

      const documentLogoPairs = [
        ['connect-api-docs-light.png', 'connect-api-docs-dark.png'],
        ['connect-api-rest-light.png', 'connect-api-rest-dark.png'],
        ['connect-api-meta-light.png', 'connect-api-meta-dark.png'],
        ['connect-api-events-light.png', 'connect-api-events-dark.png'],
      ]

      const redundantDocumentTitles = new Set([
        'Connect|API — REST API',
        'Connect|API — Meta Compatible /graph',
        'Connect|API — Eventos',
      ])

      function syncDocumentLogos() {
        document.querySelectorAll('#app img').forEach((image) => {
          const source = image.getAttribute('src') || ''
          for (const [lightName, darkName] of documentLogoPairs) {
            const target = currentTheme === 'dark' ? darkName : lightName
            const opposite = currentTheme === 'dark' ? lightName : darkName
            if (!source.includes(opposite)) continue
            image.setAttribute('src', source.replace(opposite, target))
            break
          }
        })
      }

      function hideRedundantDocumentTitles() {
        document.querySelectorAll('#app h1, #app h2, #app h3, #app [role="heading"]').forEach((heading) => {
          const text = (heading.textContent || '').trim()
          if (!redundantDocumentTitles.has(text)) return
          heading.hidden = true
          heading.setAttribute('aria-hidden', 'true')
        })
      }

      function syncDocumentPresentation() {
        syncScalarTheme()
        syncDocumentLogos()
        hideRedundantDocumentTitles()
      }

      function observeScalar() {
        if (scalarObserver) scalarObserver.disconnect()
        scalarObserver = new MutationObserver(() => {
          syncDocumentPresentation()
        })
        scalarObserver.observe(document.getElementById('app'), { childList: true, subtree: true })
      }

      function runtimeServerKind(source) {
        const fingerprint = [source && source.url, source && source.title, source && source.slug]
          .filter(Boolean)
          .join(' ')
          .toLowerCase()

        if (fingerprint.includes('meta-compatible') || fingerprint.includes('meta compatible')) return 'meta'
        if (fingerprint.includes('connect-api.openapi') || fingerprint.includes('rest api') || fingerprint.endsWith(' rest')) {
          return 'rest'
        }
        return ''
      }

      function runtimeServerTarget(source) {
        const kind = runtimeServerKind(source)
        if (!kind || !activeApiServerUrl) return ''
        if (kind === 'meta') return activeApiServerUrl.toLowerCase().endsWith('/graph') ? activeApiServerUrl : `${activeApiServerUrl}/graph`
        return activeApiServerUrl
      }

      async function applyRuntimeServer(source) {
        if (!source) return source

        const kind = runtimeServerKind(source)
        if (!kind) return source

        const targetUrl = runtimeServerTarget(source)

        try {
          let document = source.content
          if (!document || typeof document !== 'object') {
            if (!source.url) return source
            const response = await fetch(source.url, { cache: 'no-store' })
            if (!response.ok) throw new Error(`HTTP ${response.status}`)
            document = await response.json()
          } else {
            document = JSON.parse(JSON.stringify(document))
          }

          document.servers = targetUrl
            ? [
                {
                  url: targetUrl,
                  description: envApiServerUrl ? 'API configurada por SERVER_URL' : 'API informada manualmente',
                },
              ]
            : []

          const mapped = Object.assign({}, source, { content: document })
          delete mapped.url
          return mapped
        } catch (error) {
          console.warn('[Connect|API DOCs] Não foi possível sanitizar o servidor do documento.', error)
          return {
            title: source.title || 'Connect|API',
            slug: source.slug,
            content: {
              openapi: '3.1.0',
              info: {
                title: source.title || 'Connect|API',
                version: 'indisponível',
                description: 'Não foi possível carregar o contrato OpenAPI sem expor servidores estáticos.',
              },
              servers: [],
              paths: {},
            },
          }
        }
      }

      function configureServerInput() {
        const form = document.getElementById('connect-docs-server-form')
        const input = document.getElementById('connect-docs-server-input')
        const button = document.getElementById('connect-docs-server-button')

        if (!form || !input || !button) return

        input.value = activeApiServerUrl

        if (envApiServerUrl) {
          input.readOnly = true
          input.title = 'Servidor definido pela variável SERVER_URL do container de documentação.'
          button.disabled = true
          button.title = 'SERVER_URL está configurado no ambiente.'
        } else {
          input.readOnly = false
          input.title = 'Informe a URL base da API. Deixe vazio para não publicar nenhum servidor.'
          button.disabled = false
        }

        form.addEventListener('submit', (event) => {
          event.preventDefault()
          if (envApiServerUrl) return

          const value = normalizeApiServerUrl(input.value)

          try {
            if (value) localStorage.setItem(serverStorageKey, value)
            else localStorage.removeItem(serverStorageKey)
          } catch (error) {
            console.warn('[Connect|API DOCs] Não foi possível salvar o servidor informado.', error)
          }

          window.location.reload()
        })
      }

      async function init() {
        let mountedDocuments = []

        try {
          const response = await fetch(`${basePath}/configuration.json`, { cache: 'no-store' })

          if (response.ok) {
            const mountedConfig = await response.json()

            if (mountedConfig && mountedConfig.sources && mountedConfig.sources.length > 0) {
              mountedDocuments = mountedConfig.sources
            }
          }
        } catch (error) {
          // No mounted documents found.
        }

        const configuration = {{env "API_REFERENCE_CONFIG"}}
        const baseConfiguration = Object.assign({}, configuration || {})
        delete baseConfiguration.forceDarkModeState
        baseConfiguration.darkMode = currentTheme === 'dark'
        baseConfiguration.hideDarkModeToggle = true

        const configuredSources = mountedDocuments.length > 0
          ? mountedDocuments
          : Array.isArray(baseConfiguration.sources)
            ? baseConfiguration.sources
            : []

        if (configuredSources.length > 0) {
          const runtimeSources = await Promise.all(configuredSources.map((source) => applyRuntimeServer(source)))
          delete baseConfiguration.url
          delete baseConfiguration.content
          Scalar.createApiReference('#app', Object.assign({}, baseConfiguration, { sources: runtimeSources }))
        } else if (configuration) {
          Scalar.createApiReference('#app', baseConfiguration)
        } else {
          showErrorMessage(
            'Configuration Missing',
            'Add the <code>API_REFERENCE_CONFIG</code> environment variable or mount OpenAPI documents to <code>/docs</code>.',
          )
        }

        observeScalar()
        setTheme(currentTheme, false)
      }

      function showErrorMessage(title, message) {
        document.getElementById('app').innerHTML = `
          <div class="scalar-app ${currentTheme === 'dark' ? 'dark-mode' : 'light-mode'}" style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 58px);">
            <div style="max-width:500px;border:1px solid var(--scalar-border-color);border-radius:var(--scalar-radius);">
              <div class="markdown" style="background-color:var(--scalar-background-2);padding:.75rem 1rem;border-bottom:1px solid var(--scalar-border-color)">
                <strong>${title}</strong>
              </div>
              <div style="padding:1rem;">
                <div class="markdown"><p>${message}</p></div>
              </div>
            </div>
          </div>
        `
      }

      document.getElementById('connect-docs-theme-toggle').addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark')
      })

      configureServerInput()
      setTheme(currentTheme, false)
      init()

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js', { scope: './' }).catch((error) => {
            console.warn('[Connect|API DOCs] Service Worker registration failed:', error)
          })
        })
      }
    </script>
  </body>
</html>
